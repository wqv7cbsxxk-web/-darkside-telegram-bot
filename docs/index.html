тавили собственное прочтение композиции SENTENCED Farewell","paragraphs":["I AM YOUR GOD представили собственное прочтение композиции SENTENCED Farewell"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T08:58:19+00:00","original_url":"http://www.darkside.ru/news/184164/","saved_at":1790926438,"artists":[],"original_title":"I AM YOUR GOD исполняют SENTENCED","topics":[]},{"id":"dcc6e77f66e82d2fe5c2fdbfcfceb0f31bd2c8ff","title":"Новое видео FROZEN CROWN","short":"Iris (Goo Goo Dolls cover), новое видео FROZEN CROWN, доступно для просмотра ниже. Этот трек взят из нового альбома The Legend of the Six Kings, релиз которого намечен на второе октября на Napalm Records: 1. Lightning in the Sky","paragraphs":["Iris (Goo Goo Dolls cover), новое видео FROZEN CROWN, доступно для просмотра ниже. Этот трек взят из нового альбома The Legend of the Six Kings, релиз которого намечен на второе октября на Napalm Records:","1. Lightning in the Sky","2. Who Wants to Burn in Heaven","3. Reborn","4. The One 03:13","5. Iris (Goo Goo Dolls cover)","6. Winter Hearts","7. River of Time","8. Through the Fire","9. To the Stars","10. The Legend of the Six Kings"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T09:54:01+00:00","original_url":"http://www.darkside.ru/news/184179/","saved_at":1790926436,"artists":[],"original_title":"Новое видео FROZEN CROWN","topics":["releases"]},{"id":"a2eca72dfedde75b3fb4e85cbf20243bb7ac00bd","title":"Фестиваль Тома Морелло «Power To The People» покажут в бесплатной прямой трансляции","short":"Фестиваль «Power To The People», который состоится в эти выходные, будут транслировать в интернете через MS NOW (бывший MSNBC) и YouTube. Трансляция начнётся в субботу, 3 октября. В размещённом в оригинале видео можно посмотреть время начала для своего часового пояса.","paragraphs":["Фестиваль «Power To The People», который состоится в эти выходные, будут транслировать в интернете через MS NOW (бывший MSNBC) и YouTube. Трансляция начнётся в субботу, 3 октября. В размещённом в оригинале видео можно посмотреть время начала для своего часового пояса. Фестиваль, заявленный как «внепартийный праздник мира, справедливости, солидарности, музыки и общественной активности», организован при участии гитариста Rage Against The Machine Тома Морелло. Он пройдёт в Merriweather Post Pavilion в Колумбии, штат Мэриленд.","Среди участников немало артистов, известных открытым выражением своих политических взглядов, хотя этим состав не ограничивается. Специальным гостем станет Брюс Спрингстин. Также заявлены следующие исполнители:","Foo Fighters Dave Matthews Tom Morello Joan Baez Public Enemy Jack Sabbath Dropkick Murphys Cypress Hill Nathaniel Rateliff Killer Mike Serj Tankian ( System Of A Down ) Stephen Stills Mike McCready ( Pearl Jam ) Brittany Howard ( Alabama Shakes ) Taylor Momsen ( The Pretty Reckless ) Geezer Butler ( Black Sabbath ) The Linda Lindas Darryl “DMC” McDaniels ( RUN-D.M.C. ) Matt Cameron ( Soundgarden , бывший участник Pearl Jam ) State Radio Scott Ian ( Anthrax ) grandson The Last Internationale The Neighborhood Kids Shephard Fairey (диджей-сет)","В состав Jack Sabbath входят актёр и музыкант Джек Блэк и молодые музыканты: сын Тома Морелло Роман Морелло, сын Скотта Иэна Ревел, также играющий в XCOMM, Йойока Сома и Хьюго Вайс."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T17:58:55+00:00","original_url":"https://www.theprp.com/2026/10/01/news/tom-morellos-power-to-the-people-festival-to-be-livestreamed-for-free/","saved_at":1790899775,"artists":[{"id":"anthrax","name":"Anthrax"},{"id":"black-sabbath","name":"Black Sabbath"},{"id":"foo-fighters","name":"Foo Fighters"},{"id":"pearl-jam","name":"Pearl Jam"},{"id":"rage-against-the-machine","name":"Rage Against The Machine"},{"id":"soundgarden","name":"Soundgarden"},{"id":"system-of-a-down","name":"System Of A Down"},{"id":"the-pretty-reckless","name":"The Pretty Reckless"},{"id":"tom-morello","name":"Tom Morello"}],"topics":["live"]},{"id":"8876d3bfa4db34a3b790566f4edfb3ac2056f31f","title":"Blind Channel пригласили Аарона Поли из Of Mice \u0026 Men для новой песни «Into The Void»","short":"«Into The Void» стала последним предварительным синглом с нового студийного альбома Blind Channel «Painstream». В записи участвовал вокалист Of Mice \u0026 Men Аарон Поли. Blind Channel рассказали о сотрудничестве: «Into The Void» станет нашим последним отдельным синглом с грядущего альбома «Painstream» перед выходом всей пластинки.","paragraphs":["«Into The Void» стала последним предварительным синглом с нового студийного альбома Blind Channel «Painstream». В записи участвовал вокалист Of Mice \u0026 Men Аарон Поли. Blind Channel рассказали о сотрудничестве:","«Into The Void» станет нашим последним отдельным синглом с грядущего альбома «Painstream» перед выходом всей пластинки. На песню нас вдохновили парадокс Ферми и сигнал Wow! Если Земля действительно единственное место во Вселенной, где существует жизнь, то мы не слишком хорошо справляемся с её сохранением.","Аарон из Of Mice \u0026 Men присоединился к записи и позаботился о том, чтобы мошпиты затягивали людей, как чёрные дыры».","Поли добавил: «Для меня честь поучаствовать в этом треке. Он просто убойный! Работать над ним было очень весело, и я с нетерпением жду, когда его услышит весь мир».","«Painstream» выйдет 30 октября на Century Media."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T18:16:23+00:00","original_url":"https://www.theprp.com/2026/10/01/news/blind-channel-recruit-of-mice-mens-aaron-pauley-for-new-song-into-the-void/","saved_at":1790899765,"artists":[{"id":"blind-channel","name":"Blind Channel"},{"id":"of-mice-men","name":"Of Mice \u0026 Men"}],"topics":["releases"]},{"id":"88c2f9b625dc8ec435523471ea60bb1cf70d3d97","title":"PETE SANDOVAL: «TERRORIZER продолжат без DAVID VINCENT»","short":"Pete «Commando» Sandoval подтвердил, что David Vincent больше не имеет отношения к TERRORIZER, влиятельной грайндкор- и дэтграйнд-группе, которая время от времени даёт концерты с тех пор, как вернулась на сцену в апреле 2024 года на фестивале SWR Barroselas Metalfest в Баррозеласе, Португалия.","paragraphs":["Pete «Commando» Sandoval подтвердил, что David Vincent больше не имеет отношения к TERRORIZER, влиятельной грайндкор- и дэтграйнд-группе, которая время от времени даёт концерты с тех пор, как вернулась на сцену в апреле 2024 года на фестивале SWR Barroselas Metalfest в Баррозеласе, Португалия.","В последний гастрольный состав TERRORIZER входили Sandoval на барабанах, Vincent на басу, Brian Werner (VITAL REMAINS) на вокале и Richie Brown (EXMORTUS, THE ABSENCE, TRIVIUM, I AM MORBID) на гитаре.","Через пару часов после того, как Sandoval объявил о своём уходе из проекта I AM MORBID, созданного Vincent'ом, он снова вышел в соцсети и написал:","«Привет, ребята! Хочу также кое-что прояснить насчёт TERRORIZER.","Я пока не готов обсуждать все детали и будущие планы TERRORIZER. Могу сказать лишь, что TERRORIZER продолжит существовать, но с некоторыми изменениями.","Ещё хочу быть с вами честным. На данный момент я не считаю, что мы с David'ом Vincent'ом можем продолжать работать вместе. У David'а свой характер и свой способ работы, у меня свои. Мы очень разные люди, и в профессиональном плане эти различия слишком часто приводили нас к столкновениям.","Дело не в ненависти и не в обиде. Иногда двое людей просто доходят до точки, когда понимают, что совместная работа больше не идёт на пользу ни одному из них.","Я уважаю всё, что мы сделали вместе, и искренне желаю David'у всего наилучшего. Никакой злобы, никаких обид. Я просто считаю, что в профессиональном плане нам лучше идти разными дорогами. Что касается TERRORIZER, я расскажу больше, когда придёт время».","Всего за семь месяцев до этого Sandoval заявлял, что TERRORIZER «закончился» из-за его «плотного графика» в личной жизни и работы с I AM MORBID. Затем он вновь вышел в соцсети и объявил, что TERRORIZER выступит 22 октября 2023 года на Maranhão Open Air 2023 в Сан-Луисе, Бразилия. Это выступление в итоге отменили.","Прежде чем записать первый альбом MORBID ANGEL, «Altars Of Madness» 1989 года, Sandoval сыграл на двух демо и сплит-альбоме в своей родной группе TERRORIZER. Дебютный полноформатный альбом коллектива «World Downfall», вышедший в 1989 году, по сей день считается вершиной дэт-металла и грайндкора. Невероятно быстрые бласт-биты и дабл-бас-партии сочетаются там с блицкриговой атакой покойного гитариста Джесси Пинтадо (NAPALM DEATH) и бывшего вокалиста Oscar'а Garcia (NAUSEA). Состав 1989 года дополняли сам Sandoval и Vincent на басу.","В последующие двадцать три года Sandoval находил время между альбомами MORBID ANGEL, чтобы продолжать работу с TERRORIZER, и записал ещё два убойных полноформатника: «Darker Days Ahead» в 2006 году и «Hordes Of Zombies» в 2012-м. Ещё шесть лет спустя TERRORIZER выпустили «Caustic Attack» 2018 года, который в то время назвали «самым тяжёлым и самым эклектичным альбомом группы на сегодняшний день».","В 2021 году было объявлено, что TERRORIZER подписали контракт с Earache Records на мировом уровне. В тот момент в составе были Sandoval, Lee Harrison на гитаре и Sam Molina на басу и вокале.","Sandoval, который сегодня живёт как глубоко верующий христианин, был вынужден покинуть MORBID ANGEL в 2010 году после операции по поводу грыжи межпозвоночного диска.","В интервью Invisible Oranges в декабре 2013 года Vincent сказал, что Pete «обрёл Иисуса», а это означало, что Sandoval и MORBID ANGEL стали «несовместимы»."],"category":"Экстремальный метал","source":"Darkside","published":"2026-10-01T18:35:29+00:00","original_url":"http://www.darkside.ru/news/184175/","saved_at":1790899755,"artists":[{"id":"i-am-morbid","name":"I Am Morbid"},{"id":"morbid-angel","name":"Morbid Angel"},{"id":"napalm-death","name":"Napalm Death"},{"id":"terrorizer","name":"Terrorizer"}],"topics":[]},{"id":"785e6feac6b0b8b793a4a741665c7bd5f35c6685","title":"Введите Shikari Объявить о бессрочном перерыве в конце 2027 года, скажите, что они \"Not Splitting Up\"","short":"Они все равно выпустят новую музыку... надеюсь,","paragraphs":["Они все равно выпустят новую музыку... надеюсь,"],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-01T20:36:37+00:00","original_url":"https://metalinjection.net/news/enter-shikari-announce-indefinite-hiatus-at-end-of-2027-say-theyre-not-splitting-up","saved_at":1790899753,"artists":[{"id":"enter-shikari","name":"Enter Shikari"}],"topics":[],"original_title":"Enter Shikari Announce Indefinite Hiatus at End of 2027, Say They're \"Not Splitting Up\""},{"id":"b2e9c853e4443ef946197d966b41fc0e94e9a5a0","title":"Фронтмен Venom и крестный отец блэк-метала Кронос о своей блестяще причудливой двойной жизни","short":"death фронтмена Venom Конрада \"Cronos\" Ланта в возрасте 63 лет многих шокировал. Ранее в этом году он дал то, что оказалось его последним интервью Classic Rock , и мы нашли его в анимационной форме, рассказывая о его любви к Кейт Буш, его годах с Venom и его маловероятной второй карьере в качестве мультимедийного инженера.","paragraphs":["death фронтмена Venom Конрада \"Cronos\" Ланта в возрасте 63 лет многих шокировал. Ранее в этом году он дал то, что оказалось его последним интервью Classic Rock , и мы нашли его в анимационной форме, рассказывая о его любви к Кейт Буш, его годах с Venom и его маловероятной второй карьере в качестве мультимедийного инженера. «Оззи пел о Дьяволе», - сказал он нам. «Я хотел быть дьяволом».","Конрад ‘Cronos’ Лант, возможно, был последним незнакомцем, которого Кейт Буш поцеловала в губы на публике. Это был сентябрь 1980 года, и королева колдовского арт-попа подписывала контракт на Virgin Records в Ньюкасле во время остановки в городе в рамках своей ныне легендарной аудиовизуальной феерии Tour Of Life.","Любовь Кроноса к Бушу и ее музыке может показаться несовместимой с рэкетом, который он делал со своей собственной группой, демонической NWOBHM brat-princes Venom , но это всего лишь одна из многих неожиданных и интересных вещей о нем.","«Что не нравится в Кейт Буш?» - говорит он теперь, 46 лет спустя, с акцентом Джорди, столь же широким, как устье реки Тайн. «У нее невероятный способ писать. Я даже покрасил волосы в красный цвет хной из-за нее».","Поэтому, когда Кронос услышал об этой сессии подписания, он сказал своим боссам в студии звукозаписи, где он работал, что уходит на пару часов.","«Я помчался и подтолкнул меня к передней части очереди, подобрался как можно ближе», - вспоминает он. «У нее были эти плакаты, которые она подписывала. Я сказал:« Можешь написать «Кроносу…»? Затем я спросил: «Можно мне kiss?»","Некоторые, возможно, отшатнулись при виде короткой, тощей Джорди в кожаной куртке, просящей шлепку. Но Кейт Буш была сделана из более сурового материала.","«Она наклонилась и поцеловала меня в губы», - говорит он. «Мои колени пошли. Когда я уходил в оцепенении, парень позади нас говорит: ‘Can I have a __KEEP_0__?’ И я услышал этот голос:« Больше никаких поцелуев. «Я был последним».","Он сияет, как лунный подросток в памяти. «У меня остался плакат: ‘To Cronos, lots of love, Kate Bush.’»","Существует две версии Cronos. Один из них - полоскающий горло, разрушающий басы вельзевульский сумасшедший, который с конца 70-х периодически выключает Венома. Другая - грубая Джорди, которая раньше преподавала аэробику, увлекалась наблюдением за птицами и выращиванием чили, и любит Джони Митчелл , Jethro Tull и yes, Кейт Буш.","Обе версии здесь в это теплое субботнее утро в мае в Лондоне, кормят колой и льдом в кабинке в Wetherspoons на Camden Lock. Позже сегодня он и нынешний гитарист Venom Стюарт ‘Rage’ Диксон и барабанщик Дэнни ‘Dante’ Нидхэм отправятся в ближайший металлический магазин Raven Records для своего собственного магазина перед выпуском шестнадцатого альбома группы Into Oblivion , дикого rush шума и святотатства. ‘ Satan ejaculates! ’ Кронос рычит на одной песне, Man And Beast . «Мне просто нравится использовать ненормативную лексику», - говорит он с усмешкой.","Но это не просто провокация. Больше никогда не ссылается на любимого Кроноса Эдгара Аллана По. « Ворон, Сердце-обличитель , мне это нравится», - говорит он. Он даже думал записать свою собственную версию аудиокниги поэзии По, добавив к ней свой собственный оборот. Он начинает читать фразы из «Ворона»: «Бледный декабрь… святые дни прошлого».","Во время разговора Кронос мог заставить Джимми Гвоздя звучать как второстепенный член королевской семьи, но он родился в Лондоне. Южный Челси, в частности. « The Who обычно парковали свой фургон за углом, и моя мама обычно брала сигареты из магазина, где Мик Джаггер и они тоже покупали их», - говорит он. «Я помню, как увидел его по телевизору и сказал: ‘That’s парень из углового магазина».","Переезд в Ньюкасл в семь или восемь лет был трудным. Он подрался в первый день в школе из-за своего акцента. “‘Cockney wanker!’”: “Bam!” Он не говорит, кто получал его.","Он улыбается, когда описывает, каким он был в подростковом возрасте. «Мудак. Настоящий мудак. Мы с приятелем терроризировали школу.« Однажды он ворвался в мамину заначку с могадонами и запил их бутылкой водки. «Я даже не могу вспомнить тот день в школе, но, видимо, я хотел сразиться со всеми учителями».","Он хотел вступить в армию в детстве, что, по его мнению, могло бы его выправить, но выстрел в глаз гранулой, когда он и его друзья возились с пневматическими винтовками, поставил это под сомнение. «Я слеп на этот глаз», - говорит он, указывая на свой правый взгляд. «Гранула все еще там».","В детстве он любил музыку: Early Queen , Jethro Tull. Его старший брат, Грэм, был востребованным барабанщиком, который в конечном итоге присоединился к местным героям Prefab Sprout. «О, они были дерьмовыми. Я ненавидел этих ублюдков», - говорит он о последних. «Однажды они появились в студии, и инженер сказал: ‘This is Prefab Sprout.’ ‘Prefab what?’ Мы катались по полу, смеясь.»","Кронос устроился на работу в местную студию звукозаписи Impulse. В своем рассказе он убедил владельцев создать Neat Records для выпуска синглов и альбомов местных групп, таких как Fist, Tygers Of Pan Tang и, в конечном итоге, самих Venom. «Я сказал:« Вся эта тяжелая музыка продолжается. Юсу нужно было сесть на него ».","Он присоединился к Веному, когда ему было 16 лет, подпитываемый сумасшедшим rush панком. Сначала он не был их певцом. Это был Клайв Арчер, который носил макияж из протокорпусной краски и носил сценический псевдоним Иисус Христос. «Джефф и Брей сказали:« Мы думаем, что ты лучше, чем он. «Поэтому мы выгнали его и стали тройкой. С тех пор я его никогда не видела».","Джефф - Джефф Данн, он же оригинальный гитарист Venom Мантас, а Брей - барабанщик Тони Брей, он же Абаддон. Эта нечестивая троица выполняла миссию по перетаскиванию рок-н-ролла в Аид, и они, черт возьми, почти преуспели. Первые два альбома Venom, Welcome To Hell 1982 года и Black Metal следующего года, являются близнецовыми шрифтами, из которых происходит весь экстремальный металл. Грубые гимны богохульства, из-за которых Motörhead звучит как The Nolans. Как говорит Кронос: «Оззи пел о Дьяволе. Я хотел быть дьяволом».","Кому-то он подошел вплотную. Заглавный трек героически абразивного альбома 1985 года Possessed попал в ‘Filthy Fifteen’ списка песен PMRC, которые могут развратить молодежь Америки.","«Я думал, что это чертовски здорово», - говорит он. «Черт возьми, у вас есть Фрэнк Заппа и Джон Денвер, выступающие против этих скучающих домохозяек. Я также большой поклонник Джона Денвера.» Он начинает петь: « Ты наполняешь мои чувства, как ночь в лесу… »","Воздух недоброжелательности, окружающий Венома, наэлектризовал поколение молодых американских металлических фанатов. Metallica и Slayer открыты для Venom в США. «Мы с Клиффом Бертоном тусовались», - говорит Кронос о покойном басисте Metallica. «Он приносил травку, у меня был гашиш. Он был настоящим обкурителем, Клифф. Хороший парень».","В Британии все было по-другому. Фанаты Gnarly metal любили Venom, но все остальные думали, что это шутка, не в последнюю очередь пресса. «Похоже, Англия хотела иметь дело с Веномом», - говорит он. «Должно быть, мы наступили не на те пальцы».","Единственными людьми, которые не любили Венома больше, чем прессу, были сами Веном.","«Люди придумали этот миф об этом составе», - говорит он. «Никакого товарищества не было. Мы не были друзьями. Когда эта группа распалась, она была в плохих отношениях».","Технически Веном не разделился. Кронос уволился в 1987 году, но двое других продолжали без него. Оригинальный состав воссоединился для одного альбома в середине 90-х годов, но старые проблемы всплыли вновь. Один за другим Абаддон и Мантас отвалились, оставив Кроноса руководить группой с тех пор. Нынешний состав из трех человек существует уже 17 лет, почти в три раза дольше, чем оригинал. Сегодня между Кроносом, Мантой и Абаддоном нет любви.","“Nah,”. «Я не хочу иметь с ними ничего общего. Слишком много мочи вокруг».","Именно здесь общественное восприятие Кроноса отделяется от реальности. После Венома он задумался о том, чтобы бросить музыку. «Я собирался упаковать все это. Я собирался стать убойщиком или работать в комиссии по лесному хозяйству. Я люблю бывать на свежем воздухе. Вместо этого он сформировал новую группу Cronos, которая опиралась на более мелодичный хэви-метал , граничащий с хард-роком. Они выпустили два альбома, которые интересны, а не великолепны.","Но в начале 90-х он неожиданно диверсифицировался. Он провел свою часть тяжелой жизни в 80-х годах, но он также занимался тяжелой атлетикой и фитнесом. Он видел, как повальное увлечение аэробикой снялось на фоне тренировочных видео голливудской звезды Джейн Фонда, и он хотел принять участие в этом действии. «Я знал все о сердечно-сосудистых упражнениях, поэтому решил пойти и научиться делать это правильно», - говорит он. «Я учился в колледже, получал высшие оценки за все на всех экзаменах».","К началу 90-х работал инструктором по фитнесу. «Я проводил множество занятий. Я играл в рейв. Мы начинали с промежуточных вещей, просто чтобы согреться, а затем это был бах! бах! бах!« Он работал с парнями из армии. «Раньше они приходили на занятия. Мы делали это в спортивных залах или на полях. На них были бы ботинки и рюкзаки».","Кронос был со своими военными приятелями, когда у него произошел несчастный случай, который почти навсегда завершил его музыкальную карьеру. Они брали его на скалолазание в Уэльс и Шотландию. «Ты когда-нибудь делал это?» - спрашивает он. «Чувство, которое вы испытываете, находясь на вершине горы, почти духовное».","Он был на восхождении в Уэльсе в начале 2000-х годов, когда его ударило падающим камнем. «Парень над нами, камень под его ногой уступил место», - говорит он. «Я уклонился с дороги, но он попал нам прямо в затылок – бум. Некоторое время я был готов».","Это не было опасно для жизни, но это было серьезно. «Я не мог играть на басу», - говорит он. «Я, конечно, не мог встать и играть на басу. Я чувствовал, что закончил играть музыку. Именно тогда я взялся за компьютер».","Это еще один путь, по которому странная жизнь Кроноса привела его вниз","«У моего друга была компьютерная компания в Ньюкасле», - говорит он. «Я смеялся над графикой на логотипе компании, и он сказал:« Можешь ли ты сделать лучше? ’Я пошел: ‘Yeah.’ ”","Он погрузился в Photoshop и начал работать мультимедийным инженером в компании своего товарища. Он рассматривал это как продолжение того, что он делал всю свою жизнь. «Все является художественной средой», - говорит он. «Я мог бы взять немного грязи и создать картину на холсте. Вот как я вижу творчество – ничего не стоит на повестке дня. Итак, появился ИИ, и я подумал: ‘Yeah, I’ Попробую».","Он говорит об изобразительном искусстве, а не о музыке.","“Nah,”. «Я всегда буду писать свою собственную музыку».","Жизнь сегодня чуть менее насыщенная, чем раньше. Он выращивает чили для хобби, делает соусы, которые дарит друзьям. «Если вы говорите о Каролине Жнецах и Нагах и всех этих мальчиках, вы должны правильно приготовить компост», - это его совет. Он был членом RSPB в детстве, и он все еще следит за птицами вокруг своего дома в Нортумберленде. «Щитомордники, малины, галстуки. У нас даже в саду на заднем дворе была цапля. Я всегда увлекался птицами. Не только летающие »,- добавляет он со смешком.","Это тот вид кляпа, который вы хотите от Кроноса, человека, который провел почти 50 лет, трахаясь меньше, чем ноль, о том, что другие люди думают о нем – подход, который принес ему хорошее и плохое.","«Это путешествие и история, и вы должны взять все в свои руки», - говорит он, на мгновение философски. «Если вы вернетесь и что-то измените, вы измените то, кем вы являетесь сегодня».","Это должно звучать удивительно, исходя от человека, который написал песню под названием In League With Satan . Но это Кронос, а с ним все и ничего не удивляет.","Дэйв Эверли пишет и иногда напевает под музыку с начала 90-х годов. В течение этого времени он был заместителем редактора в Kerrang! и Classic Rock , помощником редактора в журнале Q и штатным писателем/чайным мальчиком в Raw , не обязательно в этом порядке. Он писал для Metal Hammer, Louder, Prog, The Observer, Select, Mojo , Evening Standard и полностью легендарного Ultrakill . Он все еще ждет, когда Билли Гиббонс отправит ему бутылку острого соуса, который ему обещали несколько лет назад.","Вы должны подтвердить свое общедоступное отображаемое имя, прежде чем комментировать","Выйдите из системы, а затем войдите снова, после чего вам будет предложено ввести отображаемое имя."],"category":"Прогрессив","source":"Louder","published":"2026-10-01T21:00:00+00:00","original_url":"https://www.loudersound.com/bands-artists/cardio-corpse-paint-and-carolina-reapers-venom-frontman-cronos-on-his-brilliantly-bizarre-double-life","saved_at":1790899751,"artists":[{"id":"jethro-tull","name":"Jethro Tull"},{"id":"metallica","name":"Metallica"},{"id":"motorhead","name":"Motörhead"},{"id":"slayer","name":"Slayer"},{"id":"venom","name":"Venom"}],"topics":[],"original_title":"Venom frontman and godfather of black metal Cronos on his brilliantly bizarre double life"},{"id":"178aecb4315e43411c67479b63ea114104f49c14","title":"Лззи Хейл из Halestorm выступила против сексуального насилия после возобновления дела в Корнеллском университете","short":"Вокалистка и гитаристка Halestorm Лззи Хейл публично высказалась о новых обстоятельствах дела о предполагаемом групповом изнасиловании, которое, как утверждается, произошло в районе Корнеллского университета в 2024 году.","paragraphs":["Вокалистка и гитаристка Halestorm Лззи Хейл публично высказалась о новых обстоятельствах дела о предполагаемом групповом изнасиловании, которое, как утверждается, произошло в районе Корнеллского университета в 2024 году. Тогда обвинения не предъявлялись, но новый гражданский иск предполагаемой пострадавшей, бывшей студентки, привёл к возобновлению дела.","В гражданском иске названы семь человек, которые, как утверждается, состояли в университетском братстве Chi Phi. Женщина заявляет, что ей дали наркотическое вещество и изнасиловали. Её представители утверждают, что власти ненадлежащим образом расследовали первоначальное дело. Последующие публикации в СМИ также обвиняли университет в недостаточном наказании виновных.","Вчера, 30 сентября, Хейл написала в социальных сетях:","«Если вы мужчина, который считает нормальным превращать другого человека лишь в то, во что можно засунуть свой член, с вами что-то серьёзно не так. Вы не “перспективный молодой человек”, а больной монстр, которого нужно наказать и оградить от контакта с другими людьми. А если вы мужчина, который бездействует, став свидетелем изнасилования, да, даже если вы увидели это в групповом чате, вы всё равно свидетель, и предпочитает ничего не делать и не говорить, вы не “хороший парень”. Вы соучастник сексуального насилия и тоже должны предстать перед правосудием, потому что мы не хотим, чтобы такие, как вы, ходили среди нас».","В подписи Хейл также добавила:","«А если у вас есть власть привлечь этих мужчин к ответственности, но вы ничего не делаете, принимаете их сторону или отпускаете их, отделавшись чёртовым “письменным заданием”, вас нужно лишить власти и права ходить среди нас»."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T21:46:23+00:00","original_url":"https://www.theprp.com/2026/10/01/news/halestorms-lzzy-hale-speaks-out-against-sexual-abusers-in-the-wake-of-reopened-cornell-university-gang-rape-case/","saved_at":1790899684,"artists":[{"id":"halestorm","name":"Halestorm"}],"topics":[]},{"id":"01f847d30c863b0d7b8d01b1d1d8999fbfcec1b6","title":"Descape представили клип на песню «True Colors»","short":"В сети появился клип на заглавную песню грядущего альбома канадской металкор-группы Descape «True Colors». Пластинка из 11 песен выйдет завтра, 2 октября, на Seek \u0026 Strike.","paragraphs":["В сети появился клип на заглавную песню грядущего альбома канадской металкор-группы Descape «True Colors». Пластинка из 11 песен выйдет завтра, 2 октября, на Seek \u0026 Strike."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T21:56:23+00:00","original_url":"https://www.theprp.com/2026/10/01/news/descapes-true-colors-music-video-debuts/","saved_at":1790899671,"artists":[{"id":"descape","name":"Descape"}],"topics":["releases"]},{"id":"e072ed442a11e8590fcd9ea34106236d182e6100","title":"Kid Rock анонсировал христианский альбом «Halfway 2 Jesus» с участием Eminem","short":"Консервативная звезда рэп-рока и кантри Kid Rock анонсировал новый альбом на религиозную тему «Halfway 2 Jesus». Первый сингл с библейским вдохновением, «James 1:17», уже появился в сети вместе с клипом. Rock посвятил видео Джимми Боунсу из The Twisted Brown Tucker Band, своей сопровождающей группы.","paragraphs":["Консервативная звезда рэп-рока и кантри Kid Rock анонсировал новый альбом на религиозную тему «Halfway 2 Jesus». Первый сингл с библейским вдохновением, «James 1:17», уже появился в сети вместе с клипом. Rock посвятил видео Джимми Боунсу из The Twisted Brown Tucker Band, своей сопровождающей группы. Боунс сейчас борется с боковым амиотрофическим склерозом. Также клип посвящён Калвину Линчу, у которого неоперабельная опухоль мозга. Его желанием в программе Make-A-Wish было сыграть на барабанах с Kid Rock.","Если ранние тексты Rock были посвящены разгулу и браваде и нередко содержали сомнительные с моральной точки зрения строки, новый альбом, судя по всему, обращается к христианским убеждениям и ценностям. Примечательно, что Eminem, также известный провокационными текстами, указан гостем в песне «7 Sins». Артисты уже сотрудничали на ранних этапах своих карьер.","Выход «Halfway 2 Jesus» ожидается 17 октября. В альбом войдут следующие песни:","01 – “ Freedom “ 02 – “ James 1:17 “ 03 – “ 7 Sins ” (feat. Eminem ) 04 – “ Why Don’t You Look Into Jesus “ 05 – “ Water Into Wine “ 06 – “ Halfway 2 Jesus “ 07 – “ I Don’t Drink Whiskey Anymore “ 08 – “ Me And Jesus “ 09 – “ God Is Good (Prelude) “ 10 – “ God Is Good “ 11 – “ Into The Setting Sun “ 12 – “ Broken Hearted People “ 13 – “ ‘Til You Can’t “ 14 – “ Why Don’t You Look Into Jesus ” (Riri Mix) 15 – “ High Road “ 16 – “ Procession “ 17 – “ God Bless The USA “"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T23:03:54+00:00","original_url":"https://www.theprp.com/2026/10/01/news/kid-rock-announces-his-new-christian-album-halfway-2-jesus-eminem-guests/","saved_at":1790899667,"artists":[{"id":"eminem","name":"Eminem"},{"id":"kid-rock","name":"Kid Rock"}],"topics":["releases"]},{"id":"d910deaf51094257b3a6c4e84e8a94466d840482","title":"Новое видео THE ROLLING STONES","short":"Mr. Charm, новое видео группы THE ROLLING STONES, доступно для просмотра ниже. Эта песня взята из альбома Foreign Tongues, выпущенного 10 июля на Capitol Records: Rough And Twisted","paragraphs":["Mr. Charm, новое видео группы THE ROLLING STONES, доступно для просмотра ниже. Эта песня взята из альбома Foreign Tongues, выпущенного 10 июля на Capitol Records:","Rough And Twisted","In The Stars","Jealous Lover","Mr. Charm","Divine Intervention","Ringing Hollow","Never Wanna Lose You","Hit Me In The Head","You Know I‘m No Good (Amy Winehouse)","Some Of Us","Covered In You","Side Effects","Back In Your Life","Beautiful Delilah (Chuck Berry)"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-01T19:00:11+00:00","original_url":"http://www.darkside.ru/news/184165/","saved_at":1790886531,"artists":[{"id":"the-rolling-stones","name":"The Rolling Stones"}],"topics":["releases"]},{"id":"2a1cc45a2f8db6e69e072082eab866ffc70ae3bd","title":"Умер вокалист VENOM","short":"Основатель, вокалист и басист VENOM Кронос (настоящее имя Конрад Томас Лант) скончался в возрасте 64 лет. Об этой ужасной вести VENOM сообщили в социальных сетях:","paragraphs":["Основатель, вокалист и басист VENOM Кронос (настоящее имя Конрад Томас Лант) скончался в возрасте 64 лет.","Об этой ужасной вести VENOM сообщили в социальных сетях:","ПАМЯТИ КОНРАДА «КРОНОСА» ЛАНТА","С глубокой скорбью и разбитыми сердцами мы сообщаем, что Конрад «Кронос» Лант ушёл из жизни.","На протяжении более четырёх десятилетий голос, бас и видение Конрада были сердцем VENOM.","От первых тёмных раскатов «Welcome To Hell» через «Black Metal», «At War With Satan», «Possessed» и дальше он создал нечто, навсегда изменившее тяжёлую музыку.","VENOM никогда не следовали правилам. Они прокладывали собственный путь.","И Конрад был в самом центре всего этого: бескомпромиссный, бесстрашный и неповторимый.","The Legions всегда были важной частью VENOM. Всем, кто стоял рядом с группой все эти годы, покупал пластинки, приходил на концерты, носил футболки, делился музыкой и поддерживал огонь, Кронос всегда был благодарен за вашу верность и поддержку.","Послание от Натана, сына Конрада: «Я хочу поблагодарить всех The Legions за поддержку, которую вы оказывали моему отцу все эти годы. Я знаю, что он очень ценил каждого из вас. Он отдал свою душу, и его музыка будет жить. Легенда Кроноса никогда не умрёт».","Его музыка никогда не умрёт.","Его голос никогда не угаснет.","А наследие VENOM будет жить в музыке, которую он создал, и в The Legions по всему миру, которые продолжают нести этот огонь.","Спасибо тебе, Конрад.","Спасибо тебе, Кронос.","Спасибо за музыку.","Спасибо за воспоминания.","Наша глубочайшая любовь и соболезнования Натану и Хел, друзьям и всем, кому выпала честь знать его.","ПОКОЙСЯ С МИРОМ, КОНРАД","ЛЕГЕНДА ЖИВЁТ 🖤 VENOM"],"category":"Экстремальный метал","source":"Darkside","published":"2026-10-01T19:28:48+00:00","original_url":"http://www.darkside.ru/news/184181/","saved_at":1790886524,"artists":[{"id":"venom","name":"Venom"}],"topics":[]},{"id":"ae5cbd8bd8fdc263979aafc91068ee7a1fe1c3db","title":"Лззи Хейл из Halestorm делает решительное заявление против сексуального насилия, поскольку расследование изнасилования в Корнельском университете возобновляется","short":"Halestorm ’s Lzzy Hale has published a powerful statement against sexual assault, as New York state prosecutors reopen investigations of the alleged 2024 gang-rape of a woman at Cornell University. The Nashville-based rocker took to Instagram this morning (Tuesday, October 1) and shared a short yet scathing post, containing an image with text that lambasted “the kind of man…","paragraphs":["Лззи Хейл из Halestorm опубликовал мощное заявление против сексуального насилия, поскольку прокуроры штата Нью-Йорк возобновляют расследование предполагаемого группового изнасилования женщины в Корнельском университете в 2024 году.","Нэшвиллский рокер написал в Instagram сегодня утром (во вторник, 1 октября) и поделился коротким, но язвительным постом, содержащим изображение с текстом, который раскритиковал «человека, который думает, что это нормально - превращать человека в нечто большее, чем то, во что вы можете засунуть свой [член]».","«Если вы тот человек, который думает, что нормально сводить другого человека к чему-то, во что вы можете втиснуть свой [член], с вами что-то серьезно не так», - начинает она.","Певец/гитарист продолжает: «Ты не« многообещающий молодой человек », ты больной монстр, которого нужно наказать и не допустить контакта с другими людьми."],"category":"Прогрессив","source":"Louder","published":"2026-10-01T20:00:00+00:00","original_url":"https://www.loudersound.com/news/halestorm-lzzy-hale-speaks-out-sexual-assault-cornell-university-rape-investigation-2026","saved_at":1790886523,"artists":[{"id":"halestorm","name":"Halestorm"}],"topics":[]},{"id":"8b4dfe2d0ac36e44f6345f93add96dd45e2c4140","title":"Новая песня GRAVE DIGGER","short":"GRAVE DIGGER выпустят новый альбом, получивший название \"Faces Of Pain\", 15 января на Reaper Entertainment. За обложку отвечал Uwe Jarling — она доступна ниже. Продюсировал Chris Boltendahl в студии Graveyard Studios в Зендене (Германия).","paragraphs":["GRAVE DIGGER выпустят новый альбом, получивший название \"Faces Of Pain\", 15 января на Reaper Entertainment. За обложку отвечал Uwe Jarling — она доступна ниже. Продюсировал Chris Boltendahl в студии Graveyard Studios в Зендене (Германия). Первый сингл из этого релиза, The Number, доступен для прослушивания.","Boltendahl: «Наконец-то настал этот момент: с нашим новым альбомом «Faces Of Pain» мы открываем следующую бурную главу нашей истории. Эта пластинка наполнена невероятным количеством души, пота и настоящей страсти. Как лучше всего описать результат?","Все было по-настоящему выдающимся творческим усилием. В частности, моё сотрудничество с гитаристом Tobias'ом Kersting'ом стало невероятно крепким и переросло в глубоко укоренившееся творческое партнёрство.","Его риффы, мои тексты и наше общее видение высвободили невероятную динамику. Результатом стала зрелая, но при этом крайне взрывная работа позднего этапа карьеры, бескомпромиссно сочетающая в себе все классические фирменные черты, которые наши фанаты любят уже десятилетиями.","'Faces Of Pain' показывает нас максимально разносторонними за долгое время. GRAVE DIGGER последовательно следуют своему собственному стилю — стилю, который мы сами формировали годами. Примечательно, что мы ни на секунду не копируем сами себя, но при этом каждая песня, каждая нота безошибочно несёт в себе фирменное, мощное звучание группы. Готовьтесь — это настоящий металлический монстр!»","Трек-лист:","1. The Gate","2. Faces Of Pain","3. Satan's Tango","4. The Number","5. Legends Never Die","6. Hell To The King","7. Dead Sun","8. The Grave That Should Not Be","9. When The World Is Calling You","10. Soul Reaper","11. Say Hello To The Devil","Бритвенно-острые риффы, мощные припевы и безошибочно узнаваемый хриплый вокал Boltendahl'а составляют основу альбома. Быстрые хэви-металлические боевики вроде «Faces Of Pain» и «Satan's Tango» соседствуют с риффовыми среднетемповыми гимнами, включая «The Number», «Legends Never Die» и «When The World Is Calling You». А в треках «Dead Sun» и «Say Hello To The Devil» группа раскрывает свою особенно тяжёлую и мрачную сторону.","Спустя более 45 лет после основания GRAVE DIGGER явно не собираются останавливаться. «Faces Of Pain» — альбом, полный энергии и классического хэви-металла, прочно укоренённый в истории группы, но при этом устремлённый в будущее.","Начиная с января 2027 года GRAVE DIGGER также представят новый материал на сцене. В рамках тура «Legends Never Die Tour» фанаты смогут в очередной раз ощутить неослабевающую живую мощь этого столпа немецкого хэви-металла."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-01T20:00:06+00:00","original_url":"http://www.darkside.ru/news/184166/","saved_at":1790886511,"artists":[{"id":"grave-digger","name":"Grave Digger"}],"topics":["releases"]},{"id":"0e367268b3d30e0b7f36c28e71e819443028a8fd","title":"Майкл Макдональд наконец-то встретился со своим давно потерянным сыном","short":"Майкл Макдональд из Doobie Brothers наконец воссоединился с давно потерянным сыном, которого он никогда не знал, спустя почти 60 лет. Уроженец Сент-Луиса вспомнил во время недавнего интервью KMOV, что ему было всего 14 лет, когда ребенок был первоначально зачат.","paragraphs":["Майкл Макдональд из Doobie Brothers наконец воссоединился с давно потерянным сыном, которого он никогда не знал, спустя почти 60 лет.","Уроженец Сент-Луиса вспомнил во время недавнего интервью KMOV, что ему было всего 14 лет, когда ребенок был первоначально зачат. Он и мать столкнулись с болезненной реальностью того, что им пришлось отдать ребенка на усыновление в то время, момент, который он никогда не забывал на протяжении многих десятилетий, которые последовали за этим.","«Мы всегда говорили о нем. И это всегда сводилось к тому, что наш самый большой страх заключался в том, как жизнь относилась к нему?» - поделился он во время интервью. «Я всегда носила эту вину с собой. Но просто знать, что он в порядке и что у него хорошая жизнь - и жизнь, которую я, вероятно, не смог бы себе позволить в то время в своей жизни, была большой наградой».","«Вы знаете, настоящие рок-звезды в этой истории для нас - это его приемные родители», - добавил он. «Кто действительно дал Майклу все, что нужно ребенку, с точки зрения любви и безопасности»."],"category":"Хард-рок","source":"Ultimate Classic Rock","published":"2026-10-01T20:05:56+00:00","original_url":"https://ultimateclassicrock.com/michael-mcdonald-long-lost-son-2026/","saved_at":1790886509,"artists":[],"topics":[]},{"id":"7449bdc3cf880c5d90871545d2f765fdd0fd3759","title":"Бокс-сет IMMORTAL выйдет зимой","short":"Начался предзаказ на уникальный релиз: бокс-сет, объединяющий полную студийную дискографию IMMORTAL с 1992 по 2023 год, дополненную концертным альбомом «The Seventh Date Of Blashyrkh - Live». Это исчерпывающее собрание сводит воедино более трёх десятилетий истории коллектива в одном цельном издании.","paragraphs":["Начался предзаказ на уникальный релиз: бокс-сет, объединяющий полную студийную дискографию IMMORTAL с 1992 по 2023 год, дополненную концертным альбомом «The Seventh Date Of Blashyrkh - Live». Это исчерпывающее собрание сводит воедино более трёх десятилетий истории коллектива в одном цельном издании.","Бокс-сет выйдет 29 января 2027 года, а оформить предзаказ можно на специальном сайте immortalbox.com.","IMMORTAL — одна из важнейших групп в истории норвежского блэк-металла. С самого начала коллектив выработал самобытный стиль, который развивался на протяжении лет, но никогда не терял своей безошибочной узнаваемости. Холодное атмосферное звучание, фирменные рифы и уникальный северный характер стали визитными карточками IMMORTAL, а каждый новый альбом раскрывал очередную грань музыкального развития команды.","История, представленная в этом бокс-сете, начинается с «Diabolical Fullmoon Mysticism», дебютного альбома группы, вышедшего в 1992 году. Он заложил стиль, ставший одним из определяющих звуков норвежской блэк-металл-сцены. Год спустя «Pure Holocaust» предложил ещё более сырой и интенсивный подход, а вышедший в 1995 году «Battles In The North» довёл скорость, агрессию и фирменную морозность группы до предела и закрепил положение IMMORTAL на экстремальной металлической сцене. Спустя два года «Blizzard Beasts» продолжил этот путь, одновременно продемонстрировав растущие композиционные и звуковые амбиции коллектива.","В конце 1990-х IMMORTAL вступили в новую фазу. Выпущенный в 1999 году «At The Heart Of Winter» ознаменовал существенный сдвиг в сочинении песен. Наряду с яростью блэк-металла всё заметнее становились классические хеви-металл-рифы, мелодии и более продуманные структуры композиций. Следующие альбомы, «Damned In Black» и «Sons of Northern Darkness», развили это направление, сохранив атмосферу и идентичность, которые всегда определяли IMMORTAL.","После нескольких лет перерыва IMMORTAL вернулись в 2009 году с «All Shall Fall». Альбом показал, что команда по-прежнему способна сочетать интенсивность блэк-металла с элементами классического хеви-металла, сохраняя при этом собственный характер.","В бокс-сет вошёл и концертный материал. «The Seventh Date of Blashyrkh - Live» запечатлел выступление IMMORTAL на Wacken Open Air в 2007 году — этот релиз становится естественным дополнением к студийным записям.","Последние главы истории IMMORTAL представлены альбомами «Northern Chaos Gods» (2018) и «War Against All» (2023). Они открыли для группы новую эру: вокальные обязанности перешли к Demonaz, а музыка осталась прочно укоренённой в фирменном стиле IMMORTAL.","В «Immortal - Complete Discography 1992-2023» входят:","Diabolical Fullmoon Mysticism (1992)","Pure Holocaust (1993)","Battles In The North (1995)","Blizzard Beasts (1997)","At The Heart Of Winter (1999)","Damned In Black (2000)","Sons Of Northern Darkness (2002)","All Shall Fall (2009)","The Seventh Date Of Blashyrkh - Live (2010)","Northern Chaos Gods (2018)","War Against All (2023)","Все альбомы в бокс-сете представлены в формате гейтфолд, причём «Sons Of Northern Darkness» и «The Seventh Date Of Blashyrkh - Live» выпущены как двойные виниловые пластинки.","Одиннадцать релизов, более тридцати лет истории и последовательные этапы эволюции одной из важнейших групп норвежского блэк-металла: всё это собрано в едином бокс-сете.","«Immortal - Complete Discography 1992-2023» даёт возможность проследить весь путь коллектива в хронологическом порядке: от сырых истоков и самых яростных, новаторских моментов ранней карьеры до новейших альбомов. Собрание позволяет давним поклонникам заново открыть для себя музыку IMMORTAL в одном полном комплекте, а тем, кто только знакомится с группой, дарит шанс изучить её историю с самого начала."],"category":"Экстремальный метал","source":"Darkside","published":"2026-10-01T20:45:24+00:00","original_url":"http://www.darkside.ru/news/184177/","saved_at":1790886498,"artists":[{"id":"immortal","name":"Immortal"}],"topics":["releases"]},{"id":"70f032a82cf167a368c172a0d52fc51b1162bee5","title":"Новое видео SHOGUN MOJO","short":"\"Gonna Raise Hell\", новое видео группы SHOGUN MOJO, в состав которой входят гитарист KISS Tommy Thayer и вокалист Dan Reed из DAN REED NETWORK, доступно для просмотра. Этот трек взят из дебютного альбома Shogun Mojo, релиз которого намечен на шестое ноября: 1. Fight For The Light","paragraphs":["\"Gonna Raise Hell\", новое видео группы SHOGUN MOJO, в состав которой входят гитарист KISS Tommy Thayer и вокалист Dan Reed из DAN REED NETWORK, доступно для просмотра. Этот трек взят из дебютного альбома Shogun Mojo, релиз которого намечен на шестое ноября:","1. Fight For The Light","2. Under The Gun","3. Gonna Raise Hell","4. Fire With Fire","5. Dog Eat Dog","6. Turn It Up","7. Nothing To See Here","8. In The Air Tonight","9. Star Rider","10. Funk Party"],"category":"Хард-рок","source":"Darkside","published":"2026-10-01T21:35:02+00:00","original_url":"http://www.darkside.ru/news/184167/","saved_at":1790886497,"artists":[{"id":"shogun-mojo","name":"Shogun Mojo"}],"topics":["releases"]},{"id":"3456de6aa381b0361166481263778a0c0e34e0b6","title":"Новое видео WOLVES IN THE THRONE ROOM","short":"Estuary, новое видео WOLVES IN THE THRONE ROOM, доступно для просмотра. Этот трек взят из нового альбома Estuary, выход которого намечен на 23 октября на виниле, CD, кассете и в цифровом варианте: 1. Estuary 07:07","paragraphs":["Estuary, новое видео WOLVES IN THE THRONE ROOM, доступно для просмотра. Этот трек взят из нового альбома Estuary, выход которого намечен на 23 октября на виниле, CD, кассете и в цифровом варианте:","1. Estuary 07:07","2. Knights of Tiamat 08:37","3. Foretold in Reflections 09:54","4. The Orca Cliffs 07:53","5. Ghosts Among the Obelisks 08:40","6. Wretched Spirits, Land of the Light 06:14"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-01T22:02:25+00:00","original_url":"http://www.darkside.ru/news/184168/","saved_at":1790886489,"artists":[{"id":"wolves-in-the-throne-room","name":"Wolves In The Throne Room"}],"topics":["releases"]},{"id":"b9956ea800661d9e3bf4a074af1eda353317207d","title":"Lzzy Hale Slams Alleged ‘Cornell 7’ Gang Rape: “You Are Not a ‘Promising Young Man’”","short":"Хейл присоединяется к растущему списку знаменитостей, выступающих против предполагаемого преступления.","paragraphs":["Хейл присоединяется к растущему списку знаменитостей, выступающих против предполагаемого преступления."],"category":"Экстремальный метал","source":"Metal Injection","published":"2026-10-01T18:19:15+00:00","original_url":"https://metalinjection.net/news/lzzy-hale-slams-alleged-cornell-7-gang-rape-you-are-not-a-promising-young-man","saved_at":1790884737,"artists":[],"topics":[],"original_title":"Lzzy Hale Slams Alleged ‘Cornell 7’ Gang Rape: “You Are Not a ‘Promising Young Man’”","translation_pending":true},{"id":"f708c69cc3a06257909e72d019a8b4362056230d","title":"Дастин Кенсрю из Thrice анонсировал рождественский альбом «That Spirit Of Christmas»","short":"Вокалист и гитарист Thrice Дастин Кенсрю объявил о выходе рождественского альбома «That Spirit Of Christmas» 23 октября. Помимо каверов на рождественскую классику, в него войдёт новая песня «Joy Lives Here», которая уже появилась в сети.","paragraphs":["Вокалист и гитарист Thrice Дастин Кенсрю объявил о выходе рождественского альбома «That Spirit Of Christmas» 23 октября. Помимо каверов на рождественскую классику, в него войдёт новая песня «Joy Lives Here», которая уже появилась в сети. Кенсрю рассказал о ней:","«Единственная совершенно новая песня на альбоме, “Joy Lives Here”, началась с пробной работы для Hallmark Channel. Мне предложили эту идею, и я решил воспринимать её как творческую задачу, хотя поначалу сам замысел мне совсем не нравился. Но он заставил меня глубже вникнуть и попытаться передать настоящее ощущение Рождества у нас дома, которое создаёт в основном моя замечательная жена, обожающая рождественские украшения. Когда я закончил, то настолько погрузился в эту тему, что полюбил её и то, как связал её с домом, хотя мне и сказали, что Hallmark искали совсем не это».","В альбом также включена переработанная версия его прежней сольной песни «This Good Night Is Still Everywhere». О пластинке Кенсрю сказал:","«Я горжусь этим альбомом и считаю его сильным от начала до конца. Как бы я ни любил рождественскую музыку, такое редко встречается на полноформатных рождественских пластинках. Обычно там есть одна или две отличные песни, а остальное кажется наполнителем вокруг сингла. Многие мои любимые записи вообще изначально выходили только синглами. Здесь же, надеюсь, вы услышите, что эта пластинка появилась исключительно из любви к этим песням, удовольствия от создания цельного альбома и радости от возможности разделить этот общий ритм со всеми вами. За вас!»","Трек-лист «That Spirit Of Christmas»:","01 – “ All Alone On Christmas “ 02 – “ White Christmas “ 03 – “ Christmas Time Is Here “ 04 – “ Every Day Will Be Like A Holiday “ 05 – “ Joy Lives Here “ 06 – “ I’ve Got My Love To Keep Me Warm “ 07 – “ All I Want For Christmas Is You “ 08 – “ My Favorite Things “ 09 – “ That Spirit Of Christmas “ 10 – “ This Good Night Is Still Everywhere “","Предзаказ доступен по адресу dustinkensrue.lnk.to/ThatSpiritofChristmas."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T18:32:42+00:00","original_url":"https://www.theprp.com/2026/10/01/news/thrices-dustin-kensrue-announces-his-holidays-album-that-spirit-of-christmas/","saved_at":1790884732,"artists":[{"id":"thrice","name":"Thrice"}],"topics":["releases"]},{"id":"37706a531f8f96998de724a1d1a866dc7a7db010","title":"Опубликована профессиональная запись выступления Static Dress на Outbreak Fest 2026","short":"В сети опубликована профессиональная видеозапись выступления британской пост-хардкор-группы Static Dress на Outbreak Fest в Манчестере 27 июня. Группа была секретным участником фестиваля. Из-за небольшого розыгрыша некоторые зрители ожидали вместо неё реюнион Title Fight.","paragraphs":["В сети опубликована профессиональная видеозапись выступления британской пост-хардкор-группы Static Dress на Outbreak Fest в Манчестере 27 июня. Группа была секретным участником фестиваля. Из-за небольшого розыгрыша некоторые зрители ожидали вмес City audience. That held true on Tuesday, as Maiden feasted on fans' fervor while plowing through genre-defining hits and beloved deep cuts off their first nine albums, from 1980's Iron Maiden through…"],"category":"Хэви-метал","source":"Ultimate Classic Rock","published":"2026-10-01T18:59:27+00:00","original_url":"https://ultimateclassicrock.com/iron-maiden-us-tour-closer-review-set-list-photos/","saved_at":1790884719,"artists":[{"id":"anthrax","name":"Anthrax"},{"id":"iron-maiden","name":"Iron Maiden"},{"id":"megadeth","name":"Megadeth"},{"id":"ufo","name":"UFO"}],"topics":["live"],"translation_pending":true,"translation_retry_after":1790995623},{"id":"19bf1e58be96fbdd093ae4ee853b951a33c38437","title":"Set Your Goals представили второй сингл после возвращения, «Big Couch»","short":"Сегодня утром, 1 октября, состоялась онлайн-премьера новой песни Set Your Goals «Big Couch». В июле группа выпустила «Accelerate», свой первый трек за более чем 15 лет. Тогда же был анонсирован семидюймовый сингл, на второй стороне которого находится представленная сегодня песня. О второй новой песне группа рассказала:","paragraphs":["Сегодня утром, 1 октября, состоялась онлайн-премьера новой песни Set Your Goals «Big Couch». В июле группа выпустила «Accelerate», свой первый трек за более чем 15 лет. Тогда же был анонсирован семидюймовый сингл, на второй стороне которого находится представленная сегодня песня.","О второй новой песне группа рассказала:","«Эта песня кажется логичным следующим шагом в развитии нашего авторского подхода. По стилю она немного выбивается из общего ряда и несёт более сильный эмоциональный заряд, который и делает её особенной для нас. Текст посвящён тому возрасту, когда ты становишься для молодых людей примером, осознаёшь значение своих поступков и искренне стараешься их не подвести. Создание песни стало общим делом: мы использовали звуки играющих детей некоторых участников группы и нашего продюсера Скотта. Мы даже пригласили нескольких друзей помочь с вокалом в последнем припеве, включая жену Скотта Эшли».","Премьера песни совпала с началом сегодняшнего тура к двадцатилетию «Mutiny!». Вместе с ними выступят Warriors, которые сыграют «War Is Hell», а также Restraining Order и Stateside.","10/01 Baltimore, MD – Soundstage 10/02 Philadelphia, PA – First Unitarian Church 10/03 New York, NY – Le Poisson Rouge 10/04 Boston, MA – The Sinclair","Во второй части тура в декабре Set Your Goals разделят сцену с I Am The Avalanche, Doomsday, Bad World и Giveaway:","12/17 Los Angeles, CA – The Regent 12/18 Santa Ana, CA – Observatory 12/19 Sacramento, CA – Ace Of Spades 12/20 San Jose, CA – The Ritz"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T19:02:24+00:00","original_url":"https://www.theprp.com/2026/10/01/news/set-your-goals-debut-their-second-comeback-single-big-couch/","saved_at":1790884711,"artists":[{"id":"set-your-goals","name":"Set Your Goals"}],"topics":["releases"]},{"id":"09b0737e2b445cf087fd72e610009aa094e1fa00","title":"The L.I.F.E. Project представили кавер на «Immigrant Song» Led Zeppelin","short":"The L.I.F.E. Project добавили ещё одну запись к серии каверов этого года, представив свою версию классической песни Led Zeppelin «Immigrant Song». В дуэт входят Джош Рэнд из Stone Sour и Касандра Карсон из Paralandra и Casandra’s Crossing.","paragraphs":["The L.I.F.E. Project добавили ещё одну запись к серии каверов этого года, представив свою версию классической песни Led Zeppelin «Immigrant Song». В дуэт входят Джош Рэнд из Stone Sour и Касандра Карсон из Paralandra и Casandra’s Crossing. Рэнд рассказал о работе над треком:","«Как и в случае с “Call Me”, мы никогда не планировали выпускать “Immigrant Song”. В 2019 году мы переехали в новый дом с домашней студией. По сути, вся музыка возникла из того, что я просто возился со своим винтажным оборудованием. Когда я начал работать с Касандрой, то предложил ей попробовать это просто ради удовольствия».","Карсон рассказала о том, как необычно познакомилась с этой песней:","«Как ни забавно, впервые я услышала “Immigrant Song” в “Шреке Третьем”, ха-ха! Когда Белоснежка запела этот боевой клич викингов, мои душа и чувства вспыхнули, словно в меня ударила молния. Папа сказал, что это песня Led Zeppelin, и я стала одержима ею, как ребёнок, впервые попробовавший шоколад. Я не могла наслушаться. Через несколько лет, когда начала играть в группах, “Immigrant Song” оставалась первой в моём списке песен, на которые я хотела сделать кавер. Было вполне естественно предложить её и Джошу, когда мы только начали работать вместе. Видимо, теперь мне нужно снова посмотреть “Шрека Третьего”, чтобы отметить выход нашей записи».","Среди недавних релизов The L.I.F.E. Project также были каверы на Suicidal Tendencies и Blondie."],"category":"Хард-рок","source":"ThePRP","published":"2026-10-01T19:18:00+00:00","original_url":"https://www.theprp.com/2026/10/01/news/the-l-i-f-e-project-stone-sour-etc-release-their-cover-of-led-zeppelins-immigrant-song/","saved_at":1790884702,"artists":[{"id":"led-zeppelin","name":"Led Zeppelin"},{"id":"the-l-i-f-e-project","name":"The L.I.F.E. Project"}],"topics":["releases"]},{"id":"4bb47ac1552034cd8fc7260278680a8d470ef734","title":"Interview: Imminence Is More Than the Band With the Violin","short":"Новая пластинка группы «Axis Mundi» показывает группу, готовую подтолкнуть металкор к кинематографическим высотам.","paragraphs":["Новая пластинка группы «Axis Mundi» показывает группу, готовую подтолкнуть металкор к кинематографическим высотам."],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-01T19:43:29+00:00","original_url":"https://metalinjection.net/interviews/interview-imminence-is-more-than-the-band-with-the-violin","saved_at":1790884693,"artists":[{"id":"imminence","name":"Imminence"}],"topics":[],"translation_pending":true,"translation_retry_after":1790995626},{"id":"357246bad44a2080140e6c750bdb286f132d73c1","title":"В Stage Tour, наследника Guitar Hero, добавлены песни Dream Theater, Arch Enemy, Powerman 5000 и других групп","short":"За последний месяц в список песен грядущей ритм-игры Stage Tour добавили ряд композиций. Последнее обновление было опубликовано вчера, 30 сентября. Stage Tour задумана как духовный наследник серии Guitar Hero, и в её разработке участвуют некоторые ветераны этой франшизы.","paragraphs":["За последний месяц в список песен грядущей ритм-игры Stage Tour добавили ряд композиций. Последнее обновление было опубликовано вчера, 30 сентября. Stage Tour задумана как духовный наследник серии Guitar Hero, и в её разработке участвуют некоторые ветераны этой франшизы.","Stage Tour будет поддерживать ряд ранее выпущенных игровых гитар, барабанов и микрофонов, а также собственную новую линейку устройств, которая появится вместе с игрой. Для её создания заключены партнёрства с Gibson и Kramer. Ожидается поддержка некоторых электронных барабанных установок. Stage Tour выйдет 10 декабря на PlayStation 5, Xbox Series X/S, Steam, Epic Games Store и Nintendo Switch 2.","Всего планируется более 90 песен. Значительная часть списка уже известна: официально подтверждены примерно 57 композиций. Среди последних анонсированных:","Powerman 5000 – “ When Worlds Collide “ Dream Theater – Under A Glass Moon “ Arch Enemy – “ Handshake With Hell “ Sabaton – “ Night Witches “ Sylosis – “ The New Flesh “ Blur – “ Parklife “ The Cure – “ Just Like Heaven “ Alter Bridge – “ Metalingus “ Sum 41 – “ You Wanted War “ Kasabian ” – “ Fire “ The Bites – “ Do Me A Favor “ The Dust Coda – “ Limbo Man “ The Karma Effect – “ Raised On Rock N Roll “","Ранее объявленные песни охватывают множество жанров: классический трэш, глэм, поп-рок, рэп, сладж, новую волну и другие. Уже заявленные композиции приведены ниже:","Billy Talent – “ Red Flag “ Black Eyed Peas – “ Pump It “ blink-182 – “ MORE THAN YOU KNOW “ Def Leppard – “ Photograph “ Duran Duran – “ Rio “ Jeff Buckley – “ Grace “ Megadeth – “ Tornado Of Souls “ Fall Out Boy – “ Heartbreak Feels So Good “ Genesis – “ Land of Confusion “ Metallica – “ Lux Æterna “ The Darkness – “ I Believe In A Thing Called Love “ Walk The Moon – “ Shut Up And Dance “ Spacehog – “ In The Meantime “ Tenacious D – “ …Baby One More Time “ The Clash – “ I Fought The Law “ Wheatus – “ Teenage Dirtbag “ ZZ Top – “ Sharp Dressed Man “ Olivia Rodrigo – “ ballad of a homeschooled girl “ Red Hot Chili Peppers – “ Dani California “ Mötley Crüe – “ Kickstart My Heart “ Slipknot – “ Psychosocial “ Ghost – “ Square Hammer “ Good Kid – “ Mimi’s Delivery Service “ BABYMETAL \u0026 Electric Callboy – “ RATATATA “ Mastodon – “ The Motherload “ Static-X – “ Terminator Oscillator “ Ed Sheeran – “ Bad Habits ” (feat. Bring Me The Horizon ) Castle Rat – “ Siren “ Extreme – “ Get The Funk Out “ Bad Omens – “ Just Pretend “ Mammoth – “ The End “ Radiohead – “ Just “ The Rolling Stones – “ In The Stars “ Weezer – “ Island In The Sun “ Rise Against – “ Broken Dreams, Inc. “ Muse – “ Starlight “ Avril Lavigne – “ Bite Me “ Beast In Black – “ Blind And Frozen “ Honey Revenge – “ Airhead “ Smash Mouth – “ All Star “ Paramore – “ For a Pessimist, I’m Pretty Optimistic “ The Paradox – “ Do Me Like That “ The Long Faces – “ Jane! “ Jfarrari – “ The Unknowing “"],"category":"Прогрессив","source":"ThePRP","published":"2026-10-01T19:57:47+00:00","original_url":"https://www.theprp.com/2026/10/01/news/dream-theater-arch-enemy-powerman-5000-sabaton-more-added-to-guitar-hero-inspired-video-game-stage-tour/","saved_at":1790884684,"artists":[{"id":"arch-enemy","name":"Arch Enemy"},{"id":"def-leppard","name":"Def Leppard"},{"id":"dream-theater","name":"Dream Theater"},{"id":"mastodon","name":"Mastodon"},{"id":"megadeth","name":"Megadeth"},{"id":"metallica","name":"Metallica"},{"id":"powerman-5000","name":"Powerman 5000"},{"id":"the-rolling-stones","name":"The Rolling Stones"}],"topics":["releases"]}]}</script>

function mention(text,name){const escaped=norm(name).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('(^|[^\\p{L}\\p{N}_])'+escaped+'($|[^\\p{L}\\p{N}_])','u').test(norm(text));}
