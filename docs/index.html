st Pavilion в Колумбии, штат Мэриленд.","Среди участников немало артистов, известных открытым выражением своих политических взглядов, хотя этим состав не ограничивается. Специальным гостем станет Брюс Спрингстин. Также заявлены следующие исполнители:","Foo Fighters Dave Matthews Tom Morello Joan Baez Public Enemy Jack Sabbath Dropkick Murphys Cypress Hill Nathaniel Rateliff Killer Mike Serj Tankian ( System Of A Down ) Stephen Stills Mike McCready ( Pearl Jam ) Brittany Howard ( Alabama Shakes ) Taylor Momsen ( The Pretty Reckless ) Geezer Butler ( Black Sabbath ) The Linda Lindas Darryl “DMC” McDaniels ( RUN-D.M.C. ) Matt Cameron ( Soundgarden , бывший участник Pearl Jam ) State Radio Scott Ian ( Anthrax ) grandson The Last Internationale The Neighborhood Kids Shephard Fairey (диджей-сет)","В состав Jack Sabbath входят актёр и музыкант Джек Блэк и молодые музыканты: сын Тома Морелло Роман Морелло, сын Скотта Иэна Ревел, также играющий в XCOMM, Йойока Сома и Хьюго Вайс."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T17:58:55+00:00","original_url":"https://www.theprp.com/2026/10/01/news/tom-morellos-power-to-the-people-festival-to-be-livestreamed-for-free/","saved_at":1790899775,"artists":[{"id":"anthrax","name":"Anthrax"},{"id":"black-sabbath","name":"Black Sabbath"},{"id":"foo-fighters","name":"Foo Fighters"},{"id":"pearl-jam","name":"Pearl Jam"},{"id":"rage-against-the-machine","name":"Rage Against The Machine"},{"id":"soundgarden","name":"Soundgarden"},{"id":"system-of-a-down","name":"System Of A Down"},{"id":"the-pretty-reckless","name":"The Pretty Reckless"},{"id":"tom-morello","name":"Tom Morello"}],"topics":["live"]},{"id":"8876d3bfa4db34a3b790566f4edfb3ac2056f31f","title":"Blind Channel пригласили Аарона Поли из Of Mice \u0026 Men для новой песни «Into The Void»","short":"«Into The Void» стала последним предварительным синглом с нового студийного альбома Blind Channel «Painstream». В записи участвовал вокалист Of Mice \u0026 Men Аарон Поли. Blind Channel рассказали о сотрудничестве: «Into The Void» станет нашим последним отдельным синглом с грядущего альбома «Painstream» перед выходом всей пластинки.","paragraphs":["«Into The Void» стала последним предварительным синглом с нового студийного альбома Blind Channel «Painstream». В записи участвовал вокалист Of Mice \u0026 Men Аарон Поли. Blind Channel рассказали о сотрудничестве:","«Into The Void» станет нашим последним отдельным синглом с грядущего альбома «Painstream» перед выходом всей пластинки. На песню нас вдохновили парадокс Ферми и сигнал Wow! Если Земля действительно единственное место во Вселенной, где существует жизнь, то мы не слишком хорошо справляемся с её сохранением.","Аарон из Of Mice \u0026 Men присоединился к записи и позаботился о том, чтобы мошпиты затягивали людей, как чёрные дыры».","Поли добавил: «Для меня честь поучаствовать в этом треке. Он просто убойный! Работать над ним было очень весело, и я с нетерпением жду, когда его услышит весь мир».","«Painstream» выйдет 30 октября на Century Media."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T18:16:23+00:00","original_url":"https://www.theprp.com/2026/10/01/news/blind-channel-recruit-of-mice-mens-aaron-pauley-for-new-song-into-the-void/","saved_at":1790899765,"artists":[{"id":"blind-channel","name":"Blind Channel"},{"id":"of-mice-men","name":"Of Mice \u0026 Men"}],"topics":["releases"]},{"id":"88c2f9b625dc8ec435523471ea60bb1cf70d3d97","title":"PETE SANDOVAL: «TERRORIZER продолжат без DAVID VINCENT»","short":"Pete «Commando» Sandoval подтвердил, что David Vincent больше не имеет отношения к TERRORIZER, влиятельной грайндкор- и дэтграйнд-группе, которая время от времени даёт концерты с тех пор, как вернулась на сцену в апреле 2024 года на фестивале SWR Barroselas Metalfest в Баррозеласе, Португалия.","paragraphs":["Pete «Commando» Sandoval подтвердил, что David Vincent больше не имеет отношения к TERRORIZER, влиятельной грайндкор- и дэтграйнд-группе, которая время от времени даёт концерты с тех пор, как вернулась на сцену в апреле 2024 года на фестивале SWR Barroselas Metalfest в Баррозеласе, Португалия.","В последний гастрольный состав TERRORIZER входили Sandoval на барабанах, Vincent на басу, Brian Werner (VITAL REMAINS) на вокале и Richie Brown (EXMORTUS, THE ABSENCE, TRIVIUM, I AM MORBID) на гитаре.","Через пару часов после того, как Sandoval объявил о своём уходе из проекта I AM MORBID, созданного Vincent'ом, он снова вышел в соцсети и написал:","«Привет, ребята! Хочу также кое-что прояснить насчёт TERRORIZER.","Я пока не готов обсуждать все детали и будущие планы TERRORIZER. Могу сказать лишь, что TERRORIZER продолжит существовать, но с некоторыми изменениями.","Ещё хочу быть с вами честным. На данный момент я не считаю, что мы с David'ом Vincent'ом можем продолжать работать вместе. У David'а свой характер и свой способ работы, у меня свои. Мы очень разные люди, и в профессиональном плане эти различия слишком часто приводили нас к столкновениям.","Дело не в ненависти и не в обиде. Иногда двое людей просто доходят до точки, когда понимают, что совместная работа больше не идёт на пользу ни одному из них.","Я уважаю всё, что мы сделали вместе, и искренне желаю David'у всего наилучшего. Никакой злобы, никаких обид. Я просто считаю, что в профессиональном плане нам лучше идти разными дорогами. Что касается TERRORIZER, я расскажу больше, когда придёт время».","Всего за семь месяцев до этого Sandoval заявлял, что TERRORIZER «закончился» из-за его «плотного графика» в личной жизни и работы с I AM MORBID. Затем он вновь вышел в соцсети и объявил, что TERRORIZER выступит 22 октября 2023 года на Maranhão Open Air 2023 в Сан-Луисе, Бразилия. Это выступление в итоге отменили.","Прежде чем записать первый альбом MORBID ANGEL, «Altars Of Madness» 1989 года, Sandoval сыграл на двух демо и сплит-альбоме в своей родной группе TERRORIZER. Дебютный полноформатный альбом коллектива «World Downfall», вышедший в 1989 году, по сей день считается вершиной дэт-металла и грайндкора. Невероятно быстрые бласт-биты и дабл-бас-партии сочетаются там с блицкриговой атакой покойного гитариста Джесси Пинтадо (NAPALM DEATH) и бывшего вокалиста Oscar'а Garcia (NAUSEA). Состав 1989 года дополняли сам Sandoval и Vincent на басу.","В последующие двадцать три года Sandoval находил время между альбомами MORBID ANGEL, чтобы продолжать работу с TERRORIZER, и записал ещё два убойных полноформатника: «Darker Days Ahead» в 2006 году и «Hordes Of Zombies» в 2012-м. Ещё шесть лет спустя TERRORIZER выпустили «Caustic Attack» 2018 года, который в то время назвали «самым тяжёлым и самым эклектичным альбомом группы на сегодняшний день».","В 2021 году было объявлено, что TERRORIZER подписали контракт с Earache Records на мировом уровне. В тот момент в составе были Sandoval, Lee Harrison на гитаре и Sam Molina на басу и вокале.","Sandoval, который сегодня живёт как глубоко верующий христианин, был вынужден покинуть MORBID ANGEL в 2010 году после операции по поводу грыжи межпозвоночного диска.","В интервью Invisible Oranges в декабре 2013 года Vincent сказал, что Pete «обрёл Иисуса», а это означало, что Sandoval и MORBID ANGEL стали «несовместимы»."],"category":"Экстремальный метал","source":"Darkside","published":"2026-10-01T18:35:29+00:00","original_url":"http://www.darkside.ru/news/184175/","saved_at":1790899755,"artists":[{"id":"i-am-morbid","name":"I Am Morbid"},{"id":"morbid-angel","name":"Morbid Angel"},{"id":"napalm-death","name":"Napalm Death"},{"id":"terrorizer","name":"Terrorizer"}],"topics":[]},{"id":"785e6feac6b0b8b793a4a741665c7bd5f35c6685","title":"Enter Shikari объявили о бессрочном перерыве с конца 2027 года: «Мы не распадаемся»","short":"Они все равно выпустят новую музыку... надеюсь,","paragraphs":["Они все равно выпустят новую музыку... надеюсь,"],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-01T20:36:37+00:00","original_url":"https://metalinjection.net/news/enter-shikari-announce-indefinite-hiatus-at-end-of-2027-say-theyre-not-splitting-up","saved_at":1790899753,"artists":[{"id":"enter-shikari","name":"Enter Shikari"}],"topics":[],"original_title":"Enter Shikari Announce Indefinite Hiatus at End of 2027, Say They're \"Not Splitting Up\"","content_pending":true,"content_status":"Доступен только анонс. Полный текст ожидает загрузки."},{"id":"b2e9c853e4443ef946197d966b41fc0e94e9a5a0","title":"Фронтмен Venom и крестный отец блэк-метала Кронос о своей блестяще причудливой двойной жизни","short":"death фронтмена Venom Конрада \"Cronos\" Ланта в возрасте 63 лет многих шокировал. Ранее в этом году он дал то, что оказалось его последним интервью Classic Rock , и мы нашли его в анимационной форме, рассказывая о его любви к Кейт Буш, его годах с Venom и его маловероятной второй карьере в качестве мультимедийного инженера.","paragraphs":["death фронтмена Venom Конрада \"Cronos\" Ланта в возрасте 63 лет многих шокировал. Ранее в этом году он дал то, что оказалось его последним интервью Classic Rock , и мы нашли его в анимационной форме, рассказывая о его любви к Кейт Буш, его годах с Venom и его маловероятной второй карьере в качестве мультимедийного инженера. «Оззи пел о Дьяволе», - сказал он нам. «Я хотел быть дьяволом».","Конрад ‘Cronos’ Лант, возможно, был последним незнакомцем, которого Кейт Буш поцеловала в губы на публике. Это был сентябрь 1980 года, и королева колдовского арт-попа подписывала контракт на Virgin Records в Ньюкасле во время остановки в городе в рамках своей ныне легендарной аудиовизуальной феерии Tour Of Life.","Любовь Кроноса к Бушу и ее музыке может показаться несовместимой с рэкетом, который он делал со своей собственной группой, демонической NWOBHM brat-princes Venom , но это всего лишь одна из многих неожиданных и интересных вещей о нем.","«Что не нравится в Кейт Буш?» - говорит он теперь, 46 лет спустя, с акцентом Джорди, столь же широким, как устье реки Тайн. «У нее невероятный способ писать. Я даже покрасил волосы в красный цвет хной из-за нее».","Поэтому, когда Кронос услышал об этой сессии подписания, он сказал своим боссам в студии звукозаписи, где он работал, что уходит на пару часов.","«Я помчался и подтолкнул меня к передней части очереди, подобрался как можно ближе», - вспоминает он. «У нее были эти плакаты, которые она подписывала. Я сказал:« Можешь написать «Кроносу…»? Затем я спросил: «Можно мне kiss?»","Некоторые, возможно, отшатнулись при виде короткой, тощей Джорди в кожаной куртке, просящей шлепку. Но Кейт Буш была сделана из более сурового материала.","«Она наклонилась и поцеловала меня в губы, — говорит он. — Мои колени пошли. Когда я уходил в оцепенении, парень позади нас the говорит: ‘Can I have a kiss?’ И я услышал этот голос: Больше никаких поцелуев. Я был the последним».","Он сияет, как лунный подросток в памяти. «У меня остался плакат: ‘To Cronos, lots of love, Kate Bush.’»","Существует две версии Cronos. Один из них - полоскающий горло, разрушающий басы вельзевульский сумасшедший, который с конца 70-х периодически выключает Венома. Другая - грубая Джорди, которая раньше преподавала аэробику, увлекалась наблюдением за птицами и выращиванием чили, и любит Джони Митчелл , Jethro Tull и yes, Кейт Буш.","Обе версии здесь в это теплое субботнее утро в мае в Лондоне, кормят колой и льдом в кабинке в Wetherspoons на Camden Lock. Позже сегодня он и нынешний гитарист Venom Стюарт ‘Rage’ Диксон и барабанщик Дэнни ‘Dante’ Нидхэм отправятся в ближайший металлический магазин Raven Records для своего собственного магазина перед выпуском шестнадцатого альбома группы Into Oblivion , дикого rush шума и святотатства. ‘ Satan ejaculates! ’ Кронос рычит на одной песне, Man And Beast . «Мне просто нравится использовать ненормативную лексику», - говорит он с усмешкой.","Но это не просто провокация. Больше никогда не ссылается на любимого Кроноса Эдгара Аллана По. « Ворон, Сердце-обличитель , мне это нравится», - говорит он. Он даже думал записать свою собственную версию аудиокниги поэзии По, добавив к ней свой собственный оборот. Он начинает читать фразы из «Ворона»: «Бледный декабрь… святые дни прошлого».","Во время разговора Кронос мог заставить Джимми Гвоздя звучать как второстепенный член королевской семьи, но он родился в Лондоне. Южный Челси, в частности. « The Who обычно парковали свой фургон за углом, и моя мама обычно брала сигареты из магазина, где Мик Джаггер и они тоже покупали их», - говорит он. «Я помню, как увидел его по телевизору и сказал: ‘That’s парень из углового магазина».","Переезд в Ньюкасл в семь или восемь лет был трудным. Он подрался в первый день в школе из-за своего акцента. “‘Cockney wanker!’”: “Bam!” Он не говорит, кто получал его.","Он улыбается, когда описывает, каким он был в подростковом возрасте. «Мудак. Настоящий мудак. Мы с приятелем терроризировали школу.« Однажды он ворвался в мамину заначку с могадонами и запил их бутылкой водки. «Я даже не могу вспомнить тот день в школе, но, видимо, я хотел сразиться со всеми учителями».","Он хотел вступить в армию в детстве, что, по его мнению, могло бы его выправить, но выстрел в глаз гранулой, когда он и его друзья возились с пневматическими винтовками, поставил это под сомнение. «Я слеп на этот глаз», - говорит он, указывая на свой правый взгляд. «Гранула все еще там».","В детстве он любил музыку: Early Queen , Jethro Tull. Его старший брат, Грэм, был востребованным барабанщиком, который в конечном итоге присоединился к местным героям Prefab Sprout. «О, они были дерьмовыми. Я ненавидел этих ублюдков», - говорит он о последних. «Однажды они появились в студии, и инженер сказал: ‘This is Prefab Sprout.’ ‘Prefab what?’ Мы катались по полу, смеясь.»","Кронос устроился на работу в местную студию звукозаписи Impulse. В своем рассказе он убедил владельцев создать Neat Records для выпуска синглов и альбомов местных групп, таких как Fist, Tygers Of Pan Tang и, в конечном итоге, самих Venom. «Я сказал:« Вся эта тяжелая музыка продолжается. Юсу нужно было сесть на него ».","Он присоединился к Веному, когда ему было 16 лет, подпитываемый сумасшедшим rush панком. Сначала он не был их певцом. Это был Клайв Арчер, который носил макияж из протокорпусной краски и носил сценический псевдоним Иисус Христос. «Джефф и Брей сказали:« Мы думаем, что ты лучше, чем он. «Поэтому мы выгнали его и стали тройкой. С тех пор я его никогда не видела».","Джефф - Джефф Данн, он же оригинальный гитарист Venom Мантас, а Брей - барабанщик Тони Брей, он же Абаддон. Эта нечестивая троица выполняла миссию по перетаскиванию рок-н-ролла в Аид, и они, черт возьми, почти преуспели. Первые два альбома Venom, Welcome To Hell 1982 года и Black Metal следующего года, являются близнецовыми шрифтами, из которых происходит весь экстремальный металл. Грубые гимны богохульства, из-за которых Motörhead звучит как The Nolans. Как говорит Кронос: «Оззи пел о Дьяволе. Я хотел быть дьяволом».","Кому-то он подошел вплотную. Заглавный трек героически абразивного альбома 1985 года Possessed попал в ‘Filthy Fifteen’ списка песен PMRC, которые могут развратить молодежь Америки.","«Я думал, что это чертовски здорово», - говорит он. «Черт возьми, у вас есть Фрэнк Заппа и Джон Денвер, выступающие против этих скучающих домохозяек. Я также большой поклонник Джона Денвера.» Он начинает петь: « Ты наполняешь мои чувства, как ночь в лесу… »","Воздух недоброжелательности, окружающий Венома, наэлектризовал поколение молодых американских металлических фанатов. Metallica и Slayer открыты для Venom в США. «Мы с Клиффом Бертоном тусовались», - говорит Кронос о покойном басисте Metallica. «Он приносил травку, у меня был гашиш. Он был настоящим обкурителем, Клифф. Хороший парень».","В Британии все было по-другому. Фанаты Gnarly metal любили Venom, но все остальные думали, что это шутка, не в последнюю очередь пресса. «Похоже, Англия хотела иметь дело с Веномом», - говорит он. «Должно быть, мы наступили не на те пальцы».","Единственными людьми, которые не любили Венома больше, чем прессу, были сами Веном.","«Люди придумали этот миф об этом составе», - говорит он. «Никакого товарищества не было. Мы не были друзьями. Когда эта группа распалась, она была в плохих отношениях».","Технически Веном не разделился. Кронос уволился в 1987 году, но двое других продолжали без него. Оригинальный состав воссоединился для одного альбома в середине 90-х годов, но старые проблемы всплыли вновь. Один за другим Абаддон и Мантас отвалились, оставив Кроноса руководить группой с тех пор. Нынешний состав из трех человек существует уже 17 лет, почти в три раза дольше, чем оригинал. Сегодня между Кроносом, Мантой и Абаддоном нет любви.","“Nah,”. «Я не хочу иметь с ними ничего общего. Слишком много мочи вокруг».","Именно здесь общественное восприятие Кроноса отделяется от реальности. После Венома он задумался о том, чтобы бросить музыку. «Я собирался упаковать все это. Я собирался стать убойщиком или работать в комиссии по лесному хозяйству. Я люблю бывать на свежем воздухе. Вместо этого он сформировал новую группу Cronos, которая опиралась на более мелодичный хэви-метал , граничащий с хард-роком. Они выпустили два альбома, которые интересны, а не великолепны.","Но в начале 90-х он неожиданно диверсифицировался. Он провел свою часть тяжелой жизни в 80-х годах, но он также занимался тяжелой атлетикой и фитнесом. Он видел, как повальное увлечение аэробикой снялось на фоне тренировочных видео голливудской звезды Джейн Фонда, и он хотел принять участие в этом действии. «Я знал все о сердечно-сосудистых упражнениях, поэтому решил пойти и научиться делать это правильно», - говорит он. «Я учился в колледже, получал высшие оценки за все на всех экзаменах».","К началу 90-х работал инструктором по фитнесу. «Я проводил множество занятий. Я играл в рейв. Мы начинали с промежуточных вещей, просто чтобы согреться, а затем это был бах! бах! бах!« Он работал с парнями из армии. «Раньше они приходили на занятия. Мы делали это в спортивных залах или на полях. На них были бы ботинки и рюкзаки».","Кронос был со своими военными приятелями, когда у него произошел несчастный случай, который почти навсегда завершил его музыкальную карьеру. Они брали его на скалолазание в Уэльс и Шотландию. «Ты когда-нибудь делал это?» - спрашивает он. «Чувство, которое вы испытываете, находясь на вершине горы, почти духовное».","Он был на восхождении в Уэльсе в начале 2000-х годов, когда его ударило падающим камнем. «Парень над нами, камень под его ногой уступил место», - говорит он. «Я уклонился с дороги, но он попал нам прямо в затылок – бум. Некоторое время я был готов».","Это не было опасно для жизни, но это было серьезно. «Я не мог играть на басу», - говорит он. «Я, конечно, не мог встать и играть на басу. Я чувствовал, что закончил играть музыку. Именно тогда я взялся за компьютер».","Это еще один путь, по которому странная жизнь Кроноса привела его вниз","«У моего друга была компьютерная компания в Ньюкасле», - говорит он. «Я смеялся над графикой на логотипе компании, и он сказал:« Можешь ли ты сделать лучше? ’Я пошел: ‘Yeah.’ ”","Он погрузился в Photoshop и начал работать мультимедийным инженером в компании своего товарища. Он рассматривал это как продолжение того, что он делал всю свою жизнь. «Все является художественной средой», - говорит он. «Я мог бы взять немного грязи и создать картину на холсте. Вот как я вижу творчество – ничего не стоит на повестке дня. Итак, появился ИИ, и я подумал: ‘Yeah, I’ Попробую».","Он говорит об изобразительном искусстве, а не о музыке.","“Nah,”. «Я всегда буду писать свою собственную музыку».","Жизнь сегодня чуть менее насыщенная, чем раньше. Он выращивает чили для хобби, делает соусы, которые дарит друзьям. «Если вы говорите о Каролине Жнецах и Нагах и всех этих мальчиках, вы должны правильно приготовить компост», - это его совет. Он был членом RSPB в детстве, и он все еще следит за птицами вокруг своего дома в Нортумберленде. «Щитомордники, малины, галстуки. У нас даже в саду на заднем дворе была цапля. Я всегда увлекался птицами. Не только летающие »,- добавляет он со смешком.","Это тот вид кляпа, который вы хотите от Кроноса, человека, который провел почти 50 лет, трахаясь меньше, чем ноль, о том, что другие люди думают о нем – подход, который принес ему хорошее и плохое.","«Это путешествие и история, и вы должны взять все в свои руки», - говорит он, на мгновение философски. «Если вы вернетесь и что-то измените, вы измените то, кем вы являетесь сегодня».","Это должно звучать удивительно, исходя от человека, который написал песню под названием In League With Satan . Но это Кронос, а с ним все и ничего не удивляет.","Дэйв Эверли пишет и иногда напевает под музыку с начала 90-х годов. В течение этого времени он был заместителем редактора в Kerrang! и Classic Rock , помощником редактора в журнале Q и штатным писателем/чайным мальчиком в Raw , не обязательно в этом порядке. Он писал для Metal Hammer, Louder, Prog, The Observer, Select, Mojo , Evening Standard и полностью легендарного Ultrakill . Он все еще ждет, когда Билли Гиббонс отправит ему бутылку острого соуса, который ему обещали несколько лет назад."],"category":"Прогрессив","source":"Louder","published":"2026-10-01T21:00:00+00:00","original_url":"https://www.loudersound.com/bands-artists/cardio-corpse-paint-and-carolina-reapers-venom-frontman-cronos-on-his-brilliantly-bizarre-double-life","saved_at":1790899751,"artists":[{"id":"jethro-tull","name":"Jethro Tull"},{"id":"metallica","name":"Metallica"},{"id":"motorhead","name":"Motörhead"},{"id":"slayer","name":"Slayer"},{"id":"venom","name":"Venom"}],"topics":[],"original_title":"Venom frontman and godfather of black metal Cronos on his brilliantly bizarre double life","original_paragraphs":["The death of Venom frontman Conrad \"Cronos\" Lant at the age of 63 came as a shock to many. Earlier this year, he gave what turned out to be his final interview to Classic Rock , and we found him in animated form, holding forth on his love of Kate Bush, his years with Venom and his unlikely second career as a multimedia engineer. “Ozzy was singing about the Devil,\" he told us. \"I wanted to be the Devil.”","Conrad ‘Cronos’ Lant might be the last stranger Kate Bush kissed on the lips in public. It was September 1980, and the queen of witchy art-pop was doing a signing session at Virgin Records in Newcastle during a stop-off in the city as part of her now-fabled Tour Of Life audio-visual extravaganza.","Cronos’s love of Bush and her music might seem at odds with the filth-hound racket he was making with his own band, demonic NWOBHM brat-princes Venom , but it’s just one of many unexpected and interesting things about him.","“What’s not to love about Kate Bush?” he says now, 46 years later, Geordie accent as wide as the Tyne estuary. “She’s got an incredible way of writing. I even dyed me hair red with henna because of her.”","So when Cronos heard about that signing session, he told his bosses at the recording studio where he worked that he was bunking off for a couple of hours.","“I raced in and pushed me way to the front of the queue, got as near as I could,” he recalls. “She had these posters she was signing. I said: ‘Can you write “To Cronos…”? Then I said: ‘Can I have a kiss?’”","Some might have recoiled at the sight of a short, scrawny Geordie in a leather jacket asking for a smacker. But Kate Bush was made of sterner stuff.","“She leaned over and kissed me on me lips,” he says. “My knees went. As I was walking away in a daze, the guy behind us says: ‘Can I have a kiss?’ And I heard this voice: ‘No more kisses.’ I was the last one.”","He beams like a moonstruck teenager at the memory. “I’ve still got the poster: ‘To Cronos, lots of love, Kate Bush.’”","There are two versions of Cronos. One is the gargling, bass-wrecking Beelzebubian madman who has fronted Venom on and (occasionally) off since the end of the 70s. The other is the garrulous Geordie who used to teach aerobics, is into birdwatching and growing chillis, and loves Joni Mitchell , Jethro Tull and, yes, Kate Bush.","Both versions are here on this warm Saturday morning in May in London, nursing Coke-and-ice in a booth in a Wetherspoons on Camden Lock. Later today, he and current Venom guitarist Stuart ‘Rage’ Dixon and drummer Danny ‘Dante’ Needham will descend on nearby metal shop Raven Records for their own in-store ahead of the release of the band’s sixteenth album, Into Oblivion , a wild-eyed rush of noise and sacrilege. ‘ Satan ejaculates! ’ Cronos snarls on one song, Man And Beast . “I just like using profanity for the fuck of it,” he says with a grin.","But it’s not just provocation. Nevermore references Cronos’s beloved Edgar Allan Poe. “ The Raven, The Tell-Tale Heart , I love that stuff,” he says. He was even thinking of recording his own audiobook version of Poe’s poetry, putting his own spin on it. He begins reciting phrases from The Raven : “‘Bleak December… saintly days of yore.’”","When talking, Cronos might make Jimmy Nail sound like a minor royal, but he was born in London. South Chelsea, specifically. “ The Who used to park their van around the corner and me mam used to get her cigarettes from the shop where Mick Jagger and them lot bought theirs too,” he says. “I remember seeing him on the telly and saying: ‘That’s the guy from the corner shop.’”","Moving to Newcastle at seven or eight was tough. He got into a fight on his first day of school because of his accent. “‘Cockney wanker!’” he says, then mimes a punch: “Bam!” He doesn’t say who was on the receiving end of it.","He grins when he describes what he was like as a teenager. “A wanker. A proper twat. Me and me mate would terrorise the school.” One day, he broke into his mum’s stash of Mogadons and washed them down with a bottle of vodka. “I can’t even remember that day at school, but apparently I was wanting to fight all the teachers.”","He wanted to join the army as a kid, which he thinks might have straightened him out, but getting shot in the eye with a pellet when he and his friends were messing about with air rifles put the kibosh on that. “I’m blind in this eye,” he says, pointing to his right peeper. “The pellet’s still in there.”","He loved music as a kid: early Queen , Jethro Tull. His elder brother, Graham, was an in-demand drummer who ended up joining local heroes Prefab Sprout. “Oh, they were shite. I hated those fuckers,” he says of the latter. “They turned up in the studio one day and the engineer said: ‘This is Prefab Sprout.’ ‘Prefab what?’ We were rolling round the floor laughing our cocks off.”","Cronos got a job in a local recording studio, Impulse. In his telling, he persuaded the owners to set up Neat Records to release singles and albums by local bands such as Fist, Tygers Of Pan Tang and, eventually, Venom themselves. “I said: ‘All this heavy music is going on. Yous needed to get on it.”","He’d joined Venom when he was 16, fuelled by the mad rush of punk. He wasn’t their singer at first. That was Clive Archer, who wore protocorpse paint make-up and had the stage name Jesus Christ. “Jeff and Bray said: ‘We think you’re better than him.’ So we kicked him out and became a three-piece. I’ve never seen him since.”","Jeff is Jeff Dunn, aka original Venom guitarist Mantas, and Bray is drummer Tony Bray, aka Abaddon. This unholy trinity were on a mission to drag rock’n’roll to Hades, and they damn near succeeded. Venom’s first two albums, 1982’s Welcome To Hell and the following year’s Black Metal are the twin fonts from which all extreme metal springs. Rough-arsed hymns of blasphemy that made Motörhead sound like The Nolans. As Cronos puts it: “Ozzy was singing about the Devil. I wanted to be the Devil.”","To some, he came close. The title track of 1985’s heroically abrasive Possessed album landed them on the PMRC’s ‘Filthy Fifteen’ list of songs likely to corrupt America’s youth.","“I thought it was fucking great,” he says. “Fucking hell, you’ve got Frank Zappa and John Denver stepping up against these bored housewives. I’m a massive John Denver fan as well.” He starts singing: ‘ You fill up my senses, like a night in the forest… ’","The air of malevolence surrounding Venom electrified a generation of young American metal fans. Metallica and Slayer opened for Venom in the US. “Me and Cliff Burton used to hang out,” Cronos says of the late Metallica bassist. “He’d bring weed, I’d have hash. He was a proper stoner, Cliff. Good lad.”","Things were different back home in Britain. Gnarly metal fans loved Venom, but everyone else thought they were a joke, not least the press. “It seemed like England wanted fuck-all to do with Venom,” he says. “We must’ve stepped on the wrong toes.”","The only people who disliked Venom more than the press were Venom themselves.","“People have made up this myth about that line-up,” he says. “There was no camaraderie. We weren’t friends. When this band split, it was on bad terms.”","Technically, Venom didn’t split. Cronos quit in 1987, but the other two carried on without him. The original line-up reunited for one album in the mid-90s but the old problems resurfaced. One by one, Abaddon and Mantas fell away, leaving Cronos to lead the band ever since. The current three-piece line-up has been together for 17 years, almost three times as long as the original. Today there’s no love lost between Cronos, Mantas and Abaddon.","“Nah,” he says. “I don’t want anything to do with them two. Too much piss-fartin’ around.”","This is where the public perception of Cronos splits from the reality. Post-Venom, he considered quitting music. “I was gonna pack it all in. I was gonna be a slaughterman or work in the forestry commission. I love being outdoors.” Instead he formed a new band, Cronos, who leaned into more melodic heavy metal , verging on hard rock. They released two albums that are interesting rather than great.","But the early 90s saw him diversify in an unexpected fashion. He’d done his share of hard living in the 80s, but he was into weightlifting and fitness too. He’d seen how the aerobics craze had taken off on the back of Hollywood star Jane Fonda’s workout videos and he wanted in on the action. “I knew fuck-all about cardiovascular exercise, so I decided to go and learn how to do it properly,” he says. “I went to college, got top marks for everything in all me exams.”","By the early 90s he was working as a fitness instructor. “I did loads of classes. I played rave. We’d start off with mid-paced stuff, just to warm up, then it was bang! bang! bang!” He worked with guys from the military. “They used to come to the classes. We’d do it in sports halls or fields. They’d have their boots and backpacks on.”","Cronos was with his military buddies when he had the accident that nearly finished his music career for good. They’d take him climbing in Wales and Scotland. “Have you ever done it?” he asks. “The feeling you get being on top of a mountain is almost spiritual.”","He was on a climb in Wales in the early 2000s when he was hit by a falling rock. “The guy above us, the rock under his foot gave way,” he says. “I ducked out of the way, but it hit us square in the back of me neck – boom. I was braced up for a while.”","It wasn’t life-threatening, but it was serious. “I couldn’t play bass,” he says. “I certainly couldn’t stand up and play bass. I felt like I was done playing music. That’s when I took up the computer.”","This is yet another avenue that Cronos’s strange life has led him down","“A mate of mine had a computer company in Newcastle,” he says. “I was laughing at the graphics on the company logo, and he said: ‘Can you do better?’ I went: ‘Yeah.’”","He dived into Photoshop and began working as a multimedia engineer for his mate’s company. He saw it as an extension of what he’d done all his life. “Everything’s an art medium,” he says. “I could pick up some mud and create a picture on a canvas. This is the way I see creativity – nothing’s off the table. So AI comes along, and I’m like: ‘Yeah, I’ll try that.’”","He’s talking about the visual arts, not music.","“Nah,” he says. “I’ll always write me own music.”","Life today is only slightly less full-on than it has been. He grows chillis for a hobby, making sauces that he gives to friends. “If you’re talking Carolina Reapers and Nagas and all them boys, you’ve got to get your compost right,” is his tip. He was a member of the RSPB as a kid, and he still keeps an eye out for birds around his house in Northumberland. “Goldfinches, robins, wrens. We even had a heron in our back garden. I’ve always been into birds. Not just the flying ones,” he adds with a cackle.","It’s the kind of ripped-from-the-old-days gag you want from Cronos, a man who has spent almost 50 years giving less than zero fucks about what other people think of him – an approach that has brought him the good and the bad with it.","“It’s a journey and a story, and you’ve got to take everything in your stride,” he says, momentarily philosophical. “If you go back and change something, you change who you are today.”","It should sound surprising coming from a man who wrote a song called In League With Satan . But this is Cronos, and with him everything and nothing is a surprise.","Dave Everley has been writing about and occasionally humming along to music since the early 90s. During that time, he has been Deputy Editor on Kerrang! and Classic Rock , Associate Editor on Q magazine and staff writer/tea boy on Raw , not necessarily in that order. He has written for Metal Hammer, Louder, Prog, the Observer, Select, Mojo , the Evening Standard and the totally legendary Ultrakill . He is still waiting for Billy Gibbons to send him a bottle of hot sauce he was promised several years ago."]},{"id":"178aecb4315e43411c67479b63ea114104f49c14","title":"Лззи Хейл из Halestorm выступила против сексуального насилия после возобновления дела в Корнеллском университете","short":"Вокалистка и гитаристка Halestorm Лззи Хейл публично высказалась о новых обстоятельствах дела о предполагаемом групповом изнасиловании, которое, как утверждается, произошло в районе Корнеллского университета в 2024 году.","paragraphs":["Вокалистка и гитаристка Halestorm Лззи Хейл публично высказалась о новых обстоятельствах дела о предполагаемом групповом изнасиловании, которое, как утверждается, произошло в районе Корнеллского университета в 2024 году. Тогда обвинения не предъявлялись, но новый гражданский иск предполагаемой пострадавшей, бывшей студентки, привёл к возобновлению дела.","В гражданском иске названы семь человек, которые, как утверждается, состояли в университетском братстве Chi Phi. Женщина заявляет, что ей дали наркотическое вещество и изнасиловали. Её представители утверждают, что власти ненадлежащим образом расследовали первоначальное дело. Последующие публикации в СМИ также обвиняли университет в недостаточном наказании виновных.","Вчера, 30 сентября, Хейл написала в социальных сетях:","«Если вы мужчина, который считает нормальным превращать другого человека лишь в то, во что можно засунуть свой член, с вами что-то серьёзно не так. Вы не “перспективный молодой человек”, а больной монстр, которого нужно наказать и оградить от контакта с другими людьми. А если вы мужчина, который бездействует, став свидетелем изнасилования, да, даже если вы увидели это в групповом чате, вы всё равно свидетель, и предпочитает ничего не делать и не говорить, вы не “хороший парень”. Вы соучастник сексуального насилия и тоже должны предстать перед правосудием, потому что мы не хотим, чтобы такие, как вы, ходили среди нас».","В подписи Хейл также добавила:","«А если у вас есть власть привлечь этих мужчин к ответственности, но вы ничего не делаете, принимаете их сторону или отпускаете их, отделавшись чёртовым “письменным заданием”, вас нужно лишить власти и права ходить среди нас»."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T21:46:23+00:00","original_url":"https://www.theprp.com/2026/10/01/news/halestorms-lzzy-hale-speaks-out-against-sexual-abusers-in-the-wake-of-reopened-cornell-university-gang-rape-case/","saved_at":1790899684,"artists":[{"id":"halestorm","name":"Halestorm"}],"topics":[]},{"id":"01f847d30c863b0d7b8d01b1d1d8999fbfcec1b6","title":"Descape представили клип на песню «True Colors»","short":"В сети появился клип на заглавную песню грядущего альбома канадской металкор-группы Descape «True Colors». Пластинка из 11 песен выйдет завтра, 2 октября, на Seek \u0026 Strike.","paragraphs":["В сети появился клип на заглавную песню грядущего альбома канадской металкор-группы Descape «True Colors». Пластинка из 11 песен выйдет завтра, 2 октября, на Seek \u0026 Strike."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T21:56:23+00:00","original_url":"https://www.theprp.com/2026/10/01/news/descapes-true-colors-music-video-debuts/","saved_at":1790899671,"artists":[{"id":"descape","name":"Descape"}],"topics":["releases"]},{"id":"e072ed442a11e8590fcd9ea34106236d182e6100","title":"Kid Rock анонсировал христианский альбом «Halfway 2 Jesus» с участием Eminem","short":"Консервативная звезда рэп-рока и кантри Kid Rock анонсировал новый альбом на религиозную тему «Halfway 2 Jesus». Первый сингл с библейским вдохновением, «James 1:17», уже появился в сети вместе с клипом. Rock посвятил видео Джимми Боунсу из The Twisted Brown Tucker Band, своей сопровождающей группы.","paragraphs":["Консервативная звезда рэп-рока и кантри Kid Rock анонсировал новый альбом на религиозную тему «Halfway 2 Jesus». Первый сингл с библейским вдохновением, «James 1:17», уже появился в сети вместе с клипом. Rock посвятил видео Джимми Боунсу из The Twisted Brown Tucker Band, своей сопровождающей группы. Боунс сейчас борется с боковым амиотрофическим склерозом. Также клип посвящён Калвину Линчу, у которого неоперабельная опухоль мозга. Его желанием в программе Make-A-Wish было сыграть на барабанах с Kid Rock.","Если ранние тексты Rock были посвящены разгулу и браваде и нередко содержали сомнительные с моральной точки зрения строки, новый альбом, судя по всему, обращается к христианским убеждениям и ценностям. Примечательно, что Eminem, также известный провокационными текстами, указан гостем в песне «7 Sins». Артисты уже сотрудничали на ранних этапах своих карьер.","Выход «Halfway 2 Jesus» ожидается 17 октября. В альбом войдут следующие песни:","01 – “ Freedom “ 02 – “ James 1:17 “ 03 – “ 7 Sins ” (feat. Eminem ) 04 – “ Why Don’t You Look Into Jesus “ 05 – “ Water Into Wine “ 06 – “ Halfway 2 Jesus “ 07 – “ I Don’t Drink Whiskey Anymore “ 08 – “ Me And Jesus “ 09 – “ God Is Good (Prelude) “ 10 – “ God Is Good “ 11 – “ Into The Setting Sun “ 12 – “ Broken Hearted People “ 13 – “ ‘Til You Can’t “ 14 – “ Why Don’t You Look Into Jesus ” (Riri Mix) 15 – “ High Road “ 16 – “ Procession “ 17 – “ God Bless The USA “"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T23:03:54+00:00","original_url":"https://www.theprp.com/2026/10/01/news/kid-rock-announces-his-new-christian-album-halfway-2-jesus-eminem-guests/","saved_at":1790899667,"artists":[{"id":"eminem","name":"Eminem"},{"id":"kid-rock","name":"Kid Rock"}],"topics":["releases"]},{"id":"d910deaf51094257b3a6c4e84e8a94466d840482","title":"Новое видео THE ROLLING STONES","short":"Mr. Charm, новое видео группы THE ROLLING STONES, доступно для просмотра ниже. Эта песня взята из альбома Foreign Tongues, выпущенного 10 июля на Capitol Records: Rough And Twisted","paragraphs":["Mr. Charm, новое видео группы THE ROLLING STONES, доступно для просмотра ниже. Эта песня взята из альбома Foreign Tongues, выпущенного 10 июля на Capitol Records:","Rough And Twisted","In The Stars","Jealous Lover","Mr. Charm","Divine Intervention","Ringing Hollow","Never Wanna Lose You","Hit Me In The Head","You Know I‘m No Good (Amy Winehouse)","Some Of Us","Covered In You","Side Effects","Back In Your Life","Beautiful Delilah (Chuck Berry)"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-01T19:00:11+00:00","original_url":"http://www.darkside.ru/news/184165/","saved_at":1790886531,"artists":[{"id":"the-rolling-stones","name":"The Rolling Stones"}],"topics":["releases"]},{"id":"2a1cc45a2f8db6e69e072082eab866ffc70ae3bd","title":"Умер вокалист VENOM","short":"Основатель, вокалист и басист VENOM Кронос (настоящее имя Конрад Томас Лант) скончался в возрасте 64 лет. Об этой ужасной вести VENOM сообщили в социальных сетях:","paragraphs":["Основатель, вокалист и басист VENOM Кронос (настоящее имя Конрад Томас Лант) скончался в возрасте 64 лет.","Об этой ужасной вести VENOM сообщили в социальных сетях:","ПАМЯТИ КОНРАДА «КРОНОСА» ЛАНТА","С глубокой скорбью и разбитыми сердцами мы сообщаем, что Конрад «Кронос» Лант ушёл из жизни.","На протяжении более четырёх десятилетий голос, бас и видение Конрада были сердцем VENOM.","От первых тёмных раскатов «Welcome To Hell» через «Black Metal», «At War With Satan», «Possessed» и дальше он создал нечто, навсегда изменившее тяжёлую музыку.","VENOM никогда не следовали правилам. Они прокладывали собственный путь.","И Конрад был в самом центре всего этого: бескомпромиссный, бесстрашный и неповторимый.","The Legions всегда были важной частью VENOM. Всем, кто стоял рядом с группой все эти годы, покупал пластинки, приходил на концерты, носил футболки, делился музыкой и поддерживал огонь, Кронос всегда был благодарен за вашу верность и поддержку.","Послание от Натана, сына Конрада: «Я хочу поблагодарить всех The Legions за поддержку, которую вы оказывали моему отцу все эти годы. Я знаю, что он очень ценил каждого из вас. Он отдал свою душу, и его музыка будет жить. Легенда Кроноса никогда не умрёт».","Его музыка никогда не умрёт.","Его голос никогда не угаснет.","А наследие VENOM будет жить в музыке, которую он создал, и в The Legions по всему миру, которые продолжают нести этот огонь.","Спасибо тебе, Конрад.","Спасибо тебе, Кронос.","Спасибо за музыку.","Спасибо за воспоминания.","Наша глубочайшая любовь и соболезнования Натану и Хел, друзьям и всем, кому выпала честь знать его.","ПОКОЙСЯ С МИРОМ, КОНРАД","ЛЕГЕНДА ЖИВЁТ 🖤 VENOM"],"category":"Экстремальный метал","source":"Darkside","published":"2026-10-01T19:28:48+00:00","original_url":"http://www.darkside.ru/news/184181/","saved_at":1790886524,"artists":[{"id":"venom","name":"Venom"}],"topics":[]},{"id":"ae5cbd8bd8fdc263979aafc91068ee7a1fe1c3db","title":"Лззи Хейл из Halestorm делает решительное заявление против сексуального насилия, поскольку расследование изнасилования в Корнельском университете возобновляется","short":"Halestorm ’s Lzzy Hale has published a powerful statement against sexual assault, as New York state prosecutors reopen investigations of the alleged 2024 gang-rape of a woman at Cornell University. The Nashville-based rocker took to Instagram this morning (Tuesday, October 1) and shared a short yet scathing post, containing an image with text that lambasted “the kind of man…","paragraphs":["Лззи Хейл из Halestorm опубликовал мощное заявление против сексуального насилия, поскольку прокуроры штата Нью-Йорк возобновляют расследование предполагаемого группового изнасилования женщины в Корнельском университете в 2024 году.","Нэшвиллский рокер написал в Instagram сегодня утром (во вторник, 1 октября) и поделился коротким, но язвительным постом, содержащим изображение с текстом, который раскритиковал «человека, который думает, что это нормально - превращать человека в нечто большее, чем то, во что вы можете засунуть свой [член]».","«Если вы тот человек, который думает, что нормально сводить другого человека к чему-то, во что вы можете втиснуть свой [член], с вами что-то серьезно не так», - начинает она.","Певец/гитарист продолжает: «Ты не« многообещающий молодой человек », ты больной монстр, которого нужно наказать и не допустить контакта с другими людьми."],"category":"Прогрессив","source":"Louder","published":"2026-10-01T20:00:00+00:00","original_url":"https://www.loudersound.com/news/halestorm-lzzy-hale-speaks-out-sexual-assault-cornell-university-rape-investigation-2026","saved_at":1790886523,"artists":[{"id":"halestorm","name":"Halestorm"}],"topics":[]},{"id":"8b4dfe2d0ac36e44f6345f93add96dd45e2c4140","title":"Новая песня GRAVE DIGGER","short":"GRAVE DIGGER выпустят новый альбом, получивший название \"Faces Of Pain\", 15 января на Reaper Entertainment. За обложку отвечал Uwe Jarling — она доступна ниже. Продюсировал Chris Boltendahl в студии Graveyard Studios в Зендене (Германия).","paragraphs":["GRAVE DIGGER выпустят новый альбом, получивший название \"Faces Of Pain\", 15 января на Reaper Entertainment. За обложку отвечал Uwe Jarling — она доступна ниже. Продюсировал Chris Boltendahl в студии Graveyard Studios в Зендене (Германия). Первый сингл из этого релиза, The Number, доступен для прослушивания.","Boltendahl: «Наконец-то настал этот момент: с нашим новым альбомом «Faces Of Pain» мы открываем следующую бурную главу нашей истории. Эта пластинка наполнена невероятным количеством души, пота и настоящей страсти. Как лучше всего описать результат?","Все было по-настоящему выдающимся творческим усилием. В частности, моё сотрудничество с гитаристом Tobias'ом Kersting'ом стало невероятно крепким и переросло в глубоко укоренившееся творческое партнёрство.","Его риффы, мои тексты и наше общее видение высвободили невероятную динамику. Результатом стала зрелая, но при этом крайне взрывная работа позднего этапа карьеры, бескомпромиссно сочетающая в себе все классические фирменные черты, которые наши фанаты любят уже десятилетиями.","'Faces Of Pain' показывает нас максимально разносторонними за долгое время. GRAVE DIGGER последовательно следуют своему собственному стилю — стилю, который мы сами формировали годами. Примечательно, что мы ни на секунду не копируем сами себя, но при этом каждая песня, каждая нота безошибочно несёт в себе фирменное, мощное звучание группы. Готовьтесь — это настоящий металлический монстр!»","Трек-лист:","1. The Gate","2. Faces Of Pain","3. Satan's Tango","4. The Number","5. Legends Never Die","6. Hell To The King","7. Dead Sun","8. The Grave That Should Not Be","9. When The World Is Calling You","10. Soul Reaper","11. Say Hello To The Devil","Бритвенно-острые риффы, мощные припевы и безошибочно узнаваемый хриплый вокал Boltendahl'а составляют основу альбома. Быстрые хэви-металлические боевики вроде «Faces Of Pain» и «Satan's Tango» соседствуют с риффовыми среднетемповыми гимнами, включая «The Number», «Legends Never Die» и «When The World Is Calling You». А в треках «Dead Sun» и «Say Hello To The Devil» группа раскрывает свою особенно тяжёлую и мрачную сторону.","Спустя более 45 лет после основания GRAVE DIGGER явно не собираются останавливаться. «Faces Of Pain» — альбом, полный энергии и классического хэви-металла, прочно укоренённый в истории группы, но при этом устремлённый в будущее.","Начиная с января 2027 года GRAVE DIGGER также представят новый материал на сцене. В рамках тура «Legends Never Die Tour» фанаты смогут в очередной раз ощутить неослабевающую живую мощь этого столпа немецкого хэви-металла."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-01T20:00:06+00:00","original_url":"http://www.darkside.ru/news/184166/","saved_at":1790886511,"artists":[{"id":"grave-digger","name":"Grave Digger"}],"topics":["releases"]},{"id":"0e367268b3d30e0b7f36c28e71e819443028a8fd","title":"Майкл Макдональд наконец-то встретился со своим давно потерянным сыном","short":"Майкл Макдональд из Doobie Brothers наконец воссоединился с давно потерянным сыном, которого он никогда не знал, спустя почти 60 лет. Уроженец Сент-Луиса вспомнил во время недавнего интервью KMOV, что ему было всего 14 лет, когда ребенок был первоначально зачат.","paragraphs":["Майкл Макдональд из Doobie Brothers наконец воссоединился с давно потерянным сыном, которого он никогда не знал, спустя почти 60 лет.","Уроженец Сент-Луиса вспомнил во время недавнего интервью KMOV, что ему было всего 14 лет, когда ребенок был первоначально зачат. Он и мать столкнулись с болезненной реальностью того, что им пришлось отдать ребенка на усыновление в то время, момент, который он никогда не забывал на протяжении многих десятилетий, которые последовали за этим.","«Мы всегда говорили о нем. И это всегда сводилось к тому, что наш самый большой страх заключался в том, как жизнь относилась к нему?» - поделился он во время интервью. «Я всегда носила эту вину с собой. Но просто знать, что он в порядке и что у него хорошая жизнь - и жизнь, которую я, вероятно, не смог бы себе позволить в то время в своей жизни, была большой наградой».","«Вы знаете, настоящие рок-звезды в этой истории для нас - это его приемные родители», - добавил он. «Кто действительно дал Майклу все, что нужно ребенку, с точки зрения любви и безопасности»."],"category":"Хард-рок","source":"Ultimate Classic Rock","published":"2026-10-01T20:05:56+00:00","original_url":"https://ultimateclassicrock.com/michael-mcdonald-long-lost-son-2026/","saved_at":1790886509,"artists":[],"topics":[]},{"id":"7449bdc3cf880c5d90871545d2f765fdd0fd3759","title":"Бокс-сет IMMORTAL выйдет зимой","short":"Начался предзаказ на уникальный релиз: бокс-сет, объединяющий полную студийную дискографию IMMORTAL с 1992 по 2023 год, дополненную концертным альбомом «The Seventh Date Of Blashyrkh - Live». Это исчерпывающее собрание сводит воедино более трёх десятилетий истории коллектива в одном цельном издании.","paragraphs":["Начался предзаказ на уникальный релиз: бокс-сет, объединяющий полную студийную дискографию IMMORTAL с 1992 по 2023 год, дополненную концертным альбомом «The Seventh Date Of Blashyrkh - Live». Это исчерпывающее собрание сводит воедино более трёх десятилетий истории коллектива в одном цельном издании.","Бокс-сет выйдет 29 января 2027 года, а оформить предзаказ можно на специальном сайте immortalbox.com.","IMMORTAL — одна из важнейших групп в истории норвежского блэк-металла. С самого начала коллектив выработал самобытный стиль, который развивался на протяжении лет, но никогда не терял своей безошибочной узнаваемости. Холодное атмосферное звучание, фирменные рифы и уникальный северный характер стали визитными карточками IMMORTAL, а каждый новый альбом раскрывал очередную грань музыкального развития команды.","История, представленная в этом бокс-сете, начинается с «Diabolical Fullmoon Mysticism», дебютного альбома группы, вышедшего в 1992 году. Он заложил стиль, ставший одним из определяющих звуков норвежской блэк-металл-сцены. Год спустя «Pure Holocaust» предложил ещё более сырой и интенсивный подход, а вышедший в 1995 году «Battles In The North» довёл скорость, агрессию и фирменную морозность группы до предела и закрепил положение IMMORTAL на экстремальной металлической сцене. Спустя два года «Blizzard Beasts» продолжил этот путь, одновременно продемонстрировав растущие композиционные и звуковые амбиции коллектива.","В конце 1990-х IMMORTAL вступили в новую фазу. Выпущенный в 1999 году «At The Heart Of Winter» ознаменовал существенный сдвиг в сочинении песен. Наряду с яростью блэк-металла всё заметнее становились классические хеви-металл-рифы, мелодии и более продуманные структуры композиций. Следующие альбомы, «Damned In Black» и «Sons of Northern Darkness», развили это направление, сохранив атмосферу и идентичность, которые всегда определяли IMMORTAL.","После нескольких лет перерыва IMMORTAL вернулись в 2009 году с «All Shall Fall». Альбом показал, что команда по-прежнему способна сочетать интенсивность блэк-металла с элементами классического хеви-металла, сохраняя при этом собственный характер.","В бокс-сет вошёл и концертный материал. «The Seventh Date of Blashyrkh - Live» запечатлел выступление IMMORTAL на Wacken Open Air в 2007 году — этот релиз становится естественным дополнением к студийным записям.","Последние главы истории IMMORTAL представлены альбомами «Northern Chaos Gods» (2018) и «War Against All» (2023). Они открыли для группы новую эру: вокальные обязанности перешли к Demonaz, а музыка осталась прочно укоренённой в фирменном стиле IMMORTAL.","В «Immortal - Complete Discography 1992-2023» входят:","Diabolical Fullmoon Mysticism (1992)","Pure Holocaust (1993)","Battles In The North (1995)","Blizzard Beasts (1997)","At The Heart Of Winter (1999)","Damned In Black (2000)","Sons Of Northern Darkness (2002)","All Shall Fall (2009)","The Seventh Date Of Blashyrkh - Live (2010)","Northern Chaos Gods (2018)","War Against All (2023)","Все альбомы в бокс-сете представлены в формате гейтфолд, причём «Sons Of Northern Darkness» и «The Seventh Date Of Blashyrkh - Live» выпущены как двойные виниловые пластинки.","Одиннадцать релизов, более тридцати лет истории и последовательные этапы эволюции одной из важнейших групп норвежского блэк-металла: всё это собрано в едином бокс-сете.","«Immortal - Complete Discography 1992-2023» даёт возможность проследить весь путь коллектива в хронологическом порядке: от сырых истоков и самых яростных, новаторских моментов ранней карьеры до новейших альбомов. Собрание позволяет давним поклонникам заново открыть для себя музыку IMMORTAL в одном полном комплекте, а тем, кто только знакомится с группой, дарит шанс изучить её историю с самого начала."],"category":"Экстремальный метал","source":"Darkside","published":"2026-10-01T20:45:24+00:00","original_url":"http://www.darkside.ru/news/184177/","saved_at":1790886498,"artists":[{"id":"immortal","name":"Immortal"}],"topics":["releases"]},{"id":"70f032a82cf167a368c172a0d52fc51b1162bee5","title":"Новое видео SHOGUN MOJO","short":"\"Gonna Raise Hell\", новое видео группы SHOGUN MOJO, в состав которой входят гитарист KISS Tommy Thayer и вокалист Dan Reed из DAN REED NETWORK, доступно для просмотра. Этот трек взят из дебютного альбома Shogun Mojo, релиз которого намечен на шестое ноября: 1. Fight For The Light","paragraphs":["\"Gonna Raise Hell\", новое видео группы SHOGUN MOJO, в состав которой входят гитарист KISS Tommy Thayer и вокалист Dan Reed из DAN REED NETWORK, доступно для просмотра. Этот трек взят из дебютного альбома Shogun Mojo, релиз которого намечен на шестое ноября:","1. Fight For The Light","2. Under The Gun","3. Gonna Raise Hell","4. Fire With Fire","5. Dog Eat Dog","6. Turn It Up","7. Nothing To See Here","8. In The Air Tonight","9. Star Rider","10. Funk Party"],"category":"Хард-рок","source":"Darkside","published":"2026-10-01T21:35:02+00:00","original_url":"http://www.darkside.ru/news/184167/","saved_at":1790886497,"artists":[{"id":"shogun-mojo","name":"Shogun Mojo"}],"topics":["releases"]},{"id":"3456de6aa381b0361166481263778a0c0e34e0b6","title":"Новое видео WOLVES IN THE THRONE ROOM","short":"Estuary, новое видео WOLVES IN THE THRONE ROOM, доступно для просмотра. Этот трек взят из нового альбома Estuary, выход которого намечен на 23 октября на виниле, CD, кассете и в цифровом варианте: 1. Estuary 07:07","paragraphs":["Estuary, новое видео WOLVES IN THE THRONE ROOM, доступно для просмотра. Этот трек взят из нового альбома Estuary, выход которого намечен на 23 октября на виниле, CD, кассете и в цифровом варианте:","1. Estuary 07:07","2. Knights of Tiamat 08:37","3. Foretold in Reflections 09:54","4. The Orca Cliffs 07:53","5. Ghosts Among the Obelisks 08:40","6. Wretched Spirits, Land of the Light 06:14"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-01T22:02:25+00:00","original_url":"http://www.darkside.ru/news/184168/","saved_at":1790886489,"artists":[{"id":"wolves-in-the-throne-room","name":"Wolves In The Throne Room"}],"topics":["releases"]},{"id":"b9956ea800661d9e3bf4a074af1eda353317207d","title":"Лззи Хейл осудила предполагаемое групповое изнасилование по делу «Cornell 7»: «Вы не перспективный молодой человек»","short":"Хейл присоединяется к растущему списку знаменитостей, выступающих против предполагаемого преступления.","paragraphs":["Хейл присоединяется к растущему списку знаменитостей, выступающих против предполагаемого преступления."],"category":"Экстремальный метал","source":"Metal Injection","published":"2026-10-01T18:19:15+00:00","original_url":"https://metalinjection.net/news/lzzy-hale-slams-alleged-cornell-7-gang-rape-you-are-not-a-promising-young-man","saved_at":1790884737,"artists":[],"topics":[],"original_title":"Lzzy Hale Slams Alleged ‘Cornell 7’ Gang Rape: “You Are Not a ‘Promising Young Man’”","original_paragraphs":["Хейл присоединяется к растущему списку знаменитостей, выступающих против предполагаемого преступления."],"content_pending":true,"content_status":"Доступен только анонс. Полный текст ожидает загрузки."},{"id":"f708c69cc3a06257909e72d019a8b4362056230d","title":"Дастин Кенсрю из Thrice анонсировал рождественский альбом «That Spirit Of Christmas»","short":"Вокалист и гитарист Thrice Дастин Кенсрю объявил о выходе рождественского альбома «That Spirit Of Christmas» 23 октября. Помимо каверов на рождественскую классику, в него войдёт новая песня «Joy Lives Here», которая уже появилась в сети.","paragraphs":["Вокалист и гитарист Thrice Дастин Кенсрю объявил о выходе рождественского альбома «That Spirit Of Christmas» 23 октября. Помимо каверов на рождественскую классику, в него войдёт новая песня «Joy Lives Here», которая уже появилась в сети. Кенсрю рассказал о ней:","«Единственная совершенно новая песня на альбоме, “Joy Lives Here”, началась с пробной работы для Hallmark Channel. Мне предложили эту идею, и я решил воспринимать её как творческую задачу, хотя поначалу сам замысел мне совсем не нравился. Но он заставил меня глубже вникнуть и попытаться передать настоящее ощущение Рождества у нас дома, которое создаёт в основном моя замечательная жена, обожающая рождественские украшения. Когда я закончил, то настолько погрузился в эту тему, что полюбил её и то, как связал её с домом, хотя мне и сказали, что Hallmark искали совсем не это».","В альбом также включена переработанная версия его прежней сольной песни «This Good Night Is Still Everywhere». О пластинке Кенсрю сказал:","«Я горжусь этим альбомом и считаю его сильным от начала до конца. Как бы я ни любил рождественскую музыку, такое редко встречается на полноформатных рождественских пластинках. Обычно там есть одна или две отличные песни, а остальное кажется наполнителем вокруг сингла. Многие мои любимые записи вообще изначально выходили только синглами. Здесь же, надеюсь, вы услышите, что эта пластинка появилась исключительно из любви к этим песням, удовольствия от создания цельного альбома и радости от возможности разделить этот общий ритм со всеми вами. За вас!»","Трек-лист «That Spirit Of Christmas»:","01 - \"All Alone On Christmas\" 02 - \"White Christmas\" 03 - \"Christmas Time Is Here\" 04 - \"Каждый день будет как праздник\" 05 - \"Joy Lives Here\" 06 - \"У меня есть любовь, чтобы держать меня в тепле\" 07 - \"All I Want For Christmas Is You\" 08 - \"My Favorite Things\" 09 - \"That Spirit Of Christmas\" 10 - \"This Good Night Is Still Everywhere\"","Предзаказ доступен по адресу dustinkensrue.lnk.to/ThatSpiritofChristmas."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T18:32:42+00:00","original_url":"https://www.theprp.com/2026/10/01/news/thrices-dustin-kensrue-announces-his-holidays-album-that-spirit-of-christmas/","saved_at":1790884732,"artists":[{"id":"thrice","name":"Thrice"}],"topics":["releases"],"original_title":"Дастин Кенсрю из Thrice анонсировал рождественский альбом «That Spirit Of Christmas»","original_paragraphs":["Thrice vocalist/guitarist Dustin Kensrue has announced his new holidays record “ That Spirit Of Christmas ” for an October 23rd release date. In addition to covering various Christmas standards, he’s also contributed a new track titled “ Joy Lives Here “, which has newly debuted online below. Kensrue went on to say of it:","“The truly new song on the album, ‘ Joy Lives Here ,’ began as a bit of spec writing for the Hallmark Channel. The idea was put to me, and I decided to treat it as a writing challenge, even though I originally was not a fan of the specific prompt at all. But it forced me to dig down and try to capture the actual feeling around my house at Christmas (created mostly thanks to my amazing and Christmas-decoration-loving wife). By the time I finished, I’d gone deep enough into the prompt to really love it, and the way I had connected it to home — despite being told it was not really at all what Hallmark was looking for.”","A reworked version of his previous solo track “ This Good Night Is Still Everywhere ” is also included. Kensrue said of this record:","“I’m proud of this album, and I think it’s solid top to bottom in a way that, as much as I love Christmas music, generally isn’t the case with a lot of full Christmas albums. There’s usually a great song or two, but often the rest feels like padding for the single, and a lot of my favorite recordings were only singles in the first place. In this case I hope you can hear that this record only exists out of a simple love for these songs, the pleasure of crafting a cohesive album, and a joy at getting to participate in this shared rhythm with all of you. Cheers!”","“ That Spirit Of Christmas ” track listing:","01 – “ All Alone On Christmas “ 02 – “ White Christmas “ 03 – “ Christmas Time Is Here “ 04 – “ Every Day Will Be Like A Holiday “ 05 – “ Joy Lives Here “ 06 – “ I’ve Got My Love To Keep Me Warm “ 07 – “ All I Want For Christmas Is You “ 08 – “ My Favorite Things “ 09 – “ That Spirit Of Christmas “ 10 – “ This Good Night Is Still Everywhere “","You can pre-order it through dustinkensrue.lnk.to/ThatSpiritofChristmas ."]},{"id":"37706a531f8f96998de724a1d1a866dc7a7db010","title":"Опубликована профессиональная запись выступления Static Dress на Outbreak Fest 2026","short":"В сети опубликована профессиональная видеозапись выступления британской пост-хардкор-группы Static Dress на Outbreak Fest в Манчестере 27 июня. Группа была секретным участником фестиваля. Из-за небольшого розыгрыша некоторые зрители ожидали вместо неё реюнион Title Fight.","paragraphs":["В сети опубликована профессиональная видеозапись выступления британской пост-хардкор-группы Static Dress на Outbreak Fest в Манчестере 27 июня. Группа была секретным участником фестиваля. Из-за небольшого розыгрыша некоторые зрители ожидали вместо неё реюнион Title Fight. Static Dress поддержали эту мистификацию, что можно увидеть в видео в оригинале. Во время выступления также прозвучал кавер на «Can’t Relate» Higher Power."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T18:41:32+00:00","original_url":"https://www.theprp.com/2026/10/01/news/pro-shot-footage-of-static-dress-2026-outbreak-festival-set-released/","saved_at":1790884724,"artists":[{"id":"static-dress","name":"Static Dress"}],"topics":["live"]},{"id":"095733533d030a652783212fa07d9305cc9388cc","title":"Тур по США Iron Maiden 2026: сет-лист, фото + обзор","short":"Iron Maiden завершили мировую часть своего тура Run for Your Lives по США во вторник, раскачав Alamodome в Сан-Антонио громовым, бросающим вызов возрасту набором, который стер все мысли о выходе на пенсию из сознания более чем 40 000 присутствующих поклонников. Ниже вы можете увидеть сет-лист и эксклюзивные фотографии с концерта.","paragraphs":["Iron Maiden завершили мировую часть своего тура Run for Your Lives по США во вторник, раскачав Alamodome в Сан-Антонио громовым, бросающим вызов возрасту набором, который стер все мысли о выходе на пенсию из сознания более чем 40 000 присутствующих поклонников.","Ниже вы можете увидеть сет-лист и эксклюзивные фотографии с концерта.","Ночь началась рано с оживленного набора из пяти песен от Anthrax, который получил в последнюю минуту помощь от Рэйвена и бывшего барабанщика Fear Factory Майка Хеллера, поскольку барабанщик Чарли Бенанте был занят «выбиванием кишки», по словам гитариста Скотта Яна. Легенды трэша играли быстро и свободно, с Йеном и Хеллером, закрывающими глаза во время решающих реплик песни, и Джоуи Белладонна, ведущий аудиторию в сингалонгах размером с Техас. Энергия оставалась высокой, поскольку Megadeth следовал за Anthrax с набором из девяти песен, полным хитов и фаворитов фанатов, с \"The Conjuring\" и \"Tornado of Souls\" зарабатывая бешеные ответы от аудитории.","К тому времени UFO ? \"Doctor Doctor\" начал кричать от громкоговорителей к сигналу Iron Maiden Прибытие, энергия в Аламодоме достигла пика. Любой, кто видел металлическое шоу в Сан-Антонио, знает, что почти невозможно сравниться с диким энтузиазмом аудитории Аламо-Сити. Это произошло во вторник, когда Maiden пировали на пылу поклонников, пробираясь через определяющие жанр хиты и любимые глубокие отрезки своих первых девяти альбомов, с 1980 года Iron Maiden до 1992 года Fear of the Dark.","Группа открылась трио разрезов Killers — \"Murders in the Rue Morgue,\"_ \"Wrathchild\" и заглавный трек — в честь их уличных корней и монументального вклада покойного фронтмена Пола Ди'Анно. Певец Брюс Дикинсон одел эту часть, пересекая сцену в узких джинсах и кожаной куртке, развязывая свой могучий оперный вой. В возрасте 68 лет Дикинсон продолжает обучать певцов в возрасте половины своего возраста, изменяя свое впечатляющее вибрато и контроль дыхания парящими криками и головокружительно длинными нотами.","Остальная часть группы последовала этому примеру, с басистом и лидером группы Steve Харрисом, обеспечивающим неустанную ритмическую тягу, поскольку гитаристы Дэйв Мюррей, Адриан Смит и Яник Герс обменяли соло, которые были равными частями, масляными гладкими и бурно быстрыми. Барабанщик Саймон Доусон, который заменил убежденного Нико Макбрейна после ухода последнего из гастролей в 2024 году, умело заполнил обувь своего предшественника, ударив по подписям Макбрейна и мамонта, качаясь канавками. Высокоскоростные рипперы, такие как \"Run to the Hills\" и \"The Trooper\", в наши дни звучат медленнее, чем в 80-е годы расцвета группы, но если единственным доказательством коллективного статуса старшего гражданина Maiden является несколько потерянных ударов в минуту, это небольшая цена, которую нужно заплатить.","Когда в мае 2025 года стартовал тур «Run for Your Lives», некоторые фанаты возмутились цифровыми экранами, которые заменили давний реквизит и фоны на сцене от Iron Maiden. Но, по крайней мере, они развеяли сомнения этого автора во вторник, поскольку визуальные эффекты достигли традиционно высокой планки, которую группа всегда устанавливала.","Морские образы с привидениями во время \"Rime of the Ancient Mariner\" усилили завораживающую эпику, привлекая поклонников к мультисенсорному «театру разума» Мейден, как его придумал Дикинсон. И пуристы все еще наполнялись аналоговыми аксессуарами, поскольку во время шоу дважды появлялся талисман Maiden Эдди размером с монстра и пытался разорвать участников группы на кусочки.","Неудивительно, что глубокие порезы и длинные эпосы управляли шоу. Поклонники так же восторженно (возможно, в большей степени) приветствовали редко исполняемые произведения, такие как \"Infinite Dreams\" и \"Seventh Son of a Seventh Son\", как и изношенные публичные выступления, такие как \"The Number of the Beast\" и \"Aces High.\".","Такова радость шоу Iron Maiden. Трудно привлечь справедливую аудиторию «только хитов», когда у вас никогда не было хитов с самого начала. (Несмотря на их ошеломляющий успех, у них никогда не было песни, попавшей в Billboard Hot 100.) Каждая песня в наборе обязательно будет чьей-то любимой в любой вечер, и заразительный энтузиазм толпы поддержал группу, когда они доминировали на самом большом концерте в Сан-Антонио за свою полувековую карьеру.","Это дешевое клише - сказать, что Iron Maiden лет любят хорошее вино; более подходящим сравнением было бы почтенный театральный актер, который постоянно переосмысливает классическую роль. Обогащенный возрастом и опытом, Iron Maiden привносит новую серьезность в их выступления; каждый тур становится захватывающей новой главой в их эпической саге.","Честно говоря, никто не делает это так, как они — никто никогда не делал — и как только Дикинсон заверил Alamodome: «Мы вернемся», поклонники начали считать минуты, пока группа не выполнит это обещание.","1. \"Murders in the Rue Morgue\" 2. \"Wrathchild\" 3. \"Killers\" 4. \"Phantom of the Opera\" 5. \"The Number of the Beast\" 6. \"Infinite Dreams\" 7. \"Powerslave\" 8. \"2 Minutes to Midnight\" 9. \"Rime of the Ancient Mariner\" 10. \"Run to the Hills\" 11. \"Seventh Son of a Seventh Son\" 12. \"The Trooper\" 13. \"Hallowed Be Thy Name\" 14. \"Iron Maiden\" Включаю 15. \"Aces High\" 16. \"Fear of the Dark\" 17. \"Wasted Years\"","1. \"Devil's Island\" 2. \"The Conjuring\" 3. \"Take No Prisoners\" 4. \"Sweating Bullets\" 5. \"Tipping Point\" 6. \"Tornado of Souls\" 7. \"Symphony of Destruction\" 8. \"Peace Sells\" 9. \"Holy Wars... The Punishment Due\"","1. \"Caught in a Mosh\" 2. \"Madhouse\" 3. \"Antisocial\" 4. \"Got the Time\" 5. \"Indians\""],"category":"Хэви-метал","source":"Ultimate Classic Rock","published":"2026-10-01T18:59:27+00:00","original_url":"https://ultimateclassicrock.com/iron-maiden-us-tour-closer-review-set-list-photos/","saved_at":1790884719,"artists":[{"id":"anthrax","name":"Anthrax"},{"id":"destruction","name":"Destruction"},{"id":"iron-maiden","name":"Iron Maiden"},{"id":"megadeth","name":"Megadeth"},{"id":"ufo","name":"UFO"}],"topics":["live"],"original_title":"Тур по США Iron Maiden 2026: сет-лист, фото + обзор","original_paragraphs":["Iron Maiden completed the U.S. leg of their Run for Your Lives world tour on Tuesday, rocking San Antonio's Alamodome to its core with a thundering, age-defying set that wiped any thoughts of retirement from the minds of the 40,000-plus fans in attendance.","You can see the set list and exclusive photos from the concert below.","The night started early with a brisk five-song set from Anthrax , who received a last-minute assist from Raven and ex-Fear Factory drummer Mike Heller as drummer Charlie Benante was busy \"puking his guts out,\" according to guitarist Scott Ian . The thrash legends played fast and loose, with Ian and Heller locking eyes during crucial song cues and Joey Belladonna leading the audience in Texas-sized singalongs. The energy stayed high as Megadeth followed Anthrax with a nine-song set full of hits and fan favorites, with \"The Conjuring\" and \"Tornado of Souls\" earning rabid responses from the audience.","By the time UFO's \"Doctor Doctor\" began blaring from the loudspeakers to signal Iron Maiden's arrival, the energy in the Alamodome had reached a fever pitch. Anybody who's seen a metal show in San Antonio knows it's nearly impossible to match the feral enthusiasm of an Alamo City audience. That held true on Tuesday, as Maiden feasted on fans' fervor while plowing��through genre-defining hits and beloved deep cuts off their first nine albums, from 1980's Iron Maiden through 1992's Fear of the Dark .","The band opened with a trio of Killers cuts — \"Murders in the Rue Morgue,\" \"Wrathchild\" and the title track — honoring their streetwise roots and monumental contributions of late frontman Paul Di'Anno . Singer Bruce Dickinson dressed the part, bounding across the stage in skintight jeans and a leather jacket while unleashing his mighty, operatic howl. At 68 years old, Dickinson continues to school singers half his age, flexing his spectacular vibrato and breath control with soaring screams and dizzyingly long notes.","The rest of the band followed suit, with bassist and bandleader Steve Harris providing the relentless rhythmic thrust as guitarists Dave Murray, Adrian Smith and Janick Gers traded solos that were equal parts buttery smooth and blisteringly fast. Drummer Simon Dawson , who replaced the stalwart Nicko McBrain following the latter's retirement from touring in 2024, capably filled his predecessor's shoes, hitting McBrain's signature fills and mammoth, swinging grooves. High-speed rippers such as \"Run to the Hills\" and \"The Trooper\" sound slower these days than they did in the band's '80s heyday, but if the only evidence of Maiden's collective senior-citizen status is a few lost beats per minute, it's a small price to pay.","When the Run for Your Lives tour launched in May 2025, some fans took umbrage at the digital screens that replaced Iron Maiden's longtime physical stage props and backdrops. But at the very least, they assuaged this writer's doubts on Tuesday, as the visuals reached the traditionally high bar the band has always set.","The haunted nautical imagery during \"Rime of the Ancient Mariner\" enhanced the spellbinding epic, drawing fans further into Maiden's multisensory \"theater of the mind,\" as Dickinson has coined it. And purists still got their fill of analog accessories, as monster-sized versions of Maiden's trusty mascot Eddie showed up twice during the show and tried to hack the band members to bits.","Unsurprisingly, deep cuts and long-form epics ruled the show. Fans cheered just as rapturously (perhaps more so) for seldom-played opuses such as \"Infinite Dreams\" and \"Seventh Son of a Seventh Son\" as they did for well-worn crowd-pleasers such as \"The Number of the Beast\" and \"Aces High.\"","Such is the joy of an Iron Maiden show. It's hard to attract a fairweather \"just the hits\" audience when you never had any hits to begin with. (For all their staggering success, they've never had a song reach the Billboard Hot 100.) Every song in the set is bound to be somebody's favorite on any given night, and the crowd's infectious enthusiasm bolstered the band as they dominated the biggest San Antonio concert of their half-century career.","It's a cheap cliche to say Iron Maiden ages like fine wine; a more apt comparison would be a venerable stage actor who constantly reinterprets a classic role. Enriched by age and experience, Iron Maiden brings a newfound gravity to their performances; each tour becomes an exciting new chapter in their epic saga.","Frankly, nobody does it like them — nobody ever has — and as soon as Dickinson assured the Alamodome, \"We will be back,\" fans began counting the minutes until the band makes good on that promise.","1. \"Murders in the Rue Morgue\" 2. \"Wrathchild\" 3. \"Killers\" 4. \"Phantom of the Opera\" 5. \"The Number of the Beast\" 6. \"Infinite Dreams\" 7. \"Powerslave\" 8. \"2 Minutes to Midnight\" 9. \"Rime of the Ancient Mariner\" 10. \"Run to the Hills\" 11. \"Seventh Son of a Seventh Son\" 12. \"The Trooper\" 13. \"Hallowed Be Thy Name\" 14. \"Iron Maiden\" Encore 15. \"Aces High\" 16. \"Fear of the Dark\" 17. \"Wasted Years\"","1. \"Devil's Island\" 2. \"The Conjuring\" 3. \"Take No Prisoners\" 4. \"Sweating Bullets\" 5. \"Tipping Point\" 6. \"Tornado of Souls\" 7. \"Symphony of Destruction\" 8. \"Peace Sells\" 9. \"Holy Wars... The Punishment Due\"","1. \"Caught in a Mosh\" 2. \"Madhouse\" 3. \"Antisocial\" 4. \"Got the Time\" 5. \"Indians\""]},{"id":"19bf1e58be96fbdd093ae4ee853b951a33c38437","title":"Set Your Goals представили второй сингл после возвращения, «Big Couch»","short":"Сегодня утром, 1 октября, состоялась онлайн-премьера новой песни Set Your Goals «Big Couch». В июле группа выпустила «Accelerate», свой первый трек за более чем 15 лет. Тогда же был анонсирован семидюймовый сингл, на второй стороне которого находится представленная сегодня песня. О второй новой песне группа рассказала:","paragraphs":["Сегодня утром, 1 октября, состоялась онлайн-премьера новой песни Set Your Goals «Big Couch». В июле группа выпустила «Accelerate», свой первый трек за более чем 15 лет. Тогда же был анонсирован семидюймовый сингл, на второй стороне которого находится представленная сегодня песня.","О второй новой песне группа рассказала:","«Эта песня кажется логичным следующим шагом в развитии нашего авторского подхода. По стилю она немного выбивается из общего ряда и несёт более сильный эмоциональный заряд, который и делает её особенной для нас. Текст посвящён тому возрасту, когда ты становишься для молодых людей примером, осознаёшь значение своих поступков и искренне стараешься их не подвести. Создание песни стало общим делом: мы использовали звуки играющих детей некоторых участников группы и нашего продюсера Скотта. Мы даже пригласили нескольких друзей помочь с вокалом в последнем припеве, включая жену Скотта Эшли».","Премьера песни совпала с началом сегодняшнего тура к двадцатилетию «Mutiny!». Вместе с ними выступят Warriors, которые сыграют «War Is Hell», а также Restraining Order и Stateside.","10/01 Baltimore, MD – Soundstage 10/02 Philadelphia, PA – First Unitarian Church 10/03 New York, NY – Le Poisson Rouge 10/04 Boston, MA – The Sinclair","Во второй части тура в декабре Set Your Goals разделят сцену с I Am The Avalanche, Doomsday, Bad World и Giveaway:","12/17 Los Angeles, CA – The Regent 12/18 Santa Ana, CA – Observatory 12/19 Sacramento, CA – Ace Of Spades 12/20 San Jose, CA – The Ritz"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-01T19:02:24+00:00","original_url":"https://www.theprp.com/2026/10/01/news/set-your-goals-debut-their-second-comeback-single-big-couch/","saved_at":1790884711,"artists":[{"id":"set-your-goals","name":"Set Your Goals"}],"topics":["releases"]},{"id":"09b0737e2b445cf087fd72e610009aa094e1fa00","title":"The L.I.F.E. Project представили кавер на «Immigrant Song» Led Zeppelin","short":"The L.I.F.E. Project добавили ещё одну запись к серии каверов этого года, представив свою версию классической песни Led Zeppelin «Immigrant Song». В дуэт входят Джош Рэнд из Stone Sour и Касандра Карсон из Paralandra и Casandra’s Crossing.","paragraphs":["The L.I.F.E. Project добавили ещё одну запись к серии каверов этого года, представив свою версию классической песни Led Zeppelin «Immigrant Song». В дуэт входят Джош Рэнд из Stone Sour и Касандра Карсон из Paralandra и Casandra’s Crossing. Рэнд рассказал о работе над треком:","«Как и в случае с “Call Me”, мы никогда не планировали выпускать “Immigrant Song”. В 2019 году мы переехали в новый дом с домашней студией. По сути, вся музыка возникла из того, что я просто возился со своим винтажным оборудованием. Когда я начал работать с Касандрой, то предложил ей попробовать это просто ради удовольствия».","Карсон рассказала о том, как необычно познакомилась с этой песней:","«Как ни забавно, впервые я услышала “Immigrant Song” в “Шреке Третьем”, ха-ха! Когда Белоснежка запела этот боевой клич викингов, мои душа и чувства вспыхнули, словно в меня ударила молния. Папа сказал, что это песня Led Zeppelin, и я стала одержима ею, как ребёнок, впервые попробовавший шоколад. Я не могла наслушаться. Через несколько лет, когда начала играть в группах, “Immigrant Song” оставалась первой в моём списке песен, на которые я хотела сделать кавер. Было вполне естественно предложить её и Джошу, когда мы только начали работать вместе. Видимо, теперь мне нужно снова посмотреть “Шрека Третьего”, чтобы отметить выход нашей записи».","Среди недавних релизов The L.I.F.E. Project также были каверы на Suicidal Tendencies и Blondie."],"category":"Хард-рок","source":"ThePRP","published":"2026-10-01T19:18:00+00:00","original_url":"https://www.theprp.com/2026/10/01/news/the-l-i-f-e-project-stone-sour-etc-release-their-cover-of-led-zeppelins-immigrant-song/","saved_at":1790884702,"artists":[{"id":"led-zeppelin","name":"Led Zeppelin"},{"id":"the-l-i-f-e-project","name":"The L.I.F.E. Project"}],"topics":["releases"]},{"id":"4bb47ac1552034cd8fc7260278680a8d470ef734","title":"Интервью: Imminence — больше, чем просто группа со скрипкой","short":"Новая пластинка группы «Axis Mundi» показывает группу, готовую подтолкнуть металкор к кинематографическим высотам.","paragraphs":["Новая пластинка группы «Axis Mundi» показывает группу, готовую подтолкнуть металкор к кинематографическим высотам."],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-01T19:43:29+00:00","original_url":"https://metalinjection.net/interviews/interview-imminence-is-more-than-the-band-with-the-violin","saved_at":1790884693,"artists":[{"id":"imminence","name":"Imminence"}],"topics":[],"original_title":"Interview: Imminence Is More Than the Band With the Violin","original_paragraphs":["Новая пластинка группы «Axis Mundi» показывает группу, готовую подтолкнуть металкор к кинематограф
