<script id="articlesSeed" type="application/json">{"articles":[{"id":"7acd7958841a326c1cf1ea51f5358251603e696a","title":"With A Vengeance (Ex-Bad Wolves, Etc.) Запуск “Oblivion” Музыкальное видео","short":"With A Vengeance, новый наряд, состоящий из бывших членов Bad Wolves, Tommy Vext, Chris Cain и Kevin Creekman, наряду с Austin D’Amond ( Chimaira и т.д.), и Xander Raymond Charles, выпустили свой второй сингл на сегодняшний день.","paragraphs":["With A Vengeance, новый наряд, состоящий из бывших членов Bad Wolves, Tommy Vext, Chris Cain и Kevin Creekman, наряду с Austin D’Amond ( Chimaira и т.д.), и Xander Raymond Charles, выпустили свой второй сингл на сегодняшний день. Этот трек называется \" Oblivion \", а вместе с ним и музыкальное видео с участием Joe Letz из Lindemann и т.д. слава.","Вокалист Tommy Vext рассказал о треке, который исследует психическое здоровье и последствия психиатрической медицины:","«Oblivion» — это вопрос о том, что происходит, когда что-то, предназначенное для помощи, начинает создавать свои собственные последствия. Это серьезная тема, но мы не хотели проповедовать — мы хотели сделать тяжелую, агрессивную песню с массивным припевом и позволить видео взять идею где-то совершенно незатронутой».","Дебютный альбом группы “ Born To Survive ” выйдет 30 октября. Вокруг него забронированы следующие туры:","10/14 Little Rock, AR – Revolution Room 10/15 Dallas, TX – AM/FM 10/16 Lubbock, TX – The Garden 10/18 Oklahoma City, OK – 89th Street 10/19 Wichita, KS – Wash Wave 10/21 Cincinnati, OH – Bogarts 10/22 Columbus, OH – The King Of Clubs 10/23 Cadillac, MI – The Venue 10/24 Belvidere, IL – Apollo Theatre 10/25 Joliet, IL – The Forge 10/26 Cleveland, OH – Cambridge Room 10/28 Hartford, CT – The Webster 10/29 Derry, NH – Tupelo Music Hall 10/30 Saratoga, NY – TBA 10/31 Harrisburg, PA – XL Live 11/01 Pittsburgh, PA – Crafthouse 11/02 Huntington, WV – Jerk Riley’s 11/04 Iowa City, IA – Wildwood 11/05 Lincoln, NE – 1867 Bar","С помощью Alibis :","11/06 Sioux Falls, SD – Icon 11/07 Rapid City, SD – The Park 11/09 Greeley, CO – Moxi Theater 11/10 Grand Junction, CO – Mesa Theater 11/12 Tempe, AZ – Marquee Theatre 11/13 Ramona, CA – Ramona Mainstage 11/14 Pomona, CA – The Glass House"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T17:04:33+00:00","original_url":"https://www.theprp.com/2026/10/02/news/with-a-vengeance-ex-bad-wolves-etc-launch-oblivion-music-video/","saved_at":1790998255,"original_paragraphs":["With A Vengeance , the new outfit consisting of ex- Bad Wolves members Tommy Vext , Chris Cain and Kevin Creekman , alongside Austin D’Amond ( Chimaira , etc.), and Xander Raymond Charles , have issued their second single to date. That track is titled “ Oblivion “, and with it comes a music video featuring Joe Letz of Lindemann , etc. fame.","Vocalist Tommy Vext said of the track, which examines mental health and the consequences of psychiatric medicine:","“‘ Oblivion ‘ is about questioning what happens when something intended to help starts creating consequences of its own. It’s a serious subject, but we didn’t want to preach — we wanted to make a heavy, aggressive song with a massive chorus and let the video take the idea somewhere completely unhinged.”","The group’s debut effort “ Born To Survive ” will be released on October 30th. They have the following touring booked around it:","10/14 Little Rock, AR – Revolution Room 10/15 Dallas, TX – AM/FM 10/16 Lubbock, TX – The Garden 10/18 Oklahoma City, OK – 89th Street 10/19 Wichita, KS – Wash Wave 10/21 Cincinnati, OH – Bogarts 10/22 Columbus, OH – The King Of Clubs 10/23 Cadillac, MI – The Venue 10/24 Belvidere, IL – Apollo Theatre 10/25 Joliet, IL – The Forge 10/26 Cleveland, OH – Cambridge Room 10/28 Hartford, CT – The Webster 10/29 Derry, NH – Tupelo Music Hall 10/30 Saratoga, NY – TBA 10/31 Harrisburg, PA – XL Live 11/01 Pittsburgh, PA – Crafthouse 11/02 Huntington, WV – Jerk Riley’s 11/04 Iowa City, IA – Wildwood 11/05 Lincoln, NE – 1867 Bar","With Alibis :","11/06 Sioux Falls, SD – Icon 11/07 Rapid City, SD – The Park 11/09 Greeley, CO – Moxi Theater 11/10 Grand Junction, CO – Mesa Theater 11/12 Tempe, AZ – Marquee Theatre 11/13 Ramona, CA – Ramona Mainstage 11/14 Pomona, CA – The Glass House"],"content_complete":true,"artists":[],"original_title":"With A Vengeance (Ex-Bad Wolves, Etc.) Launch “Oblivion” Music Video","topics":["releases"]},{"id":"f2e07be970222885e07b827fa5460842a99c7c92","title":"Scroll Eater Премьера “Deliver The Word” Музыкальное видео, Unbroken Reign Jackson Scott Гости","short":"Недавно Facedown Records, подписав Scroll Eater, выпустили новый сингл под названием \"Deliver The Word\". Христианский альтернативный металлический наряд Jackson Scott из Unbroken Reign на этой трассе. Видео ниже было снято с режиссером Jonathan Franco.","paragraphs":["Недавно Facedown Records, подписав Scroll Eater, выпустили новый сингл под названием \"Deliver The Word\". Христианский альтернативный металлический наряд Jackson Scott из Unbroken Reign на этой трассе. Видео ниже было снято с режиссером Jonathan Franco."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T17:26:33+00:00","original_url":"https://www.theprp.com/2026/10/02/news/scroll-eater-premiere-deliver-the-word-music-video-unbroken-reigns-jackson-scott-guests/","saved_at":1790998247,"original_paragraphs":["Recent Facedown Records signing Scroll Eater have issued a new single titled “ Deliver The Word “. The Christian alternative metal outfit are joined by Jackson Scott of Unbroken Reign on this track. The below video for it was shot with director Jonathan Franco ."],"content_complete":true,"artists":[],"original_title":"Scroll Eater Premiere “Deliver The Word” Music Video, Unbroken Reign’s Jackson Scott Guests","topics":["releases"]},{"id":"ad2f510b5563b2f6a77c6994ff2f844a8500fb25","title":"Новый видео слэш с участием Майлза Кеннеди и заговорщиков","short":"\"Flying Blind\", новое видео группы SLASH FEATURING MYLES KENNEDY \u0026 THE CONSPIRATORS, доступно для просмотра ниже. Эта песня взята из альбома \"Flying Blind\", выходящего 26 февраля на Gibson Records: 01. Avarice And Greed","paragraphs":["\"Flying Blind\", новое видео группы SLASH FEATURING MYLES KENNEDY \u0026 THE CONSPIRATORS, доступно для просмотра ниже. Эта песня взята из альбома \"Flying Blind\", выходящего 26 февраля на Gibson Records:","01. Avarice And Greed","02. Good Time Girl","03. Thrill Seeker","04. One Of Your Kind","05. Flying Blind","06. Looking For A Miracle","07. Sweet Kill","08. Here In Babylon","09. Living The Dream","10. (Don't) Thread The Needle","11. Rev My Heart","12. Stem The Flow","Альбом из 12 треков, записанный в основном вживую с давним продюсером Michael'ом «Elvis» Baskette'ом на Studio Barbarosa во Флориде, запечатлел Slash'а на гитаре и педальной стил-гитаре, Myles'а Kennedy на вокале, Todd'а Kerns'а на басу, Brent'а Fitz'а на барабанах и Frank'а Sidoris'а на ритм-гитаре в моменты максимальной непосредственности, инстинктивности и слаженности. Основную часть пластинки коллектив записал примерно за неделю, нередко успевая по две песни в день, при этом музыканты играли вместе в одной комнате.","«Это очень весёлая, спонтанная рок-н-ролльная пластинка, — говорит Slash о „Flying Blind\". — Она очень прямолинейная, приземлённая и сырая».","Песня родилась спонтанно во время предпродакшна: Slash показал рифф, когда музыканты готовились к репетиции. Композиция развилась быстро, соединив безошибочный хард-роковый драйв SMKC со взмывающей мелодией и мгновенным хуком, благодаря чему в итоге стала естественным выбором для знакомства с альбомом.","Slash объясняет: «Она появилась в студии, пока мы стояли там на предпродакшне: ко мне пришёл рифф и начал развиваться. До прихода ребят у меня от этой песни не было ничего, а потом мы начали вечернюю репетицию и сыграли этот рифф. Всё сложилось очень быстро.","Что касается того, почему она стала первым синглом... ты никогда не знаешь, каким будет первый сингл, пока не запишешь его. Когда я начал об этом думать, у „Flying Blind\" оказались как раз подходящая мелодичность и хук, чтобы стать материалом для сингла».","По словам Myles'а Kennedy, текст заглавного трека посвящён тем лазейкам, к которым люди порой прибегают в поисках удовлетворения.","«Мне очень понравилось подбирать мелодию к этой песне, — добавляет Kennedy. — В том, как начинается аккордовая последовательность, была приятная плавность. Текст о том, как люди иногда пытаются срезать путь и найти лёгкий способ достичь счастья или просветления».","SMKC также анонсировали мировой тур 2027 года «Flying Blind», который стартует в Латинской Америке в апреле, а затем доберётся до Северной Америки 23 апреля и продолжится по Великобритании и Европе. Североамериканская часть включает два вечера в The Wiltern в Лос-Анджелесе, а также выступления в нью-йоркском Beacon Theatre, нэшвиллском Ryman Auditorium, бостонском Citizens House of Blues, денверском Fillmore Auditorium и других знаковых залах.","В честь выхода «Flying Blind» SMKC объединились с Fandiem и запустили специальный благотворительный розыгрыш, где фанаты могут выиграть поездку мечты в Уэльс и познакомиться со Slash'ем за кулисами в замке Кардифф. Средства от акции пойдут в American Foundation for Suicide Prevention (AFSP) и National Alliance on Mental Illness (NAMI).","Победитель и один сопровождающий получат авиаперелёт в Кардифф и обратно, три ночи в отеле, места в гостевом списке Slash'а на его выступление в замке Кардифф, доступ за кулисы для встречи со Slash'ем, просмотр шоу из зала у пульта, возможность попасть на предконцертный саундчек, набор мерча Slash'а, обзорную экскурсию по Южному Уэльсу и ужин перед шоу.","Фанаты могут сделать пожертвование и принять участие в розыгрыше на сайте www.fandiem.com/slash, получив шанс на эксклюзивный опыт и одновременно помогая собирать средства для двух организаций, занимающихся психическим здоровьем и профилактикой суицида.","SMKC по-прежнему работают так же, как в самом начале: собраться в комнате, играть и посмотреть, что получится. Эта философия и стоит за «Flying Blind», первым полноформатным студийным альбомом коллектива со времён признанного «4» 2022 года. Часть песен выросла из демо и музыкальных набросков Slash'а, другие возникли спонтанно, когда музыканты играли вместе в одной комнате.","Slash принёс исходный материал Kennedy, который добавил вокальные мелодии и тексты, после чего песни превратились в полноценные аранжировки вместе с басистом Todd'ом Kerns'ом, барабанщиком Brent'ом Fitz'ем и ритм-гитаристом Frank'ом Sidoris'ом.","«Он невероятный автор риффов, — говорит Kennedy о Slash'е. — Он ещё и придумывает простые аккордовые последовательности, которые очень хорошо подходят для мелодий. Это работает и не стареет».","В отличие от прежних альбомов SMKC, риффы и аранжировки которых порой складывались на ежевечерних саундчеках и в ходе долгих гастролей, значительная часть «Flying Blind» появилась на свет короткими сконцентрированными рывками между другими проектами участников.","Slash развивал материал, пока гастролировал с GUNS N' ROSES, записывал свой признанный блюзовый альбом «Orgy Of The Damned» и запускал S.E.R.P.E.N.T. Festival. Kennedy начал работу над песнями во время перерыва в деятельности ALTER BRIDGE и при создании своего третьего сольного альбома.","«Наш график плотный, и приходится его придерживаться, иначе всё остальное начинает страдать, — говорит он. — Теперь само собой разумеется, что ты всегда что-то создаёшь. Это как мышца. Творческой части мозга некогда атрофироваться, и ты просто продолжаешь двигаться вперёд».","Коллектив вновь собрался с Baskette'ом, который ранее продюсировал «World On Fire» (2014) и «Living The Dream» (2018) для SMKC, на его студии Studio Barbarosa во Флориде. То, что все оставались вместе на протяжении всех сессий, позволило музыкальной и человеческой химии, лежащей в основе коллектива, стать неотъемлемой частью записи.","Перед началом сессий Slash дал Baskette'у две чёткие инструкции: записывать все живьём и не перегружать партии после записи.","«Он по-настоящему этого придерживался, — говорит Slash. — Всё получилось отлично».","Аранжировки были в основном готовы до начала записи, но оставались достаточно открытыми, чтобы вместить спонтанные идеи прямо в студии. Поскольку музыканты играли одновременно, команде удалось сохранить как можно больше естественного взаимодействия и энергии каждого цельного исполнения.","Kennedy записал свой вокал несколько месяцев спустя и называет готовый альбом вершиной в истории записей SMKC.","«Из всех пластинок звучание и исполнение на „Flying Blind\" нравятся мне больше всего. Всё очень живое. Оно прямо здесь», — говорит он.","В своих 12 треках «Flying Blind» исследует широкий спектр звучаний, не отказываясь от прямого хард-рокового фундамента группы. «Good Time Girl» сочетает хук на токбоксе с отчётливым кантри-акцентом, навеянным пионером гитары Джимми Брайантом и стил-гитаристом Спиди Уэстом, а «Sweet Kill» выдаёт нахальный, построенный на риффах рок, который Slash называет «наверное, самой восьмидесятнической вещью, что я сделал за долгое время».","«One Of Your Kind» движется на пониженном строе с тяжёлым нагнетанием, тогда как резкие аккорды в панковом духе ведут «Here In Babylon». «Thrill Seeker» построена вокруг головокружительного нисходящего риффа, который при этом остаётся глубоко в грув-кармане, а «Rev My Heart» это классический рок-н-ролльный разгон, опирающийся на незабываемую последовательность аккордов и текст, навеянный тем вечером, когда Kennedy впервые встретил свою будущую жену.","Инструментал «Living The Dream» продолжает традицию SMKC, давая Slash'у простор для импровизации и выводя его безошибочно узнаваемую гитарную игру на передний план.","«Я записывал по такому инструменталу на каждом альбоме CONSPIRATORS, кроме „Apocalyptic Love\", — говорит Slash. — Приятно иметь вещь, которую можно раскрыть и на которой можно импровизировать, где у меня нет никаких конкретных рамок и ограничителей. Хорошо делать новую на каждой пластинке, чтобы вживую не приходилось играть одну и ту же».","Одно из самых заметных отступлений альбома, «Looking For A Miracle»: это первая песня, которую Slash написал на педальной стил-гитаре, и первая, где звучит записанное соло гитариста на этом инструменте. Исходную музыкальную идею Slash развил на педальной стил-гитаре, а затем адаптировал под обычную гитару, чтобы весь коллектив мог её отрепетировать. Потом он вернулся к педальной стил-гитаре во время записи и выстроил соло уже на Studio Barbarosa.","«Я обожаю педальную стил-гитару, — говорит Slash. — Это один из тех инструментов, возможности которых просто невероятны. Так что для меня это стало отдельным увлечением. Но это серьёзное обязательство. Инструмент довольно сложный».","Kennedy и остальные участники наблюдали, как отношения Slash'а с инструментом развивались со временем.","«Долгое время мы приезжали репетировать перед турами или заниматься предпродакшном, а потом уезжали, а Slash оставался в своей студии и до глубокой ночи отрабатывал педальную стил-гитару», — вспоминает Myles.","Альбом завершается песней «Stem The Flow», масштабным финальным заявлением о разочаровании в институтах и системах, которые когда-то считались несокрушимыми.","Жёсткий, спонтанный и разносторонний «Flying Blind» запечатлел SMKC звучащими так же свободно, сыро и слаженно, как всегда.","Корни SMKC уходят к звёздному одноимённому сольному альбому Slash'а 2010 года, на котором Kennedy выступил одним из нескольких приглашённых вокалистов. Возникшая после этого музыкальная и человеческая связь быстро переросла в постоянный коллектив.","«Работа с CONSPIRATORS началась как счастливая случайность после того первого сольного альбома, — говорит Slash. — Я выстроил с этими ребятами отношения и на музыкальном, и на личном уровне, от которых не собирался отказываться, когда GUNS перезапустились».","То, что начиналось без долгосрочного плана, выросло в пятнадцатилетнее партнёрство, пять студийных альбомов и множество мировых туров.","«У меня в голове не укладывается, что эти пятнадцать лет пролетели так быстро, — говорит Kennedy. — Как одно мгновение. Но, как говорится, время летит, когда ты веселишься, а нам очень весело. Это из тех случаев, когда хочется ущипнуть себя».","Спустя пятнадцать лет после образования SLASH FEATURING MYLES KENNEDY \u0026 THE CONSPIRATORS продолжают оттачивать звучание, неся факел живого, нелакированного рок-н-ролла. Для Slash'а движущей силой «Flying Blind» и SMKC остаётся чистое удовольствие от игры.","«Когда мы начинали, у нас ничего не было, — говорит Slash. — Мы не собирались покорять мир. Всё было ради чистого удовольствия. Так что теперь мы собираемся, играем, отлично проводим время, потом выезжаем в тур и делаем это снова при следующей возможности», — смеётся Slash. «Пока есть электричество, мы будем втыкать штекер в розетку»."],"category":"Хард-рок","source":"Darkside","published":"2026-10-02T17:35:23+00:00","original_url":"http://www.darkside.ru/news/184191/","saved_at":1790998243,"artists":[{"id":"guns-n-roses","name":"Guns N’ Roses"}],"original_title":"Новое видео SLASH FEATURING MYLES KENNEDY \u0026amp; THE CONSPIRATORS","topics":["releases"]},{"id":"ae89c2f98946c6924cfcd021a55173ad7688769b","title":"Agalloch s “Marrow Of The Spirit” Новый Mix \u0026 Master для предстоящего переиздания","short":"Четвертый полноформатный альбом Blackened post-metal band Agalloch, Marrow Of The Spirit, был недавно перемикширован и ремастирован для переиздания 11 декабря на CD, виниле и кассетах. Также был представлен люксовый бокс-сет.","paragraphs":["Четвертый полноформатный альбом Blackened post-metal band Agalloch, Marrow Of The Spirit, был недавно перемикширован и ремастирован для переиздания 11 декабря на CD, виниле и кассетах. Также был представлен люксовый бокс-сет. Новый микс контролировался Markus Stock в Klangschmiede Studio E, а обновленная работа по мастерингу выполнялась Gus Elg.","Звуковая переработка “ Ghosts Of The Midwinter Fires ” из альбома теперь транслируется ниже. В 2015 году в Большом американском мюзик-холле состоялось живое выступление трека из Сан-Франциско, CA-шоу и «Nihil Totem», полностью оформленной фортепианной пьесы, написанной Jeffery Neblock для The Watcher’s Monolith. Eisenwald.","Планируемые прессинги включают:","белый/черный/серебряный брызги · Eisenwald почтовый заказ прозрачный красный · выбранные инди-магазины прозрачный оранжевый · Decibel журнал серебро/белый мрамор · нордвис / скандинавия ночной синий мрамор · AGALLOCH / шоу"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T17:44:44+00:00","original_url":"https://www.theprp.com/2026/10/02/news/agallochs-marrow-of-the-spirit-gets-new-mix-master-for-upcoming-reissue/","saved_at":1790998240,"original_paragraphs":["Blackened post-metal band Agalloch ‘s fourth full-length album, “ Marrow Of The Spirit “, has newly been re-mixed and remastered for a December 11th reissue across CD, vinyl and cassette formats. A deluxe box set has also been unveiled. The new mix was overseen by Markus Stock at Klangschmiede Studio E , while the updated mastering job was done by Gus Elg .","The sonic reworking of “ Ghosts Of The Midwinter Fires ” from the album is now streaming below. Joining it are a 2015 live performance of the track from a San Francisco, CA show at The Great American Music Hall and “ Nihil Totem “, a fully fleshed out piano piece written by Jeffery Neblock for “ The Watcher’s Monolith “. Eisenwald will be issuing this effort.","Planned pressings include:","White/Black/Silver Splatter · Eisenwald Mailorder Clear Red · Selected Indie Stores Clear Orange · Decibel Magazine Silver/White Marble · Nordvis / Scandinavia Night Blue Marble · AGALLOCH / Shows"],"content_complete":true,"artists":[],"original_title":"Agalloch’s “Marrow Of The Spirit” Gets New Mix \u0026 Master For Upcoming Reissue","topics":[]},{"id":"659534bb4cee09269f7688fdb93f570d27f4bce1","title":"Igorrr Установить даты начала европей от фестиваль 30 января, билеты доступны сейчас. Что касается реестра, вы можете ожидать, что поймаете следующих артистов:","Cold World Madball Integrity ( “ Humanity Is The Devil ” установленный Combust Division of Mind The S.E.T. Iron Mind WarxGames Gemstar Cold Times Cold Hard Steel Negative Force Sluggo Severance","Билеты теперь доступны."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T18:27:45+00:00","original_url":"https://www.theprp.com/2026/10/02/news/cold-world-madball-integrity-combust-etc-booked-for-2027-disturbin-the-peace-festival/","saved_at":1790998225,"original_paragraphs":["The 2027 ‘ Disturbin’ The Peace ‘ festival lineup has been unveiled. The Baltimore Soundstage in Baltimore, MD will host that fest on January 30th, with tickets available now. As for the roster, you can expect to catch the following artists:","Cold World Madball Integrity (“ Humanity Is The Devil ” set) Combust Division of Mind The S.E.T. Iron Mind WarxGames Gemstar Cold Times Cold Hard Steel Negative Force Sluggo Severance","Tickets are now available ."],"content_complete":true,"artists":[],"original_title":"Cold World, Madball, Integrity, Combust, Etc. Booked For 2027 ‘Disturbin’ The Peace’ Festival","topics":["live"]},{"id":"212b8d4e0876a5f0bb58b60f94eef468e2c7ef0f","title":"Slash Feat. Myles Kennedy And The Conspirators Анонс нового альбома “Flying Blind” \u0026 World Tour","short":"Slash Feat. Myles Kennedy And The Conspirators установили “ Flying Blind ” в качестве названия для своего следующего студийного альбома. Gibson Records снова будет работать над этим релизом, который был намечен на 26 февраля.","paragraphs":["Slash Feat. Myles Kennedy And The Conspirators установили “ Flying Blind ” в качестве названия для своего следующего студийного альбома. Gibson Records снова будет работать над этим релизом, который был намечен на 26 февраля. В дополнение к альбому, есть музыкальное видео John Harvatine IV для заглавного трека, чтобы проверить ниже, в то время как мировой тур 2027 года также только что был развернут.","Продюсер Michael “Elvis” Baskette наблюдал за сессиями альбома, большинство из которых были записаны в прямом эфире на Studio Barbarosa во Флориде. Slash сказал о записи: «Это действительно веселая, своего рода спонтанная рок-н-ролльная запись. Это очень просто и приземленно и сыро».","Далее он добавил заглавный трек:","\"Созданный в студии, пока мы стояли там в предварительном производстве, рифф пришел ко мне и начал развиваться. До прихода этих парней у меня ничего не было из этой песни, а затем мы начали ночь репетиций и сыграли этот рифф. Он собрался очень быстро. Что касается первого сингла, вы никогда не знаете, каким будет первый сингл, пока не запишете его. Когда я начал думать об этом, ‘ Flying Blind ’, казалось, имел правильные мелодические чувства и крючок, чтобы сделать его единственным материалом».","Альбом также предлагает несколько сюрпризов, в том числе ток-бокс на “ Good Time Girl “. “ Looking For A Miracle ”, в то время как Slash подает свою первую песню, написанную и записанную на педальной стали.","“ Flying Blind ” трек-лист:","01 – “ Avarice And Greed “ 02 – “ Good Time Girl “ 03 – “ Thrill Seeker “ 04 – “ One Of Your Kind “ 05 – “ Flying Blind “ 06 – “ Looking For A Miracle “ 07 – “ Sweet Kill “ 08 – “ Here In Babylon “ 09 – “ Living The Dream “ 10 – “ (Don’t) Thread The Needle “ 11 – “ Rev My Heart “ 12 – “ Stem The Flow “","О предварительных заказах см. slash.lnk.to/flyingblindalbum. Что касается гастрольной кампании группы на альбоме, читайте дальше.","04/02 Santiago, CHL – Teatro Caupolican 04/04 Mendoza, ARG Maipú 04/06 Córdoba, ARG – Plaza de la Música 04/07 Buenos Aires, ARG – Movistar Arena 04/10 Florianópolis, BRA – Arena Opus 04/11 Curitiba, BRA – Live Curitiba 04/13 Rio de Janeiro, BRA – Fundição Progresso 04/14 São Paulo, BRA – Espaço Unimed","04/23 Reno, NV – Grand Theatre at The Grand Sierra Resort 04/24 Rohnert Park, CA – Graton Resort \u0026 Casino 04/26 Los Angeles, CA – The Wiltern 04/27 Los Angeles, CA – The Wiltern 04/29 Del Mar, CA – The Sound 05/01 Albuquerque, NM – Route 66 Casino 05/02 Denver, CO – Fillmore Auditorium 05/04 Kansas City, MO – The Midland Theatre 05/05 Des Moines, IA – Val Air Ballroom 05/07 Windsor, ON – Caesars Windsor 05/08 Niagara Falls, ON – OLG Stage at Fallsview Casino 05/10 Boston, MA – Citizens House of Blues 05/12 New York, NY – Beacon Theatre 05/17 Nashville, TN – Ryman Auditorium 05/19 St. Louis, MO – The Factory 05/21 Norman, OK – Riverwind Casino 05/22 Tulsa, OK – Hard Rock Hotel \u0026 Casino","06/07 Munich, GER – Zenith 06/09 Warsaw, POL – Letnia Scena Progresji 06/10 Nickelsdorf, AUT – Nova Rock Festival 06/12 Milan, ITA – Carroponte 06/13 Rome, ITA – Rock In Roma 06/17 Vitoria-Gasteiz, SPA – Azkena Rock Festival 06/23 Stockholm, SWE – Grona Lund 06/28 Dusseldorf, GER – Mitsubishi Electric Halle 06/30 Cardiff, UK – Cardiff Castle 07/01 Scarborough, UK – Scarborough Open Air Theatre 07/03 Dublin, IRE – Trinity College 07/04 Belfast, UK – Custom House Square 07/06 Halifax, UK – Piece Hall 07/07 London, UK – Eventim Apollo 07/09 Weert, NET – Bospop 07/11 Vizovice, CZE – Masters of Rock 07/12 Zagreb, HRV – SRC Salata 07/14 Budapest, HUN – Budapest Park 07/16 Belgrade, SRB – Luka Beograd 07/18 Athens, GRE – Lycabettus Theatre 07/22 Istanbul, TUR – Bonus Parkorman 07/25 Plovdiv, BUL – Hills Of Rock 07/26 Ghimbav, ROM – Rockstadt Extreme Festival","Подписку на предпродажу можно найти на сайте laylo.com/slash/m/flyingblindworldtour2027 .Общая распродажа начнется в следующую пятницу, 09 октября."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T20:11:10+00:00","original_url":"https://www.theprp.com/2026/10/02/news/slash-feat-myles-kennedy-and-the-conspirators-announce-new-album-flying-blind-world-tour/","saved_at":1790998202,"original_paragraphs":["Slash Feat. Myles Kennedy And The Conspirators have set “ Flying Blind ” as the title to their next studio album. Gibson Records will again be handling that release, which has been slated for February 26th. In addition to the album reveal, there’s a John Harvatine IV -directed music video for the title track to check out below, while a 2027 world tour has also just been rolled out.","Producer Michael “Elvis” Baskette oversaw the album sessions, most of which were captured live at Studio Barbarosa in Florida. Slash said of the record, “It’s a really fun, kind of spontaneous rock ’n’ roll record. It’s very straightforward and down-to-earth and raw.”","He went on to add of the title track:","“Created in the studio while we were standing there in pre-production, a riff came to me and started developing. I had nothing of that song prior to those guys coming in, and then we started up a night of rehearsal and played that riff. It came together really quickly. As for it being the first single, you never know what the first single is going to be until you’ve recorded it. When I started thinking about it, ‘ Flying Blind ’ just seemed to have the right kind of melodic sensibilities and a hook to make it single material.”","The album is set to offer up a few surprises too, including a talk box on “ Good Time Girl “. “ Looking For A Miracle ” meanwhile finds Slash serving up his first song written and recorded on pedal steel.","“ Flying Blind ” track listing:","01 – “ Avarice And Greed “ 02 – “ Good Time Girl “ 03 – “ Thrill Seeker “ 04 – “ One Of Your Kind “ 05 – “ Flying Blind “ 06 – “ Looking For A Miracle “ 07 – “ Sweet Kill “ 08 – “ Here In Babylon “ 09 – “ Living The Dream “ 10 – “ (Don’t) Thread The Needle “ 11 – “ Rev My Heart “ 12 – “ Stem The Flow “","For pre-orders, see slash.lnk.to/flyingblindalbum . As for the band’s touring campaign on the album, read on.","04/02 Santiago, CHL – Teatro Caupolican 04/04 Mendoza, ARG Maipú 04/06 Córdoba, ARG – Plaza de la Música 04/07 Buenos Aires, ARG – Movistar Arena 04/10 Florianópolis, BRA – Arena Opus 04/11 Curitiba, BRA – Live Curitiba 04/13 Rio de Janeiro, BRA – Fundição Progresso 04/14 São Paulo, BRA – Espaço Unimed","04/23 Reno, NV – Grand Theatre at The Grand Sierra Resort 04/24 Rohnert Park, CA – Graton Resort \u0026 Casino 04/26 Los Angeles, CA – The Wiltern 04/27 Los Angeles, CA – The Wiltern 04/29 Del Mar, CA – The Sound 05/01 Albuquerque, NM – Route 66 Casino 05/02 Denver, CO – Fillmore Auditorium 05/04 Kansas City, MO – The Midland Theatre 05/05 Des Moines, IA – Val Air Ballroom 05/07 Windsor, ON – Caesars Windsor 05/08 Niagara Falls, ON – OLG Stage at Fallsview Casino 05/10 Boston, MA – Citizens House of Blues 05/12 New York, NY – Beacon Theatre 05/17 Nashville, TN – Ryman Auditorium 05/19 St. Louis, MO – The Factory 05/21 Norman, OK – Riverwind Casino 05/22 Tulsa, OK – Hard Rock Hotel \u0026 Casino","06/07 Munich, GER – Zenith 06/09 Warsaw, POL – Letnia Scena Progresji 06/10 Nickelsdorf, AUT – Nova Rock Festival 06/12 Milan, ITA – Carroponte 06/13 Rome, ITA – Rock In Roma 06/17 Vitoria-Gasteiz, SPA – Azkena Rock Festival 06/23 Stockholm, SWE – Grona Lund 06/28 Dusseldorf, GER – Mitsubishi Electric Halle 06/30 Cardiff, UK – Cardiff Castle 07/01 Scarborough, UK – Scarborough Open Air Theatre 07/03 Dublin, IRE – Trinity College 07/04 Belfast, UK – Custom House Square 07/06 Halifax, UK – Piece Hall 07/07 London, UK – Eventim Apollo 07/09 Weert, NET – Bospop 07/11 Vizovice, CZE – Masters of Rock 07/12 Zagreb, HRV – SRC Salata 07/14 Budapest, HUN – Budapest Park 07/16 Belgrade, SRB – Luka Beograd 07/18 Athens, GRE – Lycabettus Theatre 07/22 Istanbul, TUR – Bonus Parkorman 07/25 Plovdiv, BUL – Hills Of Rock 07/26 Ghimbav, ROM – Rockstadt Extreme Festival","Presale signups can be found through laylo.com/slash/m/flyingblindworldtour2027 . The general onsale will commence next Friday, October 09th."],"content_complete":true,"artists":[],"original_title":"Slash Feat. Myles Kennedy And The Conspirators Announce New Album “Flying Blind” \u0026 World Tour","topics":["live","releases"]},{"id":"231060fbd30d2cc4f16f59718e0a194def692de7","title":"Чтобы «Фронт освобождения» могилы вышел сейчас, возьмите свою копию с Metal Injection","short":"Смотрите новый клип группы на \"Limb From Lamb.\"","paragraphs":["Смотрите новый клип группы на \"Limb From Lamb.\""],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-02T18:20:08+00:00","original_url":"https://metalinjection.net/new-music/to-the-graves-liberation-front-out-now-grab-your-copy-from-metal-injection","saved_at":1790997439,"original_paragraphs":["Plus, watch the band's new video for \"Limb From Lamb.\""],"artists":[],"original_title":"To The Grave's 'Liberation Front' Out Now, Grab Your Copy From Metal Injection","topics":[],"content_pending":true,"content_status":"Доступен только анонс. Полный текст ожидает загрузки.","translation_last_attempt":1790998197,"translation_retry_after":1790998497},{"id":"742ae02d96f3cba523e9270a73416dd05d54c260","title":"Amon Amarth, A Perfect Circle и The Arson Choir — в подборке лучших треков недели Metal Injection","short":"В подборке лучших треков Metal Injection за первую неделю октября нашлось место новым исполнителям, хорошо знакомым именам и неожиданным участникам.","paragraphs":["В подборке лучших треков Metal Injection за первую неделю октября нашлось место новым исполнителям, хорошо знакомым именам и неожиданным участникам.","Тони Айомми выпустил второй сингл за год — «Stormwatcher»: более меланхоличную, но при этом эпическую композицию. Amon Amarth представили релиз «The Allfather Awakens», а его заглавный трек порадует любителей приключений. A Perfect Circle выпустили динамичный сингл «To Whom It May Concern» — мелодичную и тревожную песню, подходящую для октябрьского сезона страшных историй.","Альтернативные рокеры Dead Poet Society также выпустили сегодня альбом «Monarch». Его музыка сочетает альтернативный и прогрессивный рок с заметным влиянием индастриала и гранжа; ведущий сингл «Hollywood On Fire» хорошо передаёт этот характер. Прогрессивная супергруппа TEMIC, в которой играют музыканты из проектов Devin Townsend, Mike Portnoy’s Shattered Fortress, Haken и других, представила сингл «Casting Stone». Разнообразная по звучанию композиция войдёт в концептуальный альбом о переживании утраты, который выйдет через неделю, 9 октября. Imminence — группа с металлической музыкой и скрипкой, хотя её творчество гораздо шире этого определения, — выпустили сегодня альбом «Axis Mundi» с ведущим синглом «Shed Your Skin».","Среди новых групп стоит обратить внимание на The Arson Choir. Их мощная тяжёлая музыка напоминает хаотичную сторону металкора в духе The Dillinger Escape Plan. Песня «A Thousand Terrible» постоянно меняется и на каждом повороте наносит новый удар.","Вот лучшие металлические треки недели по версии Metal Injection:","1. Tony Iommi — «Stormwatcher»","2. To The Grave — «LIMB FROM LAMB»","3. Amon Amarth — «The Allfather Awakens»","4. Imminence — «Shed Your Skin»","5. A Perfect Circle — «To Whom It May Concern»","6. Rev3rent — «Lacerations and the Feeling of Dying»","7. Of Virtue — «Too Late»","8. TEMIC — «Casting Stone»","9. Dead Poet Society — «Hollywood On Fire»","10. The Arson Choir — «A Thousand Terrible Things»"],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-02T19:31:55+00:00","original_url":"https://metalinjection.net/playlist/top-tracks-of-the-week-playlist/amon-amarth-a-perfect-circle-the-arson-choir-more-added-to-metal-injections-top-tracks-of-the-week","saved_at":1790997382,"original_paragraphs":["From new names, to old names, to unlikely names, there were quite the selection of new tracks to choose from for Metal Injection's top tracks of the week for the first week of October.","We had one of the metal grandfathers bless us with a new track as Tony Iommi unleashed his second single of the year titled \"Stormwatcher,\" a more melancholic offering, but epic in its entirety. Viking metallers Amon Amarth also released their newest effort today, titled The Allfather Awakens , and the title track has certainly given those wishing for a quest something to sink their teeth into. Everyone's favorite alt-metal oddballs A Perfect Circle released a dynamic offering with their single, \"To Whom It May Concern,\" a melodious and eerie track that feels essential for Spooky Month listening.","We also have alt-rockers Dead Poet Society and their newest record, Monarch , that was also released today, an effort that treads an alt-rock and prog line with a heavy amount of industrial and grunge influences, their lead single, \"Hollywood On Fire,\" a shining example of that nature. We also have prog powerhouse TEMIC , a supergroup consisting of members from Devin Townsend , Mike Portnoy 's Shattered Fortress , Haken , and more, and their newest single, \"Casting Stone,\" a diverse release from the conceptual record surrounding grief that is out this time next week (October 9). Then, we have violin-metal unit Imminence –even though they are much more than the band with the violin–and their new album, Axis Mundi , out today with the lead single, \"Shed Your Skin.\"","In terms of newer bands you need to check out, The Arson Choir is delivering a seriously crushing take on heavy music that calls to mind metalcore's chaotic end ala The Dillinger Escape Plan . \"A Thousand Terrible\" twists, turns, and hits you in the face every step of the way.","With so much to choose from in heavy music, these are Metal Injection's top metal tracks of the week.","1. Tony Iommi , \"Stormwatcher\"","2. To The Grave , \"LIMB FROM LAMB\"","3. Amon Amarth , \"The Allfather Awakens\"","4. Imminence , \"Shed Your Skin\"","5. A Perfect Circle , \"To Whom It May Concern\"","6. Rev3rent , \"Lacerations and the Feeling of Dying\"","7. Of Virtue , \"Too Late\"","8. TEMIC , \"Casting Stone\"","9. Dead Poet Society , \"Hollywood On Fire\"","10. The Arson Choir , \"A Thousand Terrible Things\""],"artists":["Amon Amarth","A Perfect Circle","Imminence"],"original_title":"Amon Amarth, A Perfect Circle, The Arson Choir \u0026 More Added to Metal Injection's Top Tracks of the Week","topics":[],"content_complete":true},{"id":"5b9d85dc3d9307f4ef478807fe63348466cbff44","title":"As Cities Burn Новый альбом “Brain Matter(s)” Получает широкий релиз","short":"As Cities Burn недавно выпустили свой альбом \"мозговое вещество(ы)\". Группа впервые выпустила этот альбом ранее в этом году исключительно через Lockstep, платформу, запущенную продюсером/музыкантом Aaron Sprinkle ( Anberlin, Story Of The Year).","paragraphs":["As Cities Burn недавно выпустили свой альбом \"мозговое вещество(ы)\". Группа впервые выпустила этот альбом ранее в этом году исключительно через Lockstep, платформу, запущенную продюсером/музыкантом Aaron Sprinkle ( Anberlin, Story Of The Year). Sprinkle также произвела и спроектировала эту работу. Сегодня, 02 октября, этот альбом теперь доступен для ведущих поставщиков цифровых услуг. Физические форматы также доступны через ascitiesburn.store. Музыкальное видео для представленного трека «Mr. Villainous» также транслируется ниже."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T19:39:25+00:00","original_url":"https://www.theprp.com/2026/10/02/news/as-cities-burns-new-album-brain-matters-gets-a-wide-release/","saved_at":1790997379,"original_paragraphs":["As Cities Burn have newly given their album “ brain matter(s) ” a wide release. The group first issued that record earlier this year exclusively through Lockstep , a platform launched by producer/musician Aaron Sprinkle ( Anberlin , Story Of The Year ). Sprinkle also produced and engineered this effort. Today, October 02nd, has seen that album now arrive across leading digital service providers. Physical formats are also available via ascitiesburn.store . A music video for the featured track “ mr. villainous ” is also now streaming below."],"artists":[],"original_title":"As Cities Burn’s New Album “Brain Matter(s)” Gets A Wide Release","topics":["releases"]},{"id":"738654a0218a91981437787274fb3b721d4a2d4e","title":"AC/DC О том, чтобы сыграть свой последний концерт?","short":"Почти через два с половиной года после начала тура AC/DC 's 'Power Up' завершится в пятницу вечером шоу на стадионе MetLife за пределами Нью-Йорка. А это значит, что пришло время задать вопрос: будет ли это последний раз, когда легендарная австралийская хард-рок-группа выступает вживую?","paragraphs":["Почти через два с половиной года после начала тура AC/DC 's 'Power Up' завершится в пятницу вечером шоу на стадионе MetLife за пределами Нью-Йорка.","А это значит, что пришло время задать вопрос: будет ли это последний раз, когда легендарная австралийская хард-рок-группа выступает вживую?","Никогда не самая болтливая группа, AC/DC в последние годы особенно недальновидно рассказывала о своих планах (и изменениях в составе). Но в июне они опубликовали видео в социальных сетях, рекламирующих летние даты 2026 года, заявив, что собираются «power up в последний раз».","Тот факт, что они упомянули название тура (также название их последнего альбома, 2020 года Power Up), казалось бы, говорит о том, что они говорили о конце этого тура, а не о своей гастрольной карьере.","Сингеру Brian Johnson исполнится 79 лет в понедельник (5 октября). Ведущему гитаристу Angus Young - единственному остающемуся члену-основателю AC/DC - 71 год. Ритм-гитаристу Стиви Янгу, который занял пост своего покойного дяди Malcolm Young с 2014 года - исполнится 70 лет в декабре.","В какой-то момент тихий выход на пенсию будет звучать лучше, чем рев толпы?","(Вновь нанятая ритм-секция группы - басист Крис Чейни и барабанщик Мэтт Лауг, которые собираются завершить свой первый тур с AC/DC - имеют сравнительно высокий возраст 56 и 58 лет.)","AC/DC Более четырех десятилетий они гастролировали только после выпуска нового студийного альбома - за исключением короткого тура специальных концертов 2003 года, приуроченного к продвижению переиздания их каталога через Sony Music.","Если они будут придерживаться своего обычного плана, мы можем долго ждать. Группа выпустила только четыре альбома за последние тридцать лет, с шестилетним ожиданием между их последними тремя альбомами: 2008 Black Ice, 2014 Rock or Bust и Power Up.","Отчасти из-за пандемии COVID фанаты ждали восемь лет в период с конца 2015 года. AC/DC \"Беспокойный\" Rock or Bust Экскурсия и начало 2024 года Power Up Начните прямо сейчас, сократите это время пополам, и вы все еще смотрите на возвращение на сцену в 2030 году.","Конечно, AC/DC могут порвать со своими традиционными способами в любой момент. Может быть, они выпустят свой первый в истории величайший хит (удивительно, они никогда его не выпускали) и отправятся в тур в следующем году.","Может быть, они уже тайно записали новый альбом - хотя, кажется, их фотографируют в Ванкувере каждый раз, когда они начинают работать над ним. Или, может быть, они будут гастролировать без какого-либо нового альбома. Но все эти вещи будут большими изменениями от их устоявшихся способов.","Если у двух старших членов группы - Ангуса и Брайана - есть какие-либо пенсионные планы, они сохранили их себе во время своего единственного интервью в этом году. USA Today Там, где они хотели бы исполнить свое последнее шоу, Янг ловко уклонился от вопроса: «Я надеюсь, что это не на моих похоронах».","На вопрос, какое наследие они надеются оставить после себя, ответы дуэта были такими же бессмысленными, как и их музыка. «Я бы просто сказал „великая рок-группа“», — ответил Янг. Джонсон был лишь немного более красноречивым: «Они были великолепны в том, что они сделали. И они делали это последовательно»."],"category":"Хард-рок","source":"Ultimate Classic Rock","published":"2026-10-02T20:03:27+00:00","original_url":"https://ultimateclassicrock.com/ac-dc-last-show-question/","saved_at":1790997375,"original_paragraphs":["Nearly two and a half years after it started, AC/DC 's 'Power Up' tour will end Friday night with a show at MetLife Stadium outside of New York City.","Which means it's once again time to ask the question: Will this be the last time the legendary Australian hard rock band ever performs live?","Never the most talkative bunch, AC/DC have been particularly tight-lipped about their plans (and lineup changes) in recent years. But in June they posted a video on social media promoting the summer 2026 dates, declaring that they were going to \"power up one last time.\"","The fact that they mentioned the tour's name (also the title of their most recent album, 2020's Power Up ) would seem to suggest that they were talking about the end of this tour, not their touring career.","Singer Brian Johnson will turn 79 on Monday (Oct. 5). Lead guitarist Angus Young - the only remaining founding member of AC/DC - is 71. Rhythm guitarist Stevie Young - who has taken over for his late uncle Malcolm Young since 2014 - will turn 70 in December.","At some point will a quiet retirement sound better than the roar of the crowd?","(The band's newly hired rhythm section - bassist Chris Chaney and drummer Matt Laug, who are both about to complete their first tour with AC/DC - are a comparatively spry 56 and 58 years old.)","AC/DC also seem to be creatures of habit. For over four decades they have only toured after releasing a new studio album - with the exception of a brief 2003 run of special concerts, timed to promote the re-release of their catalog via Sony Music.","If they stick to their usual plan, we may be in for a long wait. The group has only released four albums in the last thirty years, with a six-year wait between their last three albums: 2008's Black Ice , 2014's Rock or Bust and Power Up .","Partly due to the COVID pandemic, fans waited eight years in between the 2015 end of AC/DC's trouble-plagued 'Rock or Bust' tour and the 2024 start of the 'Power Up' Tour. Start the clock right now, cut that time in half and you're still looking at a 2030 return to the stage.","Of course AC/DC could break with their traditional ways at a moment's notice. Maybe they will release their first-ever greatest hits record (amazingly, they've never released one) and tour behind that next year.","Maybe they've already secretly recorded a new album - although they seem to be photographed in Vancouver every time they start to work on one. Or maybe they'll tour without any kind of new album. But all of those things would be big changes from their established ways.","If the band's two senior members - Angus and Brian - do have any retirement plans they kept it to themselves during their one and only interview so far this year. When asked by USA Today where they'd like to perform their last-ever show, Young deftly dodged the question: \"I hope it's not at my funeral.\"","When asked what legacy they hope to leave behind, the duo's answers were as no-nonsense as their music. \"I would just say 'a great rock band,'\" replied Young. Johnson was only slightly more verbose: \"They were great at what they did. And they did it consistently.\""],"artists":[{"id":"ac-dc","name":"AC/DC"}],"original_title":"Are AC/DC About To Play Their Last-Ever Concert?","topics":["live"]},{"id":"ddabebd2b57ed559f5e1bd9e7310b38f72306654","title":"Главная›Исполнители›Big Ass Truck I.E. Is “Dragging Meat” On New Song","short":"Дебютный EP «Found On Road Dead» выйдет 20 октября на лейбле Nuclear Blast Records.","paragraphs":["Дебютный EP «Found On Road Dead» выйдет 20 октября на лейбле Nuclear Blast Records."],"category":"Хэви-метал","source":"Metal Injection","published":"2026-10-02T20:10:16+00:00","original_url":"https://metalinjection.net/new-music/listen-big-ass-truck-i-e-is-dragging-meat-on-new-song","saved_at":1790997355,"original_paragraphs":["Coming off their debut EP 'Found On Road Dead,' out October 20 via Nuclear Blast Records."],"artists":[],"original_title":"Listen: Big Ass Truck I.E. Is “Dragging Meat” On New Song","topics":["releases"],"content_pending":true,"content_status":"Доступен только анонс. Полный текст ожидает загрузки.","translation_last_attempt":1790998197,"translation_retry_after":1790998497},{"id":"39bbfbdcfa4c8468911d43399d8cc5a49d2bd182","title":"Kim Dracula \u0026 Criss Angel's 'Haunted' Live Event Перенесено на 2027 год","short":"Kim Dracula и иллюзионист Criss Angel 's ' Haunted' живое событие было перенесено на 2027 год. Пара первоначально намеревалась провести премьеру этого события в Planet Hollywood в Лас-Вегасе, штат Нью-Йорк, 24 октября. Недавно опубликованное заявление, опубликованное в одночасье, подтвердило, что это теперь более длительный случай.","paragraphs":["Kim Dracula и иллюзионист Criss Angel 's ' Haunted' живое событие было перенесено на 2027 год. Пара первоначально намеревалась провести премьеру этого события в Planet Hollywood в Лас-Вегасе, штат Нью-Йорк, 24 октября. Недавно опубликованное заявление, опубликованное в одночасье, подтвердило, что это теперь более длительный случай.","\"HAUNTED, предстоящее шоу в Лас-Вегасе от Kim Dracula и Criss Angel, будет перенесено на 2027 год.","Живое шоу - это экстраординарное производство, в котором представлены инновационные новые технологии и амбициозные производственные элементы. Масштаб и сложность воплощения HAUNTED в жизнь потребовали больше времени, чем первоначально предполагалось, чтобы полностью реализовать шоу, как предполагалось.","Билеты в настоящее время возвращаются.","Мы надеемся, что скоро будет объявлена новая дата, и поделимся более подробной информацией, как только она будет подтверждена.","Спасибо за понимание и поддержку»."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T20:17:47+00:00","original_url":"https://www.theprp.com/2026/10/02/news/kim-dracula-criss-angels-haunted-live-event-postponed-to-2027/","saved_at":1790997323,"original_paragraphs":["Kim Dracula and illusionist Criss Angel ‘s ‘ Haunted ‘ live event has been postponed to 2027. The pair had originally intended to premiere that event at at Planet Hollywood in Las Vegas, NV on October 24th. A newly issued statement shared overnight has confirmed that is now longer the case. It reads:","“ HAUNTED , the upcoming Las Vegas show from Kim Dracula and Criss Angel , will be postponed to 2027.","The live show is an extraordinary production, featuring innovative new technology and ambitious production elements. The scale and complexity of bringing HAUNTED to life has required more time than originally anticipated to fully realize the show as envisioned.","Tickets are currently being refunded.","We hope to have a new date to announce soon and will share more details as soon as it is confirmed.","Thank you for your understanding and support.”"],"artists":[],"original_title":"Kim Dracula \u0026 Criss Angel’s ‘Haunted” Live Event Postponed To 2027","topics":["live"]},{"id":"95cf9cf2349190e4cf495f3bf76f696db0fe9ad8","title":"Droneflower (Cave In, Etc.) - Два трека для Bandcamp Friday","short":"Droneflower поделились парой треков, “ Sky Burial ” \u0026 \"Drive It In\", для Bandcamp этого месяца в пятницу (сегодня, октябрь 02-го). Этот проект объединяет Stephen Brodsky ( Cave In, Mutoid Man и т.д.) с Marissa Nadler). Brodsky сказал в социальных сетях о сегодняшнем падении: «Здесь новый DRONEFLOWER для первого @bandcamp в пятницу жуткого сезона ... отправляйтесь туда, чтобы…","paragraphs":["Droneflower поделились парой треков, “ Sky Burial ” \u0026 \"Drive It In\", для Bandcamp этого месяца в пятницу (сегодня, октябрь 02-го). Этот проект объединяет Stephen Brodsky ( Cave In, Mutoid Man и т.д.) с Marissa Nadler). Brodsky сказал в социальных сетях о сегодняшнем падении:","«Здесь новый DRONEFLOWER для первого @bandcamp в пятницу жуткого сезона ... отправляйтесь туда, чтобы услышать “Sky Burial» (довольно самообъясняющийся) и “ Drive It In ” (написанный для никсированной перезагрузки Buffy the Vampire Slayer). Прекрасная картина обложки Marissa, клавиши / арфа невероятным @sfxmaven \u0026 смешанный могучим @j2hthree Enjoy!"],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T20:28:37+00:00","original_url":"https://www.theprp.com/2026/10/02/news/droneflower-cave-in-etc-release-two-tracks-for-bandcamp-friday/","saved_at":1790997317,"original_paragraphs":["Droneflower have shared a pair of tracks, “ Sky Burial ” \u0026 “ Drive It In “, for this month’s Bandcamp Friday (today, October 02nd). That project pairs Stephen Brodsky ( Cave In , Mutoid Man , etc.) with Marissa Nadler ). Brodsky said on social media of today’s drop:","“Here’s new DRONEFLOWER for the first @bandcamp Friday of spooky season… head there to hear “Sky Burial ” (pretty self explanatory) and “ Drive It In ” (written for a nixed Buffy the Vampire Slayer reboot). Lovely cover painting by Marissa , keys/harp by the incredible @sfxmaven \u0026 mixed by the mighty @j2hthree Enjoy! Also now’s a good time to revisit our album + EP releases on @sacredbones”"],"artists":[{"id":"slayer","name":"Slayer"}],"original_title":"Droneflower (Cave In, Etc.) Release Two Tracks For Bandcamp Friday","topics":["releases"]},{"id":"da58dc1a5f0b31248599805e3693aa02fbe82ee9","title":"ATLAS Новый сингл “Bittersleep”","short":"‘Northcore’ наряд ATLAS выпустил новый трек под названием \"Bittersleep\". Видео Riivata Visuals для трека было размещено ниже, причем песня, как представляется, представлена без комментариев от группы.","paragraphs":["‘Northcore’ наряд ATLAS выпустил новый трек под названием \"Bittersleep\". Видео Riivata Visuals для трека было размещено ниже, причем песня, как представляется, представлена без комментариев от группы."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T20:33:24+00:00","original_url":"https://www.theprp.com/2026/10/02/news/atlas-new-single-bittersleep-arrives/","saved_at":1790997310,"original_paragraphs":["‘Northcore’ outfit ATLAS have issued a new track titled “ Bittersleep “. A video by Riivata Visuals for the track has been posted below, with the song appearing to be presented without commentary from the group."],"artists":[],"original_title":"ATLAS’ New Single “Bittersleep” Arrives","topics":["releases"]},{"id":"485ba0ee4472ccdd59f3b9bc8698d90fc4e4e8e6","title":"Alienist представили нового гитариста и вокалиста Джейкоба Чёрчварда в клипе «Phantom»","short":"Австралийская металкор-группа Alienist официально приветствовала чистого вокалиста/гитариста Jacob Churchward в своем составе с их недавно выпущенным треком \"Phantom\". Музыкальное видео для этого трека было снято и недавно дебютировало онлайн ниже через UNFD.","paragraphs":["Австралийская металкор-группа Alienist официально приветствовала чистого вокалиста/гитариста Jacob Churchward в своем составе с их недавно выпущенным треком \"Phantom\". Музыкальное видео для этого трека было снято и недавно дебютировало онлайн ниже через UNFD."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T20:42:51+00:00","original_url":"https://www.theprp.com/2026/10/02/news/alienist-welcome-new-guitarist-vocalist-jacob-churchward-with-phantom-music-video/","saved_at":1790992087,"artists":[],"original_title":"Alienist Welcome New Guitarist/Vocalist Jacob Churchward With “Phantom” Music Video","topics":["releases"],"original_paragraphs":["Australian metalcore band Alienist have officially welcomed clean vocalist/guitarist Jacob Churchward to their lineup with their newly released track “ Phantom “. A music video for that track was shot and has newly debuted online below via UNFD ."]},{"id":"8045d9037be0a86e012e32bb63aaaf2444517842","title":"Участники The Sword и Zombi объединились в новом дум-метал-проекте Autumn Tomb","short":"Autumn Tomb — новое дум-метал-трио, объединившее участников The Sword и Zombi. В него вошли Стив Мур из Zombi, басист и клавишник The Sword Брайан Ричи и барабанщик Сантьяго «Джимми» Вела III. Одноимённый дебютный альбом выйдет 6 ноября на Spaceflight Records. Мур начал этот проект ещё в 2024 году; альбом записали в его студии Nightmare City в Олбани, штат Нью-Йорк.…","paragraphs":["Autumn Tomb — новое дум-метал-трио, объединившее участников The Sword и Zombi. В него вошли Стив Мур из Zombi, басист и клавишник The Sword Брайан Ричи и барабанщик Сантьяго «Джимми» Вела III. Одноимённый дебютный альбом выйдет 6 ноября на Spaceflight Records. Мур начал этот проект ещё в 2024 году; альбом записали в его студии Nightmare City в Олбани, штат Нью-Йорк.","Мур рассказал о проекте:","«Я слушаю метал с конца 80-х и давно хотел собрать подобную группу. Но по-настоящему меня вдохновил 2022 год: тогда Zombi гастролировали на разогреве у The Sword, а через несколько месяцев — у Om. Это вновь разожгло мою любовь к тяжёлой музыке».","Вела добавил:","«Когда появилась возможность поработать со Стивом Муром над новым проектом тяжёлой музыки, я согласился без колебаний. Я много лет восхищался Zombi и сольными работами Стива ещё до нашего знакомства. Брайана я знаю с подросткового возраста: в начале 00-х мы начинали на музыкальной сцене Остина. С 2011 года мне посчастливилось играть вместе с ним в The Sword».","Ричи продолжил:","«Я был очарован с первой ноты демозаписей, которые прислал Стив! Для меня честь добавить своё звучание к этим замечательным трекам и поработать с моим давним другом и музыкальным соратником Сантьяго Велой».","Альбом уже можно предзаказать через Bandcamp. Первый трек «Crumbling Thrones» появился сегодня, 2 октября."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T21:03:33+00:00","original_url":"https://www.theprp.com/2026/10/02/news/the-sword-zombi-members-unite-in-new-doom-metal-project-autumn-tomb/","saved_at":1790992086,"artists":[],"original_title":"The Sword \u0026 Zombi Members Unite In New Doom Metal Project Autumn Tomb","topics":[],"original_paragraphs":["Autumn Tomb is the name of a new doom metal trio uniting members of The Sword and Zombi . This latest collab between members of those two outfits finds Zombi ‘s Steve Moore uniting with The Sword ‘s bassist/keyboardist Bryan Richie and drummer Santiago “Jimmy” Vela III . A self-titled debut will be touching down on November 06th through Spaceflight Records . Moore initiated this project back in 2024, with this forthcoming bow having been tracked at his Nightmare City studio in Albany, NY.","Moore said of the project:","“I’ve been a fan of metal since the late 80’s and have wanted to put together a group like this for a while. What really lit the fire for me though was in 2022 when Zombi toured supporting The Sword , and then a few months later supporting Om . Kinda rekindled my love of heavy music.”","Vela added:","“When the opportunity arose to work on a new heavy music project with Steve Moore, it was a no-brainer for me. I’ve been a long time admirer of Zombi as well as Steve ‘s solo work for many years before I knew him. I have known Bryan since I was a teen, going back to the early 00’s coming up in the Austin music scene and have been lucky enough to rock along side of him since 2011 with The Sword .”","Richie went on to say:","“I was captivated from the first note of the demos Steve sent us! I am honored to put my sonic fingerprints on these amazing tracks and it was a privilege to be able to work with my long time friend and musical collaborator Santiago Vela .”","You can pre-order the record now through Bandcamp , with a stream of the lead track “ Crumbling Thrones ” having arrived today, October 02nd."]},{"id":"b16517caf98ac279afc0ade03f6c7bfde1fa9fa5","title":"SLAM BAND с участниками Filth анонсировали дебютный полноформатный альбом «THE ALBUM»","short":"Сатирический слэм SLAM BAND дебютирует в полноформатном “ THE ALBUM ” 30 октября. В рамках этого проекта запланировано появление 12 песен с предварительными заказами на физические форматы, которые теперь доступны через slamband.bigcartel.com.","paragraphs":["Сатирический слэм SLAM BAND дебютирует в полноформатном “ THE ALBUM ” 30 октября. В рамках этого проекта запланировано появление 12 песен с предварительными заказами на физические форматы, которые теперь доступны через slamband.bigcartel.com. Проект объединяет участников Filth с Zack Dufort Serpents Breath и до сих пор выпустил ряд красочных синглов, включая некоторые печально известные метеоризмы."],"category":"Экстремальный метал","source":"ThePRP","published":"2026-10-02T21:37:18+00:00","original_url":"https://www.theprp.com/2026/10/02/news/slam-band-filth-etc-announce-their-full-length-debut-the-album/","saved_at":1790992083,"artists":[],"original_title":"SLAM BAND (Filth, Etc.) Announce Their Full-Length Debut “THE ALBUM”","topics":["releases"],"original_paragraphs":["Satirical slam outfit SLAM BAND will have their debut full-length “ THE ALBUM ” out on October 30th. 12 songs are scheduled to appear on that effort, with pre-orders for physical formats now available through slamband.bigcartel.com . The project unites members of Filth with Zack Dufort of Serpents Breath and have thus far released a string of colorful singles, including some infamous flatulence ."]},{"id":"05b62e362d3744d4fe7810011b91b5300463fe5c","title":"KID ROCK целый альбом славит ИИсуса","short":"Kid Rock выпустит новый христианский альбом «Halfway To Jesus» 17 октября. Официальный клип на первый сингл с пластинки, «James 1:17 (Jesus Is King)», можно посмотреть ниже. Ролик снят в Honky Tonk Kid'а Rock'а в Нэшвилле и посвящён давнему клавишнику Kid'а Rock'а, Jimmie'у Bones'у, у которого в 2024 году диагностировали БАС.","paragraphs":["Kid Rock выпустит новый христианский альбом «Halfway To Jesus» 17 октября. Официальный клип на первый сингл с пластинки, «James 1:17 (Jesus Is King)», можно посмотреть ниже. Ролик снят в Honky Tonk Kid'а Rock'а в Нэшвилле и посвящён давнему клавишнику Kid'а Rock'а, Jimmie'у Bones'у, у которого в 2024 году диагностировали БАС. Видео также посвящено Калвину Линчу, поклоннику Kid'а Rock'а с неоперабельной опухолью мозга, чьим желанием, загаданным через Make-A-Wish, было поиграть на барабанах вместе с Kid'ом Rock'ом.","На «Halfway To Jesus» вошли 17 песен, среди них «7 Sins», где в качестве гостя выступил Eminem, и «Halfway 2 Jesus», в записи которой приняли участие кантри-певцы Gary LeVox (RASCAL FLATTS) и Jimmie Allen.","Ранее Eminem уже появлялся на альбоме Kid'а Rock'а 1998 года «Devil Without A Cause», в треке «Fuck Off». Позже Kid Rock снялся в клипе на сингл Eminem'а 2013 года «Berzerk».","«Я горжусь гостями, которые присоединились ко мне, особенно своим старым другом Eminem'ом, — написал Kid Rock во вступительном слове к «Halfway To Jesus». — В его куплете говорится о том, что мы обсуждали и что действительно нужно услышать: мы расходимся во взглядах на политику и другие вещи, но остались друзьями, несмотря на всё это.","Мы надеемся, что это послужит примером для людей, которые потеряли друзей или перестали разговаривать с семьёй из-за того, что те думают иначе», — добавил он.","В августе Kid Rock рассказал в программе «Fox \u0026 Friends» о том, что вдохновило его на создание христианского альбома:","«Я вырос католиком и ходил в католическую церковь, и мне всегда хотелось признаться: это скучно. Эта музыка ужасна. Я ходил в баптистские церкви и внеконфессиональные в поисках той музыки, которую хотел услышать, и там есть хорошие вещи, но в них всегда было немного мрачности. Поэтому я решил написать песни, с которыми мне самому хотелось бы славить Иисуса и выражать свою веру: это рок-н-ролл, кантри и хип-хоп».","На официальном сайте Kid'а Rock'а сейчас продаётся целый ряд товаров, связанных с «Halfway To Jesus»: футболки, куртки и кепки на религиозную тематику, автомобильные номерные знаки, рамка для номерного знака, солнцезащитные очки, свеча, «фляга со святой водой», «тайник», стилизованный под Библию, молитвенный дневник и золотое нательное украшение в виде креста.","«Halfway To Jesus» станет первым новым альбомом Kid'а Rock'а со времён «Bad Reputation» 2022 года, который на пике занял лишь 124-е место после выхода и через неделю вылетел из чарта, став самым провальным студийным альбомом в его карьере.","Американский кантри-рокер, настоящее имя которого Bob Ritchie, открыто поддерживает президента США Дональда Трампа, выступал на музыкальных мероприятиях, связанных с Республиканской партией, сидел рядом с Трампом на футбольных матчах и получал приглашения в Белый дом.","В феврале этого года Kid Rock возглавил альтернативное шоу в перерыве матча под названием «The All-American Halftime Show», организованное консервативной организацией Turning Point USA в то же время, когда Bad Bunny выступал на сцене шоу в перерыве Супербоула.","Трек-лист:","01. Freedom","02. James 1:17 (Jesus Is King)","03. 7 Sins (featuring Eminem)","04. Why Don't You Look Into Jesus","05. Water Into Wine","06. Halfway 2 Jesus (featuring Gary LeVox and Jimmie Allen)","07. I Don't Drink The Whiskey Anymore","08. Me And Jesus","09. God Is Good (Prelude)","10. God Is Good","11. Into The Setting Sun","12. Broken Hearted People","13. 'Til You Can't","14. Why Don't You Look Into Jesus (Riri Mix)","15. High Road","16. Procession","17. God Bless The USA"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T22:34:16+00:00","original_url":"http://www.darkside.ru/news/184193/","saved_at":1790992082,"artists":[{"id":"eminem","name":"Eminem"},{"id":"kid-rock","name":"Kid Rock"}],"original_title":"KID ROCK целый альбом славит ИИсуса","topics":["releases"]},{"id":"f882027e49d664eec85c21488b861d7e01b01b88","title":"Ноэл Галлахер — о каждой песне альбома Oasis «(What’s the Story) Morning Glory?»","short":"(What's the Story) Morning Glory? , Oasis '1995, последовавший за их дебютным альбомом Definitely Maybe, был записан всего за 12 рабочих дней и продолжал продаваться более чем в 22 миллионах копий, превратив Манчестерскую инди-рок-группу в глобальных суперзвезд.","paragraphs":["(What's the Story) Morning Glory? , Oasis '1995, последовавший за их дебютным альбомом Definitely Maybe, был записан всего за 12 рабочих дней и продолжал продаваться более чем в 22 миллионах копий, превратив Манчестерскую инди-рок-группу в глобальных суперзвезд. \"Мы не совсем уверены в себе, но это намного лучше, чем последний\", Ноэль Галлахер пообещал NME за три месяца до релиза the album 2 октября 1995 года. Все, кто слышал это, тоже так говорят, и я не думаю, что это просто лизание задницы.","Конечно, больше. Лучше? Это вопрос мнения. Но вот мысли Ноэля Галлахера о каждой песне на любимой пластинке его группы.","«В следующем году кто-то в Штатах скажет мне значение песни Hello, которая для меня не имеет никакого смысла, — сказал Ноэль Галлахер журналу Alternative Press перед выпуском второго альбома его группы. — Это просто слова, натянутые вместе». — Тексты песен: «Мы живем в тени / У нас был шанс, и мы его выбросили / И он никогда не будет таким же». \"Это просто говорит, ну, это никогда не будет то же самое для нас больше, я полагаю. Если определенно, может быть, о том, чтобы мечтать о том, чтобы быть в группе, это о том, чтобы на самом деле быть в группе. Так что это как, Привет, это хорошо, чтобы вернуться - назад, делая записи.\"Знаменито, открывающая песня на What's The Story ... несет со-написание кредита для глэм-рок-звезды, ставшей осужденным педофилом Гэри Глиттером, как на раннем взятии песни, Ноэль Галлахер спонтанно спел лирику из сингла Глиттера 1973 года Hello, Hello, I'm Back Again во время его аутро, который, по-видимому, вызвал много развлечений в студии.","«[Продюсер] Марк Койл сказал: «Ты не получишь этот кусок в гребаной песне: это Гэри Глиттер!» — вспоминал Галлахер в эпизоде подкаста Мэтта Моргана в 2021 году. — И я сказал: «Нет, нет, нет, я напишу что-то еще, но я пока что вложу это. И я никогда не мог ничего придумать для этого. И я просто пошел, черт возьми, потому что мы были высоко в студии».","Когда Ноэль Галлахер (Noel Gallagher) дал NME пошаговый послужной список второго альбома Oasis перед его релизом, он прямо заявил, что Roll With It - это \"примерно все\". Галлахер предложил немного больше понимания, когда говорил с журналом Select о каждой песне на записи. \"Это просто типичная чертова вещь Oasis\", - объяснил он. - Заткнись и продолжай. Ты должен говорить то, что ты говоришь, и быть тем, кем ты являешься\". Это те же чувства, что и почти в каждой песне, которую мы делаем. Y'know, Supersonic - \"You've Got Be yourself...\" Это начинает становиться немного скучным (смеется), но это тексты, с которыми я чувствую себя комфортно.","«Мы получили много критики за то, что выложили его в качестве сингла, — признался он. — Это не самая лучшая песня в мире, это даже не самая лучшая песня Oasis». На вопрос Select, была ли песня написана о его младшем брате Лиаме, Галлахер ответил: «Это хуйня!","\"Речь идет о моей подруге, Мег Мэтьюс, - сказала Ноэль в сентябре 95 года. - У нее была компания, которая свернулась, и она чувствовала себя немного жалко. Смысл в том, что ей не было смысла чувствовать себя подавленной, она должна разобраться со мной в моей жизни, потому что я в клочья в половине времени\".","«Его оригинальное название было Wishing Stone, — рассказал он в другом интервью. — Мы играли в Cathouse в Глазго, я встретил какую-то девушку, и мы вернулись в мой гостиничный номер, и у нее был этот камень в кармане, который, как она настаивала, у меня был... Я думал, что это отличное название, и песня вышла из этого». Он назывался Wishing Stone в течение многих лет, пока мы не слушали Wonderwall Music Джорджа Харрисона, и это было похоже на «Блестящий, у меня есть связь с Битлз». «Когда мы впервые играли его, наш Лиам сказал, что он думал, что это дерьмо», - сказал гитарист Select, радостно издеваясь над своим братом. «Мы делали бэк-трек, и наш Лиам говорит: «Я не пою на этом, это чертовски глупо, чувак, это гребаная музыка регги...» Так что я сказал: «Почему бы тебе не пойти к чиппи, и мы увидимся немного, а? Теперь, когда он пел на нем, конечно, это величайшая песня, когда-либо написанная».","«Речь идет о том, чтобы не расстраиваться из-за того, что вы могли сказать или сделать вчера, - сказал Ноэль Энди Ричардсону из NME. - Речь идет о том, чтобы смотреть вперед, а не оглядываться назад. Я ненавижу людей, которые оглядываются на прошлое или говорят о том, что могло бы быть».","Галлахер впервые исполнил песню на первом в истории хедлайн-шоу Oasis на Sheffield Arena вместимостью 12 000 человек (теперь Utilita Arena Sheffield) 22 апреля 1995 года, написав основную структуру аккордов в Париже всего за 48 часов до выступления своей группы в клубе Bataclan. Во второй половине концерта в Шеффилде песне все еще не хватало припева, но в то время как Ноэль крутил аккорды во время саундчека группы, его младший брат непреднамеренно вдохновил то, что станет его культовым рефреном. Лиам подошел и сказал: Кто такая Салли?, - вспоминал Ноэль в своем комментарии к видео-компиляции Oasis: Time Flies 1994-2009. - И я подумал: О чем, черт возьми, вы говорите? И он сказал: \"Это то, что ты поешь? Так что Салли может подождать?\" И я подумал: \"Нет, это не так. Но теперь это чертовски хорошо\".","«Кто-то однажды подошел ко мне на концерте Иэна Брауна и спросил меня: «Была ли Салли, девушка, о которой идет речь, на самом деле Салли Циннамон из песни Stone Roses?», которая, как я думал, была чертовски блестящей. Она, очевидно, села и разработала это, и я не хотел портить это для нее, поэтому я сказал, Yes, это Салли Циннамон. Что это не так, на самом деле». И память Ноэля о культовом видео песни? «Мешок дерьма. Пустая трата дня».","«Одна из лучших песен, которые я когда-либо писал, и одна из самых простых, — заявил Галлахер в 1995 году. — Это нечто среднее между I Wanna Be Adored by The [Stone] Roses и суммированием Нила Янга, которое он мог бы сделать, когда был лучше, чем сейчас».","Лирика песни, по его словам, «о том, чтобы быть в группе». «Здесь нет сожаления, — настаивал он, — определенно нет сожаления. Но определенно, возможно, это был очень «вверх» альбом, потому что мы мечтали о том, что должно было прийти к нам... Речь идет о том, чтобы оглянуться назад и сказать: Ну, у нас есть то, что мы хотели, но это была чертовски тяжелая работа... это не было таким большим смехом, как мы думали».","Первоначально называвшаяся The Jam, эта короткая инструментальная композиция включала в себя Paul Weller на гармонике и соло-гитаре. «Это всего лишь около 40 с лишним секунд, но я думаю, что полная версия выйдет в конечном итоге», - предсказывал Галлахер.","«Мы только что подписали контракт, и я жил в постельном режиме в Манчестере, — сказал Галлахер в интервью Uncut в 2006 году. — Алан МакГи звонил в среду: «Хорошо, у нас вечеринка в офисе, приезжайте. — Если у кого-то есть собственный лейбл звукозаписи, и у них есть вечеринка, потому что это среда, это то, где я, черт возьми, должен быть». Так что я спустился в Лондон с гитарой, джинсами, тренерами - даже не зубной щеткой - и провел чертовски блестящее время. Офисы были в Хэкни, и он отправил персонал в паб, чтобы вернуться с подносом Джека Дэниела и кокаином, это было как: Черт возьми, чувак, я ни за что не вернусь в Манчестер, я не могу там больше жить. Я закончил со своей птицей, съехал вниз, и я помню, как просто написал эту песню, я думаю, что я был без ума от наркотиков.","Это психоделия-встречается-социальный комментарий, человек, - прокомментировал он в журнале Select. - Стихи довольно глубокие. Некоторые из них о бездомных людях, и о людях, которые не всегда могут получить то, что хотят, и о том, как люди, которые могут получить то, что хотят, всегда кажутся стонущими больше, чем люди, которые не могут. Я хотел чего-то глубокого и значимого для хора, но, в конце концов, я просто сдался и подумал, К черту это, может просто пойти глупо и иметь вещи о рыбах, посуде и собаках.","«Это было вдохновлено Ричардом [Эшкрофтом] из The Verve, — сказал Галлахер NME. — Я некоторое время жаловался, что Ричард не очень счастлив, поэтому я написал его для него, и примерно через три недели он ушел. Это о авторах песен в целом, которые отчаянно пытаются что-то сказать. Я хотел бы иметь возможность писать действительно значимые тексты, но я всегда в конечном итоге говорю о наркотиках или сексе».","«В моей голове, я думаю, я хотел, чтобы это звучало как Pink Floyd, потому что это те же аккорды, что и Wish You Were Here, вступительные аккорды те же», - добавил он в интервью 2021 года, возвращаясь к the album трек-по-треку в студиях Rockfield. Происходит что-то странное, и это как бы падает между двумя стилистическими табуретками, но это чертовски отличная песня... некоторые из лучших слов, которые я когда-либо писал».","В интервью с Энди Перри, Галлахер весело признался, что он сорвал мелодию и ключевые слова для She's Electric из британского образовательного телесериала для детей под названием Stop, Look, Listen. \"Это очень детская песня, даже больше, чем Digsy's Dinner\", признал он. \"Конечно, как только наш Лиам услышал ее, он говорит: \"Это должен быть первый сингл! Нам было очень весело, когда мы это делали. Это что, пи-пи-пи? Ты сказал это, а не я, приятель.","\"Это циничная песня о наркотиках, - сказал Галлахер NME в 1995 году. - Кокаин и гребаные бритвенные лезвия и зеркала, - сказал он в интервью Uncut 21 год спустя. - Я поражен, что нам это сошло с рук в то время. Мне нравится, когда мы играем его вживую. Кто-то сказал мне по телефону один раз, это американская поговорка: \"Какова история, утренняя слава?\", как мы говорим: \"Хорошо, как дела?\" И я был, блядь, подожди минутку, пока я это записываю, это чертовы стартеры, у меня это будет. Я помню, как писал эту чертову строчку, Все твои мечты сделаны, когда ты прикован к зеркалу и лезвию бритвы в этой комнате, - сказал он во время интервью, снятого в Рокфилде. - Я говорю, как будто я был просто в той зоне, где все, что я писал, было значимым.","\"Когда у меня заканчиваются наркотики, я получаю серьезно дерзкого ублюдка, - сказал Галлахер в интервью Sunday Times в 1996 году. - Сверхновая Шампань - ради Христа, насколько велик этот титул? Это как я говорю, я мистер Ноэль Галлахер. Вы знаете, кто я? Я величайший. Я как Мухаммед Али\".","Песня, которая, по словам Галлахера, оказала влияние на Led Zeppelin В «Stairway To Heaven» и «The Beatles» Dear Prudence есть гитарное соло от его героя и друга Пола Уэллера, который позже назвал Галлахера «сукой», потому что он чувствовал, что человек из Оазиса намеренно удерживал свой вклад на низком уровне в финальном миксе.","«Это был крик о гитарном соло, потому что мой был шокером», — признался Галлахер.","По сей день автор песен не совсем уверен, о чем песня.Однако самый известный в мире сторонник «Манчестер Сити» слишком хорошо знаком с ощущением боли \"Sham\" в 2026 году...","Музыкальный писатель с 1993 года, бывший редактор журналов Kerrang! и Planet Rock (RIP), Пол Бранниган является редактором журнала Louder. Написав ранее книги о Лемми, Дэйв Грол (бестселлер Sunday Times This Is A Call) и Metallica (Школа рождения Metallica_KEEP_6__, в соавторстве с Яном Уинвудом), его биография Эдди Van Halen (Извержение в Великобритании, развязанное в США) появилась в 2021 году. Он писал для Rolling Stone, Mojo и Q, тусовался с Фугази в Dischord House, летал на частном самолете Ozzy Osbourne, играл Gibson SG Ангуса Янга и брал интервью у всех от Aerosmith и Beastie Boys до Young Gods и ZZ Top. Родился на севере Ирландии, Бранниган живет в Северном Лондоне и поддерживает Арсенал."],"category":"Прогрессив","source":"Louder","published":"2026-10-02T22:49:52+00:00","original_url":"https://www.loudersound.com/bands-artists/noel-gallaghers-track-by-track-guide-to-whats-the-story-morning-glory","saved_at":1790992081,"artists":[{"id":"aerosmith","name":"Aerosmith"},{"id":"led-zeppelin","name":"Led Zeppelin"},{"id":"metallica","name":"Metallica"},{"id":"ozzy-osbourne","name":"Ozzy Osbourne"},{"id":"pink-floyd","name":"Pink Floyd"},{"id":"van-halen","name":"Van Halen"}],"original_title":"Noel Gallagher's track-by-track guide to Oasis' (What's the Story) Morning Glory?","topics":[],"original_paragraphs":["(What's the Story) Morning Glory? , Oasis ' 1995 follow-up to their debut album Definitely Maybe was recorded in just 12 working days, and went on to sell over 22 million copies, turning the Manchester indie rock band into global superstars. \"We're not exactly short on self-belief, but it is much better than the last one,\" Noel Gallagher promised to NME three months ahead of the album's October 2, 1995 release. \"Everyone who's heard it says that as well, and I don't think it's just arse licking.\"","Bigger certainly. Better? Hmmm, that's a matter of opinion. But here's Noel Gallagher thoughts on every song on his band's best-loved record.","\"I'll be told by someone in the States next year the meaning of the song Hello , which to me hasn't got no meaning,\" Noel Gallagher told Alternative Press magazine ahead of the release of his band's second album. \"It's just words strung together.\" \"The lyrics are ' We live in the shadows/We had the chance and we threw it away/And it's never gonna be the same',\" Oasis' songwriter quoted to Select magazine. \" It's just saying, Well, it's never gonna be the same for us anymore, I s'pose. If Definitely Maybe was about dreaming about being in a band, this one's about actually being in a band. So it's like, Hello, it's good to be back – back making records.\" Famously, the opening song on What's The Story ... carries a co-writing credit for glam rock star-turned-convicted paedophile Gary Glitter, as on an early take of the song, Noel Gallagher spontaneously sang a lyric from Glitter’s 1973 single Hello, Hello, I'm Back Again during its outro, which apparently caused much amusement in the studio.","\"[Producer] Mark Coyle said, 'You're not going to have that bit in the fucking song: it's Gary Glitter!'\" Gallagher recalled on a 2021 episode of the Matt Morgan Podscast. \"And I said, No, no, no, I'm gonna write something else, but I'll put that in for now. And I could never come up with anything for it. And I just went, Fuck it, because we were high in the studio.\"","When Noel Gallagher gave NME a song-by-song breakdown of Oasis' second album ahead of its release he bluntly declared that Roll With It is \"about fuck all\". Gallagher offered a little more insight when talking Select magazine through every song on the record. \"It's just a typical fuckin' Oasis thing,\" he explained. \"Shut up moanin' and fuckin' get on with it. You've gotta say what you say, and be who you be. It's the same sentiments as there is in nearly every song we do. Y'know, Supersonic – ' You've gotta be yourself. ..' It starts to get a bit boring (laughs), but those are the lyrics I feel comfortable with.","\"We got a lot of criticism for putting it out as a single,\" he admitted. \"It's not the greatest song in the world, it's not even the greatest Oasis song.\" Asked by Select if the song was written about his younger brother Liam, Gallagher replied, \"Is it fuck!\"","\"It's about my girlfriend, Meg Matthews,\" Noel told NME in September'95. \"She had a company which folded, and she was feeling a bit sorry for herself. The sentiment is that there was no point in her feeling down, she has to sort my life out for me, because I'm in bits half the time.\"","\"Its original title was Wishing Stone ,\" he revealed in another interview. \"We played the Cathouse in Glasgow, I met some girl and we went back to my hotel room and she had this stone in her pocket that she insisted I had... I thought it was a great title and the song came out of that. It was called Wishing Stone for ages until we were listening to Wonderwall Music by George Harrison and it was like, Brilliant, I’ve got a Beatles connection.\" \"When we were first playing it, our Liam said he thought it was shit,\" the guitarist told Select , gleefully mocking his brother. \"We were doing the backing track and our Liam goes, 'I'm not singing on that, it's fuckin' stupid, man, it's fuckin' reggae music...' So I said, Why don't you go off to the chippie then, and we'll see you in a bit, eh? Now that he's sang on it, of course, it's the greatest song ever written.\"","\"It's about not being upset about the things you might have said or done yesterday,\" No
