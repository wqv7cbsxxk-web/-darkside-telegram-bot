el told NME 's Andy Richardson. \"It's about looking forward rather than looking back. I hate people who look back on the past or talk about what might have been.\"","Gallagher performed the song for the first time at Oasis' first ever arena headline show, at the 12,000-capacity Sheffield Arena (now the Utilita Arena Sheffield) on April 22, 1995, having written the basic chord structure in Paris just 48 hours earlier, ahead of his band's gig at the Bataclan club. On the afternoon of the gig in Sheffield, the song was still lacking a chorus, but while Noel was strumming the chords during the band's soundcheck, his younger brother inadvertently inspired what would become its iconic refrain. \"Liam come up and said, 'Who's Sally?' Noel recalled in his commentary for the Oasis videos compilation Oasis: Time Flies 1994-2009 . \"And I was like, What the fuck are you talking about? And he said, 'Is that what you're singing? So Sally can wait?' And I was like, No, it isn't. But it fucking is now, nice one.\"","\"Someone came up to me at an Ian Brown gig once and asked me, 'Was Sally, the girl in question, actually Sally Cinnamon from the Stone Roses song?', which I thought was fucking brilliant. She'd obviously sat down and worked this out, and I didn't want to spoil it for her, so I said, Yes, it is Sally Cinnamon . Which it's not, really.\" And Noel's memory of the song's iconic video? \"Bag of shite. A waste of an afternoon.\"","\"One of the best songs I've ever written, and one of the simplest,\" Gallagher declared in 1995. \"It's a cross between I Wanna Be Adored by The [Stone] Roses and summat Neil Young might've done when he was better than he is now.\"","The song's lyrics, he said, are \"about being in a group\". \"There's no regret in there,\" he insisted to Select , \"definitely no regret. But Definitely Maybe was a very 'up' album, because we were dreaming of what was gonna come our way... This is about looking back and going, Well, we've got where we wanted to be, but it's been fucking hard work... it's not been as big a laugh as we thought it'd be.\"","Originally called The Jam , this short instrumental features Paul Weller on harmonica, and lead guitar. \"It's only about 40-odd seconds, but I think the full version will come out eventually\" Gallagher predicted. And it did, on the B-side of the Wonderwall single.","\"We'd just signed and I was living in a bedsit in Manchester,\" Gallagher told Uncut in 2006. \"[Creation records boss] Alan McGee would phone up on like a Wednesday, 'Alright, we're having a party in the office, come down.' If somebody's got their own record label and they're having a party 'cos its Wednesday, that's where I fucking need to be. So I come down to London with a guitar, jeans, trainers - not even a toothbrush - and had a fucking brilliant time. The offices were out in Hackney and he sent the staff round the pub to come back with a tray of Jack Daniel's and cokes, it was like: Fucking hell man, no way am I going back to Manchester, I can't live there any more. I finished with me bird, moved down, and I remember just writing this song, I think I was off my head on drugs.\"","\"It's psychedelia-meets-social comment, man,\" he commented in Select magazine. \"The verses are quite deep. Some of them are about homeless people, and people who can't always get what they want, and how people who can get what they want always seem to be moaning more than people who can't. I wanted something deep and meaningful for the chorus, but, in the end I just gave up and thought, Fuck it, might as well just go stupid and have stuff about fishes and dishes and dogs itchin' and all that...\"","\"It was inspired by Richard [Ashcroft] from The Verve,\" Gallagher told NME . \"I sussed Richard wasn't very happy for a while so l wrote it for him and about three weeks later he quit. It's about songwriters in general who are desperately trying to say something. I'd like to be able to write really meaningful lyrics,but I always end up talking about drugs or sex.\"","\"In my head, I believe I wanted it to sound like Pink Floyd because it's the same chords as Wish You Were Here, the opening chords are the same,\" he added in a 2021 interview, revisiting the album track-by-track at Rockfield studios. \"I was listening to it today, and it sounds a bit half baked to me. There's a country thing going on, and it's kind of falling in between two stylistic stools, but it's a fucking great song... some of the best words I ever wrote.\"","In an interview with Select' s Andy Perry, Gallagher cheerfully admitted that he'd ripped off the melody and key lyrics for She's Electric from a British educational TV series for children called Stop, Look, Listen . \"It's a very childish song, even more than Digsy's Dinner,\" he acknowledged. \"Of course, as soon as our Liam heard it, he goes, 'That should be the first single!' I'm goin', Don't be so fuckin' ridiculous! You knob! We had a lot of fun doing that one. Is it a Blur piss-take? You said that, not me, mate.\"","\"It's a cynical song about drugs\", Gallagher told NME in 1995. \"Cocaine and fucking razorblades and mirrors,\" he expanded in an interview with Uncut 21 years later. \"I'm amazed we got away with it at the time. I love it when we play it live. Somebody said to me on the phone once, it's an American saying: 'What's the story, morning glory'?, like we say, All right, how you doing? And I was like, fuck, hang on a minute, while I write that down, that's fucking starters, I'll have that.\" \"I do remember writing that fucking line, ' All your dreams are made when you're chained to the mirror and the razor blade' in this room,\" he said during an interview filmed at Rockfield. \"I sound like I was just in the zone there, where everything that I was writing was meaningful.\"","\"When I'm out of it on drugs I get a seriously cocky bastard,\" Gallagher told the Sunday Times in 1996. \" Champagne Supernova - for Christ's sake, how big is that title? It's like I'm saying, I am Mr Noel Gallagher. Do you know who I am? I am the greatest. I'm like Muhammad Ali.\"","The song, which Gallagher says took influences from Led Zeppelin's Stairway To Heaven , and The Beatles' Dear Prudence , features a guitar solo from his hero and friend Paul Weller, who later called Gallagher \"a cunt\" because he felt the Oasis man had deliberately kept his contribution low in the final mix.","\"It was crying out for a guitar solo because mine was a shocker,\" Gallagher admitted.","To this day, the songwriter isn't at all sure what the song's lyrics are about. However, the world's most famous Manchester City supporter has become all too familiar with the feeling of \"Sham\" pain in 2026...","A music writer since 1993, formerly Editor of Kerrang! and Planet Rock magazine (RIP), Paul Brannigan is a Contributing Editor to Louder. Having previously written books on Lemmy, Dave Grohl (the Sunday Times best-seller This Is A Call) and Metallica ( Birth School Metallica Death , co-authored with Ian Winwood), his Eddie Van Halen biography ( Eruption in the UK, Unchained in the US) emerged in 2021. He has written for Rolling Stone, Mojo and Q, hung out with Fugazi at Dischord House, flown on Ozzy Osbourne's private jet, played Angus Young's Gibson SG, and interviewed everyone from Aerosmith and Beastie Boys to Young Gods and ZZ Top. Born in the North of Ireland, Brannigan lives in North London and supports The Arsenal."]},{"id":"d7fd6a974ec5f1a1740b7731020383e8a46b0539","title":"Новый альбом AMON AMARTH доступен для прослушивания","short":"The Allfather Awakes, новое видео группы AMON AMARTH, доступно для просмотра. Этот трек взят из нового альбома \"The Allfather Awakens\", релиз которого намечен на второе октября на Metal Blade Records: 01. Gjallarhorn","paragraphs":["The Allfather Awakes, новое видео группы AMON AMARTH, доступно для просмотра. Этот трек взят из нового альбома \"The Allfather Awakens\", релиз которого намечен на второе октября на Metal Blade Records:","01. Gjallarhorn","02. Eight Legs Of Thunder","03. Kvasir's Blood","04. We Rule The Waves","05. Upphaf","06. Die With A War Cry","07. Raven God","08. The Allfather Awakes","09. Oden's Hunt","10. Ascending Like An Eagle"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T22:56:22+00:00","original_url":"http://www.darkside.ru/news/184202/","saved_at":1790992068,"artists":[],"original_title":"Новый альбом AMON AMARTH доступен для прослушивания","topics":["releases"]},{"id":"cf5f52524f638177ef369df12142bb5554fd2fb1","title":"Бадди Гай вспоминает блюзменов, которые его вдохновили","short":"В 2015 году легенда блюза Бадди Гай выпустил альбом Born To Play Guitar , в котором приняли участие Билли Гиббонс, Джосс Стоун и Ван Моррисон. Альбом получил премию Грэмми в следующем году, но до этого Бадди рассказал The Blues о своей карьере и жизни, оглядываясь на необыкновенную чикагскую блюзовую сцену, которая породила так много великих имен.","paragraphs":["В 2015 году легенда блюза Бадди Гай выпустил альбом Born To Play Guitar , в котором приняли участие Билли Гиббонс, Джосс Стоун и Ван Моррисон. Альбом получил премию Грэмми в следующем году, но до этого Бадди рассказал The Blues о своей карьере и жизни, оглядываясь на необыкновенную чикагскую блюзовую сцену, которая породила так много великих имен.","Бадди Гай никогда не забудет, как его спасла чикагская блюзовая сцена. «Я не ел три дня, я был голоден, мне было холодно. Я носил свою гитару, гулял по улицам на южной стороне, и я думал, что мне, возможно, придется выпросить у кого-то десять центов, чтобы я мог позвонить своей матери и попросить ее отправить мне мой поезд домой »,- говорит он The Blues серьезными тонами. «Но потом этот незнакомец пожалел меня, услышал, как я играю с Джимми Ридом, схватил меня за руку и взял с собой в клуб 708.","- Чувак, я не мог поверить своим глазам и ушам. Я вошел, и место прыгало. Музыка согревала мою душу. Я сразу узнал песню, которая играла; это была песня Отиса Rush«Я не могу бросить тебя, детка». Однако это была не копия; это был сам Отис Rush. Тогда я знал, что я был в Чикаго, что это то, за чем я приеду ».","Это была зима 1957 года, и в ту ночь на 708 East 47th Street в Бронзевилле, Чикаго, 21-летний парень, родившийся и выросший в Леттсворте, штат Луизиана, оказался на сцене с Гибсоном Лес Полом в руке, павлином, раздирающим доски, играющим гитару Бобби Бланда «Further On Up The Road» за спиной, над головой, играя зубами.","Отис Rush поднял его; аудитория тоже. Раздались слухи, и до конца ночи Мадди Уотерс принес бутерброд с салями, чтобы накормить его. «Сначала я не поверил, что это он, но это был Чикаго; вы шли по улице, и вы приходили в угол, и вы находили Мадди, Волка, Маленького Уолтера, Сонни Боя... блюзового гиганта, делающего свое дело».","Той ночью Бадди Гай и Мадди Уотерс завязали дружбу, которая продлится всю жизнь Мадди.","На протяжении всего увлекательного получасового разговора The Blues с Бадди Гаем они снова и снова возвращаются в Чикаго, город, который музыкант называет своим домом вот уже 58 лет.","«Это то, где я достиг совершеннолетия; это определило меня», - ласково говорит он.","Он приехал в город 25 сентября 1957 года, дата неизгладимо запечатлелась в его памяти, в поисках работы в университете. «Мне сказали, что я заработаю там в два раза больше денег, чем в Университете штата Луизиана, где я работал. Моя мама была больна, у нее был инсульт, я пытался поддержать ее, мой план состоял в том, чтобы работать днем, а затем проводить вечера, наблюдая, как Мадди Уотерс играет на гитаре ночью.","«Я никогда не думал, что стану профессиональным музыкантом, я не думал, что я настолько хорош. Я был застенчив, но после того, как Мадди, Вульф и Би Би Кинг сказали мне, что я действительно хорош, я подумал, что мне лучше продолжать играть».","Именно в клубе 708 он также подружился с Би Би Кингом. «Я был на сцене 708, играл его песню, я посмотрел в аудиторию, и там был он. Я испугался сцены, пришлось сделать перерыв. Я пошла в туалет, когда вышла, он позвал меня к себе. Он сказал, что видел много его в моей игре. Я не могла в это поверить, он не только пришел послушать, как я играю, но ему понравилось то, что он услышал. Он сказал: ‘You’готов занять мое место.« Я не был уверен в этом, но для меня всегда было честью быть в его компании».","Другой чикагский друг Гая, Мэджик Сэм, заключил с ним свой первый контракт. На Cobra Records Эли Тоскано под руководством продюсера, автора песен и басиста Вилли Диксона Гай записал свой дебютный альбом 45 Sit And Cry (The Blues) . В 1958 году он был выпущен на лейбле Cobra импринт Artistic.","«После игры в клубе 708 обо мне стало известно», - объясняет Гай. «Большинство гитаристов в Чикаго в это время сидели, чтобы играть, но вот был этот парень, который был диким, сумасшедшим, с гитарным лидерством в 150 футов, который начинал играть из-за пределов клуба, а затем входил и прыгал со сцены и играл в толпе. Конечно, я получил это от просмотра Guitar Slim и T-Bone Walker в Луизиане».","Magic Sam принимал участие в конкурсах талантов Battle Of Guitars, которые проходили в воскресенье днем в разных барах по всему городу.","«Я начал играть в них, побеждать в них и познакомился с ним, Мэттом Мерфи, Уэйном Беннетом, всеми этими великими гитаристами. Однажды днем после того, как я снова выиграл, Сэм сказал, что отвезет меня в свою звукозаписывающую компанию, чтобы узнать, запишут ли они меня. Мы добрались туда; это была крошечная студия. Там был вокалист Гарольд Беррадж. Я не мог в это поверить; я знал, что Гарольду Беррейджу 45 лет.","«В любом случае, они подключили меня, я сыграл три ноты« Сладких шестнадцати »Би Би Кинга, и у Гарольда Берраджа отвисла челюсть. Эли Тоскано поставил этот контракт передо мной и сказал:« Подпиши это, мы сделаем с тобой запись. «Это была забавная обстановка. Я не получил свободы. Вилли Диксон был главным; он сказал мне, что играть и как играть, и я сделал, как он сказал мне».","Тем не менее, Гай все еще наслаждался этим опытом. «Это не имело значения, потому что это был мой первый раз в настоящей студии, и я так нервничал и так волновался. Было два микрофона, один для меня, один для группы. Группа состояла из Вилли Диксона на басу, Отиса Rush на ритм-гитаре, Оди Пейна на барабанах, Гарольда Берраджа на фортепиано и Маккинли Итона на баритон-саксофоне. Сидеть и плакать на стороне А – ну, именно так я себя чувствовал, сидя в студии в тот день».","Сторона «Б» «Try To Quit You Baby» была ответом на песню Отиса Rush«I Can 't Quit You Baby». «Это была идея Эли Тоскано, и если бы Отис Rush тоже играл на ней, я не мог бы быть счастливее. Как будто я попал на небеса».","Sit And Cry (The Blues) и его продолжение, This Is The End 1959 года – на последний из которых сильно повлиял Би Би Кинг – провалились, и к 1960 году Cobra была объявлена банкротом. Парень, неустрашимый, продолжал выступать, и в следующем году он оказался в Шахматах, где он оставался в течение семи лет. Шахматы располагались по адресу 2120 South Michigan Avenue и находились на пике своего могущества.","Первый раз Бадди Гай пошёл в Шахматы, у него в руке была демо-запись. Никто не интересовался лентой, но его Лес Пол привлек внимание Уэйна Беннетта, который попросил одолжить её для сессии с ду-воп вокальной группой The Spaniels. Гай должен был посмотреть запись сессии, оставил свою собственную ленту для Леонарда Шахматы, но ничего не слышал. Второй раз он пошёл в здание, правда, это была другая история: он получил контракт на запись.","Отис Rush взял меня к Леонарду [Шесс, совладелец лейбла с его братом Филом]. Леонард, видимо, попросил Отиса привести меня на прослушивание с ним. Сэм тоже пришел. Они не взяли Сэма, но они взяли меня и Отиса. Я не знаю, почему они не хотели Сэма.","Первая сессия, которую он записал там, была с Howlin' Wolf. \"Я молчал, слушал очень хорошо, делал то, что мне говорили, и потому что я сделал это, тогда мне позвонили, что я поддерживаю Muddy, Sonny Boy [Williamson], Koko Taylor, Little Walter. Это было образование. Little Walter, он положил гармонику на карту. Я очень хорошо знал его, я играл на двух или трех его альбомах. Мы связались, потому что мы оба из Луизианы.","Мы пытаемся придумать блюзовый фестиваль в честь него в Александрии, штат Луизиана, на данный момент. Но прежде чем он сделал Juke, гармонику, вы могли бы купить ее за 10, 15 центов, затем после этого 45, она просто взорвалась, все хотели играть на гармонике. Это было похоже на то, как после того, как BB King играл на гитаре на 3 часа, прежде чем вы пошли в небольшой музыкальный магазин, они сказали бы сделать мне предложение на гитаре. После 3 часов, о, ну, это стоит так и так сейчас».","С таким количеством легенд, живущих и работающих на таком небольшом расстоянии друг от друга, эго могло быть проблемой. \"Но мы все были так влюблены в музыку, не было соперничества, было чувство настоящего товарищества, мы были семьей. Все веселились. Соперничество в Битве Гитар, мы разыграли это, это был просто акт, мы заставили зрителей думать, что, но факт в том, что мы все крали лизы друг у друга, пытаясь получить лучший звук и наслаждаться собой».","Но его время в Chess не сработало так, как он ожидал. «Они не выходили и взрывали меня и Отиса, как будто у них был Мадди, — говорит он. — Они давали мне 45 раз в два-три года, они действительно просто заставляли меня поддерживать всех остальных на лейбле там. Они даже заставили меня играть на некоторых духовных записях. Только после того, как музыканты в Великобритании начали проверять меня по имени, Леонард заинтересовался мной и пришел в студию, чтобы увидеть мою запись». До этого я работал с Вилли Диксоном и Ральфом Бассом».","Шахматы действительно пропустили трюк с Гаем; здесь был мятежник, который, упреждая театральность Джими Хендрикса на сцене, мог воспламенить толпу, которая в студии раздвинула границы, используя обратную связь, искажение, расширенные соло, которые хотели записать такие альбомы, как «Электрическая грязь» Мадди Уотерса и «Альбом Хоулина Вольфа» Хоулина еще до того, как был изобретен психо-блюз.","Тем не менее, несколько синглов, которые он записал для лейбла, содержали некоторые будущие классики; его дебютный альбом The First Time I Met The Blues в 1960 году, Stone Crazy 1962 года и I Suffer With The Blues 1967 года - это выбор и все созрело для повторного открытия, захватив волнение, энтузиазм и сырую энергию, которые стали товарным знаком Chess R \u0026 B.","В феврале 1965 года он впервые приехал в Великобританию, узнал, что у него есть аудитория, и больше никогда не сомневался в его таланте. «Это был огромный толчок, чтобы узнать, что люди действительно слушают. Там были Джими Хендрикс, Род Стюарт, Джефф Бек... они все были фанатами».","Семь месяцев спустя он снова побывал в рамках европейского турне American Folk Blues Festival. Именно в этом туре он наладил еще одну важную связь, на этот раз с Big Mama Thornton. \"Это был первый раз, когда я встретил ее, и я играю на гитаре для нее. Она начинает петь Hound Dog - я большой поклонник пластинки, ее версии и Элвиса - она прыгает на сцене и с этим ее мост падает из ее рта.","«И, не пропуская записку, она поднимает ее со сцены и помещает прямо обратно и продолжает петь. Это подвело ее, она не суетилась, она была бессмыслицей и просто взялась за это. Она не кусала свой язык о том, чтобы ничего не говорить».","В том же году Гай объединился с гармоником Джуниором Уэллсом, посетив потрясающий альбом Уэллса Hoodoo Man Blues для Delmark под псевдонимом Friendly Chap. death в 1998 году.","Как и многие близкие друзья Гая, их дружба началась в клубе 708. «Он играл в группе Мадди. Я не мог оторвать от него глаз», — с любовью говорит Гай. Пара сразу же щелкнула, как два гороха в стручке. «Он подошел к блюзу, как и я, он был диким. Мы начали джемовать в маленьких клубах в Чикаго вместе, я бегал вокруг со своей 150-футовой проволокой, я заставил его получить проволоку для своей гармоники.","\"В первый раз, когда мы играли на джазовом фестивале в Ньюпорте в 1960 году, никто о нас не слышал, мы были блюзовыми артистами на джазовом фестивале. Во второй половине дня они управляли этими гитарными мастерскими. Вы шли на небольшую сцену, спрятанную в углу, у вас была небольшая группа за спиной, и вы получали аудиторию от 100 до 150 человек. Это должно было быть интимным. Мы начали разогреваться - я был на одной стороне поля, он был на другой\". Мы начали играть, и мы так хорошо знали друг друга, знали, что другой собирается делать, мы встретились друг с другом посередине и бах!","«Внезапно за нами наблюдали 15 000 человек. Мы заставили их взволноваться, встать на ноги, хлопать в ладоши. Джордж Вейн, он человек, который создал джазовый фестиваль в Ньюпорте, он подошел и сказал: «Кто, черт возьми, вы, ребята? У нас никогда не было столько людей на семинаре раньше.» Би Би Кинг был в аудитории, и следующее, что я знаю, он и Джуниор играют в кости на траве на передней части сцены с фанатами».","В 1967 году Гай покинул Chess и подписал контракт с Vanguard, расширив свою музыкальную палитру, включив соул и фанк в 1968 году в A Man And The Blues. Он продолжал играть вживую и никогда не уходил далеко от Чикаго в течение 70-х и 80-х; в июне 1989 года он пообещал свою преданность городу дальше, открыв Legends, свой блюзовый клуб на 700 S Wabash Avenue.","Именно там он играл свое последнее шоу с Джуниором Уэллсом, и он все еще играет там каждый январь, продавая резиденцию на 16 свиданий. \"Это, конечно, весело\", - говорит он. - Затем в 2012 году он принес свою любовь к Чикаго в полный круг, попросив президента США Обаму спеть \"Sweet Home Chicago\" Роберта Джонсона с ним, когда он был гостем в Белом доме. - И он это сделал, - говорит Гай. - Это был гордый момент.","Эта функция первоначально появилась в The Blues #24, опубликованном в сентябре 2015 года."],"category":"Прогрессив","source":"Louder","published":"2026-10-02T23:05:00+00:00","original_url":"https://www.loudersound.com/bands-artists/buddy-guy-born-to-play-the-blues","saved_at":1790992066,"artists":[],"original_title":"Last man standing: Buddy Guy looks back on the bluesmen who inspired him","topics":[],"original_paragraphs":["In 2015, blues legend Buddy Guy released Born To Play Guitar , an album that featured guest appearances from Billy Gibbons, Joss Stone and Van Morrison. The album picked up a Grammy Award the following year, but before that, Buddy spoke to The Blues about his career and life, looking back on the extraordinary Chicago blues scene that produced so many great names.","Buddy Guy will never forget how the Chicago blues scene saved him. “I’d not eaten for three days, I was hungry, I was cold. I was carrying my guitar, walking the streets on the South Side, and I was thinking I might have to beg a dime from someone so I could call my mother to ask her to send me my train fare back home,” he tells The Blues in serious tones. “But then this stranger, he took pity on me, he heard me playing some Jimmy Reed, he grabbed my hand and took me along to the 708 Club.","\"Man, I couldn’t believe my eyes and ears. I walked in, and the place was jumpin’. The music warmed my soul. I recognised the song that was playing immediately; it was Otis Rush’s I Can’t Quit You Baby . It was no copy though; it was Otis Rush himself. I knew I was in Chicago then, that this is what I’d come for.”","This was winter 1957, and that night at 708 East 47th Street in Bronzeville, Chicago, the 21-year- old, born and raised in Lettsworth, Louisiana, ended up on stage, Gibson Les Paul in hand, peacock-strutting across the boards, playing Bobby Bland’s Further On Up The Road with his guitar behind his back, over his head, played with his teeth.","Otis Rush lapped it up; the audience did too. Word got out, and before the end of the night Muddy Waters had turned up with a salami sandwich to feed him. “I didn’t believe it was him at first, but that was Chicago though; you walked down a street, and you’d come to a corner, and you’d find Muddy, Wolf, Little Walter, Sonny Boy… a blues giant doing his thing.”","That night, Buddy Guy and Muddy Waters struck up a friendship that would last Muddy’s lifetime.","Throughout the fascinating half-hour conversation The Blues has with Buddy Guy, talk time and again finds its way back to Chicago, the city the musician has called home for 58 years.","“It’s where I came of age; it defined me,” he says affectionately.","He arrived in the city on September 25, 1957, the date imprinted indelibly on his memory, looking for work at the university. “I was told I’d make twice as much money there than the Louisiana State University, where I had been working. My mother was sick, she’d had a stroke, I was trying to support her, my plan was to work in the day then spend the evenings watching Muddy Waters play guitar at night.","\"I never thought I’d be a professional musician, I didn’t think I was that good. I was shy but after Muddy, Wolf and BB King told me I really was good, I thought I’d better keep on playing.”","It was at the 708 Club that he also made friends with BB King. “I was on stage at the 708, playing his song, I looked out into the audience and there he was. I got stage fright, had to take a break. I went to the bathroom, when I came out, he called me over to him. He said he saw a lot of him in my playing. I couldn’t believe it, not only had he come to hear me play but he liked what he heard. He said: ‘You’re ready to take my place.’ I wasn’t sure about that but it was always an honour to be in his company.”","Another Chicagoan friend of Guy’s, Magic Sam, got him his first record deal. At Eli Toscano’s Cobra Records, under producer, songwriter and bassist Willie Dixon’s supervision, Guy recorded his debut 45 Sit And Cry (The Blues) . In 1958, it was released on the Cobra label imprint Artistic.","“After playing the 708 club word got out about me,” explains Guy. “Most guitar players in Chicago at this time were sitting down to play but here was this guy who was wild, crazy, with a 150ft guitar lead, that would start playing from outside the club then come in and jump off the stage and play in the crowd. Of course I’d got that from seeing Guitar Slim and T-Bone Walker back in Louisiana.”","Magic Sam was taking part in Battle Of Guitars talent contests, which took place on a Sunday afternoon at different bars around the city.","“I got playing in them, started winning them, and got to know him, Matt Murphy, Wayne Bennett, all these great guitarists. One afternoon after I’d won again, Sam said he’d take me to his record company, see if they’d record me. We got there; it was a tiny studio. Harold Burrage, the vocalist, was there. I couldn’t believe it; I knew Harold Burrage’s 45s.","\"Anyhow, they plugged me in, I played three notes of BB King’s Sweet Sixteen and Harold Burrage’s jaw dropped. Eli Toscano put this contract in front of me and said: ‘Sign this, we’re gonna make a record with you.’ It was a funny set-up. I didn’t get no freedom. Willie Dixon was in charge; he told me what to play and how to play it, and I did as he told me.\"","Guy still savoured the experience, though. “It didn’t matter because it was my first time in a proper studio and I was so nervous and so excited. There were two microphones, one for me, one for the band. The band was Willie Dixon on bass, Otis Rush on rhythm guitar, Odie Payne on drums, Harold Burrage on piano and McKinley Eaton on baritone sax. The A-side Sit And Cry – well, that’s just how I felt sitting in the studio that day.”","The B-side, Try To Quit You Baby , was an answer record to Otis Rush’s I Can’t Quit You Baby . “That was Eli Toscano’s idea, and having Otis Rush playing on it too, I couldn’t be happier. It was like I’d gone to heaven.”","Sit And Cry (The Blues) and its follow-up, 1959’s This Is The End – the latter of which was heavily influenced by BB King – flopped, though, and by 1960 Cobra had been declared bankrupt. Guy, undeterred, kept on performing and the following year he ended up at Chess, where he remained for seven years. Chess was located at 2120 South Michigan Avenue, and was at the height of its power.","The first time Buddy Guy went to Chess, he had a demo tape in his hand. No one was interested in the tape, but his Les Paul caught the eye of Wayne Bennett, who asked to borrow it for a session with the doo-wop vocal group The Spaniels. Guy got to watch the recording of the session, left his own tape for Leonard Chess, but heard nothing back. The second time he went to the building, though, it was a different story: he got a record deal.","“Otis Rush took me to Leonard [Chess, co-owner of the label with his brother Phil]. Leonard apparently had asked Otis to bring me over to audition with him. Sam came along too. They didn’t take Sam, but they took me and Otis. I don’t know why they didn’t want Sam.”","The first session he recorded there was with Howlin’ Wolf . “I kept quiet, listened real well, did what I was told and because I did that, then I got the call that I was backing Muddy, Sonny Boy [Williamson], Koko Taylor, Little Walter. That was an education. Little Walter, he put the harmonica on the map. I got to know him real well, I played on two or three of his albums. We bonded because we were both from Louisiana.","\"We’re trying to come up with a blues festival in honour of him in Alexandria, Louisiana, at the moment. But before he made Juke , the harmonica, you could buy one for 10, 15 cents, then after that 45, it just exploded, everyone wanted to play the harmonica. It was like after BB King played the guitar on 3 O’Clock , before that you’d go into a little music store, they’d say make me an offer on the guitar. After 3 O’Clock , oh well, that costs such and such now.”","With so many legends living and working such a short distance from one another, ego could have been a problem. “But we were all so in love with the music, there was no rivalry, there was this sense of real camaraderie, we were a family. Everyone was having fun. The rivalry at the Battle Of The Guitars, we played that up, it was just an act, we made the audience think that, but the fact of the matter was, we were all stealing licks from one other, trying to get the best sound and enjoying ourselves.”","But his time at Chess didn’t work out quite as he had expected. “They didn’t go out and explode me and Otis like they had Muddy,” he says. “They gave me a 45 once every two to three years, they really just got me backing everyone else on the label there. They even had me playing on some spiritual recordings. It was only after the musicians in the UK started namechecking me that Leonard got interested in me and came to the studio to see me record. That was the only time. Before that I was working with Willie Dixon and Ralph Bass.”","Chess really missed a trick with Guy; here was a seditionary who, pre-empting Jimi Hendrix’s onstage theatrics, could ignite a crowd, who in the studio pushed boundaries using feedback, distortion, extended solos, who wanted to record albums like Muddy Waters’ Electric Mud and Howlin’ Wolf’s The Howlin’ Wolf Album before psych blues had even been invented.","Nevertheless, the handful of singles he recorded for the label contained some future classics; his label debut The First Time I Met The Blues in 1960, 1962’s Stone Crazy and 1967’s I Suffer With The Blues are the pick and all ripe for rediscovery, capturing an excitement, enthusiasm and raw energy that trademarked Chess R\u0026B.","It was in February 1965 that he went to the UK for the first time, found out he had an audience and never doubted his talent again. “It was a huge boost to know people were actually listening. There was Jimi Hendrix, Rod Stewart, Jeff Beck… they were all fans.”","Seven months later he visited again as part of the American Folk Blues Festival European tour. It was on that tour that he forged another important relationship, this time with Big Mama Thornton. “That was the first time I met her and I’m playing lead guitar for her. She starts singing Hound Dog – I’m a big fan of the record, her version and Elvis’ – she’s jumping around on stage and with that her bridge falls out of her mouth.","\"And without missing a note, she picks it up off the stage floor and puts it straight back in and keeps singing. That summed her up, she didn’t make no fuss, she was no-nonsense and just got on with it. She didn’t bite her tongue about saying nothing either.”","That same year, Guy teamed with harmonica player Junior Wells, guesting on Wells’ terrific Hoodoo Man Blues album for Delmark under the pseudonym Friendly Chap. They’d continue working together up until Wells’ death in 1998.","Like so many of Guy’s close friendships, theirs began at the 708 Club. “He was playing in Muddy’s band. I couldn’t take my eyes off him,” says Guy fondly. The pair clicked immediately, like two peas in a pod. “He approached the blues like me, he was a wild one. We started jamming in the little clubs in Chicago together, I was running around with my 150ft wire, I made him get a wire for his harmonica.","\"The first time we played the Newport Jazz Festival in 1960, no one had heard of us, we were blues artists at a jazz festival. In the afternoon they ran these guitar workshops. You’d go to a small stage tucked away in the corner, you’d have a little band behind you and you’d get an audience of 100 to 150 people watching. It was supposed to be intimate. We started warming up – I was on one side of the field, he was on the other. We started playing, and we knew each other so well, knew what the other was going to do, we met each other in the middle and bang!","\"Suddenly we had 15,000 people watching us. We had them excited, up on their feet, clapping their hands. George Wein, he’s the man who created the Newport Jazz Festival, he came over and said: ‘Who the hell are you guys? We’ve never had that many people at a workshop before.’ BB King was in the audience and the next thing I know, he and Junior are out gambling dice on the grass at the front of the stage with the fans.”","In 1967, Guy left Chess and signed to Vanguard, expanding his musical palette to include soul and funk on 1968’s A Man And The Blues . He continued playing live, and never strayed far from Chicago during the 70s and 80s; in June 1989 he pledged his allegiance to the city further, opening Legends, his blues club at 700 S Wabash Avenue.","It’s there he played his last show with Junior Wells and he still plays there every January, selling out a 16-date residency. “That sure is fun,” he says. Then in 2012 he brought his love of Chicago full circle by asking US President Obama to sing Robert Johnson’s Sweet Home Chicago with him when he was a visitor at The White House. “And he did,” says Guy. “That was a proud moment.”","This feature originally appeared in The Blues #24, published in September 2015."]},{"id":"1430fc8c33ef11ad09e78277cb141c73394bbfd0","title":"Как Бон Скотт из AC/DC повлиял на жизнь Брента Хайндса, одного из основателей Mastodon","short":"Подкаст Beyond The Thunderdome был запущен в 2021 году с миссией обсудить всё AC/DC. Среди тех, кто появился на шоу, были Airbourne, Simon Wright, Chris Slade, Chris Jericho, Scott Ian, Slash, Dweezil Zappa и Dee Snider, а в марте 2021 года было взято интервью у гитариста Mastodon Brent Hinds.","paragraphs":["Подкаст Beyond The Thunderdome был запущен в 2021 году с миссией обсудить всё AC/DC. Среди тех, кто появился на шоу, были Airbourne, Simon Wright, Chris Slade, Chris Jericho, Scott Ian, Slash, Dweezil Zappa и Dee Snider, а в марте 2021 года было взято интервью у гитариста Mastodon Brent Hinds. Ниже один из создателей подкаста Курт Сквайрс вспоминает эту встречу.","Когда мы говорили с Брентом Хиндсом , он был именно тем, кем вы ожидали увидеть Брента Хиндса. Незадолго до окончания дня он пригласил нас на экскурсионный автобус Mastodon, показал свежую татуировку AC/DC и спросил, какую песню мы хотели бы, чтобы он сыграл на своем Gibson SG, пока мы снимали группу в тот вечер. Мы выбрали Царя . Он ухмыльнулся и обязался.","Ничто из этого не удивило. К тому времени AC/DC – и особенно Бон Скотт – были вплетены в жизнь Хинда на протяжении десятилетий. На самом деле, его история о Бон Скотте началась рядом с бассейном во Флориде. Первой AC/DC музыкальной кассетой Хиндса стала кассета Highway To Hell.","«Мне было около одиннадцати лет», - вспоминал он. «Я уехал на велосипеде, купил его на свои деньги, снял его у бассейна и слушал все это снова и снова».","И впечатления были незабываемыми. «Это было наэлектризовано», - сказал он. Настолько электризующим, что Хиндс стал настолько поглощен музыкой, и он забыл, что лежит под солнцем Флориды. К тому времени, когда он вернулся в коттедж своей семьи, он сильно обгорел везде, кроме одного идеального белого прямоугольника, где его портативный кассетный плеер Panasonic лежал на груди. Его первая встреча с AC/DC буквально оставила след.","Как и многие музыканты своего поколения, Хиндс обнаружил, что Бон Скотт был не просто певцом. Он был персонажем, стилем жизни, предостерегающей сказкой, героем и многим другим, все слилось в одно целое.","Даже спустя десятилетия Хиндс сравнивал свои эксцессы с эксцессами Бона.","«Каждый раз, когда я перестарался с вечеринками и просыпался с чувством death, мое тело выглядело так: ‘Brent, you’ сейчас умрет, как Бон Скотт. Вставай и иди рви».","Реплика смешная, потому что Брент говорит так, как будто он рассказывает шутку. Несмотря на всю мифологию, связанную с Боном Скоттом – и ее было много на протяжении десятилетий – Хиндс понимал, что за вечеринку придется заплатить определенную цену. Тем не менее, восхищение никогда не исчезало.","«По сей день What's Next To The Moon на Powerage, вероятно, моя любимая песня AC/DC».","Этот выбор говорит о многом. Хиндс тяготел к одной из самых красочных и незамеченных историй Бона – напоминание о том, что под риффами и чванством был одаренный рассказчик.","Как и Бон, Хиндс покинул нас слишком рано. Он скончался в 2025 году в возрасте 51 года, оставив после себя преданных поклонников, музыкантов и друзей. Тем не менее, знак, который Бон оставил на нем, все еще был там, чтобы все видели, татуированный на его коже.","Курт Сквайерс - создатель подкаста AC/DC: Beyond The Thunder . Он был вовлечен в Highway To Hell в возрасте десяти лет, имел свой первый живой опыт AC/DC в 1985 году и, наконец, встретился с группой в 2000 году, отношения, которые он с тех пор поддерживает. Он живет в Роли, штат Северная Каролина, и является автором грядущей книги AC/DC: Every Dirty Song ."],"category":"Хард-рок","source":"Louder","published":"2026-10-03T00:30:00+00:00","original_url":"https://www.loudersound.com/bands-artists/how-acdc-impacted-brent-hinds","saved_at":1790992043,"artists":[{"id":"ac-dc","name":"AC/DC"},{"id":"mastodon","name":"Mastodon"}],"original_title":"How AC/DC's Bon Scott impacted the life of Mastodon's founding guitarist, Brent Hinds","topics":[],"original_paragraphs":["The Beyond The Thunderdome podcast launched in 2021 with a mission to discuss all things AC/DC. Those who've appeared on the show include Airbourne, Simon Wright, Chris Slade, Chris Jericho, Scott Ian, Slash, Dweezil Zappa and Dee Snider, and in March 2021, late Mastodon guitarist Brent Hinds was interviewed. Below, podcast co-creator Kurt Squires remembers the encounter.","When we spoke to Brent Hinds , he was exactly who you’d expect Brent Hinds to be. Before the day was over, he’d invited us onto Mastodon ’s tour bus, shown off a freshly inked AC/DC tattoo, and asked which song we’d like him to play on his Gibson SG while we filmed the band that night. We chose The Czar . He grinned and obliged.","None of it was surprising. By then, AC/DC – and especially Bon Scott – had been woven into Hind’s life for decades. In fact, his Bon Scott story began beside a swimming pool in Florida. The first AC/DC music Hinds ever owned was a Highway To Hell cassette.","“I was about eleven years old,” he recalled. “I rode my bike off, bought it with my allowance money, took it down by the pool and listened to the whole thing over and over again.”","And the experience was unforgettable. “It was electrifying,” he said. So electrifying that Hinds became so absorbed in the music, and he forgot he was lying under the Florida sun. By the time he got back to his family’s cottage, he was badly sunburned everywhere except for one perfect white rectangle where his Panasonic portable cassette player had rested on his chest. His first encounter with AC/DC had literally left a mark.","Like many musicians of his generation, Hinds discovered that Bon Scott wasn’t just a singer. He was a character, a lifestyle, a cautionary tale, a hero and more, all rolled into one.","Even decades later, Hinds measured his own excesses against Bon’s.","“Every time I’ve ever overdone it partying and woke up feeling like death, my body’s been like: ‘Brent, you’re gonna die like Bon Scott right now. Get up and go puke.’”","The line is funny because Brent tells it like he’s telling a joke. For all the mythology surrounding Bon Scott – and there has been plenty of it over the decades – Hinds understood that there was a cost attached to the party. Yet the admiration never faded.","“To this day, What’s Next To The Moon on Powerage is probably my favourite AC/DC song.”","That choice says a lot. Hinds gravitated toward one of Bon’s most colourful and overlooked stories – a reminder that beneath the riffs and swagger was a gifted storyteller.","Like Bon, Hinds left us too soon. He passed away in 2025 at the age of 51, leaving behind his own devoted following of fans, musicians and friends. Yet the mark Bon left on him was still there for everyone to see, tattooed on his skin.","Kurt Squiers is the brains behind the podcast AC/DC: Beyond The Thunder . He was hooked by Highway To Hell at the age of ten, had his first live AC/DC experience in 1985, and finally met the band in 2000, a relationship he has since maintained. He lives in Raleigh, North Carolina, and is the author of the upcoming book AC/DC: Every Dirty Song ."]},{"id":"e2141d56a4abde570fd3feb5858f73d81b9e6cff","title":"CHRIS HARMS выпустит новый альбом зимой","short":"CHRIS HARMS сообщил о том, что его новая сольная работа, получившая название Aporia, 27 января 2027 года на Napalm Records. Первый сингл из этого релиза, \"Find What You Love And Let It Kill You\", доступен для прослушивания. Альбом будет доступен в цифровом варианте, а также в лимитированном бокс-сете со специальным CD. Трек-лист:","paragraphs":["CHRIS HARMS сообщил о том, что его новая сольная работа, получившая название Aporia, 27 января 2027 года на Napalm Records. Первый сингл из этого релиза, \"Find What You Love And Let It Kill You\", доступен для прослушивания. Альбом будет доступен в цифровом варианте, а также в лимитированном бокс-сете со специальным CD.","Трек-лист:","01. U† I†","02. Find What You Love And Let It Kill You","03. Skipped A Beat (feat. Erk Aicrag)","04. Diamond Death","05. Tears Of A Nun","06. You Are Not What You See (feat. Ryan Shuck)","07. The Unholiest","08. Hallo Depression (feat. SWISS)","09. The Only Word You Know","10. On A Dreamless Night","11. Dear Time"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T18:22:10+00:00","original_url":"http://www.darkside.ru/news/184172/","saved_at":1790981928,"artists":[],"original_title":"CHRIS HARMS выпустит новый альбом зимой","topics":["releases"]},{"id":"de83704bf38d7ec7a201b59df6f9e156c91ebef9","title":"KYLE THOMAS завершил запись вокала для TROUBLE","short":"В недавнем интервью вокалист TROUBLE Kyle Thomas рассказал о ходе сочинения и записи материала для нового альбома: «Я сейчас записываю вокал [для нового альбома TROUBLE]. Весь свой вокал я записываю дома. Делаю я это так: мне присылают миксы песен, я загружаю их в сессию, записываю вокал и сохраняю всё обратно в файл, чтобы все могли послушать.","paragraphs":["В недавнем интервью вокалист TROUBLE Kyle Thomas рассказал о ходе сочинения и записи материала для нового альбома:","«Я сейчас записываю вокал [для нового альбома TROUBLE]. Весь свой вокал я записываю дома. Делаю я это так: мне присылают миксы песен, я загружаю их в сессию, записываю вокал и сохраняю всё обратно в файл, чтобы все могли послушать.","Обычно я работаю с тем, кто написал музыку к конкретной песне, будь то Rick [Wartell, гитарист TROUBLE] или Bruce [Franklin, гитарист TROUBLE], пока человек не будет доволен результатом. Я продолжаю отправлять им записи, и если они присылают их обратно со словами: „Слушай, попробуй так, попробуй эдак. Вот эта часть мне не нравится. А вот эта нравится\", то, когда они наконец довольны, я делюсь результатом со всеми остальными.","Кажется, на этом альбоме 10 или 11 песен, и я закончил примерно половину. Когда в конце октября я вернусь домой [из тура с EXHORDER], я останусь дома до конца года, так что буду стараться закончить оставшиеся пять песен или около того, наверное, до Дня благодарения, и тогда моя работа будет сделана.","Думаю, теперь в музыкальном плане нам остались только гитарные овердабы и, может быть, какие-то соло: так, мелкие штрихи, вишенка на торте. Так что всё выглядит неплохо»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T18:55:17+00:00","original_url":"http://www.darkside.ru/news/184183/","saved_at":1790981926,"artists":[],"original_title":"KYLE THOMAS завершил запись вокала для TROUBLE","topics":[]},{"id":"263e578852aac5fcd3e6795222313e636ff3383f","title":"Новое видео MISS MAY I","short":"Bury Me Down, новое видео группы MISS MAY I, доступно для просмотра ниже. Эта песня взята из альбома \"No Place For Me\", выходящего второго октября на Solid State Records: 01. Sanctuary","paragraphs":["Bury Me Down, новое видео группы MISS MAY I, доступно для просмотра ниже. Эта песня взята из альбома \"No Place For Me\", выходящего второго октября на Solid State Records:","01. Sanctuary","02. Portrait Of Pain","03. Hand Me A Halo","04. Pray e Coffin 05:03","7. King of Fallout 04:22","8. I Fuck for Beer 02:36"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T21:25:46+00:00","original_url":"http://www.darkside.ru/news/184200/","saved_at":1790981906,"artists":[{"id":"destruction","name":"Destruction"}],"original_title":"Новое видео METHANE","topics":["releases"]},{"id":"fe57935485125d96d11c9f2ed83d8328aef9276a","title":"Новое видео STEVEN WILSON","short":"Шестикратный номинант на «Грэмми», музыкант, автор песен и продюсер STEVEN WILSON выпустит девятый студийный альбом. «Requiem For A Village» на лейбле Fiction Records в пятницу, 6 ноября. Альбом будет доступен в широком спектре форматов: в цифровом виде, на CD, Blu-ray, в виде двух 140-граммовых 12-дюймовых пластинок чёрного винила, двух 12-дюймовых пластинок цвета «бычья…","paragraphs":["Шестикратный номинант на «Грэмми», музыкант, автор песен и продюсер STEVEN WILSON выпустит девятый студийный альбом. «Requiem For A Village» на лейбле Fiction Records в пятницу, 6 ноября. Альбом будет доступен в широком спектре форматов: в цифровом виде, на CD, Blu-ray, в виде двух 140-граммовых 12-дюймовых пластинок чёрного винила, двух 12-дюймовых пластинок цвета «бычья кровь», а также в бокс-сете с 2 CD и диском Blu-ray, упакованном в 96-страничную книгу в твёрдом переплёте.","Если восьмой альбом Steven'а Wilson'а, получивший признание критиков «The Overview» 2025 года, исследовал глубины, расстояния и запустение открытого космоса, то «Requiem For A Village» сужает фокус до крошечного, никому не известного уголка где-то за пределами карты на Британских островах — хаунтологического мира, полностью оторванного от современности, где в местной галерее висят картины Стэнли Спенсера, на полках публичной библиотеки стоят рассказы М. Р. Джеймса и Алджернона Блэквуда, а на рыночной площади играют «Дети камней». Отказавшись от искусственного интеллекта и корректирующих студийных технологий, Wilson выбрал нестандартный подход к записи, чтобы создать музыку, которая осознанно принимает и мрачное, и саму возможность ошибки, — обратившись вместо этого к живым инструментам, будь то безупречным или несовершенным, и принимая случайные огрехи, чтобы посмотреть, куда они приведут.","«Requiem For A Village» — интимный, амбициозный, богатый воображением и намеренно эксцентричный альбом — включает завораживающую закадровую партию, написанную легендарным Andy Partridge (XTC) и озвученную отмеченным наградами актёром David Tennant («Доктор Кто», «Бродчёрч», «Rivals»), при участии давнего соратника, мультиинструменталиста Randy McStine, барабанщика Russell Holzman и вокалистки Katherine Priddy.","Альбому предшествует премьера заглавного трека «Requiem For A Village» — сокрушительного нагромождения летящих барабанов, напористой басовой линии и скрежещущих гитар, которое превращается в нечто похожее на саундтрек к надвигающемуся апокалипсису; композиция уже доступна на всех цифровых площадках и в виде клипа Это первое в серии «Village Sessions», записанной и снятой с McStine и Holzman. Кроме того, ранее на этой неделе был представлен эксклюзивный отрывок из закадровой партии альбома, а также новая онлайн-платформа, стилизованная под традиционный сайт приходского совета вымышленной деревни, с отсылками к песням, текстам и пасхалками.","Steven Wilson: «Мне хотелось вернуться к такой музыке, в которой слышны, образно говоря, отпечатки пальцев.","Сделать акцент на человеческих жестах и несовершенствах в музыке — на том, что нельзя создать с помощью софта. Например, использовать только аналоговые синтезаторы со всей их непредсказуемостью или играть на инструментах, которые звучат не идеально точно в строй.","Но именно это привело к тому, что я взялся за скрипку, гобой или попробовал сыграть на барабанах — вещи, играть на которых я толком не умею, но при этом извлёк из них нечто, вдохновившее меня неожиданным образом. Подойти к музыке с чувством наивности и посмотреть, куда это приведёт. И это привело меня в деревню».","Wilson представит «Requiem For A Village» на специальном диджей-сете в лондонском клубе The Social (5 Little Portland Street, London, W1W 7JD) во вторник, 22 сентября. Сет под названием «Songs From The Village» станет своего рода введением в музыку, вдохновившую альбом, — от туманной инаковости BOARDS OF CANADA и DEMDIKE STARE, завороженных раг THIRD EAR BAND до тягучего саспенса, характерного для британского детского телевидения и других эфиров 70-х. Все средства будут направлены в пользу Here 2 Belong — британской благотворительной организации, поддерживающей молодых людей с опытом пребывания под опекой государства в процессе перехода к независимой или частично независимой жизни.","В следующем месяце Wilson выступит с двумя аншлаговыми концертами в лондонском Royal Albert Hall, которые пройдут 28–29 октября. Это будет уже седьмое выступление музыканта на этой исторической площадке — в программе прозвучат ранее не звучавшие оркестровые аранжировки «The Overview» и другие композиции, подготовленные специально для этих шоу, в сопровождении его группы, оркестра Parallax Orchestra и хора SANSARA под управлением Тома Ричардса.","Дополнительные концертные даты будут объявлены позднее.","Трек-лист:","01. Swirl In A Lark's Eye","02. Requiem For A Village","03. The Same River Twice","04. Now Departing","05. Hiraeth","06. On Chapel Slope","07. Murmuration","08. Curcus Fingerprint","09. A Basket Of Bees","10. Great Green Map","11. Wheel","12. The Old God Is Buried"],"category":"Прогрессив","source":"Darkside","published":"2026-10-02T21:59:57+00:00","original_url":"http://www.darkside.ru/news/184195/","saved_at":1790981904,"artists":[{"id":"steven-wilson","name":"Steven Wilson"}],"original_title":"Новое видео STEVEN WILSON","topics":["releases"]},{"id":"d180bdfd3a1ae791aa1bb01353194b643a8c2a6b","title":"Новое видео PATRIARCHS IN BLACK","short":"No More Blood, новое видео PATRIARCHS IN BLACK, доступно для просмотра. Этот трек взят из нового альбома \"To Serve Man\", релиз которого намечен на восьм ed_at":1790949940,"artists":[],"original_title":"Новое видео FEUERSCHWANZ x IN EXTREMO","topics":["releases"]},{"id":"c1c2e400c280bed9fbbf0444523072822c6154d0","title":"Новое видео FIRTAN","short":"Shadows of a Dawn Unborn feat. Christian of Vinsta новое видео FIRTAN, доступно для просмотра. Этот трек взят из нового альбома \"Helios\", релиз которого намечен на второе октября: 1. Himsa","paragraphs":["Shadows of a Dawn Unborn feat. Christian of Vinsta новое видео FIRTAN, доступно для просмотра. Этот трек взят из нового альбома \"Helios\", релиз которого намечен на второе октября:","1. Himsa","2. Kalikas Tongue","3. Ambrosia","4. Solis currus","5. Ascension","6. Wide Open Eye","7. Helios","8. The Form Revealed","9. Revealing Prana","10. The Hierophant Way","11. Shadows of a Dawn Unborn"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T12:53:15+00:00","original_url":"http://www.darkside.ru/news/184180/","saved_at":1790949936,"artists":[],"original_title":"Новое видео FIRTAN","topics":["releases"]},{"id":"98615d0bdbcdac2115c00dd8cfdb8590188ae8ba","title":"ALICE COOPER: «Не хочу я на пенсию, чего вы пристали!?»","short":"ALICE COOPER в недавнем интервью вновь ответил на вопрос о том, собирается ли он на пенсию: «Конечно, Alice — вымышленный персонаж, поэтому у него нет возраста. Я не знаю, сколько лет Alice, но на сцене ему столько же, сколько было в 1973 году.","paragraphs":["ALICE COOPER в недавнем интервью вновь ответил на вопрос о том, собирается ли он на пенсию:","«Конечно, Alice — вымышленный персонаж, поэтому у него нет возраста. Я не знаю, сколько лет Alice, но на сцене ему столько же, сколько было в 1973 году. И… и если я когда-нибудь изменюсь внешне, если когда-нибудь наберу 100 фунтов, я никогда не буду играть Alice. Если я не смогу выступать с той же энергией, что и тогда, — то же самое. Я никогда не буду играть на автопилоте, потому что тогда это уже не будет Alice. Я уж точно не буду выступать на круизном лайнере, исполняя \"Мне 18. И я не...\" А будет так: \"Мне 80, и я не могу найти свои туфли\".","Современные рок-н-ролльщики — Пол Маккартни, THE [ROLLING] STONES, Род Стюарт — мы посвятили этому всю жизнь. И мы будем этим заниматься, пока сможем, потому что я не могу придумать лучшей работы»."],"category":"Хард-рок","source":"Darkside","published":"2026-10-02T13:35:49+00:00","original_url":"http://www.darkside.ru/news/184188/","saved_at":1790949931,"artists":[{"id":"alice-cooper","name":"Alice Cooper"}],"original_title":"ALICE COOPER: «Не хочу я на пенсию, чего вы пристали!?»","topics":[]},{"id":"e22650fc56b675b7e77d06fb546d9eaa45de04ab","title":"BATTLE BEAST не рассматривали никого, кроме MARINA LA TORRACA","short":"В интервью SDTV – Stonedead Festival басист и один из основателей BATTLE BEAST Eero Sipilä и новая вокалистка Marina La Torraca рассказали о недавнем уходе Noora'ы Louhimo, которую как раз и заменила La Torraca. Отвечая на вопрос, каково это — прийти в группу и вносить в неё что-то своё, Marina сказала: «Это большая честь.","paragraphs":["В интервью SDTV – Stonedead Festival басист и один из основателей BATTLE BEAST Eero Sipilä и новая вокалистка Marina La Torraca рассказали о недавнем уходе Noora'ы Louhimo, которую как раз и заменила La Torraca. Отвечая на вопрос, каково это — прийти в группу и вносить в неё что-то своё, Marina сказала:","«Это большая честь. Это первое, что я хочу сказать. Я невероятно польщена. Чувства смешанные, потому что мы очень много работали и играли весь летний сезон. А летний сезон всегда тяжелее обычного тура. Мы как раз об этом говорили: бесконечные переезды, порой почти нет времени на сон, и ты играешь два шоу подряд, не поспав между ними.","А меня с самого начала бросили в львиную яму. Сначала был азиатский тур [в марте], потом небольшой перерыв, который на самом деле перерывом не был. Мы уже репетировали к этому и занимались другими делами. У ребят тоже было очень много забот, потому что всё произошло стремительно: сначала Noora ушла из группы, потом пришла я. И было просто: „Так, вперёд, вперёд, вперёд\"».","Говоря о том, как Marina выбрали новой вокалисткой BATTLE BEAST, Eero рассказал:","«Нам пришлось соображать на ходу, когда в конце прошлого лета Noora объявила, что уходит. Мы такие: „О, чёрт. О, чёрт. О, чёрт. Нам срочно нужна новая вокалистка\". Шоу у нас были уже расписаны. А я какое-то время был в ступоре. Думал: „Ох, я не знаю, что делать\".","К счастью, Joona [Björkroth], наш соло-гитарист, мгновенно взял всё в свои руки и начал работать как часы, подыскивая новых вокалисток. И, в конечном итоге, никакого короткого списка у нас не было, как и разных запасных планов. Мы просто сказали: „Вот Marina. Звучит она отлично. Выглядит замечательно. Давайте спросим её. Посмотрим, что она ответит\". Остальное уже история.","Никакого списка не было. Никакого списка. У нас была только Marina. Она была единственной, кого мы рассматривали, и единственной, кого мы спросили. Теперь я рад, что всё сложилось именно так, потому что будь у нас больше времени на раздумья и сомнения, всё могло бы пойти гораздо хуже: начни ты сомневаться в себе — „А она точно идеальный вариант?\" Но нам и правда пришлось действовать по обстоятельствам».","Marina вставила свои пару центов:","«Да, потому что в таких вопросах никогда не знаешь наверняка. Правда, никогда. И потом, когда ты выписываешь на бумаге качества одного человека и другого, получается: „Что мне с этим делать? Вот у этого такой вокал, у того такой характер…\" А теперь, когда я узнала этих ребят, я могу это понять чуть лучше.","Это было интуитивное коллективное решение, и вы просто сказали: „Ладно, давайте остановимся на этом\". Это не был кастинг, не было сложного отбора. Я ведь работала в музыкальном театре и знаю, что такое месяцы прослушиваний, когда ты переходишь на следующий этап, потом на следующий, и всё такое. Я там бывала. Поэтому я, честно говоря, ожидала чего-то подобного. Думала: „О, это будет как процесс прослушивания\". Но нет».","Eero добавил:","«Да, но иногда реально нужно с верой прыгнуть в омут и для нас это была именно такая ситуация. Других вариантов не было. Мы не можем уйти на двухлетний перерыв, а потом тихонько начать искать людей. Нам просто нужно было сказать: „Надо двигаться прямо сейчас. Давайте возьмём её\"».","Marina также рассказала о планах BATTLE BEAST на новую музыку с её участием:","«Если честно, мы просто проводим большой эксперимент. Мы начнём сразу после окончания летнего сезона. Посмотрим, что у нас получится, потому что BATTLE BEAST, насколько я слышала, всегда писали именно так. У них нет формулы. Они чувствуют, а потом пишут то, что хотят, во что верят. Вроде: „Вот это хорошо\".","Так что попробуем прийти к этому. Пока то, что мы делаем, хорошо, меня даже не особенно волнует, мой это почерк или моя подпись. Дело не в этом. Скорее: „Давайте посмотрим, что мы можем создать вместе, и сделаем это хорошо\"»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T14:31:25+00:00","original_url":"http://www.darkside.ru/news/184078/","saved_at":1790949925,"artists":[],"original_title":"BATTLE BEAST не рассматривали никого, кроме MARINA LA TORRACA","topics":[]},{"id":"57fa4d5bba31e665ecf69534c7dac86b9996ce69","title":"Новое видео YNGWIE MALMSTEEN","short":"\"Beyond Zeta Reticuli\", новое видео группы YNGWIE MALMSTEEN, доступно для просмотра ниже. Эта песня взята из альбома \"Hell Or High Water\", выходящего 13 ноября на Music Theories Recordings/Artone Label Group: 01. Now Or Never","paragraphs":["\"Beyond Zeta Reticuli\", новое видео группы YNGWIE MALMSTEEN, доступно для просмотра ниже. Эта песня взята из альбома \"Hell Or High Water\", выходящего 13 ноября на Music Theories Recordings/Artone Label Group:","01. Now Or Never","02. Am Caprice/Hell Or High Water","03. (He Is) Living A Lie","04. Antikythera","05. (On The) Battlefield","06. Beyond Zeta Reticuli","07. Prestissimo In Bm/Adagio","08. Eye For An Eye","09. Father","Malmsteen: «Вдохновлённый моим увлечением инопланетной жизнью, этот инструментал соединяет масштабные тяжёлые темы, сильные мелодии и замысловатый контрапункт: чистое неоклассическое пламя».","Когда мы думаем о величайших гитаристах всех времён, об избранных музыкантах, которые изобрели совершенно новый стиль и звук на инструменте, Malmsteen по праву стоит рядом с такими революционерами, как Jimi Hendrix, Jimmy Page и Edward Van Halen.","Девять треков, составивших его новейший триумф, были созданы тщательно и осознанно, вдали от отвлекающих факторов, тормозящих творческий процесс в наше время. Впервые он попробовал такой подход на «Parabellum» 2021 года, главным образом из-за состояния мира в тот период, и результаты оказались настолько сильными, что он решил сделать это своим методом работы на будущее.","«Когда я начинал записывать пластинки, я просто брал песни, которые у меня были под рукой,. Позже я втянулся в график: записать альбом, отыграть тур, потом писать следующий. Во время пандемии я понял, что лучше сосредоточиться полностью и без перерывов, поэтому остался дома и писал этот альбом восемь месяцев. У меня было готово около 80 или 90 треков, а потом мне пришлось решать, какие из них самые сильные».","Для человека, рождённого с даром создавать увертюры «из ниоткуда», наука сочинения песен это то, что трудно объяснить. Но так или иначе, он благодарен за обилие идей золотого стандарта, которые приходят к нему, из тех, что у других музыкантов отняли бы месяцы или даже годы на воплощение. Для Yngwie J. Malmsteen'а это просто то, для чего он был рождён.","«Даже без гитары в руках музыка просто приходит ко мне, — рассуждает Yngwie. — Это как в фильме „Амадей\". Моцарту музыка являлась в готовом виде. Я понимаю строительные блоки и потому могу построить вам что угодно.","Если вы попросите меня написать дэт-металл-песню, перезвоните через пять минут, и она будет готова. Хотите кантри-энд-вестерн или регги? Без проблем. Я могу дать вам всё, что захотите. Язык музыки прост. Есть определённые ноты, которые сочетаются друг с другом в любом стилистическом направлении и приятны на слух.","Идеи приходят не всегда, но когда приходят, это как лавина. Вещи, которые я выбираю для своих пластинок, словно подарки, которые я ловлю, потому что они меня поражают. В этом смысле мне очень повезло».","Ведущий сингл «Now Or Never» это идеальный шторм из риффов с приглушением ладонью, барочных контрмелодий, взмывающего вокала и умопомрачительной беглости. Если вам нужен Yngwie в двух словах, то это именно он, и схожее можно сказать о втором треке, инструментальном шедевре «Am Caprice/Hell Or High Water».","В «(On The) Battlefield» и «Eye For An Eye» звучат одни из сильнейших на сегодня вокальных партий певца и гитариста, а рядом с ними стоят поразительные инструментальные композиции «Antikythera» и «Beyond Zeta Reticuli», названные в честь важных научных прорывов и открытий.","«Hell Or High Water» это альбом, переполненный эмоциями со всех сторон, но заключительный трек «Father», несомненно, самый проникновенный из всех. Он написан в дань уважения отцу гитарной легенды, который ушёл из жизни в прошлом году.","«Он был удивительным человеком, — вспоминает Yngwie. — Я гордился тем, что он мой отец, и я любил его. Я хотел посвятить ему всё это, а этот конкретный трек написан для него. Я хотел, чтобы другие почувствовали то, что чувствовал я, когда слушают его.","Никколо Паганини однажды сказал: „Нужно сильно чувствовать, чтобы заставить чувствовать сильно других\". Одно дело быть печатной машинкой и совсем другое быть тем, кто пишет истории, способные трогать людей. В этом всегда и была суть».","Примечание: в тексте «Yngwie J. Malmsteen'а» я применил окончание, поскольку это имя живого музыканта. Никколо Паганини транслитерирован по-русски, так как он умерший музыкант (по вашему правилу). Название лейбла Music Theories Recordings/Artone Label Group оставлено в оригинале."],"category":"Хард-рок","source":"Darkside","published":"2026-10-02T15:27:37+00:00","original_url":"http://www.darkside.ru/news/184186/","saved_at":1790949924,"artists":[{"id":"van-halen","name":"Van Halen"}],"original_title":"Новое видео YNGWIE MALMSTEEN","topics":["releases"]},{"id":"3a7c11bd0849f2c5fcb79e99cf5b809cab275d3b","title":"Вокалист EXHORDER: «Нами интересуется очень и очень крупный лейбл»","short":"В новом интервью вокалист и гитарист EXHORDER Kyle Thomas рассказал о возможном продолжении четвёртого полноформатного альбома группы «Defectum Omnium», вышедшего в марте 2024 года на Nuclear Blast Records. 56-летний певец из Нового Орлеана, который также возглавляет легенд дум-металла TROUBLE, сказал: «Забавно получилось.","paragraphs":["В новом интервью вокалист и гитарист EXHORDER Kyle Thomas рассказал о возможном продолжении четвёртого полноформатного альбома группы «Defectum Omnium», вышедшего в марте 2024 года на Nuclear Blast Records. 56-летний певец из Нового Орлеана, который также возглавляет легенд дум-металла TROUBLE, сказал:","«Забавно получилось. Я давал интервью и упомянул в нём, что сейчас у нас нет контракта с лейблом. Потом эту историю подхватили, и заголовки были из серии — у нас нет лейбла. А мне показалось, что из-за этого мы выглядим так, будто никому не нужны, хотя это неправда.","На самом деле у нас сейчас есть очень крупный лейбл, который очень и очень активно за нами охотится. Просто мы не торопимся, потому что у нас хватает ресурсов, чтобы сделать всё самостоятельно, без лейбла, и мы рассматриваем такой вариант.","Но приятно знать, что есть хотя бы один известный лейбл, который нас хочет. Есть и ещё один, поменьше. Так что в подписании этой группы заинтересованы сразу несколько лейблов.","Вы же знаете, как это бывает. Большинство людей не читают статью. Они читают заголовок, а потом устраивают соревнование, кто напишет самый глупый комментарий на свете».","На вопрос, как изменился процесс сочинения музыки в EXHORDER по сравнению с тем, каким он был четыре десятилетия назад, Thomas ответил:","«Ну, процесс, безусловно, другой, потому что из тех составов остался только я, так что он, естественно, не мог не измениться. Но эволюция началась ещё до нынешнего состава.","Где-то в 1993 году, после [нашего второго альбома 1992 года] „The Law\", который получился настолько техничным, почти прогрессивным, мы решили, что больше не хотим быть такими. Поэтому план на следующий альбом, а мы собирались делать его в 1993-м, состоял в том, чтобы песни стали гораздо более структурными, чуть дальше от трэшевого звучания и ближе к груву, мелодиям и всему такому.","Так что когда вышел [альбом 2019 года] „Mourn The Southern Skies\", некоторые люди жаловались на резкую смену стиля. А мне хочется сказать: извините, ребята, но это должно было случиться ещё в 1993 году. Потому что таков и был план.","Мы никогда не были по-настоящему стопроцентной металл-группой. Мы никогда не были по-настоящему стопроцентной панк-группой. Мы никогда не были по-настоящему кем-то одним. Мы делали то, что хотели, и всегда делали то, что хотели, и это и есть наша настоящая традиция.","Конечно, было бы нелепо, если бы мы вдруг выдали регги-ритм. Это было бы глупо. Есть вещи, которые просто не хочется делать, потому что в них нет смысла. Но именно поэтому в некоторых композициях двух последних альбомов такие резкие стилистические различия. Потому что мы расширяемся.","Мне за пятьдесят. Я больше не злой молодой человек. Я уже не знаю, как думает злой молодой человек. Поэтому мне приходится искать новый способ мотивировать себя на сочинение материала.","И цель всегда одна: когда мы заканчиваем песни и прослушиваем их, нам нужно быть честными с собой и спросить: „Место ли этому на альбоме EXHORDER?\" Даже если стилистически вещь другая, звучит ли она всё равно как EXHORDER? Вот в чём главная хитрость. И за последние пять-семь лет, пока мы работаем над новым материалом, было несколько песен, о которых мы говорили: „Нет, давайте отложим эту для чего-нибудь другого, потому что она просто не вписывается\"»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T16:22:43+00:00","original_url":"http://www.darkside.ru/news/184187/","saved_at":1790949922,"artists":[],"original_title":"Вокалист EXHORDER: «Нами интересуется очень и очень крупный лейбл»","topics":[]},{"id":"56cd3e65b44df9dc38fd35595ae7ace3ebd62d34","title":"METALLICA отыграла первый концерт в Сфере","short":"Группа METALLICA выступлением первого октября открыла серию концертов в Sphere in Las Vegas, Nevada: 01. Battery","paragraphs":["Группа METALLICA выступлением первого октября открыла серию концертов в Sphere in Las Vegas, Nevada:","01. Battery","02. Creeping Death","03. Now That We're Dead","04. Sad But True","05. The Shortest Straw","06. Wherever I May Roam","07. The Day That Never Comes","08. ...And Justice For All","09. Kirk Hammett And Robert Trujillo Doodle","10. Nothing Else Matters","11. The Call Of Ktulu","12. Lux Æterna","13. Ride The Lightning","14. The Memory Remains","15. Seek \u0026 Destroy","16. Master Of Puppets"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T16:36:09+00:00","original_url":"http://www.darkside.ru/news/184194/","saved_at":1790949921,"artists":[{"id":"metallica","name":"Metallica"}],"original_title":"METALLICA отыграла первый концерт в Сфере","topics":["live"]},{"id":"04f389504614efd84f8673164c18f56671a7ce0a","title":"JEFF 'MANTAS' DUNN почтил память вокалиста VENOM","short":"Jeff \"Mantas\" Dunn отреагировал на известия о смерти Кроноса: «Позвольте поблагодарить всех вас за огромное количество слов признательности и соболезнований. Я считаю, что это вполне заслуженно.","paragraphs":["Jeff \"Mantas\" Dunn отреагировал на известия о смерти Кроноса:","«Позвольте поблагодарить всех вас за огромное количество слов признательности и соболезнований. Я считаю, что это вполне заслуженно.","«Я говорю от своего имени и от имени Abaddon [Antony Bray, первого барабанщика VENOM], с которым я сегодня разговаривал, когда говорю, что, несмотря на бурную историю этой группы, в конечном итоге именно мы трое начали нечто столь особенное и изменили направление, движение и историю металла в том виде, в каком мы его знаем.","Мы узнали об этом два дня назад, но, разумеется, без согласия и по желанию семьи Конрада мы не имели права никому ничего говорить и уважали это.","В такие моменты я вспоминаю ту дружбу, которая связывала нас в те ранние дни, тот дух „один за всех, все за одного“, ту бунтарскую сущность и абсолютное стремление быть чем-то совершенно иным — независимо от того, принимали нас или нет.","У меня до сих пор сохранилось много ранних видеозаписей, на которых мы втроем просто смеялись, порой без всякой причины, просто дурачась — наше чувство юмора было не для всех.","Я благодарю вас всех за бесчисленные сообщения, и, как я уже сказал, несмотря на всю историю, ссоры, оскорбления, взлеты и падения, а также дисфункциональный характер этой группы, это сильно бьет по мне.","Я свяжусь с вами завтра, друзья мои.","Покойся с миром, Конрад Кронос Лант»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T01:53:29+00:00","original_url":"http://www.darkside.ru/news/184185/","saved_at":1790926477,"artists":[{"id":"venom","name":"Venom"}],"original_title":"JEFF \u0026#039;MANTAS\u0026#039; DUNN почтил память вокалиста VENOM","topics":[]},{"id":"2b57b718b23703da38307e2bb12fdbf32406bdd7","title":"Новое видео COMEBACK KID","short":"Yesterday's Gone feat. Brendan Garrone, новое видео группы COMEBACK KID, доступно для просмотра ниже. Эта песня взята из альбома \"Chosen Hell\", выходящего шестого ноября на SharpTone Records в США и на Dine Alone Records в Канаде. Трек-лист:","paragraphs":["Yesterday's Gone feat. Brendan Garrone, новое видео группы COMEBACK KID, доступно для просмотра ниже. Эта песня взята из альбома \"Chosen Hell\", выходящего шестого ноября на SharpTone Records в США и на Dine Alone Records в Канаде.","Трек-лист:","01. Target On My Back","02. Vindication","03. Shedding Season (feat. SPIRITBOX's Courtney LaPlante)","04. Lost And Found","05. Underneath The Pressure","06. Chosen Hell","07. Yesterday's Gone (feat. INCENDIARY's Brendan Garrone)","08. Tunnel Vision","09. Becoming","10. Heartland Elegy","11. Too Late"],"category":"Прогрессив","source":"Darkside","published":"2026-10-02T05:32:42+00:00","original_url":"http://www.darkside.ru/news/183939/","saved_at":1790926456,"artists":[],"original_title":"Новое видео COMEBACK KID","topics":["releases"]},{"id":"feb2c8e6ea603f69413201605ef0487e994074df","title":"Новая песня FAKE NAMES","short":"\"If You Could See Me Today\", новое видео с текстом от группы FAKE NAMES, в состав которой входят Brian Baker (MINOR THREAT, DAG NASTY, BAD RELIGION), Michael Hampton (S.O.A., EMBRACE, THE FAITH), Dennis Lyxzén (REFUSED, INVSN), Johnny Temple (GIRLS AGAINST BOYS, SOULSIDE) и Mario Rubalcaba (ROCKET FROM THE CRYPT, OFF!), доступно для просмотра ниже.","paragraphs":["\"If You Could See Me Today\", новое видео с текстом от группы FAKE NAMES, в состав которой входят Brian Baker (MINOR THREAT, DAG NASTY, BAD RELIGION), Michael Hampton (S.O.A., EMBRACE, THE FAITH), Dennis Lyxzén (REFUSED, INVSN), Johnny Temple (GIRLS AGAINST BOYS, SOULSIDE) и Mario Rubalcaba (ROCKET FROM THE CRYPT, OFF!), доступно для просмотра ниже. Эта песня взята из альбома \"Punk Ruins\", выходящего 23 октября на Epitaph.","«Мы записали двенадцать песен за пять дней, и все они вошли в альбом», — объясняет Baker, добавляя, что Lyxzén записал свой вокал за один день.","«Одно из преимуществ того, что мы все работаем дома, — это то, что у нас есть достаточно времени, чтобы обдумать, что именно мы собираемся делать», — добавляет Baker, когда его спрашивают, как группе удалось создать столь целостный альбом за время, которое некоторые другие коллективы тратят исключительно на предпродакшн.","«Я знаю, каким будет гитарное соло, потому что я уже сыграл его дома и отправил Michael'y , чтобы он его доработал. Это не так сложно, как кажется.","Этот альбом — результат коллективного творчества, и большая часть удовольствия заключается в том, чтобы посмотреть, как, черт возьми, он в итоге получится», — объясняет Brian, добавляя, что мастерство других музыкантов помогло преобразовать его первоначальные идеи и идеи Hampton'а в нечто, намного превосходящее их ожидания. Такие треки, как «Diamond Buzz», создают гипнотический грув, в то время как заглавный трек демонстрирует несомненный хардкор-саунд, на котором где Lyxzén поёт на полную мощность, усиливая и без того острые как бритва хуки песни.","Трек-лист:","01. Until It's Normal","02. Good Old Days","03. Punk Ruins","04. Cover The Distance","05. What I Tell Myself","06. Diamond Buzz","07. Language Lost","08. Beautiful Scars","09. If You Could See Me Today","10. The Little Wonders","11. Scream","12. Paradise"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T06:55:14+00:00","original_url":"http://www.darkside.ru/news/184158/","saved_at":1790926453,"artists":[],"original_title":"Новая песня FAKE NAMES","topics":["releases"]},{"id":"eb4dba4ee424aff5ab8df29943019c0a0645cb34","title":"ANTHRAX не думают о пенсии","short":"Во время визита в программу «Trunk Nation With Eddie Trunk» участники ANTHRAX подтвердили, что не планируют уходить на покой, однако недавно вышедший альбом «Cursum Perficio», первый за десять лет, вполне может оказаться их последним полноформатным релизом.","paragraphs":["Во время визита в программу «Trunk Nation With Eddie Trunk» участники ANTHRAX подтвердили, что не планируют уходить на покой, однако недавно вышедший альбом «Cursum Perficio», первый за десять лет, вполне может оказаться их последним полноформатным релизом. Когда ведущий спросил, есть ли у ANTHRAX планы подвести черту в обозримом будущем, гитарист Scott Ian ответил:","«Вы не думаете, что если бы такой был план, мы бы разыграли эту карту, как столько других групп, и заявили: „Вот и всё. Смотрите, это написано прямо в названии альбома. Наш путь окончен, так что лучше купите эту пластинку и лучше идите покупать билеты. Мы будем только гастролировать и займёмся этим ещё лет пять\".","А потом придумали бы отговорку: „Ну, мы говорили, что путь окончен, но на самом деле он окончен лишь отчасти. Так что теперь мы записываем ещё один альбом\"».","Коснувшись того, что множество других хард-рок- и хеви-металл-групп в последние годы объявляли о прощальных турах, но потом передумывали и возвращались к концертам, барабанщик ANTHRAX Charlie Benante сказал:","«Когда ты достигаешь определённого уровня, у тебя появляются менеджеры и агенты, которые говорят: „Слушайте, на вас всё ещё есть спрос\". Потом они разговаривают с каким-нибудь промоутером, и тот отвечает: „Я не против, если он согласится\". И всё начинает складываться в: „Ладно, давайте сделаем это снова\".","Как тут остановиться? Сколько лет мы уже в это вложили? Сорок с лишним. Ты построил магазин. Зачем его закрывать?»","Scott добавил:","«Вы знаете эту фразу, которую все слышат, она постоянно звучит. Это одна из тех главных фраз, которые слышишь снова и снова: „Ты же понимаешь, что пролетаешь мимо кучи денег\". Вот это и слышишь постоянно.","Я сейчас не про нас, потому что мы не говорили, что уходим на покой. Но я слышу про другие группы, которые объявляли о завершении карьеры, а потом возвращались, и всегда звучит одно и то же: „Ну, можно ж столько бабла поднять!\" [Смеётся]»"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T07:53:02+00:00","original_url":"http://www.darkside.ru/news/184154/","saved_at":1790926439,"artists":[{"id":"anthrax","name":"Anthrax"}],"original_title":"ANTHRAX не думают о пенсии","topics":[]},{"id":"40ae4c62e25c005508e50f6b1eb77ebcf4a9f1ef","title":"I AM YOUR GOD исполняют SENTENCED","short":"I AM YOUR GOD представили собственное прочтение композиции SENTENCED Farewell","paragraphs":["I AM YOUR GOD представили собственное прочтение композиции SENTENCED Farewell"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T08:58:19+00:00","original_url":"http://www.darkside.ru/news/184164/","saved_at":1790926438,"artists":[],"original_title":"I AM YOUR GOD исполняют SENTENCED","topics":[]},{"id":"dcc6e77f66e82d2fe5c2fdbfcfceb0f31bd2c8ff","title":"Новое видео FROZEN CROWN","short":"Iris (Goo Goo Dolls cover), новое видео FROZEN CROWN, доступно для просмотра ниже. Этот трек взят из нового альбома The Legend of the Six Kings, релиз которого намечен на второе октября на Napalm Records: 1. Lightning in the Sky","paragraphs":["Iris (Goo Goo Dolls cover), новое видео FROZEN CROWN, доступно для просмотра ниже. Этот трек взят из нового альбома The Legend of the Six Kings, релиз которого намечен на второе октября на Napalm Records:","1. Lightning in the Sky","2. Who Wants to Burn in Heaven","3. Reborn","4. The One 03:13","5. Iris (Goo Goo Dolls cover)","6. Winter Hearts","7. River of Time","8. Through the Fire","9. To the Stars","10. The Legend of the Six Kings"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T09:54:01+00:00","original_url":"http://www.darkside.ru/news/184179/","saved_at":1790926436,"artists":[],"original_title":"Новое видео FROZEN CROWN","topics":["releases"]},{"id":"a2eca72dfedde75b3fb4e85cbf20243bb7ac00bd","title":"Фестиваль Тома Морелло «Power To The People» покажут в бесплатной прямой трансляции","short":"Фестиваль «Power To The People», который состоится в эти выходные, будут транслировать в интернете через MS NOW (бывший MSNBC) и YouTube. Трансляция начнётся в субботу, 3 октября. В размещённом в оригинале видео можно посмотреть время начала для своего часового пояса.","paragraphs":["Фестиваль «Power To The People», который состоится в эти выходные, будут транслировать в интернете через MS NOW (бывший MSNBC) и YouTube. Трансляция начнётся в субботу, 3 октября. В размещённом в оригинале видео можно посмотреть время начала для своего часового пояса. Фестиваль, заявленный как «внепартийный праздник мира, справедливости, солидарности, музыки и общественной активности», организован при участии гитариста Rage Against The Machine Тома Морелло. Он пройдёт в Merriweather Po
