<script id="articlesSeed" type="application/json">{"articles":[{"id":"485ba0ee4472ccdd59f3b9bc8698d90fc4e4e8e6","title":"Alienist Welcome New Guitarist/Vocalist Jacob Churchward With “Phantom” Music Video","short":"Australian metalcore band Alienist have officially welcomed clean vocalist/guitarist Jacob Churchward to their lineup with their newly released track “ Phantom “. A music video for that track was shot and has newly debuted online below via UNFD .","paragraphs":["Australian metalcore band Alienist have officially welcomed clean vocalist/guitarist Jacob Churchward to their lineup with their newly released track “ Phantom “. A music video for that track was shot and has newly debuted online below via UNFD ."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T20:42:51+00:00","original_url":"https://www.theprp.com/2026/10/02/news/alienist-welcome-new-guitarist-vocalist-jacob-churchward-with-phantom-music-video/","saved_at":1790992087,"translation_pending":true,"artists":[],"original_title":"Alienist Welcome New Guitarist/Vocalist Jacob Churchward With “Phantom” Music Video","topics":["releases"]},{"id":"8045d9037be0a86e012e32bb63aaaf2444517842","title":"The Sword \u0026 Zombi Members Unite In New Doom Metal Project Autumn Tomb","short":"Autumn Tomb is the name of a new doom metal trio uniting members of The Sword and Zombi . This latest collab between members of those two outfits finds Zombi ‘s Steve Moore uniting with The Sword ‘s bassist/keyboardist Bryan Richie and drummer Santiago “Jimmy” Vela III .","paragraphs":["Autumn Tomb is the name of a new doom metal trio uniting members of The Sword and Zombi . This latest collab between members of those two outfits finds Zombi ‘s Steve Moore uniting with The Sword ‘s bassist/keyboardist Bryan Richie and drummer Santiago “Jimmy” Vela III . A self-titled debut will be touching down on November 06th through Spaceflight Records . Moore initiated this project back in 2024, with this forthcoming bow having been tracked at his Nightmare City studio in Albany, NY.","Moore said of the project:","“I’ve been a fan of metal since the late 80’s and have wanted to put together a group like this for a while. What really lit the fire for me though was in 2022 when Zombi toured supporting The Sword , and then a few months later supporting Om . Kinda rekindled my love of heavy music.”","Vela added:","“When the opportunity arose to work on a new heavy music project with Steve Moore, it was a no-brainer for me. I’ve been a long time admirer of Zombi as well as Steve ‘s solo work for many years before I knew him. I have known Bryan since I was a teen, going back to the early 00’s coming up in the Austin music scene and have been lucky enough to rock along side of him since 2011 with The Sword .”","Richie went on to say:","“I was captivated from the first note of the demos Steve sent us! I am honored to put my sonic fingerprints on these amazing tracks and it was a privilege to be able to work with my long time friend and musical collaborator Santiago Vela .”","You can pre-order the record now through Bandcamp , with a stream of the lead track “ Crumbling Thrones ” having arrived today, October 02nd."],"category":"Хэви-метал","source":"ThePRP","published":"2026-10-02T21:03:33+00:00","original_url":"https://www.theprp.com/2026/10/02/news/the-sword-zombi-members-unite-in-new-doom-metal-project-autumn-tomb/","saved_at":1790992086,"translation_pending":true,"artists":[],"original_title":"The Sword \u0026 Zombi Members Unite In New Doom Metal Project Autumn Tomb","topics":[]},{"id":"b16517caf98ac279afc0ade03f6c7bfde1fa9fa5","title":"SLAM BAND (Filth, Etc.) Announce Their Full-Length Debut “THE ALBUM”","short":"Satirical slam outfit SLAM BAND will have their debut full-length “ THE ALBUM ” out on October 30th. 12 songs are scheduled to appear on that effort, with pre-orders for physical formats now available through slamband.bigcartel.com .","paragraphs":["Satirical slam outfit SLAM BAND will have their debut full-length “ THE ALBUM ” out on October 30th. 12 songs are scheduled to appear on that effort, with pre-orders for physical formats now available through slamband.bigcartel.com . The project unites members of Filth with Zack Dufort of Serpents Breath and have thus far released a string of colorful singles, including some infamous flatulence ."],"category":"Экстремальный метал","source":"ThePRP","published":"2026-10-02T21:37:18+00:00","original_url":"https://www.theprp.com/2026/10/02/news/slam-band-filth-etc-announce-their-full-length-debut-the-album/","saved_at":1790992083,"translation_pending":true,"artists":[],"original_title":"SLAM BAND (Filth, Etc.) Announce Their Full-Length Debut “THE ALBUM”","topics":["releases"]},{"id":"05b62e362d3744d4fe7810011b91b5300463fe5c","title":"KID ROCK целый альбом славит ИИсуса","short":"Kid Rock выпустит новый христианский альбом «Halfway To Jesus» 17 октября. Официальный клип на первый сингл с пластинки, «James 1:17 (Jesus Is King)», можно посмотреть ниже. Ролик снят в Honky Tonk Kid'а Rock'а в Нэшвилле и посвящён давнему клавишнику Kid'а Rock'а, Jimmie'у Bones'у, у которого в 2024 году диагностировали БАС.","paragraphs":["Kid Rock выпустит новый христианский альбом «Halfway To Jesus» 17 октября. Официальный клип на первый сингл с пластинки, «James 1:17 (Jesus Is King)», можно посмотреть ниже. Ролик снят в Honky Tonk Kid'а Rock'а в Нэшвилле и посвящён давнему клавишнику Kid'а Rock'а, Jimmie'у Bones'у, у которого в 2024 году диагностировали БАС. Видео также посвящено Калвину Линчу, поклоннику Kid'а Rock'а с неоперабельной опухолью мозга, чьим желанием, загаданным через Make-A-Wish, было поиграть на барабанах вместе с Kid'ом Rock'ом.","На «Halfway To Jesus» вошли 17 песен, среди них «7 Sins», где в качестве гостя выступил Eminem, и «Halfway 2 Jesus», в записи которой приняли участие кантри-певцы Gary LeVox (RASCAL FLATTS) и Jimmie Allen.","Ранее Eminem уже появлялся на альбоме Kid'а Rock'а 1998 года «Devil Without A Cause», в треке «Fuck Off». Позже Kid Rock снялся в клипе на сингл Eminem'а 2013 года «Berzerk».","«Я горжусь гостями, которые присоединились ко мне, особенно своим старым другом Eminem'ом, — написал Kid Rock во вступительном слове к «Halfway To Jesus». — В его куплете говорится о том, что мы обсуждали и что действительно нужно услышать: мы расходимся во взглядах на политику и другие вещи, но остались друзьями, несмотря на всё это.","Мы надеемся, что это послужит примером для людей, которые потеряли друзей или перестали разговаривать с семьёй из-за того, что те думают иначе», — добавил он.","В августе Kid Rock рассказал в программе «Fox \u0026 Friends» о том, что вдохновило его на создание христианского альбома:","«Я вырос католиком и ходил в католическую церковь, и мне всегда хотелось признаться: это скучно. Эта музыка ужасна. Я ходил в баптистские церкви и внеконфессиональные в поисках той музыки, которую хотел услышать, и там есть хорошие вещи, но в них всегда было немного мрачности. Поэтому я решил написать песни, с которыми мне самому хотелось бы славить Иисуса и выражать свою веру: это рок-н-ролл, кантри и хип-хоп».","На официальном сайте Kid'а Rock'а сейчас продаётся целый ряд товаров, связанных с «Halfway To Jesus»: футболки, куртки и кепки на религиозную тематику, автомобильные номерные знаки, рамка для номерного знака, солнцезащитные очки, свеча, «фляга со святой водой», «тайник», стилизованный под Библию, молитвенный дневник и золотое нательное украшение в виде креста.","«Halfway To Jesus» станет первым новым альбомом Kid'а Rock'а со времён «Bad Reputation» 2022 года, который на пике занял лишь 124-е место после выхода и через неделю вылетел из чарта, став самым провальным студийным альбомом в его карьере.","Американский кантри-рокер, настоящее имя которого Bob Ritchie, открыто поддерживает президента США Дональда Трампа, выступал на музыкальных мероприятиях, связанных с Республиканской партией, сидел рядом с Трампом на футбольных матчах и получал приглашения в Белый дом.","В феврале этого года Kid Rock возглавил альтернативное шоу в перерыве матча под названием «The All-American Halftime Show», организованное консервативной организацией Turning Point USA в то же время, когда Bad Bunny выступал на сцене шоу в перерыве Супербоула.","Трек-лист:","01. Freedom","02. James 1:17 (Jesus Is King)","03. 7 Sins (featuring Eminem)","04. Why Don't You Look Into Jesus","05. Water Into Wine","06. Halfway 2 Jesus (featuring Gary LeVox and Jimmie Allen)","07. I Don't Drink The Whiskey Anymore","08. Me And Jesus","09. God Is Good (Prelude)","10. God Is Good","11. Into The Setting Sun","12. Broken Hearted People","13. 'Til You Can't","14. Why Don't You Look Into Jesus (Riri Mix)","15. High Road","16. Procession","17. God Bless The USA"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T22:34:16+00:00","original_url":"http://www.darkside.ru/news/184193/","saved_at":1790992082,"artists":[{"id":"eminem","name":"Eminem"},{"id":"kid-rock","name":"Kid Rock"}],"original_title":"KID ROCK целый альбом славит ИИсуса","topics":["releases"]},{"id":"f882027e49d664eec85c21488b861d7e01b01b88","title":"Noel Gallagher's track-by-track guide to Oasis' (What's the Story) Morning Glory?","short":"(What's the Story) Morning Glory? , Oasis ' 1995 follow-up to their debut album Definitely Maybe was recorded in just 12 working days, and went on to sell over 22 million copies, turning the Manchester indie rock band into global superstars.","paragraphs":["(What's the Story) Morning Glory? , Oasis ' 1995 follow-up to their debut album Definitely Maybe was recorded in just 12 working days, and went on to sell over 22 million copies, turning the Manchester indie rock band into global superstars. \"We're not exactly short on self-belief, but it is much better than the last one,\" Noel Gallagher promised to NME three months ahead of the album's October 2, 1995 release. \"Everyone who's heard it says that as well, and I don't think it's just arse licking.\"","Bigger certainly. Better? Hmmm, that's a matter of opinion. But here's Noel Gallagher thoughts on every song on his band's best-loved record.","\"I'll be told by someone in the States next year the meaning of the song Hello , which to me hasn't got no meaning,\" Noel Gallagher told Alternative Press magazine ahead of the release of his band's second album. \"It's just words strung together.\" \"The lyrics are ' We live in the shadows/We had the chance and we threw it away/And it's never gonna be the same',\" Oasis' songwriter quoted to Select magazine. \" It's just saying, Well, it's never gonna be the same for us anymore, I s'pose. If Definitely Maybe was about dreaming about being in a band, this one's about actually being in a band. So it's like, Hello, it's good to be back – back making records.\" Famously, the opening song on What's The Story ... carries a co-writing credit for glam rock star-turned-convicted paedophile Gary Glitter, as on an early take of the song, Noel Gallagher spontaneously sang a lyric from Glitter’s 1973 single Hello, Hello, I'm Back Again during its outro, which apparently caused much amusement in the studio.","\"[Producer] Mark Coyle said, 'You're not going to have that bit in the fucking song: it's Gary Glitter!'\" Gallagher recalled on a 2021 episode of the Matt Morgan Podscast. \"And I said, No, no, no, I'm gonna write something else, but I'll put that in for now. And I could never come up with anything for it. And I just went, Fuck it, because we were high in the studio.\"","When Noel Gallagher gave NME a song-by-song breakdown of Oasis' second album ahead of its release he bluntly declared that Roll With It is \"about fuck all\". Gallagher offered a little more insight when talking Select magazine through every song on the record. \"It's just a typical fuckin' Oasis thing,\" he explained. \"Shut up moanin' and fuckin' get on with it. You've gotta say what you say, and be who you be. It's the same sentiments as there is in nearly every song we do. Y'know, Supersonic – ' You've gotta be yourself. ..' It starts to get a bit boring (laughs), but those are the lyrics I feel comfortable with.","\"We got a lot of criticism for putting it out as a single,\" he admitted. \"It's not the greatest song in the world, it's not even the greatest Oasis song.\" Asked by Select if the song was written about his younger brother Liam, Gallagher replied, \"Is it fuck!\"","\"It's about my girlfriend, Meg Matthews,\" Noel told NME in September'95. \"She had a company which folded, and she was feeling a bit sorry for herself. The sentiment is that there was no point in her feeling down, she has to sort my life out for me, because I'm in bits half the time.\"","\"Its original title was Wishing Stone ,\" he revealed in another interview. \"We played the Cathouse in Glasgow, I met some girl and we went back to my hotel room and she had this stone in her pocket that she insisted I had... I thought it was a great title and the song came out of that. It was called Wishing Stone for ages until we were listening to Wonderwall Music by George Harrison and it was like, Brilliant, I’ve got a Beatles connection.\" \"When we were first playing it, our Liam said he thought it was shit,\" the guitarist told Select , gleefully mocking his brother. \"We were doing the backing track and our Liam goes, 'I'm not singing on that, it's fuckin' stupid, man, it's fuckin' reggae music...' So I said, Why don't you go off to the chippie then, and we'll see you in a bit, eh? Now that he's sang on it, of course, it's the greatest song ever written.\"","\"It's about not being upset about the things you might have said or done yesterday,\" Noel told NME 's Andy Richardson. \"It's about looking forward rather than looking back. I hate people who look back on the past or talk about what might have been.\"","Gallagher performed the song for the first time at Oasis' first ever arena headline show, at the 12,000-capacity Sheffield Arena (now the Utilita Arena Sheffield) on April 22, 1995, having written the basic chord structure in Paris just 48 hours earlier, ahead of his band's gig at the Bataclan club. On the afternoon of the gig in Sheffield, the song was still lacking a chorus, but while Noel was strumming the chords during the band's soundcheck, his younger brother inadvertently inspired what would become its iconic refrain. \"Liam come up and said, 'Who's Sally?' Noel recalled in his commentary for the Oasis videos compilation Oasis: Time Flies 1994-2009 . \"And I was like, What the fuck are you talking about? And he said, 'Is that what you're singing? So Sally can wait?' And I was like, No, it isn't. But it fucking is now, nice one.\"","\"Someone came up to me at an Ian Brown gig once and asked me, 'Was Sally, the girl in question, actually Sally Cinnamon from the Stone Roses song?', which I thought was fucking brilliant. She'd obviously sat down and worked this out, and I didn't want to spoil it for her, so I said, Yes, it is Sally Cinnamon . Which it's not, really.\" And Noel's memory of the song's iconic video? \"Bag of shite. A waste of an afternoon.\"","\"One of the best songs I've ever written, and one of the simplest,\" Gallagher declared in 1995. \"It's a cross between I Wanna Be Adored by The [Stone] Roses and summat Neil Young might've done when he was better than he is now.\"","The song's lyrics, he said, are \"about being in a group\". \"There's no regret in there,\" he insisted to Select , \"definitely no regret. But Definitely Maybe was a very 'up' album, because we were dreaming of what was gonna come our way... This is about looking back and going, Well, we've got where we wanted to be, but it's been fucking hard work... it's not been as big a laugh as we thought it'd be.\"","Originally called The Jam , this short instrumental features Paul Weller on harmonica, and lead guitar. \"It's only about 40-odd seconds, but I think the full version will come out eventually\" Gallagher predicted. And it did, on the B-side of the Wonderwall single.","\"We'd just signed and I was living in a bedsit in Manchester,\" Gallagher told Uncut in 2006. \"[Creation records boss] Alan McGee would phone up on like a Wednesday, 'Alright, we're having a party in the office, come down.' If somebody's got their own record label and they're having a party 'cos its Wednesday, that's where I fucking need to be. So I come down to London with a guitar, jeans, trainers - not even a toothbrush - and had a fucking brilliant time. The offices were out in Hackney and he sent the staff round the pub to come back with a tray of Jack Daniel's and cokes, it was like: Fucking hell man, no way am I going back to Manchester, I can't live there any more. I finished with me bird, moved down, and I remember just writing this song, I think I was off my head on drugs.\"","\"It's psychedelia-meets-social comment, man,\" he commented in Select magazine. \"The verses are quite deep. Some of them are about homeless people, and people who can't always get what they want, and how people who can get what they want always seem to be moaning more than people who can't. I wanted something deep and meaningful for the chorus, but, in the end I just gave up and thought, Fuck it, might as well just go stupid and have stuff about fishes and dishes and dogs itchin' and all that...\"","\"It was inspired by Richard [Ashcroft] from The Verve,\" Gallagher told NME . \"I sussed Richard wasn't very happy for a while so l wrote it for him and about three weeks later he quit. It's about songwriters in general who are desperately trying to say something. I'd like to be able to write really meaningful lyrics,but I always end up talking about drugs or sex.\"","\"In my head, I believe I wanted it to sound like Pink Floyd because it's the same chords as Wish You Were Here, the opening chords are the same,\" he added in a 2021 interview, revisiting the album track-by-track at Rockfield studios. \"I was listening to it today, and it sounds a bit half baked to me. There's a country thing going on, and it's kind of falling in between two stylistic stools, but it's a fucking great song... some of the best words I ever wrote.\"","In an interview with Select' s Andy Perry, Gallagher cheerfully admitted that he'd ripped off the melody and key lyrics for She's Electric from a British educational TV series for children called Stop, Look, Listen . \"It's a very childish song, even more than Digsy's Dinner,\" he acknowledged. \"Of course, as soon as our Liam heard it, he goes, 'That should be the first single!' I'm goin', Don't be so fuckin' ridiculous! You knob! We had a lot of fun doing that one. Is it a Blur piss-take? You said that, not me, mate.\"","\"It's a cynical song about drugs\", Gallagher told NME in 1995. \"Cocaine and fucking razorblades and mirrors,\" he expanded in an interview with Uncut 21 years later. \"I'm amazed we got away with it at the time. I love it when we play it live. Somebody said to me on the phone once, it's an American saying: 'What's the story, morning glory'?, like we say, All right, how you doing? And I was like, fuck, hang on a minute, while I write that down, that's fucking starters, I'll have that.\" \"I do remember writing that fucking line, ' All your dreams are made when you're chained to the mirror and the razor blade' in this room,\" he said during an interview filmed at Rockfield. \"I sound like I was just in the zone there, where everything that I was writing was meaningful.\"","\"When I'm out of it on drugs I get a seriously cocky bastard,\" Gallagher told the Sunday Times in 1996. \" Champagne Supernova - for Christ's sake, how big is that title? It's like I'm saying, I am Mr Noel Gallagher. Do you know who I am? I am the greatest. I'm like Muhammad Ali.\"","The song, which Gallagher says took influences from Led Zeppelin's Stairway To Heaven , and The Beatles' Dear Prudence , features a guitar solo from his hero and friend Paul Weller, who later called Gallagher \"a cunt\" because he felt the Oasis man had deliberately kept his contribution low in the final mix.","\"It was crying out for a guitar solo because mine was a shocker,\" Gallagher admitted.","To this day, the songwriter isn't at all sure what the song's lyrics are about. However, the world's most famous Manchester City supporter has become all too familiar with the feeling of \"Sham\" pain in 2026...","A music writer since 1993, formerly Editor of Kerrang! and Planet Rock magazine (RIP), Paul Brannigan is a Contributing Editor to Louder. Having previously written books on Lemmy, Dave Grohl (the Sunday Times best-seller This Is A Call) and Metallica ( Birth School Metallica Death , co-authored with Ian Winwood), his Eddie Van Halen biography ( Eruption in the UK, Unchained in the US) emerged in 2021. He has written for Rolling Stone, Mojo and Q, hung out with Fugazi at Dischord House, flown on Ozzy Osbourne's private jet, played Angus Young's Gibson SG, and interviewed everyone from Aerosmith and Beastie Boys to Young Gods and ZZ Top. Born in the North of Ireland, Brannigan lives in North London and supports The Arsenal."],"category":"Прогрессив","source":"Louder","published":"2026-10-02T22:49:52+00:00","original_url":"https://www.loudersound.com/bands-artists/noel-gallaghers-track-by-track-guide-to-whats-the-story-morning-glory","saved_at":1790992081,"translation_pending":true,"artists":[{"id":"aerosmith","name":"Aerosmith"},{"id":"led-zeppelin","name":"Led Zeppelin"},{"id":"metallica","name":"Metallica"},{"id":"ozzy-osbourne","name":"Ozzy Osbourne"},{"id":"pink-floyd","name":"Pink Floyd"},{"id":"van-halen","name":"Van Halen"}],"original_title":"Noel Gallagher's track-by-track guide to Oasis' (What's the Story) Morning Glory?","topics":[]},{"id":"d7fd6a974ec5f1a1740b7731020383e8a46b0539","title":"Новый альбом AMON AMARTH доступен для прослушивания","short":"The Allfather Awakes, новое видео группы AMON AMARTH, доступно для просмотра. Этот трек взят из нового альбома \"The Allfather Awakens\", релиз которого намечен на второе октября на Metal Blade Records: 01. Gjallarhorn","paragraphs":["The Allfather Awakes, новое видео группы AMON AMARTH, доступно для просмотра. Этот трек взят из нового альбома \"The Allfather Awakens\", релиз которого намечен на второе октября на Metal Blade Records:","01. Gjallarhorn","02. Eight Legs Of Thunder","03. Kvasir's Blood","04. We Rule The Waves","05. Upphaf","06. Die With A War Cry","07. Raven God","08. The Allfather Awakes","09. Oden's Hunt","10. Ascending Like An Eagle"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T22:56:22+00:00","original_url":"http://www.darkside.ru/news/184202/","saved_at":1790992068,"artists":[],"original_title":"Новый альбом AMON AMARTH доступен для прослушивания","topics":["releases"]},{"id":"cf5f52524f638177ef369df12142bb5554fd2fb1","title":"Last man standing: Buddy Guy looks back on the bluesmen who inspired him","short":"In 2015, blues legend Buddy Guy released Born To Play Guitar , an album that featured guest appearances from Billy Gibbons, Joss Stone and Van Morrison. The album picked up a Grammy Award the following year, but before that, Buddy spoke to The Blues about his career and life, looking back on the extraordinary Chicago blues scene that produced so many great names.","paragraphs":["In 2015, blues legend Buddy Guy released Born To Play Guitar , an album that featured guest appearances from Billy Gibbons, Joss Stone and Van Morrison. The album picked up a Grammy Award the following year, but before that, Buddy spoke to The Blues about his career and life, looking back on the extraordinary Chicago blues scene that produced so many great names.","Buddy Guy will never forget how the Chicago blues scene saved him. “I’d not eaten for three days, I was hungry, I was cold. I was carrying my guitar, walking the streets on the South Side, and I was thinking I might have to beg a dime from someone so I could call my mother to ask her to send me my train fare back home,” he tells The Blues in serious tones. “But then this stranger, he took pity on me, he heard me playing some Jimmy Reed, he grabbed my hand and took me along to the 708 Club.","\"Man, I couldn’t believe my eyes and ears. I walked in, and the place was jumpin’. The music warmed my soul. I recognised the song that was playing immediately; it was Otis Rush’s I Can’t Quit You Baby . It was no copy though; it was Otis Rush himself. I knew I was in Chicago then, that this is what I’d come for.”","This was winter 1957, and that night at 708 East 47th Street in Bronzeville, Chicago, the 21-year- old, born and raised in Lettsworth, Louisiana, ended up on stage, Gibson Les Paul in hand, peacock-strutting across the boards, playing Bobby Bland’s Further On Up The Road with his guitar behind his back, over his head, played with his teeth.","Otis Rush lapped it up; the audience did too. Word got out, and before the end of the night Muddy Waters had turned up with a salami sandwich to feed him. “I didn’t believe it was him at first, but that was Chicago though; you walked down a street, and you’d come to a corner, and you’d find Muddy, Wolf, Little Walter, Sonny Boy… a blues giant doing his thing.”","That night, Buddy Guy and Muddy Waters struck up a friendship that would last Muddy’s lifetime.","Throughout the fascinating half-hour conversation The Blues has with Buddy Guy, talk time and again finds its way back to Chicago, the city the musician has called home for 58 years.","“It’s where I came of age; it defined me,” he says affectionately.","He arrived in the city on September 25, 1957, the date imprinted indelibly on his memory, looking for work at the university. “I was told I’d make twice as much money there than the Louisiana State University, where I had been working. My mother was sick, she’d had a stroke, I was trying to support her, my plan was to work in the day then spend the evenings watching Muddy Waters play guitar at night.","\"I never thought I’d be a professional musician, I didn’t think I was that good. I was shy but after Muddy, Wolf and BB King told me I really was good, I thought I’d better keep on playing.”","It was at the 708 Club that he also made friends with BB King. “I was on stage at the 708, playing his song, I looked out into the audience and there he was. I got stage fright, had to take a break. I went to the bathroom, when I came out, he called me over to him. He said he saw a lot of him in my playing. I couldn’t believe it, not only had he come to hear me play but he liked what he heard. He said: ‘You’re ready to take my place.’ I wasn’t sure about that but it was always an honour to be in his company.”","Another Chicagoan friend of Guy’s, Magic Sam, got him his first record deal. At Eli Toscano’s Cobra Records, under producer, songwriter and bassist Willie Dixon’s supervision, Guy recorded his debut 45 Sit And Cry (The Blues) . In 1958, it was released on the Cobra label imprint Artistic.","“After playing the 708 club word got out about me,” explains Guy. “Most guitar players in Chicago at this time were sitting down to play but here was this guy who was wild, crazy, with a 150ft guitar lead, that would start playing from outside the club then come in and jump off the stage and play in the crowd. Of course I’d got that from seeing Guitar Slim and T-Bone Walker back in Louisiana.”","Magic Sam was taking part in Battle Of Guitars talent contests, which took place on a Sunday afternoon at different bars around the city.","“I got playing in them, started winning them, and got to know him, Matt Murphy, Wayne Bennett, all these great guitarists. One afternoon after I’d won again, Sam said he’d take me to his record company, see if they’d record me. We got there; it was a tiny studio. Harold Burrage, the vocalist, was there. I couldn’t believe it; I knew Harold Burrage’s 45s.","\"Anyhow, they plugged me in, I played three notes of BB King’s Sweet Sixteen and Harold Burrage’s jaw dropped. Eli Toscano put this contract in front of me and said: ‘Sign this, we’re gonna make a record with you.’ It was a funny set-up. I didn’t get no freedom. Willie Dixon was in charge; he told me what to play and how to play it, and I did as he told me.\"","Guy still savoured the experience, though. “It didn’t matter because it was my first time in a proper studio and I was so nervous and so excited. There were two microphones, one for me, one for the band. The band was Willie Dixon on bass, Otis Rush on rhythm guitar, Odie Payne on drums, Harold Burrage on piano and McKinley Eaton on baritone sax. The A-side Sit And Cry – well, that’s just how I felt sitting in the studio that day.”","The B-side, Try To Quit You Baby , was an answer record to Otis Rush’s I Can’t Quit You Baby . “That was Eli Toscano’s idea, and having Otis Rush playing on it too, I couldn’t be happier. It was like I’d gone to heaven.”","Sit And Cry (The Blues) and its follow-up, 1959’s This Is The End – the latter of which was heavily influenced by BB King – flopped, though, and by 1960 Cobra had been declared bankrupt. Guy, undeterred, kept on performing and the following year he ended up at Chess, where he remained for seven years. Chess was located at 2120 South Michigan Avenue, and was at the height of its power.","The first time Buddy Guy went to Chess, he had a demo tape in his hand. No one was interested in the tape, but his Les Paul caught the eye of Wayne Bennett, who asked to borrow it for a session with the doo-wop vocal group The Spaniels. Guy got to watch the recording of the session, left his own tape for Leonard Chess, but heard nothing back. The second time he went to the building, though, it was a different story: he got a record deal.","“Otis Rush took me to Leonard [Chess, co-owner of the label with his brother Phil]. Leonard apparently had asked Otis to bring me over to audition with him. Sam came along too. They didn’t take Sam, but they took me and Otis. I don’t know why they didn’t want Sam.”","The first session he recorded there was with Howlin’ Wolf . “I kept quiet, listened real well, did what I was told and because I did that, then I got the call that I was backing Muddy, Sonny Boy [Williamson], Koko Taylor, Little Walter. That was an education. Little Walter, he put the harmonica on the map. I got to know him real well, I played on two or three of his albums. We bonded because we were both from Louisiana.","\"We’re trying to come up with a blues festival in honour of him in Alexandria, Louisiana, at the moment. But before he made Juke , the harmonica, you could buy one for 10, 15 cents, then after that 45, it just exploded, everyone wanted to play the harmonica. It was like after BB King played the guitar on 3 O’Clock , before that you’d go into a little music store, they’d say make me an offer on the guitar. After 3 O’Clock , oh well, that costs such and such now.”","With so many legends living and working such a short distance from one another, ego could have been a problem. “But we were all so in love with the music, there was no rivalry, there was this sense of real camaraderie, we were a family. Everyone was having fun. The rivalry at the Battle Of The Guitars, we played that up, it was just an act, we made the audience think that, but the fact of the matter was, we were all stealing licks from one other, trying to get the best sound and enjoying ourselves.”","But his time at Chess didn’t work out quite as he had expected. “They didn’t go out and explode me and Otis like they had Muddy,” he says. “They gave me a 45 once every two to three years, they really just got me backing everyone else on the label there. They even had me playing on some spiritual recordings. It was only after the musicians in the UK started namechecking me that Leonard got interested in me and came to the studio to see me record. That was the only time. Before that I was working with Willie Dixon and Ralph Bass.”","Chess really missed a trick with Guy; here was a seditionary who, pre-empting Jimi Hendrix’s onstage theatrics, could ignite a crowd, who in the studio pushed boundaries using feedback, distortion, extended solos, who wanted to record albums like Muddy Waters’ Electric Mud and Howlin’ Wolf’s The Howlin’ Wolf Album before psych blues had even been invented.","Nevertheless, the handful of singles he recorded for the label contained some future classics; his label debut The First Time I Met The Blues in 1960, 1962’s Stone Crazy and 1967’s I Suffer With The Blues are the pick and all ripe for rediscovery, capturing an excitement, enthusiasm and raw energy that trademarked Chess R\u0026B.","It was in February 1965 that he went to the UK for the first time, found out he had an audience and never doubted his talent again. “It was a huge boost to know people were actually listening. There was Jimi Hendrix, Rod Stewart, Jeff Beck… they were all fans.”","Seven months later he visited again as part of the American Folk Blues Festival European tour. It was on that tour that he forged another important relationship, this time with Big Mama Thornton. “That was the first time I met her and I’m playing lead guitar for her. She starts singing Hound Dog – I’m a big fan of the record, her version and Elvis’ – she’s jumping around on stage and with that her bridge falls out of her mouth.","\"And without missing a note, she picks it up off the stage floor and puts it straight back in and keeps singing. That summed her up, she didn’t make no fuss, she was no-nonsense and just got on with it. She didn’t bite her tongue about saying nothing either.”","That same year, Guy teamed with harmonica player Junior Wells, guesting on Wells’ terrific Hoodoo Man Blues album for Delmark under the pseudonym Friendly Chap. They’d continue working together up until Wells’ death in 1998.","Like so many of Guy’s close friendships, theirs began at the 708 Club. “He was playing in Muddy’s band. I couldn’t take my eyes off him,” says Guy fondly. The pair clicked immediately, like two peas in a pod. “He approached the blues like me, he was a wild one. We started jamming in the little clubs in Chicago together, I was running around with my 150ft wire, I made him get a wire for his harmonica.","\"The first time we played the Newport Jazz Festival in 1960, no one had heard of us, we were blues artists at a jazz festival. In the afternoon they ran these guitar workshops. You’d go to a small stage tucked away in the corner, you’d have a little band behind you and you’d get an audience of 100 to 150 people watching. It was supposed to be intimate. We started warming up – I was on one side of the field, he was on the other. We started playing, and we knew each other so well, knew what the other was going to do, we met each other in the middle and bang!","\"Suddenly we had 15,000 people watching us. We had them excited, up on their feet, clapping their hands. George Wein, he’s the man who created the Newport Jazz Festival, he came over and said: ‘Who the hell are you guys? We’ve never had that many people at a workshop before.’ BB King was in the audience and the next thing I know, he and Junior are out gambling dice on the grass at the front of the stage with the fans.”","In 1967, Guy left Chess and signed to Vanguard, expanding his musical palette to include soul and funk on 1968’s A Man And The Blues . He continued playing live, and never strayed far from Chicago during the 70s and 80s; in June 1989 he pledged his allegiance to the city further, opening Legends, his blues club at 700 S Wabash Avenue.","It’s there he played his last show with Junior Wells and he still plays there every January, selling out a 16-date residency. “That sure is fun,” he says. Then in 2012 he brought his love of Chicago full circle by asking US President Obama to sing Robert Johnson’s Sweet Home Chicago with him when he was a visitor at The White House. “And he did,” says Guy. “That was a proud moment.”","This feature originally appeared in The Blues #24, published in September 2015."],"category":"Прогрессив","source":"Louder","published":"2026-10-02T23:05:00+00:00","original_url":"https://www.loudersound.com/bands-artists/buddy-guy-born-to-play-the-blues","saved_at":1790992066,"translation_pending":true,"artists":[],"original_title":"Last man standing: Buddy Guy looks back on the bluesmen who inspired him","topics":[]},{"id":"1430fc8c33ef11ad09e78277cb141c73394bbfd0","title":"How AC/DC's Bon Scott impacted the life of Mastodon's founding guitarist, Brent Hinds","short":"The Beyond The Thunderdome podcast launched in 2021 with a mission to discuss all things AC/DC. Those who've appeared on the show include Airbourne, Simon Wright, Chris Slade, Chris Jericho, Scott Ian, Slash, Dweezil Zappa and Dee Snider, and in March 2021, late Mastodon guitarist Brent Hinds was interviewed.","paragraphs":["The Beyond The Thunderdome podcast launched in 2021 with a mission to discuss all things AC/DC. Those who've appeared on the show include Airbourne, Simon Wright, Chris Slade, Chris Jericho, Scott Ian, Slash, Dweezil Zappa and Dee Snider, and in March 2021, late Mastodon guitarist Brent Hinds was interviewed. Below, podcast co-creator Kurt Squires remembers the encounter.","When we spoke to Brent Hinds , he was exactly who you’d expect Brent Hinds to be. Before the day was over, he’d invited us onto Mastodon ’s tour bus, shown off a freshly inked AC/DC tattoo, and asked which song we’d like him to play on his Gibson SG while we filmed the band that night. We chose The Czar . He grinned and obliged.","None of it was surprising. By then, AC/DC – and especially Bon Scott – had been woven into Hind’s life for decades. In fact, his Bon Scott story began beside a swimming pool in Florida. The first AC/DC music Hinds ever owned was a Highway To Hell cassette.","“I was about eleven years old,” he recalled. “I rode my bike off, bought it with my allowance money, took it down by the pool and listened to the whole thing over and over again.”","And the experience was unforgettable. “It was electrifying,” he said. So electrifying that Hinds became so absorbed in the music, and he forgot he was lying under the Florida sun. By the time he got back to his family’s cottage, he was badly sunburned everywhere except for one perfect white rectangle where his Panasonic portable cassette player had rested on his chest. His first encounter with AC/DC had literally left a mark.","Like many musicians of his generation, Hinds discovered that Bon Scott wasn’t just a singer. He was a character, a lifestyle, a cautionary tale, a hero and more, all rolled into one.","Even decades later, Hinds measured his own excesses against Bon’s.","“Every time I’ve ever overdone it partying and woke up feeling like death, my body’s been like: ‘Brent, you’re gonna die like Bon Scott right now. Get up and go puke.’”","The line is funny because Brent tells it like he’s telling a joke. For all the mythology surrounding Bon Scott – and there has been plenty of it over the decades – Hinds understood that there was a cost attached to the party. Yet the admiration never faded.","“To this day, What’s Next To The Moon on Powerage is probably my favourite AC/DC song.”","That choice says a lot. Hinds gravitated toward one of Bon’s most colourful and overlooked stories – a reminder that beneath the riffs and swagger was a gifted storyteller.","Like Bon, Hinds left us too soon. He passed away in 2025 at the age of 51, leaving behind his own devoted following of fans, musicians and friends. Yet the mark Bon left on him was still there for everyone to see, tattooed on his skin.","Kurt Squiers is the brains behind the podcast AC/DC: Beyond The Thunder . He was hooked by Highway To Hell at the age of ten, had his first live AC/DC experience in 1985, and finally met the band in 2000, a relationship he has since maintained. He lives in Raleigh, North Carolina, and is the author of the upcoming book AC/DC: Every Dirty Song ."],"category":"Хард-рок","source":"Louder","published":"2026-10-03T00:30:00+00:00","original_url":"https://www.loudersound.com/bands-artists/how-acdc-impacted-brent-hinds","saved_at":1790992043,"translation_pending":true,"artists":[{"id":"ac-dc","name":"AC/DC"},{"id":"mastodon","name":"Mastodon"}],"original_title":"How AC/DC's Bon Scott impacted the life of Mastodon's founding guitarist, Brent Hinds","topics":[]},{"id":"e2141d56a4abde570fd3feb5858f73d81b9e6cff","title":"CHRIS HARMS выпустит новый альбом зимой","short":"CHRIS HARMS сообщил о том, что его новая сольная работа, получившая название Aporia, 27 января 2027 года на Napalm Records. Первый сингл из этого релиза, \"Find What You Love And Let It Kill You\", доступен для прослушивания. Альбом будет доступен в цифровом варианте, а также в лимитированном бокс-сете со специальным CD. Трек-лист:","paragraphs":["CHRIS HARMS сообщил о том, что его новая сольная работа, получившая название Aporia, 27 января 2027 года на Napalm Records. Первый сингл из этого релиза, \"Find What You Love And Let It Kill You\", доступен для прослушивания. Альбом будет доступен в цифровом варианте, а также в лимитированном бокс-сете со специальным CD.","Трек-лист:","01. U† I†","02. Find What You Love And Let It Kill You","03. Skipped A Beat (feat. Erk Aicrag)","04. Diamond Death","05. Tears Of A Nun","06. You Are Not What You See (feat. Ryan Shuck)","07. The Unholiest","08. Hallo Depression (feat. SWISS)","09. The Only Word You Know","10. On A Dreamless Night","11. Dear Time"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T18:22:10+00:00","original_url":"http://www.darkside.ru/news/184172/","saved_at":1790981928,"artists":[],"original_title":"CHRIS HARMS выпустит новый альбом зимой","topics":["releases"]},{"id":"de83704bf38d7ec7a201b59df6f9e156c91ebef9","title":"KYLE THOMAS завершил запись вокала для TROUBLE","short":"В недавнем интервью вокалист TROUBLE Kyle Thomas рассказал о ходе сочинения и записи материала для нового альбома: «Я сейчас записываю вокал [для нового альбома TROUBLE]. Весь свой вокал я записываю дома. Делаю я это так: мне присылают миксы песен, я загружаю их в сессию, записываю вокал и сохраняю всё обратно в файл, чтобы все могли послушать.","paragraphs":["В недавнем интервью вокалист TROUBLE Kyle Thomas рассказал о ходе сочинения и записи материала для нового альбома:","«Я сейчас записываю вокал [для нового альбома TROUBLE]. Весь свой вокал я записываю дома. Делаю я это так: мне присылают миксы песен, я загружаю их в сессию, записываю вокал и сохраняю всё обратно в файл, чтобы все могли послушать.","Обычно я работаю с тем, кто написал музыку к конкретной песне, будь то Rick [Wartell, гитарист TROUBLE] или Bruce [Franklin, гитарист TROUBLE], пока человек не будет доволен результатом. Я продолжаю отправлять им записи, и если они присылают их обратно со словами: „Слушай, попробуй так, попробуй эдак. Вот эта часть мне не нравится. А вот эта нравится\", то, когда они наконец довольны, я делюсь результатом со всеми остальными.","Кажется, на этом альбоме 10 или 11 песен, и я закончил примерно половину. Когда в конце октября я вернусь домой [из тура с EXHORDER], я останусь дома до конца года, так что буду стараться закончить оставшиеся пять песен или около того, наверное, до Дня благодарения, и тогда моя работа будет сделана.","Думаю, теперь в музыкальном плане нам остались только гитарные овердабы и, может быть, какие-то соло: так, мелкие штрихи, вишенка на торте. Так что всё выглядит неплохо»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T18:55:17+00:00","original_url":"http://www.darkside.ru/news/184183/","saved_at":1790981926,"artists":[],"original_title":"KYLE THOMAS завершил запись вокала для TROUBLE","topics":[]},{"id":"263e578852aac5fcd3e6795222313e636ff3383f","title":"Новое видео MISS MAY I","short":"Bury Me Down, новое видео группы MISS MAY I, доступно для просмотра ниже. Эта песня взята из альбома \"No Place For Me\", выходящего второго октября на Solid State Records: 01. Sanctuary","paragraphs":["Bury Me Down, новое видео группы MISS MAY I, доступно для просмотра ниже. Эта песня взята из альбома \"No Place For Me\", выходящего второго октября на Solid State Records:","01. Sanctuary","02. Portrait Of Pain","03. Hand Me A Halo","04. Pray For Silence","05. Death Threat","06. Die On The Vine","07. Fire Falls","08. Bury Me Down","09. Ashes Of The Altar","10. Highbrow Thieves"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T19:29:08+00:00","original_url":"http://www.darkside.ru/news/184199/","saved_at":1790981919,"artists":[],"original_title":"Новое видео MISS MAY I","topics":["releases"]},{"id":"5637e8f5f1027c901754be782f56f0e3311f1f86","title":"Новое видео KING 810","short":"\"I Know You Heard Of Me\", новое видео KING 810, доступно для просмотра. Этот трек взят из нового альбома \"K9: La Grande Mort or SILENCE OF GOD\", выходящего 27 ноября. Это уже четвертая студийная пластинка коллектива за последние 18 месяцев: 01. Know You Heard Of Me","paragraphs":["\"I Know You Heard Of Me\", новое видео KING 810, доступно для просмотра. Этот трек взят из нового альбома \"K9: La Grande Mort or SILENCE OF GOD\", выходящего 27 ноября. Это уже четвертая студийная пластинка коллектива за последние 18 месяцев:","01. Know You Heard Of Me","02. Hungry Gods","03. Love Kills","04. Decalcomania","05. Feast","06. Xoxo","07. Simulacra Simulating","08. The Thin Place","09. Black Milk","10. Divine Sparks","11. Enmeshment"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T20:17:32+00:00","original_url":"http://www.darkside.ru/news/184171/","saved_at":1790981911,"artists":[],"original_title":"Новое видео KING 810","topics":["releases"]},{"id":"cd61778057f63fe28a7b9b57e53cacbc4bb2acbc","title":"Новое видео METHANE","short":"„‘I Fuck For Beer‘, новое видео METHANE, доступно для просмотра ниже. Этот трек взят из альбома“Demolate”, выход которого состоялся 30 сентября: 1. 360° of Destruction 02:57","paragraphs":["„‘I Fuck For Beer‘, новое видео METHANE, доступно для просмотра ниже. Этот трек взят из альбома“Demolate”, выход которого состоялся 30 сентября:","1. 360° of Destruction 02:57","2. Alcoholocaust 03:01","3. Research Chemicals 04:42","4. Demolate 03:54","5. Karen 00:04","6. Get in the Coffin 05:03","7. King of Fallout 04:22","8. I Fuck for Beer 02:36"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T21:25:46+00:00","original_url":"http://www.darkside.ru/news/184200/","saved_at":1790981906,"artists":[{"id":"destruction","name":"Destruction"}],"original_title":"Новое видео METHANE","topics":["releases"]},{"id":"fe57935485125d96d11c9f2ed83d8328aef9276a","title":"Новое видео STEVEN WILSON","short":"Шестикратный номинант на «Грэмми», музыкант, автор песен и продюсер STEVEN WILSON выпустит девятый студийный альбом. «Requiem For A Village» на лейбле Fiction Records в пятницу, 6 ноября. Альбом будет доступен в широком спектре форматов: в цифровом виде, на CD, Blu-ray, в виде двух 140-граммовых 12-дюймовых пластинок чёрного винила, двух 12-дюймовых пластинок цвета «бычья…","paragraphs":["Шестикратный номинант на «Грэмми», музыкант, автор песен и продюсер STEVEN WILSON выпустит девятый студийный альбом. «Requiem For A Village» на лейбле Fiction Records в пятницу, 6 ноября. Альбом будет доступен в широком спектре форматов: в цифровом виде, на CD, Blu-ray, в виде двух 140-граммовых 12-дюймовых пластинок чёрного винила, двух 12-дюймовых пластинок цвета «бычья кровь», а также в бокс-сете с 2 CD и диском Blu-ray, упакованном в 96-страничную книгу в твёрдом переплёте.","Если восьмой альбом Steven'а Wilson'а, получивший признание критиков «The Overview» 2025 года, исследовал глубины, расстояния и запустение открытого космоса, то «Requiem For A Village» сужает фокус до крошечного, никому не известного уголка где-то за пределами карты на Британских островах — хаунтологического мира, полностью оторванного от современности, где в местной галерее висят картины Стэнли Спенсера, на полках публичной библиотеки стоят рассказы М. Р. Джеймса и Алджернона Блэквуда, а на рыночной площади играют «Дети камней». Отказавшись от искусственного интеллекта и корректирующих студийных технологий, Wilson выбрал нестандартный подход к записи, чтобы создать музыку, которая осознанно принимает и мрачное, и саму возможность ошибки, — обратившись вместо этого к живым инструментам, будь то безупречным или несовершенным, и принимая случайные огрехи, чтобы посмотреть, куда они приведут.","«Requiem For A Village» — интимный, амбициозный, богатый воображением и намеренно эксцентричный альбом — включает завораживающую закадровую партию, написанную легендарным Andy Partridge (XTC) и озвученную отмеченным наградами актёром David Tennant («Доктор Кто», «Бродчёрч», «Rivals»), при участии давнего соратника, мультиинструменталиста Randy McStine, барабанщика Russell Holzman и вокалистки Katherine Priddy.","Альбому предшествует премьера заглавного трека «Requiem For A Village» — сокрушительного нагромождения летящих барабанов, напористой басовой линии и скрежещущих гитар, которое превращается в нечто похожее на саундтрек к надвигающемуся апокалипсису; композиция уже доступна на всех цифровых площадках и в виде клипа Это первое в серии «Village Sessions», записанной и снятой с McStine и Holzman. Кроме того, ранее на этой неделе был представлен эксклюзивный отрывок из закадровой партии альбома, а также новая онлайн-платформа, стилизованная под традиционный сайт приходского совета вымышленной деревни, с отсылками к песням, текстам и пасхалками.","Steven Wilson: «Мне хотелось вернуться к такой музыке, в которой слышны, образно говоря, отпечатки пальцев.","Сделать акцент на человеческих жестах и несовершенствах в музыке — на том, что нельзя создать с помощью софта. Например, использовать только аналоговые синтезаторы со всей их непредсказуемостью или играть на инструментах, которые звучат не идеально точно в строй.","Но именно это привело к тому, что я взялся за скрипку, гобой или попробовал сыграть на барабанах — вещи, играть на которых я толком не умею, но при этом извлёк из них нечто, вдохновившее меня неожиданным образом. Подойти к музыке с чувством наивности и посмотреть, куда это приведёт. И это привело меня в деревню».","Wilson представит «Requiem For A Village» на специальном диджей-сете в лондонском клубе The Social (5 Little Portland Street, London, W1W 7JD) во вторник, 22 сентября. Сет под названием «Songs From The Village» станет своего рода введением в музыку, вдохновившую альбом, — от туманной инаковости BOARDS OF CANADA и DEMDIKE STARE, завороженных раг THIRD EAR BAND до тягучего саспенса, характерного для британского детского телевидения и других эфиров 70-х. Все средства будут направлены в пользу Here 2 Belong — британской благотворительной организации, поддерживающей молодых людей с опытом пребывания под опекой государства в процессе перехода к независимой или частично независимой жизни.","В следующем месяце Wilson выступит с двумя аншлаговыми концертами в лондонском Royal Albert Hall, которые пройдут 28–29 октября. Это будет уже седьмое выступление музыканта на этой исторической площадке — в программе прозвучат ранее не звучавшие оркестровые аранжировки «The Overview» и другие композиции, подготовленные специально для этих шоу, в сопровождении его группы, оркестра Parallax Orchestra и хора SANSARA под управлением Тома Ричардса.","Дополнительные концертные даты будут объявлены позднее.","Трек-лист:","01. Swirl In A Lark's Eye","02. Requiem For A Village","03. The Same River Twice","04. Now Departing","05. Hiraeth","06. On Chapel Slope","07. Murmuration","08. Curcus Fingerprint","09. A Basket Of Bees","10. Great Green Map","11. Wheel","12. The Old God Is Buried"],"category":"Прогрессив","source":"Darkside","published":"2026-10-02T21:59:57+00:00","original_url":"http://www.darkside.ru/news/184195/","saved_at":1790981904,"artists":[{"id":"steven-wilson","name":"Steven Wilson"}],"original_title":"Новое видео STEVEN WILSON","topics":["releases"]},{"id":"d180bdfd3a1ae791aa1bb01353194b643a8c2a6b","title":"Новое видео PATRIARCHS IN BLACK","short":"No More Blood, новое видео PATRIARCHS IN BLACK, доступно для просмотра. Этот трек взят из нового альбома \"To Serve Man\", релиз которого намечен на восьмое января на Metalville","paragraphs":["No More Blood, новое видео PATRIARCHS IN BLACK, доступно для просмотра. Этот трек взят из нового альбома \"To Serve Man\", релиз которого намечен на восьмое января на Metalville"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T10:45:07+00:00","original_url":"http://www.darkside.ru/news/184176/","saved_at":1790968431,"artists":[],"original_title":"Новое видео PATRIARCHS IN BLACK","topics":["releases"]},{"id":"f13075ea89515fca87f029d1b2d7b3127e206a08","title":"Новое видео SEVEN KINGDOMS","short":"Sono Sola, новое видео SEVEN KINGDOMS, доступно для просмотра. Этот трек взят из нового альбома Sono Sola, релиз которого намечен на 29 января: 1. Twin Flames","paragraphs":["Sono Sola, новое видео SEVEN KINGDOMS, доступно для просмотра. Этот трек взят из нового альбома Sono Sola, релиз которого намечен на 29 января:","1. Twin Flames","2. Dissonance","3. The Serpent and the Lotus (2026 Remastered)","4. Endless Night","5. Undone","6. Through These Waves (2026 Remastered)","7. I Don't Care","8. The Oracle","9. Five Tones","10. Sono Sola"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T11:29:10+00:00","original_url":"http://www.darkside.ru/news/184178/","saved_at":1790949943,"artists":[],"original_title":"Новое видео SEVEN KINGDOMS","topics":["releases"]},{"id":"c93a69fb88581c62d015c3f72c979290288f3809","title":"Новое видео FEUERSCHWANZ x IN EXTREMO","short":"Carpe Noctem, новое видео FEUERSCHWANZ x IN EXTREMO, доступно для просмотра. Это первая в истории полноценная студийная совместная работа двух коллективов, приуроченная к старту совместного тура","paragraphs":["Carpe Noctem, новое видео FEUERSCHWANZ x IN EXTREMO, доступно для просмотра. Это первая в истории полноценная студийная совместная работа двух коллективов, приуроченная к старту совместного тура"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T12:00:52+00:00","original_url":"http://www.darkside.ru/news/184189/","saved_at":1790949940,"artists":[],"original_title":"Новое видео FEUERSCHWANZ x IN EXTREMO","topics":["releases"]},{"id":"c1c2e400c280bed9fbbf0444523072822c6154d0","title":"Новое видео FIRTAN","short":"Shadows of a Dawn Unborn feat. Christian of Vinsta новое видео FIRTAN, доступно для просмотра. Этот трек взят из нового альбома \"Helios\", релиз которого намечен на второе октября: 1. Himsa","paragraphs":["Shadows of a Dawn Unborn feat. Christian of Vinsta новое видео FIRTAN, доступно для просмотра. Этот трек взят из нового альбома \"Helios\", релиз которого намечен на второе октября:","1. Himsa","2. Kalikas Tongue","3. Ambrosia","4. Solis currus","5. Ascension","6. Wide Open Eye","7. Helios","8. The Form Revealed","9. Revealing Prana","10. The Hierophant Way","11. Shadows of a Dawn Unborn"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T12:53:15+00:00","original_url":"http://www.darkside.ru/news/184180/","saved_at":1790949936,"artists":[],"original_title":"Новое видео FIRTAN","topics":["releases"]},{"id":"98615d0bdbcdac2115c00dd8cfdb8590188ae8ba","title":"ALICE COOPER: «Не хочу я на пенсию, чего вы пристали!?»","short":"ALICE COOPER в недавнем интервью вновь ответил на вопрос о том, собирается ли он на пенсию: «Конечно, Alice — вымышленный персонаж, поэтому у него нет возраста. Я не знаю, сколько лет Alice, но на сцене ему столько же, сколько было в 1973 году.","paragraphs":["ALICE COOPER в недавнем интервью вновь ответил на вопрос о том, собирается ли он на пенсию:","«Конечно, Alice — вымышленный персонаж, поэтому у него нет возраста. Я не знаю, сколько лет Alice, но на сцене ему столько же, сколько было в 1973 году. И… и если я когда-нибудь изменюсь внешне, если когда-нибудь наберу 100 фунтов, я никогда не буду играть Alice. Если я не смогу выступать с той же энергией, что и тогда, — то же самое. Я никогда не буду играть на автопилоте, потому что тогда это уже не будет Alice. Я уж точно не буду выступать на круизном лайнере, исполняя \"Мне 18. И я не...\" А будет так: \"Мне 80, и я не могу найти свои туфли\".","Современные рок-н-ролльщики — Пол Маккартни, THE [ROLLING] STONES, Род Стюарт — мы посвятили этому всю жизнь. И мы будем этим заниматься, пока сможем, потому что я не могу придумать лучшей работы»."],"category":"Хард-рок","source":"Darkside","published":"2026-10-02T13:35:49+00:00","original_url":"http://www.darkside.ru/news/184188/","saved_at":1790949931,"artists":[{"id":"alice-cooper","name":"Alice Cooper"}],"original_title":"ALICE COOPER: «Не хочу я на пенсию, чего вы пристали!?»","topics":[]},{"id":"e22650fc56b675b7e77d06fb546d9eaa45de04ab","title":"BATTLE BEAST не рассматривали никого, кроме MARINA LA TORRACA","short":"В интервью SDTV – Stonedead Festival басист и один из основателей BATTLE BEAST Eero Sipilä и новая вокалистка Marina La Torraca рассказали о недавнем уходе Noora'ы Louhimo, которую как раз и заменила La Torraca. Отвечая на вопрос, каково это — прийти в группу и вносить в неё что-то своё, Marina сказала: «Это большая честь.","paragraphs":["В интервью SDTV – Stonedead Festival басист и один из основателей BATTLE BEAST Eero Sipilä и новая вокалистка Marina La Torraca рассказали о недавнем уходе Noora'ы Louhimo, которую как раз и заменила La Torraca. Отвечая на вопрос, каково это — прийти в группу и вносить в неё что-то своё, Marina сказала:","«Это большая честь. Это первое, что я хочу сказать. Я невероятно польщена. Чувства смешанные, потому что мы очень много работали и играли весь летний сезон. А летний сезон всегда тяжелее обычного тура. Мы как раз об этом говорили: бесконечные переезды, порой почти нет времени на сон, и ты играешь два шоу подряд, не поспав между ними.","А меня с самого начала бросили в львиную яму. Сначала был азиатский тур [в марте], потом небольшой перерыв, который на самом деле перерывом не был. Мы уже репетировали к этому и занимались другими делами. У ребят тоже было очень много забот, потому что всё произошло стремительно: сначала Noora ушла из группы, потом пришла я. И было просто: „Так, вперёд, вперёд, вперёд\"».","Говоря о том, как Marina выбрали новой вокалисткой BATTLE BEAST, Eero рассказал:","«Нам пришлось соображать на ходу, когда в конце прошлого лета Noora объявила, что уходит. Мы такие: „О, чёрт. О, чёрт. О, чёрт. Нам срочно нужна новая вокалистка\". Шоу у нас были уже расписаны. А я какое-то время был в ступоре. Думал: „Ох, я не знаю, что делать\".","К счастью, Joona [Björkroth], наш соло-гитарист, мгновенно взял всё в свои руки и начал работать как часы, подыскивая новых вокалисток. И, в конечном итоге, никакого короткого списка у нас не было, как и разных запасных планов. Мы просто сказали: „Вот Marina. Звучит она отлично. Выглядит замечательно. Давайте спросим её. Посмотрим, что она ответит\". Остальное уже история.","Никакого списка не было. Никакого списка. У нас была только Marina. Она была единственной, кого мы рассматривали, и единственной, кого мы спросили. Теперь я рад, что всё сложилось именно так, потому что будь у нас больше времени на раздумья и сомнения, всё могло бы пойти гораздо хуже: начни ты сомневаться в себе — „А она точно идеальный вариант?\" Но нам и правда пришлось действовать по обстоятельствам».","Marina вставила свои пару центов:","«Да, потому что в таких вопросах никогда не знаешь наверняка. Правда, никогда. И потом, когда ты выписываешь на бумаге качества одного человека и другого, получается: „Что мне с этим делать? Вот у этого такой вокал, у того такой характер…\" А теперь, когда я узнала этих ребят, я могу это понять чуть лучше.","Это было интуитивное коллективное решение, и вы просто сказали: „Ладно, давайте остановимся на этом\". Это не был кастинг, не было сложного отбора. Я ведь работала в музыкальном театре и знаю, что такое месяцы прослушиваний, когда ты переходишь на следующий этап, потом на следующий, и всё такое. Я там бывала. Поэтому я, честно говоря, ожидала чего-то подобного. Думала: „О, это будет как процесс прослушивания\". Но нет».","Eero добавил:","«Да, но иногда реально нужно с верой прыгнуть в омут и для нас это была именно такая ситуация. Других вариантов не было. Мы не можем уйти на двухлетний перерыв, а потом тихонько начать искать людей. Нам просто нужно было сказать: „Надо двигаться прямо сейчас. Давайте возьмём её\"».","Marina также рассказала о планах BATTLE BEAST на новую музыку с её участием:","«Если честно, мы просто проводим большой эксперимент. Мы начнём сразу после окончания летнего сезона. Посмотрим, что у нас получится, потому что BATTLE BEAST, насколько я слышала, всегда писали именно так. У них нет формулы. Они чувствуют, а потом пишут то, что хотят, во что верят. Вроде: „Вот это хорошо\".","Так что попробуем прийти к этому. Пока то, что мы делаем, хорошо, меня даже не особенно волнует, мой это почерк или моя подпись. Дело не в этом. Скорее: „Давайте посмотрим, что мы можем создать вместе, и сделаем это хорошо\"»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T14:31:25+00:00","original_url":"http://www.darkside.ru/news/184078/","saved_at":1790949925,"artists":[],"original_title":"BATTLE BEAST не рассматривали никого, кроме MARINA LA TORRACA","topics":[]},{"id":"57fa4d5bba31e665ecf69534c7dac86b9996ce69","title":"Новое видео YNGWIE MALMSTEEN","short":"\"Beyond Zeta Reticuli\", новое видео группы YNGWIE MALMSTEEN, доступно для просмотра ниже. Эта песня взята из альбома \"Hell Or High Water\", выходящего 13 ноября на Music Theories Recordings/Artone Label Group: 01. Now Or Never","paragraphs":["\"Beyond Zeta Reticuli\", новое видео группы YNGWIE MALMSTEEN, доступно для просмотра ниже. Эта песня взята из альбома \"Hell Or High Water\", выходящего 13 ноября на Music Theories Recordings/Artone Label Group:","01. Now Or Never","02. Am Caprice/Hell Or High Water","03. (He Is) Living A Lie","04. Antikythera","05. (On The) Battlefield","06. Beyond Zeta Reticuli","07. Prestissimo In Bm/Adagio","08. Eye For An Eye","09. Father","Malmsteen: «Вдохновлённый моим увлечением инопланетной жизнью, этот инструментал соединяет масштабные тяжёлые темы, сильные мелодии и замысловатый контрапункт: чистое неоклассическое пламя».","Когда мы думаем о величайших гитаристах всех времён, об избранных музыкантах, которые изобрели совершенно новый стиль и звук на инструменте, Malmsteen по праву стоит рядом с такими революционерами, как Jimi Hendrix, Jimmy Page и Edward Van Halen.","Девять треков, составивших его новейший триумф, были созданы тщательно и осознанно, вдали от отвлекающих факторов, тормозящих творческий процесс в наше время. Впервые он попробовал такой подход на «Parabellum» 2021 года, главным образом из-за состояния мира в тот период, и результаты оказались настолько сильными, что он решил сделать это своим методом работы на будущее.","«Когда я начинал записывать пластинки, я просто брал песни, которые у меня были под рукой,. Позже я втянулся в график: записать альбом, отыграть тур, потом писать следующий. Во время пандемии я понял, что лучше сосредоточиться полностью и без перерывов, поэтому остался дома и писал этот альбом восемь месяцев. У меня было готово около 80 или 90 треков, а потом мне пришлось решать, какие из них самые сильные».","Для человека, рождённого с даром создавать увертюры «из ниоткуда», наука сочинения песен это то, что трудно объяснить. Но так или иначе, он благодарен за обилие идей золотого стандарта, которые приходят к нему, из тех, что у других музыкантов отняли бы месяцы или даже годы на воплощение. Для Yngwie J. Malmsteen'а это просто то, для чего он был рождён.","«Даже без гитары в руках музыка просто приходит ко мне, — рассуждает Yngwie. — Это как в фильме „Амадей\". Моцарту музыка являлась в готовом виде. Я понимаю строительные блоки и потому могу построить вам что угодно.","Если вы попросите меня написать дэт-металл-песню, перезвоните через пять минут, и она будет готова. Хотите кантри-энд-вестерн или регги? Без проблем. Я могу дать вам всё, что захотите. Язык музыки прост. Есть определённые ноты, которые сочетаются друг с другом в любом стилистическом направлении и приятны на слух.","Идеи приходят не всегда, но когда приходят, это как лавина. Вещи, которые я выбираю для своих пластинок, словно подарки, которые я ловлю, потому что они меня поражают. В этом смысле мне очень повезло».","Ведущий сингл «Now Or Never» это идеальный шторм из риффов с приглушением ладонью, барочных контрмелодий, взмывающего вокала и умопомрачительной беглости. Если вам нужен Yngwie в двух словах, то это именно он, и схожее можно сказать о втором треке, инструментальном шедевре «Am Caprice/Hell Or High Water».","В «(On The) Battlefield» и «Eye For An Eye» звучат одни из сильнейших на сегодня вокальных партий певца и гитариста, а рядом с ними стоят поразительные инструментальные композиции «Antikythera» и «Beyond Zeta Reticuli», названные в честь важных научных прорывов и открытий.","«Hell Or High Water» это альбом, переполненный эмоциями со всех сторон, но заключительный трек «Father», несомненно, самый проникновенный из всех. Он написан в дань уважения отцу гитарной легенды, который ушёл из жизни в прошлом году.","«Он был удивительным человеком, — вспоминает Yngwie. — Я гордился тем, что он мой отец, и я любил его. Я хотел посвятить ему всё это, а этот конкретный трек написан для него. Я хотел, чтобы другие почувствовали то, что чувствовал я, когда слушают его.","Никколо Паганини однажды сказал: „Нужно сильно чувствовать, чтобы заставить чувствовать сильно других\". Одно дело быть печатной машинкой и совсем другое быть тем, кто пишет истории, способные трогать людей. В этом всегда и была суть».","Примечание: в тексте «Yngwie J. Malmsteen'а» я применил окончание, поскольку это имя живого музыканта. Никколо Паганини транслитерирован по-русски, так как он умерший музыкант (по вашему правилу). Название лейбла Music Theories Recordings/Artone Label Group оставлено в оригинале."],"category":"Хард-рок","source":"Darkside","published":"2026-10-02T15:27:37+00:00","original_url":"http://www.darkside.ru/news/184186/","saved_at":1790949924,"artists":[{"id":"van-halen","name":"Van Halen"}],"original_title":"Новое видео YNGWIE MALMSTEEN","topics":["releases"]},{"id":"3a7c11bd0849f2c5fcb79e99cf5b809cab275d3b","title":"Вокалист EXHORDER: «Нами интересуется очень и очень крупный лейбл»","short":"В новом интервью вокалист и гитарист EXHORDER Kyle Thomas рассказал о возможном продолжении четвёртого полноформатного альбома группы «Defectum Omnium», вышедшего в марте 2024 года на Nuclear Blast Records. 56-летний певец из Нового Орлеана, который также возглавляет легенд дум-металла TROUBLE, сказал: «Забавно получилось.","paragraphs":["В новом интервью вокалист и гитарист EXHORDER Kyle Thomas рассказал о возможном продолжении четвёртого полноформатного альбома группы «Defectum Omnium», вышедшего в марте 2024 года на Nuclear Blast Records. 56-летний певец из Нового Орлеана, который также возглавляет легенд дум-металла TROUBLE, сказал:","«Забавно получилось. Я давал интервью и упомянул в нём, что сейчас у нас нет контракта с лейблом. Потом эту историю подхватили, и заголовки были из серии — у нас нет лейбла. А мне показалось, что из-за этого мы выглядим так, будто никому не нужны, хотя это неправда.","На самом деле у нас сейчас есть очень крупный лейбл, который очень и очень активно за нами охотится. Просто мы не торопимся, потому что у нас хватает ресурсов, чтобы сделать всё самостоятельно, без лейбла, и мы рассматриваем такой вариант.","Но приятно знать, что есть хотя бы один известный лейбл, который нас хочет. Есть и ещё один, поменьше. Так что в подписании этой группы заинтересованы сразу несколько лейблов.","Вы же знаете, как это бывает. Большинство людей не читают статью. Они читают заголовок, а потом устраивают соревнование, кто напишет самый глупый комментарий на свете».","На вопрос, как изменился процесс сочинения музыки в EXHORDER по сравнению с тем, каким он был четыре десятилетия назад, Thomas ответил:","«Ну, процесс, безусловно, другой, потому что из тех составов остался только я, так что он, естественно, не мог не измениться. Но эволюция началась ещё до нынешнего состава.","Где-то в 1993 году, после [нашего второго альбома 1992 года] „The Law\", который получился настолько техничным, почти прогрессивным, мы решили, что больше не хотим быть такими. Поэтому план на следующий альбом, а мы собирались делать его в 1993-м, состоял в том, чтобы песни стали гораздо более структурными, чуть дальше от трэшевого звучания и ближе к груву, мелодиям и всему такому.","Так что когда вышел [альбом 2019 года] „Mourn The Southern Skies\", некоторые люди жаловались на резкую смену стиля. А мне хочется сказать: извините, ребята, но это должно было случиться ещё в 1993 году. Потому что таков и был план.","Мы никогда не были по-настоящему стопроцентной металл-группой. Мы никогда не были по-настоящему стопроцентной панк-группой. Мы никогда не были по-настоящему кем-то одним. Мы делали то, что хотели, и всегда делали то, что хотели, и это и есть наша настоящая традиция.","Конечно, было бы нелепо, если бы мы вдруг выдали регги-ритм. Это было бы глупо. Есть вещи, которые просто не хочется делать, потому что в них нет смысла. Но именно поэтому в некоторых композициях двух последних альбомов такие резкие стилистические различия. Потому что мы расширяемся.","Мне за пятьдесят. Я больше не злой молодой человек. Я уже не знаю, как думает злой молодой человек. Поэтому мне приходится искать новый способ мотивировать себя на сочинение материала.","И цель всегда одна: когда мы заканчиваем песни и прослушиваем их, нам нужно быть честными с собой и спросить: „Место ли этому на альбоме EXHORDER?\" Даже если стилистически вещь другая, звучит ли она всё равно как EXHORDER? Вот в чём главная хитрость. И за последние пять-семь лет, пока мы работаем над новым материалом, было несколько песен, о которых мы говорили: „Нет, давайте отложим эту для чего-нибудь другого, потому что она просто не вписывается\"»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T16:22:43+00:00","original_url":"http://www.darkside.ru/news/184187/","saved_at":1790949922,"artists":[],"original_title":"Вокалист EXHORDER: «Нами интересуется очень и очень крупный лейбл»","topics":[]},{"id":"56cd3e65b44df9dc38fd35595ae7ace3ebd62d34","title":"METALLICA отыграла первый концерт в Сфере","short":"Группа METALLICA выступлением первого октября открыла серию концертов в Sphere in Las Vegas, Nevada: 01. Battery","paragraphs":["Группа METALLICA выступлением первого октября открыла серию концертов в Sphere in Las Vegas, Nevada:","01. Battery","02. Creeping Death","03. Now That We're Dead","04. Sad But True","05. The Shortest Straw","06. Wherever I May Roam","07. The Day That Never Comes","08. ...And Justice For All","09. Kirk Hammett And Robert Trujillo Doodle","10. Nothing Else Matters","11. The Call Of Ktulu","12. Lux Æterna","13. Ride The Lightning","14. The Memory Remains","15. Seek \u0026 Destroy","16. Master Of Puppets"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T16:36:09+00:00","original_url":"http://www.darkside.ru/news/184194/","saved_at":1790949921,"artists":[{"id":"metallica","name":"Metallica"}],"original_title":"METALLICA отыграла первый концерт в Сфере","topics":["live"]},{"id":"04f389504614efd84f8673164c18f56671a7ce0a","title":"JEFF 'MANTAS' DUNN почтил память вокалиста VENOM","short":"Jeff \"Mantas\" Dunn отреагировал на известия о смерти Кроноса: «Позвольте поблагодарить всех вас за огромное количество слов признательности и соболезнований. Я считаю, что это вполне заслуженно.","paragraphs":["Jeff \"Mantas\" Dunn отреагировал на известия о смерти Кроноса:","«Позвольте поблагодарить всех вас за огромное количество слов признательности и соболезнований. Я считаю, что это вполне заслуженно.","«Я говорю от своего имени и от имени Abaddon [Antony Bray, первого барабанщика VENOM], с которым я сегодня разговаривал, когда говорю, что, несмотря на бурную историю этой группы, в конечном итоге именно мы трое начали нечто столь особенное и изменили направление, движение и историю металла в том виде, в каком мы его знаем.","Мы узнали об этом два дня назад, но, разумеется, без согласия и по желанию семьи Конрада мы не имели права никому ничего говорить и уважали это.","В такие моменты я вспоминаю ту дружбу, которая связывала нас в те ранние дни, тот дух „один за всех, все за одного“, ту бунтарскую сущность и абсолютное стремление быть чем-то совершенно иным — независимо от того, принимали нас или нет.","У меня до сих пор сохранилось много ранних видеозаписей, на которых мы втроем просто смеялись, порой без всякой причины, просто дурачась — наше чувство юмора было не для всех.","Я благодарю вас всех за бесчисленные сообщения, и, как я уже сказал, несмотря на всю историю, ссоры, оскорбления, взлеты и падения, а также дисфункциональный характер этой группы, это сильно бьет по мне.","Я свяжусь с вами завтра, друзья мои.","Покойся с миром, Конрад Кронос Лант»."],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T01:53:29+00:00","original_url":"http://www.darkside.ru/news/184185/","saved_at":1790926477,"artists":[{"id":"venom","name":"Venom"}],"original_title":"JEFF \u0026#039;MANTAS\u0026#039; DUNN почтил память вокалиста VENOM","topics":[]},{"id":"2b57b718b23703da38307e2bb12fdbf32406bdd7","title":"Новое видео COMEBACK KID","short":"Yesterday's Gone feat. Brendan Garrone, новое видео группы COMEBACK KID, доступно для просмотра ниже. Эта песня взята из альбома \"Chosen Hell\", выходящего шестого ноября на SharpTone Records в США и на Dine Alone Records в Канаде. Трек-лист:","paragraphs":["Yesterday's Gone feat. Brendan Garrone, новое видео группы COMEBACK KID, доступно для просмотра ниже. Эта песня взята из альбома \"Chosen Hell\", выходящего шестого ноября на SharpTone Records в США и на Dine Alone Records в Канаде.","Трек-лист:","01. Target On My Back","02. Vindication","03. Shedding Season (feat. SPIRITBOX's Courtney LaPlante)","04. Lost And Found","05. Underneath The Pressure","06. Chosen Hell","07. Yesterday's Gone (feat. INCENDIARY's Brendan Garrone)","08. Tunnel Vision","09. Becoming","10. Heartland Elegy","11. Too Late"],"category":"Прогрессив","source":"Darkside","published":"2026-10-02T05:32:42+00:00","original_url":"http://www.darkside.ru/news/183939/","saved_at":1790926456,"artists":[],"original_title":"Новое видео COMEBACK KID","topics":["releases"]},{"id":"feb2c8e6ea603f69413201605ef0487e994074df","title":"Новая песня FAKE NAMES","short":"\"If You Could See Me Today\", новое видео с текстом от группы FAKE NAMES, в состав которой входят Brian Baker (MINOR THREAT, DAG NASTY, BAD RELIGION), Michael Hampton (S.O.A., EMBRACE, THE FAITH), Dennis Lyxzén (REFUSED, INVSN), Johnny Temple (GIRLS AGAINST BOYS, SOULSIDE) и Mario Rubalcaba (ROCKET FROM THE CRYPT, OFF!), доступно для просмотра ниже.","paragraphs":["\"If You Could See Me Today\", новое видео с текстом от группы FAKE NAMES, в состав которой входят Brian Baker (MINOR THREAT, DAG NASTY, BAD RELIGION), Michael Hampton (S.O.A., EMBRACE, THE FAITH), Dennis Lyxzén (REFUSED, INVSN), Johnny Temple (GIRLS AGAINST BOYS, SOULSIDE) и Mario Rubalcaba (ROCKET FROM THE CRYPT, OFF!), доступно для просмотра ниже. Эта песня взята из альбома \"Punk Ruins\", выходящего 23 октября на Epitaph.","«Мы записали двенадцать песен за пять дней, и все они вошли в альбом», — объясняет Baker, добавляя, что Lyxzén записал свой вокал за один день.","«Одно из преимуществ того, что мы все работаем дома, — это то, что у нас есть достаточно времени, чтобы обдумать, что именно мы собираемся делать», — добавляет Baker, когда его спрашивают, как группе удалось создать столь целостный альбом за время, которое некоторые другие коллективы тратят исключительно на предпродакшн.","«Я знаю, каким будет гитарное соло, потому что я уже сыграл его дома и отправил Michael'y , чтобы он его доработал. Это не так сложно, как кажется.","Этот альбом — результат коллективного творчества, и большая часть удовольствия заключается в том, чтобы посмотреть, как, черт возьми, он в итоге получится», — объясняет Brian, добавляя, что мастерство других музыкантов помогло преобразовать его первоначальные идеи и идеи Hampton'а в нечто, намного превосходящее их ожидания. Такие треки, как «Diamond Buzz», создают гипнотический грув, в то время как заглавный трек демонстрирует несомненный хардкор-саунд, на котором где Lyxzén поёт на полную мощность, усиливая и без того острые как бритва хуки песни.","Трек-лист:","01. Until It's Normal","02. Good Old Days","03. Punk Ruins","04. Cover The Distance","05. What I Tell Myself","06. Diamond Buzz","07. Language Lost","08. Beautiful Scars","09. If You Could See Me Today","10. The Little Wonders","11. Scream","12. Paradise"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T06:55:14+00:00","original_url":"http://www.darkside.ru/news/184158/","saved_at":1790926453,"artists":[],"original_title":"Новая песня FAKE NAMES","topics":["releases"]},{"id":"eb4dba4ee424aff5ab8df29943019c0a0645cb34","title":"ANTHRAX не думают о пенсии","short":"Во время визита в программу «Trunk Nation With Eddie Trunk» участники ANTHRAX подтвердили, что не планируют уходить на покой, однако недавно вышедший альбом «Cursum Perficio», первый за десять лет, вполне может оказаться их последним полноформатным релизом.","paragraphs":["Во время визита в программу «Trunk Nation With Eddie Trunk» участники ANTHRAX подтвердили, что не планируют уходить на покой, однако недавно вышедший альбом «Cursum Perficio», первый за десять лет, вполне может оказаться их последним полноформатным релизом. Когда ведущий спросил, есть ли у ANTHRAX планы подвести черту в обозримом будущем, гитарист Scott Ian ответил:","«Вы не думаете, что если бы такой был план, мы бы разыграли эту карту, как столько других групп, и заявили: „Вот и всё. Смотрите, это написано прямо в названии альбома. Наш путь окончен, так что лучше купите эту пластинку и лучше идите покупать билеты. Мы будем только гастролировать и займёмся этим ещё лет пять\".","А потом придумали бы отговорку: „Ну, мы говорили, что путь окончен, но на самом деле он окончен лишь отчасти. Так что теперь мы записываем ещё один альбом\"».","Коснувшись того, что множество других хард-рок- и хеви-металл-групп в последние годы объявляли о прощальных турах, но потом передумывали и возвращались к концертам, барабанщик ANTHRAX Charlie Benante сказал:","«Когда ты достигаешь определённого уровня, у тебя появляются менеджеры и агенты, которые говорят: „Слушайте, на вас всё ещё есть спрос\". Потом они разговаривают с каким-нибудь промоутером, и тот отвечает: „Я не против, если он согласится\". И всё начинает складываться в: „Ладно, давайте сделаем это снова\".","Как тут остановиться? Сколько лет мы уже в это вложили? Сорок с лишним. Ты построил магазин. Зачем его закрывать?»","Scott добавил:","«Вы знаете эту фразу, которую все слышат, она постоянно звучит. Это одна из тех главных фраз, которые слышишь снова и снова: „Ты же понимаешь, что пролетаешь мимо кучи денег\". Вот это и слышишь постоянно.","Я сейчас не про нас, потому что мы не говорили, что уходим на покой. Но я слышу про другие группы, которые объявляли о завершении карьеры, а потом возвращались, и всегда звучит одно и то же: „Ну, можно ж столько бабла поднять!\" [Смеётся]»"],"category":"Хэви-метал","source":"Darkside","published":"2026-10-02T07:53:02+00:00","original_url":"http://www.darkside.ru/news/184154/","saved_at":1790926439,"artists":[{"id":"anthrax","name":"Anthrax"}],"original_title":"ANTHRAX не думают о пенсии","topics":[]},{"id":"40ae4c62e25c005508e50f6b1eb77ebcf4a9f1ef","title":"I AM YOUR GOD исполняют SENTENCED","short":"I AM YOUR GOD предс
