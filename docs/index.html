function allBands(){return [...catalog,...prefs.custom].filter((a,i,arr)=>arr.findIndex(b=>b.id===a.id)===i);}
function isFavorite(id){return prefs.favorites.includes(id);}
function selectArticles(items,{view='all',topic='all',band=null,query=''}={}){return items.filter(a=>!artistList(a).some(b=>prefs.blocked.includes(b.id))&&(view!=='mine'||artistList(a).some(b=>isFavorite(b.id)))&&(view!=='saved'||prefs.saved.includes(a.id))&&(!band||artistList(a).some(b=>b.id===band.id))&&(topic==='all'||(a.topics||[]).includes(topic))&&(!query||norm([a.title,a.original_title,a.source,...artistList(a).map(b=>b.name),...(a.paragraphs||[])].join(' ')).includes(norm(query))));}
function node(tag,text,cls){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(cls)el.className=cls;return el;}
function button(text,fn,cls){const b=node('button',text,cls);b.type='button';b.addEventListener('click',fn);return b;}
function toggleFavorite(id){prefs.blocked=prefs.blocked.filter(x=>x!==id);prefs.favorites=isFavorite(id)?prefs.favorites.filter(x=>x!==id):[...prefs.favorites,id];persist();renderBrowse();if(current)renderTags(current);}
function star(b){const el=button(isFavorite(b.id)?'★':'☆',()=>{registerBand(b);toggleFavorite(b.id);},'star');el.setAttribute('aria-label',(isFavorite(b.id)?'Убрать из избранного: ':'Добавить в избранное: ')+b.name);el.setAttribute('aria-pressed',String(isFavorite(b.id)));return el;}
function date(a){const d=new Date(a.published);return Number.isNaN(d.getTime())?'':d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});}
function registerBand(b){if(!allBands().some(x=>x.id===b.id)){prefs.custom.push(b);persist();}else if(b.qid){const existing=allBands().find(x=>x.id===b.id);existing.qid=b.qid;persist();}}
function openBand(b){if(current||view==='band')navigationStack.push({view,band,current,topic,query,bandSection,albumKind,detail,detailStack:[...detailStack],returnView});if(view!=='band')returnView=view;detailStack=[];registerBand(b);history.replaceState(null,'','?band='+encodeURIComponent(b.id));band=b;bandSection='about';albumKind='studio';detail=null;view='band';$('backBtn').textContent='‹ Назад';topic='all';query='';$('search').value='';current=null;showBrowse();renderBrowse();loadGroupData(b);scrollTop();}
function scrollTop(){window.scrollTo?.({top:0,behavior:'instant'});}
function showBrowse(){ $('browse').classList.remove('hidden');$('content').classList.add('hidden');$('backBtn').classList.toggle('hidden',view!=='band'); }
function renderTags(a){$('articleTags').replaceChildren();for(const b of artistList(a)){const chip=button(b.name,()=>openBand(b));$('articleTags').append(chip,star(b));}}
function updateSave(){const saved=prefs.saved.includes(current.id);$('saveArticle').textContent=saved?'✓ Сохранено':'Сохранить статью';$('saveArticle').setAttribute('aria-pressed',String(saved));}
function openArticle(a,updateUrl=true){current=a;$('browse').classList.add('hidden');$('content').classList.remove('hidden');$('backBtn').classList.remove('hidden');$('backBtn').textContent='‹ Назад';$('title').textContent=a.title||'Без заголовка';$('meta').textContent=[a.category,a.source,date(a),a.translation_pending?'Оригинал · перевод ожидает повтора':''].filter(Boolean).join(' · ');$('article').replaceChildren();for(const p of a.paragraphs||[])$('article').append(node('p',p));renderTags(a);updateSave();const link=$('sourceLink');const valid=/^https?:\/\//i.test(a.original_url||'');link.href=valid?a.original_url:'#';link.style.display=valid?'flex':'none';if(updateUrl)history.replaceState(null,'','?id='+encodeURIComponent(a.id));scrollTop();}
function empty(text,action,label){const el=node('div',undefined,'empty');el.append(node('div',text));if(action)el.append(button(label,action));$('list').append(el);}
function setView(value){lookupToken++;detail=null;detailStack=[];navigationStack=[];view=value;band=null;current=null;query='';topic='all';$('search').value='';history.replaceState(null,'',location.pathname);showBrowse();renderBrowse();scrollTop();}
function renderBrowse(){
const titles={all:'Твоя музыкальная лента',mine:'Новости моих групп',bands:'Выбери любимые группы',saved:'Прочитать позже',band:band?.name,discover:'Найти исполнителя'};
const intros={all:'Новости, релизы и концерты из любимых изданий.',mine:'Материалы, в которых упоминаются твои любимые группы.',bands:'Нажми ☆, чтобы добавить группу в свою ленту.',saved:'Статьи, которые ты сохранил. Доступны, пока остаются в архиве.',band:'Музыка, люди и выступления.',discover:'Любой жанр. Найди группу или музыканта и открой карточку.'};
$('viewTitle').textContent=titles[view];$('viewIntro').textContent=intros[view];for(const b of document.querySelectorAll('[data-view]')){if(b.dataset.view===(view==='band'||view==='bands'?'mine':view))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}
for(const b of document.querySelectorAll('[data-topic]'))b.setAttribute('aria-pressed',String(b.dataset.topic===topic));
$('filters').classList.toggle('hidden',['bands','discover'].includes(view));$('preferencesNote').classList.toggle('hidden',!['bands','mine'].includes(view));$('search').placeholder=['bands','discover'].includes(view)?'Группа или музыкант':'Найти новость или группу';$('list').replaceChildren();$('bandHero').replaceChildren();$('bandHero').classList.toggle('hidden',view!=='band');
$('bandTabs').classList.toggle('hidden',view!=='band');$('bandInfo').classList.add('hidden');$('search').classList.remove('hidden');
for(const b of document.querySelectorAll('[data-band-section]'))b.setAttribute('aria-pressed',String(b.dataset.bandSection===bandSection));
$('groupShelf').replaceChildren();$('groupShelf').classList.toggle('hidden',view!=='mine');if(view==='mine')renderFavorites();
if(view==='discover'){renderDiscovery();return;}
if(view==='band'){$('bandHero').append(node('div',prefs.blocked.includes(band.id)?'Новости скрыты':isFavorite(band.id)?'В твоём избранном':'Добавить в свою ленту','muted'),star(band),blockButton(band));}
if(view==='band'&&bandSection!=='news'){$('filters').classList.add('hidden');$('search').classList.add('hidden');$('resultCount').textContent='';renderProfile();return;}
if(view==='bands'){
const filtered=allBands().filter(b=>norm([b.name,...(b.aliases||[])].join(' ')).includes(norm(query))).sort((a,b)=>Number(isFavorite(b.id))-Number(isFavorite(a.id))||a.name.localeCompare(b.name));
$('resultCount').textContent=`Избрано: ${prefs.favorites.length} · Найдено групп: ${filtered.length}`;
for(const b of filtered){const row=node('div',undefined,'band-row');const name=button(b.name,()=>openBand(b),'band-title');name.append(node('small',`Материалов: ${articles.filter(a=>artistList(a).some(x=>x.id===b.id)).length}`));row.append(name,star(b),blockButton(b));$('list').append(row);}
if(query.trim()&&!allBands().some(b=>norm(b.name)===norm(query))){const name=query.trim().slice(0,80);const add=button(`Добавить «${name}»`,()=>{const b={id:'custom:'+norm(name),name};prefs.custom.push(b);prefs.favorites.push(b.id);persist();query='';$('search').value='';renderBrowse();});$('list').append(add,node('p','Для своей группы поиск идёт по точному названию в тексте новости.','muted'));}
return;}
const selected=selectArticles(articles,{view,topic,band,query});$('resultCount').textContent=`Материалов: ${selected.length}`;
if(!selected.length){if(view==='mine'&&!prefs.favorites.length)empty('Выбери любимые группы, и здесь появятся их новости.',()=>setView('bands'),'Выбрать группы');else empty(view==='saved'?'Здесь пока нет сохранённых статей из доступного архива.':'В доступном архиве нет подходящих материалов. Попробуй другой фильтр.');}
for(const a of selected){const card=node('article',undefined,'card');card.append(node('div',[a.source,date(a),a.translation_pending?'Оригинал · перевод ожидает повтора':''].filter(Boolean).join(' · '),'muted'),button(a.title,()=>openArticle(a),'headline'),node('p',a.short||''));const tags=node('div',undefined,'tags');for(const b of artistList(a).slice(0,3))tags.append(button(b.name,()=>openBand(b)));card.append(tags);const footer=node('div',undefined,'card-footer');footer.append(button('Читать →',()=>openArticle(a),'read'),button(prefs.saved.includes(a.id)?'✓':'＋',()=>{prefs.saved=prefs.saved.includes(a.id)?prefs.saved.filter(x=>x!==a.id):[...prefs.saved,a.id];persist();renderBrowse();},'bookmark'));footer.lastChild.setAttribute('aria-label',prefs.saved.includes(a.id)?'Убрать из сохранённого':'Сохранить статью');card.append(footer);$('list').append(card);}
}

function profileFor(b){const raw=profiles[b.id]||{},review=raw.reviewed||{};const age=Date.now()-new Date(review.members_checked_at||0).getTime();if(review.members_checked_at&&age>30*86400000)return {...raw,members_note:(raw.members_note||'')+' Ручная проверка состава устарела; показаны сведения справочника.'};return {...raw,...review};}
function upcomingEvents(p,now=new Date()){const today=now.toLocaleDateString('sv-SE',{timeZone:'Asia/Novosibirsk'});return (p.events||[]).filter(e=>/^\d{4}-\d{2}-\d{2}$/.test(e.date)&&e.city&&e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));}
function sourceLabel(url){try{return new URL(url).hostname.replace(/^www\./,'');}catch(e){return 'Источник';}}
function source(parent,url,label){if(!/^https?:\/\//i.test(url||''))return;const a=node('a',label||sourceLabel(url),'source');a.href=url;a.target='_blank';a.rel='noopener';parent.append(a);}
function checked(parent,value){if(value){const d=new Date(value);if(!Number.isNaN(d.getTime()))parent.append(node('p','Проверено: '+d.toLocaleDateString('ru-RU'),'muted'));}}
function eventDate(e){return new Date(e.date+'T12:00:00').toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});}
function eventCard(e){const card=node('div',undefined,'card');card.append(node('div',eventDate(e),'muted'),node('h2',[e.city,e.country].filter(Boolean).join(' · ')),node('p',e.venue||''));source(card,e.source_url,'Афиша / источник ↗');return card;}
function renderProfile(){const holder=$('bandInfo');holder.classList.remove('hidden');holder.replaceChildren();if(detail){renderDetail(holder);return;}const raw=profileFor(band),facts=music[band.id]?.data||{},p={...raw,origin:raw.origin||facts.origin,genres:raw.genres||facts.genres,website:raw.website||facts.website},events=upcomingEvents(p);
if(['members','albums','setlists'].includes(bandSection)){renderMusicSection(holder,p);return;}
if(bandSection==='tour'){holder.append(node('h2','Предстоящие концерты'));if(!events.length)holder.append(node('p','В нашей базе пока нет подтверждённых будущих дат. Это не означает, что группа не выступает.','muted'));for(const e of events)holder.append(eventCard(e));checked(holder,p.tour_checked_at);source(holder,p.tour_source||p.website,'Расписание на сайте группы ↗');return;}
if(bandSection==='where'){holder.append(node('h2','Где выступают'));const today=new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Novosibirsk'});if(events.length){holder.append(node('p',events[0].date===today?'По афише на сегодняшнюю дату:':'Ближайшая дата из нашей афиши:'));holder.append(eventCard(events[0]));}else holder.append(node('p','Актуальное расписание выступлений для этой группы пока не подключено.','muted'));holder.append(node('p','Показываем место выступления по афише. Фактическое местоположение участников не известно.','muted'));checked(holder,p.tour_checked_at);return;}
if(bandSection==='members'){holder.append(node('h2','Состав'));if(p.members_note)holder.append(node('p',p.members_note,'muted'));if(p.members?.length){for(const member of p.members){const row=node('div',undefined,'band-row');row.append(node('div',member.name));if(member.role)row.append(node('div',member.role,'muted'));holder.append(row);}}else holder.append(node('p','Подтверждённый список участников пока не добавлен.','muted'));checked(holder,p.members_checked_at||p.reference_checked_at);source(holder,p.members_source||p.reference_url,'Источник состава ↗');return;}
const m=music[band.id];if(m?.data?.description)holder.append(node('p',m.data.description,'section-note'));if(m?.error)holder.append(node('p',m.error,'section-note'),button('Повторить загрузку справки',()=>loadGroupData(band,true)));else if(m?.loading)holder.append(node('p','Загружаем справочные данные…','loading-note'));holder.append(node('h2','Об исполнителе'));if(facts.isPerson)holder.append(button('Возраст, проекты и история музыканта',()=>openPerson(facts.qid)));for(const [label,value] of [['Откуда',p.origin],['Жанры',p.genres],['Годы активности',p.years_active],['Инструменты',p.instruments]])if(value){const row=node('div',undefined,'band-row');row.append(node('div',label,'muted'),node('div',value));holder.append(row);}if(facts.formed)holder.append(node('div','Дата основания в Wikidata: '+facts.formed.text,'fact'));if(p.about)holder.append(node('p',p.about));if(!p.reference_url&&!p.about&&!facts.source_url&&!m?.loading)holder.append(node('p','Справка пока не подключена. Новости этой группы доступны в соседнем разделе.','muted'));checked(holder,p.reference_checked_at);source(holder,p.website,'Сайт группы ↗');source(holder,p.reference_url,'Справочник ↗');source(holder,facts.source_url,'Wikidata ↗');if(facts.source_url)musicNote(holder);}

function toggleBlocked(id){prefs.blocked=prefs.blocked.includes(id)?prefs.blocked.filter(x=>x!==id):[...prefs.blocked,id];if(prefs.blocked.includes(id))prefs.favorites=prefs.favorites.filter(x=>x!==id);persist();renderBrowse();}
function blockButton(b){const el=button('⊘',()=>{registerBand(b);toggleBlocked(b.id);},'blocked');el.setAttribute('aria-label',(prefs.blocked.includes(b.id)?'Показывать новости: ':'Скрыть новости: ')+b.name);el.setAttribute('aria-pressed',String(prefs.blocked.includes(b.id)));return el;}
function bandRow(b){const row=node('div',undefined,'band-row');const title=button(b.name,()=>openBand(b),'band-title');if(b.description)title.append(node('small',b.description));row.append(title,star(b),blockButton(b));return row;}
function renderFavorites(){const el=$('groupShelf');for(const b of allBands().filter(b=>isFavorite(b.id)))el.append(bandRow(b));el.append(button('Выбрать из каталога',()=>setView('bands')),button('Найти другую группу',()=>setView('discover')));const hidden=allBands().filter(b=>prefs.blocked.includes(b.id));if(hidden.length){const d=node('details');d.append(node('summary','Скрытые исполнители · '+hidden.length));for(const b of hidden)d.append(bandRow(b));el.append(d);}}
function renderDiscovery(){ $('resultCount').textContent='Поиск по Wikidata · результаты нужно выбрать вручную';$('list').append(button('Найти исполнителя',searchRemote,'search-action'));if(!query.trim()){$('list').append(node('p','Введи название. Например: Dream Theater, ABBA или Taylor Swift.','section-note'));return;}const local=allBands().filter(b=>norm(b.name).includes(norm(query)));for(const b of local)$('list').append(bandRow(b));}
async function searchRemote(){const token=++lookupToken,text=query.trim();if(text.length<2){$('resultCount').textContent='Введи хотя бы два символа';return;}$('resultCount').textContent='Ищем исполнителя…';try{const results=await window.MusicData.search(text);if(token!==lookupToken||view!=='discover'||query.trim()!==text)return;$('list').replaceChildren();$('resultCount').textContent='Найдено: '+results.length+' · выбери точное совпадение';for(const r of results){const local=allBands().find(b=>norm(b.name)===norm(r.name));const b=local?{...local,qid:r.qid,description:r.description}:r;const row=bandRow(b);row.children[0].addEventListener('click',()=>{if(!allBands().some(x=>x.id===b.id)){prefs.custom.push(b);persist();}else if(local&&!local.qid){local.qid=b.qid;} });$('list').append(row);}if(!results.length)$('list').append(node('p','Музыкальных совпадений не найдено. Попробуй оригинальное название.','section-note'));}catch(e){if(token===lookupToken&&view==='discover'){$('resultCount').textContent='Поиск сейчас недоступен';$('list').append(node('p','Источник не ответил. Попробуй ещё раз.', 'section-note'),button('Повторить',searchRemote));}}}
async function loadGroupData(b,retry=false){if(!window.MusicData)return;const previous=music[b.id];if(!retry&&(previous?.data||previous?.loading))return;music[b.id]={loading:true};if(view==='band'&&band?.id===b.id)renderBrowse();try{const data=await window.MusicData.group(b,profileFor(b));music[b.id]={data};const saved=prefs.custom.find(x=>x.id===b.id);if(saved){saved.aliases=[...new Set([saved.name,...Object.values(data.entity.labels||{}).map(x=>x.value)])];persist();}if(view==='band'&&band?.id===b.id)renderBrowse();}catch(e){music[b.id]={error:e.message||'Справочный источник недоступен.'};if(view==='band'&&band?.id===b.id)renderBrowse();}}
function musicNote(holder){holder.append(node('p','Справочные базы могут содержать пропуски и устаревшие записи. Совпадение Википедии и Wikidata не считается независимым подтверждением.','section-note'));}
function ageWord(age){return age%100>=11&&age%100<=14?'лет':age%10===1?'год':[2,3,4].includes(age%10)?'года':'лет';}
function musicalText(s){return String(s||'').replace(/lead and backing vocals/gi,'ведущий и бэк-вокал').replace(/backing vocals/gi,'бэк-вокал').replace(/lead vocals/gi,'ведущий вокал').replace(/bass guitar/gi,'бас-гитара').replace(/guitars?/gi,'гитара').replace(/keyboards?/gi,'клавишные').replace(/drums/gi,'ударные').replace(/percussion/gi,'перкуссия').replace(/vocals/gi,'вокал').replace(/piano/gi,'фортепиано').replace(/voice/gi,'вокал').replace(/soprano saxophone/gi,'сопрано-саксофон').replace(/saxophone/gi,'саксофон').replace(/assistant engineer/gi,'ассистент звукорежиссёра').replace(/engineer/gi,'звукорежиссёр').replace(/producer/gi,'продюсер').replace(/mixing/gi,'сведение').replace(/mastering/gi,'мастеринг').replace(/art direction/gi,'художественное оформление').replace(/continuum/gi,'континуум').replace(/occasional/gi,'иногда').replace(/synthesizers?/gi,'синтезатор').replace(/harmonica/gi,'губная гармоника').replace(/bass/gi,'бас').replace(/present/gi,'настоящее время').replace(/died/gi,'умер').replace(/guest/gi,'гость');}
function memberRow(member,official){const role=official?.role||member.role;const b=button('',()=>openPerson(member.id),'member-card');b.append(node('strong',member.name));if(role)b.append(node('small',musicalText(role)));if(official?.text)b.append(node('small',musicalText(official.text.replace(official.name,'').replace(/^[\s–—-]+/,''))));else{if(!role)b.append(node('small','Роль в группе не указана в источнике'));b.append(node('small','В группе: '+window.MusicData.span(member.begin,member.end)));}if(!role&&!official?.text&&member.instruments)b.append(node('small','Инструменты музыканта: '+musicalText(member.instruments)));if(member.birth)b.append(node('small',(member.death?'Годы жизни: ':'Родился: ')+member.birth.text+(member.death?' → '+member.death.text:'')+(member.age!==null?' · '+member.age+' '+ageWord(member.age)+(member.death?' на момент смерти':''):'')));return b;}
function renderMusicSection(holder,p){const state=music[band.id],data=state?.data;
if(bandSection==='setlists'){holder.append(node('h2','Концертные сетлисты'));const sets=p.setlist_analysis;if(sets?.shows?.length){holder.append(node('p','Сравнение проверенных сольных концертов. Фестивали не включены.','section-note'));if(sets.tour)holder.append(node('h2',sets.tour));for(const row of sets.songs||[])holder.append(node('div',row.name+' · '+row.count+'/'+sets.shows.length+(row.count===sets.shows.length?' · на всех концертах выборки':' · меняется'),'fact'));for(const show of sets.shows)source(holder,show.url,show.date+' · '+show.venue);}else{holder.append(node('p','Автоматическая загрузка setlist.fm ещё не подключена: нужен API-ключ. Основной сетлист и заменяемые песни появятся после проверки сольных концертов.','section-note'));source(holder,'https://www.setlist.fm/search?query='+encodeURIComponent(band.name),'Открыть setlist.fm ↗');}return;}
if(bandSection==='albums'){holder.append(node('h2','Альбомы'));if(!data){musicStatus(holder,state);return;}const kinds=node('div',undefined,'filters');for(const [key,label] of [['studio','Студийные'],['live','Концертные'],['compilation','Сборники']]){const tab=button(label,()=>{albumKind=key;renderBrowse();});tab.setAttribute('aria-pressed',String(key===albumKind));kinds.append(tab);}holder.append(kinds);const a=state.albumLists?.[albumKind];if(a){holder.append(node('p','Список из дискографии Википедии по типу издания. Он может быть неполным; кредиты записи показываются в карточке альбома.','section-note'));if(!a.length)holder.append(node('p','Источник пока не содержит альбомов этого исполнителя.','section-note'));for(const album of a){const row=button('',()=>openAlbum(album.id),'album-row');row.append(node('strong',album.name),node('small',album.date?.slice(0,4)||'Год не указан'));holder.append(row);}source(holder,data.wikiSource,'Дискография исполнителя в Википедии ↗');}else if(state.albumErrors?.[albumKind]){holder.append(node('p','Каталог альбомов не загрузился.','section-note'),button('Повторить',()=>loadAlbums(band,true)));}else{holder.append(node('p','Загружаем альбомы…','loading-note'));loadAlbums(band);}return;}
holder.append(node('h2','Участники группы'));const official=p.members||[];if(!data){if(official.length){for(const m of official){const row=node('div',undefined,'member-card');row.append(node('strong',m.name),node('small',m.role||'Инструмент не указан'),node('small','Период участия и возраст пока не загружены'));holder.append(row);}source(holder,p.members_source||p.reference_url,'Источник состава ↗');}musicStatus(holder,state);return;}
const wiki=data.wikiMembers||[];const matching=m=>official.find(o=>norm(o.name)===norm(m.name));const currentNames=new Set(official.map(o=>norm(o.name)));const active=[...new Map(data.members.filter(m=>currentNames.has(norm(m.name))).sort((a,b)=>Number(!!b.end)-Number(!!a.end)).map(m=>[norm(m.name),m])).values()],former=data.members.filter(m=>m.end&&!currentNames.has(norm(m.name))),uncertain=data.members.filter(m=>!m.end&&!currentNames.has(norm(m.name)));
if(active.length){holder.append(node('p','Участники из опубликованного состава. Роли: '+sourceLabel(p.members_source||p.reference_url)+'. Периоды и даты рождения: Wikidata.','section-note'));for(const m of active)holder.append(memberRow(m,{...wiki.find(w=>norm(w.name)===norm(m.name)),...matching(m)}));}
for(const o of official.filter(o=>!data.members.some(m=>norm(m.name)===norm(o.name)))){const w=wiki.find(w=>norm(w.name)===norm(o.name));const row=w?button('',()=>openPersonTitle(w.title),'member-card'):node('div',undefined,'member-card');row.append(node('strong',o.name),node('small',o.role|| (w?musicalText(w.text.replace(w.name,'').replace(/^[\s–—-]+/,'')):'Инструмент не указан')));if(!w)row.append(node('small','В справочнике нет периода участия'));holder.append(row);}
if(former.length){const d=node('details');d.append(node('summary','Предыдущие участники · '+former.length));for(const m of former)d.append(memberRow(m,wiki.find(w=>norm(w.name)===norm(m.name))));holder.append(d);}
if(uncertain.length){const d=node('details');d.append(node('summary','Участие без подтверждённой даты окончания · '+uncertain.length));for(const m of uncertain)d.append(memberRow(m,wiki.find(w=>norm(w.name)===norm(m.name))));holder.append(d);}
const extra=wiki.filter(w=>!data.members.some(m=>norm(m.name)===norm(w.name))&&!official.some(o=>norm(o.name)===norm(w.name)));if(extra.length){const d=node('details');d.append(node('summary','Участники и периоды из Википедии · '+extra.length));for(const w of extra){const row=button('',()=>openPersonTitle(w.title),'member-card');row.append(node('strong',w.name),node('small',musicalText(w.text.replace(w.name,'').replace(/^[\s–—-]+/,''))),node('small',w.kind==='former'?'Бывший участник':w.kind==='current'?'Указан в опубликованном составе':'Статус требует уточнения'));d.append(row);}holder.append(d);source(holder,data.wikiHistorySource||data.wikiSource,'Роли и история состава в Википедии ↗');}
if(!data.members.length&&!official.length)holder.append(node('p','В источнике нет участников. Это не означает, что состав отсутствует.','section-note'));
if(p.members_note)holder.append(node('p',p.members_note,'section-note'));musicNote(holder);checked(holder,data.checked_at);source(holder,p.members_source||p.reference_url,'Источник опубликованного состава ↗');source(holder,data.source_url,'Периоды участия и даты рождения ↗');if(wiki.length)source(holder,data.wikiSource,'Роли и периоды из Википедии ↗');}
function musicStatus(holder,state){holder.append(node('p',state?.error||'Загружаем справочные данные…','loading-note'));if(state?.error)holder.append(button('Повторить',()=>loadGroupData(band,true)));}
async function loadAlbums(b,retry=false){const state=music[b.id],kind=albumKind;if(!state?.data)return;state.albumLists||={};state.albumLoading||={};state.albumErrors||={};if(!retry&&(state.albumLoading[kind]||state.albumLists[kind]))return;state.albumLoading[kind]=true;state.albumErrors[kind]=false;try{state.albumLists[kind]=await window.MusicData.albums(state.data.qid,kind);}catch(e){state.albumErrors[kind]=true;}finally{state.albumLoading[kind]=false;if(view==='band'&&band?.id===b.id&&bandSection==='albums'&&albumKind===kind)renderBrowse();}}
async function openPerson(qid){if(detail)detailStack.push(detail);detail={kind:'person',loading:true};renderBrowse();scrollTop();const pending=detail;try{pending.data=await window.MusicData.person(qid);}catch(e){pending.error=e.message;}pending.loading=false;if(detail===pending)renderBrowse();}
async function openPersonTitle(title){if(detail)detailStack.push(detail);detail={kind:'person',loading:true};renderBrowse();scrollTop();const pending=detail;try{pending.data=await window.MusicData.personByTitle(title);}catch(e){pending.error=e.message;}pending.loading=false;if(detail===pending)renderBrowse();}
async function openAlbum(qid){if(detail)detailStack.push(detail);detail={kind:'album',loading:true};renderBrowse();scrollTop();const pending=detail;try{pending.data=qid.startsWith('wiki:')?await window.MusicData.albumByTitle(qid.slice(5)):await window.MusicData.album(qid);}catch(e){pending.error=e.message;}pending.loading=false;if(detail===pending)renderBrowse();}
function creditText(text){const parts=text.split(/\s+[–—-]\s+/);return parts.length>1?parts.shift()+' — '+musicalText(parts.join(' — ')):text;}
function renderDetail(holder){holder.append(button(detailStack.length?'‹ Назад':'‹ Назад к группе',()=>{detail=detailStack.pop()||null;renderBrowse();scrollTop();}));if(detail.loading){holder.append(node('p','Загружаем карточку…','loading-note'));return;}if(detail.error){holder.append(node('p',detail.error,'section-note'));return;}const d=detail.data;holder.append(node('div',detail.kind==='person'?'Музыкант':'Альбом','detail-head'),node('h1',d.name));if(d.description)holder.append(node('p',d.description,'section-note'));
if(detail.kind==='person'){if(d.birth)holder.append(node('div','Дата рождения: '+d.birth.text,'fact'));if(d.death)holder.append(node('div','Дата смерти: '+d.death.text,'fact'));if(d.age!==null)holder.append(node('div',(d.death?'Возраст на момент смерти: ':'Возраст: ')+d.age+' '+ageWord(d.age),'fact'));if(d.instruments)holder.append(node('div','Инструменты: '+musicalText(d.instruments),'fact'));holder.append(node('h2','Участие в проектах'));for(const project of d.projects){const row=button('',()=>{const b=allBands().find(b=>norm(b.name)===norm(project.name))||{id:'wd:'+project.qid,qid:project.qid,name:project.name};if(!allBands().some(x=>x.id===b.id)){prefs.custom.push(b);persist();}openBand(b);},'album-row');row.append(node('strong',project.name),node('small',(project.begin||'Начало не указано')+' → '+(project.end||'Окончание не указано')));holder.append(row);}if(!d.projects.length)holder.append(node('p','В источнике нет истории участия в проектах.','section-note'));if(d.projectsError)holder.append(node('p','Часть связей с группами не загрузилась.','section-note'));holder.append(button('Альбомы с личным кредитом исполнителя',async()=>{const pending=detail;try{const rows=await window.MusicData.albums(d.qid,'credit');if(detail!==pending)return;const block=node('div');block.append(node('p','Только прямой кредит в базе. Участие в группе не доказывает участие в записи каждого её альбома.','section-note'));for(const a of rows)block.append(button(a.name+' · '+a.date.slice(0,4),()=>openAlbum(a.id),'album-row'));if(!rows.length)block.append(node('p','Прямые альбомные кредиты в базе не найдены.','section-note'));holder.append(block);}catch(e){if(detail===pending)holder.append(node('p','Не удалось загрузить альбомы.','section-note'));}}));
}else{if(d.date)holder.append(node('div','Дата выпуска: '+d.date.text,'fact'));holder.append(node('h2','Трек-лист'));if(d.tracks.length){const list=node('ol');for(const t of d.tracks)list.append(node('li',t.title+(t.duration&&t.duration!==t.title?' · '+t.duration:'')));holder.append(list);}else holder.append(node('p',d.detailsError?'Источник трек-листа не загрузился.':'Трек-лист в подключённом источнике не найден.','section-note'));holder.append(node('h2','Участники записи и кредиты'));for(const credit of d.credits)holder.append(credit.title?button(creditText(credit.text),()=>openPersonTitle(credit.title),'album-row'):node('div',creditText(credit.text),'fact'));if(!d.credits.length)holder.append(node('p','Кредиты записи не найдены. Состав группы не подставляется вместо участников записи.','section-note'));source(holder,d.wiki_url,'Трек-лист и кредиты в Википедии ↗');}musicNote(holder);source(holder,d.source_url,'Справочная карточка ↗');}

$('closeBtn').addEventListener('click',()=>{if(tg)tg.close();else history.back();});
$('backBtn').addEventListener('click',()=>{if(detail){detail=detailStack.pop()||null;renderBrowse();scrollTop();return;}if(current){current=null;history.replaceState(null,'',location.pathname);showBrowse();renderBrowse();scrollTop();}else if(navigationStack.length){const previous=navigationStack.pop();({view,band,current,topic,query,bandSection,albumKind,detail,detailStack,returnView}=previous);$('search').value=query;history.replaceState(null,'',band?'?band='+encodeURIComponent(band.id):location.pathname);showBrowse();renderBrowse();if(current)openArticle(current);scrollTop();}else setView(returnView==='band'?'all':returnView);});
$('saveArticle').addEventListener('click',()=>{if(!current)return;prefs.saved=prefs.saved.includes(current.id)?prefs.saved.filter(x=>x!==current.id):[...prefs.saved,current.id];persist();updateSave();});
$('search').addEventListener('input',e=>{query=e.target.value;renderBrowse();});
for(const b of document.querySelectorAll('[data-view]'))b.addEventListener('click',()=>setView(b.dataset.view));
for(const b of document.querySelectorAll('[data-topic]'))b.addEventListener('click',()=>{topic=b.dataset.topic;renderBrowse();});
for(const b of document.querySelectorAll('[data-band-section]'))b.addEventListener('click',()=>{bandSection=b.dataset.bandSection;detail=null;detailStack=[];renderBrowse();});
const ARTICLE_CACHE_KEY='metal-news.articles.v1';
let loadedCatalog=false,loadedProfiles=false;
function restoreArticleCache(){try{let cached=JSON.parse(localStorage.getItem(ARTICLE_CACHE_KEY)||'null');if(!Array.isArray(cached?.articles)){cached=JSON.parse($('articlesSeed').textContent||'null');if(Array.isArray(cached?.articles))try{localStorage.setItem(ARTICLE_CACHE_KEY,JSON.stringify({...cached,cachedAt:Date.now()}));}catch(e){}}if(!Array.isArray(cached?.articles))return false;articles=cached.articles.filter(a=>a&&a.id).sort((a,b)=>new Date(b.published)-new Date(a.published));if(!articles.length)return false;const id=qs.get('id');catalog=[...new Map(articles.flatMap(a=>a.artists||[]).map(a=>[a.id,a])).values()];loadedCatalog=true;$('status').classList.add('hidden');$('app').classList.remove('hidden');renderBrowse();const target=id&&articles.find(a=>String(a.id)===id);if(target)openArticle(target,false);else if(qs.get('band')){const b=allBands().find(b=>b.id===qs.get('band'));if(b)openBand(b);}return true;}catch(e){return false;}}
async function loadOptionalData(){const tasks=[];if(!loadedCatalog){loadedCatalog=true;tasks.push((async()=>{try{const c=await fetch('artists.json',{cache:'no-cache'});if(c.ok)catalog=(await c.json()).artists||[];}catch(e){}if(!catalog.length)catalog=[...new Map(articles.flatMap(a=>a.artists||[]).map(a=>[a.id,a])).values()];})());}if(!loadedProfiles){loadedProfiles=true;tasks.push((async()=>{try{const r=await fetch('artist_profiles.json?t='+Date.now(),{cache:'no-store'});if(r.ok)profiles=(await r.json()).profiles||{};}catch(e){}try{const seed=await fetch('music_cache.json');if(seed.ok&&window.MusicData)window.MusicData.seed(await seed.json());}catch(e){}})());}await Promise.all(tasks);}
async function load(){tries++;try{const r=await fetch('articles.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const data=await r.json();articles=(data.articles||[]).filter(a=>a&&a.id).sort((a,b)=>new Date(b.published)-new Date(a.published));try{localStorage.setItem(ARTICLE_CACHE_KEY,JSON.stringify({articles:data.articles||[],cachedAt:Date.now()}));}catch(e){}const id=qs.get('id');if(id&&!articles.some(a=>String(a.id)===id))throw Error('Article not published');if(!catalog.length)catalog=[...new Map(articles.flatMap(a=>a.artists||[]).map(a=>[a.id,a])).values()];$('status').classList.add('hidden');$('app').classList.remove('hidden');renderBrowse();if(id)openArticle(articles.find(a=>String(a.id)===id),false);else if(qs.get('band')){const b=allBands().find(b=>b.id===qs.get('band'));if(b)openBand(b);}void loadOptionalData();return;}catch(e){console.log(e);}if(tries<60){if(!$('app').classList.contains('hidden')){setTimeout(load,30000);return;}$('statusText').textContent=qs.get('id')?'Статья публикуется. Ещё несколько секунд…':'Не удалось загрузить ленту. Повторяю…';setTimeout(load,3000);}else{$('statusText').textContent='Не удалось загрузить материал. Проверь соединение и попробуй снова.';document.querySelector('.spinner').style.display='none';$('status').append(button('Повторить',()=>{tries=0;load();}));}}
window.MetalNews={toggleBlocked,profileFor,upcomingEvents,selectArticles,mention,artistList,setView,openBand,toggleFavorite,get preferences(){return prefs;}};
restoreArticleCache();load();
})();
