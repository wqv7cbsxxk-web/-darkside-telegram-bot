name: Metal News Aggregator to Telegram

on:
  push:
    branches: [main]
    paths:
      - 'local_translation.py'
      - 'runner.py'
      - 'bot.py'
      - 'tests/**'
      - 'build_mini_app_data.py'
      - '.github/workflows/darkside.yml'
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: "Отправить последнюю новость для проверки Mini App"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: metal-news-aggregator
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache offline translation model
        uses: actions/cache@v4
        with:
          path: .translation-model
          key: argos-en-ru-1.9-591d743a

      - name: Install verified English to Russian model
        run: python local_translation.py

      - name: Test article pipeline
        run: |
          python -m unittest discover -s tests -v
          npm ci --ignore-scripts
          npm test

      - name: Test real offline translation without public APIs
        env:
          LOCAL_TRANSLATION_MODEL: '.translation-model/translate-en_ru-1_9'
        run: python -m unittest discover -s tests -p test_local_translation_integration.py -v

      - name: Run aggregator
        id: aggregator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_LATEST: ${{ inputs.test_latest || 'false' }}
          DISPLAY_TZ: "Asia/Novosibirsk"
          LOCAL_TRANSLATION_MODEL: '.translation-model/translate-en_ru-1_9'
        run: python runner.py

      - name: Embed current feed for Telegram WebView
        id: embed
        if: ${{ always() && (steps.aggregator.outcome == 'success' || steps.aggregator.outcome == 'failure') }}
        run: python build_mini_app_data.py

      - name: Save bot state and Mini App articles
        if: ${{ always() && steps.embed.outcome == 'success' }}
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- state.json docs/articles.json docs/index.html translation_cache.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json docs/articles.json docs/index.html translation_cache.json
            git commit -m "Update bot state and Mini App articles"
            git push
          else
            echo "State and articles unchanged"
          fi

      - name: Refresh public artist profiles
        if: success()
        env:
          SETLIST_FM_API_KEY: ${{ secrets.SETLIST_FM_API_KEY }}
        run: |
          python refresh_artist_profiles.py --limit 6 --budget 40
          python refresh_setlists.py
          python metal_archives.py --limit 3
          python refresh_extra_sources.py --limit 2
          if [[ -n "$(git status --porcelain -- docs/artist_profiles.json docs/metal_archives.json docs/reference_sources.json docs/concerts.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/artist_profiles.json docs/metal_archives.json docs/reference_sources.json docs/concerts.json
            git commit -m "Update public artist profiles"
            git push
          fi
