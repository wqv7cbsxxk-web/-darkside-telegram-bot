name: Metal News Aggregator to Telegram

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: "Отправить последнюю новость для проверки Mini App"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: metal-news-aggregator
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test article pipeline
        run: |
          python -m unittest discover -s tests -v
          node tests/test_mini_app.cjs
          node tests/test_music_data.cjs

      - name: Run aggregator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_LATEST: ${{ inputs.test_latest || 'false' }}
          DISPLAY_TZ: "Asia/Novosibirsk"
        run: python runner.py

      - name: Embed current feed for Telegram WebView
        if: always()
        run: python build_mini_app_data.py

      - name: Save bot state and Mini App articles
        if: always()
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- state.json docs/articles.json docs/index.html translation_cache.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json docs/articles.json docs/index.html translation_cache.json
            git commit -m "Update bot state and Mini App articles"
            git push
          else
            echo "State and articles unchanged"
          fi

      - name: Refresh public artist profiles
        if: success()
        env:
          SETLIST_FM_API_KEY: ${{ secrets.SETLIST_FM_API_KEY }}
        run: |
          python refresh_artist_profiles.py --limit 6 --budget 40
          python refresh_setlists.py
          if [[ -n "$(git status --porcelain -- docs/artist_profiles.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/artist_profiles.json
            git commit -m "Update public artist profiles"
            git push
          fi
