name: Metal News Aggregator to Telegram

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_latest:
        description: "Отправить последнюю новость для проверки Mini App"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: metal-news-aggregator
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test article pipeline
        run: |
          python -m unittest discover -s tests -v
          node tests/test_mini_app.cjs

      - name: Run aggregator
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_LATEST: ${{ inputs.test_latest || 'false' }}
          DISPLAY_TZ: "Asia/Novosibirsk"
        run: python runner.py

      - name: Save bot state and Mini App articles
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain -- state.json docs/articles.json 2>/dev/null)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json docs/articles.json
            git commit -m "Update bot state and Mini App articles"
            git push
          else
            echo "State and articles unchanged"
          fi
