name: Configure Mini App Open button

on:
  push:
    branches: [main]
    paths:
      - configure_menu.py
      - .github/workflows/menu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Set and verify Open menu button
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python configure_menu.py
