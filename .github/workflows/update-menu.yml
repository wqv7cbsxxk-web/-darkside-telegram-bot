name: Refresh Telegram Mini App menu

on:
  push:
    branches: [main]
    paths:
      - bot.py
      - .github/workflows/update-menu.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Update and verify Telegram menu button
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -c 'import bot; bot.configure_open_menu(bot.resolve_chat_id())'
